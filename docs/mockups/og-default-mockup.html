<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BoardgameShelf — default OG image (locked)</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
  :root{
    /* names from css/base.css — values approximated, Claude Code substitutes the real ones */
    --bgs-bg:#2a221e; --bgs-ivory:#f3ead9; --bgs-gold:#e2a648;
    --bgs-vote-play:#8fa57c; --bgs-vote-pass:#c4785a;
    --bgs-ivory-rgb:243,234,217; --bgs-gold-rgb:226,166,72;
    --page:#1c1714; --chrome:#2f2723;
    --display:"Fraunces",Georgia,serif; --ui:"Inter",system-ui,sans-serif; --mono:"IBM Plex Mono",ui-monospace,monospace;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--page);color:var(--bgs-ivory);font-family:var(--ui)}
  .wrap{max-width:1240px;margin:0 auto;padding:16px 16px 48px}
  .bar{display:flex;gap:8px;align-items:center;margin-bottom:16px}
  .bar .label{font-family:var(--mono);font-size:12px;color:rgba(var(--bgs-ivory-rgb),.55)}
  .seg{display:flex;gap:4px;padding:3px;border-radius:999px;background:var(--chrome)}
  .seg button{appearance:none;border:0;background:transparent;color:rgba(var(--bgs-ivory-rgb),.7);font:500 13px var(--ui);padding:7px 12px;border-radius:999px;cursor:pointer}
  .seg button[aria-pressed="true"]{background:var(--bgs-gold);color:#2a221e}
  .seg button:focus-visible{box-shadow:0 0 0 2px var(--bgs-gold);outline:none}

  .stage{position:relative;width:100%;aspect-ratio:1200/630;overflow:hidden;border-radius:14px;box-shadow:0 20px 50px rgba(0,0,0,.45)}
  .preview{display:none;max-width:420px;margin:0 auto;border-radius:22px;overflow:hidden;background:#2b2b2d;box-shadow:0 20px 50px rgba(0,0,0,.45)}
  .preview .img{position:relative;width:100%;aspect-ratio:1200/630;overflow:hidden}
  .preview .meta{padding:16px 18px 20px}
  .preview .t{font:600 22px var(--ui);color:#fff}
  .preview .d{font:400 17px var(--ui);color:#a9a9ad;margin-top:2px}
  .preview .time{font:400 17px var(--ui);color:#8a8a8e;margin-top:26px}
  [data-view="preview"] .stage{display:none}
  [data-view="preview"] .preview{display:block}

  /* ===== the 1200×630 canvas — this block is the spec ===== */
  .og{position:absolute;top:0;left:0;width:1200px;height:630px;transform-origin:0 0;background:var(--bgs-bg);color:var(--bgs-ivory);overflow:hidden}
  .og .eyebrow{position:absolute;top:56px;left:72px;display:flex;align-items:center;gap:10px;font:500 22px var(--display)}
  .og .eyebrow i{width:9px;height:9px;background:var(--bgs-gold);transform:rotate(45deg);display:inline-block}
  .og h1{position:absolute;margin:0;left:72px;top:212px;width:560px;font:400 84px/1.02 var(--display);letter-spacing:-.5px}
  .og .sub{position:absolute;left:72px;top:428px;font:400 26px var(--ui);color:rgba(var(--bgs-ivory-rgb),.7)}
  .og .url{position:absolute;left:72px;bottom:52px;font:400 19px var(--mono);color:rgba(var(--bgs-ivory-rgb),.45)}
  .og .fan{position:absolute;right:120px;top:88px;width:300px;height:430px}
  .og .card{position:absolute;left:0;top:0;width:236px;height:330px;border-radius:18px;background:linear-gradient(160deg,#4a3d34,#33291f);box-shadow:0 0 0 2px rgba(var(--bgs-gold-rgb),.75),0 18px 40px rgba(0,0,0,.45);transform-origin:50% 120%}
  .og .card .inner{position:absolute;inset:14px;border-radius:10px;border:1px solid rgba(var(--bgs-gold-rgb),.35)}
  .og .card .gem{position:absolute;left:50%;top:50%;width:20px;height:20px;background:var(--bgs-gold);transform:translate(-50%,-50%) rotate(45deg);opacity:.7}
  .og .card .dim{position:absolute;inset:0;border-radius:18px;background:rgba(0,0,0,var(--dim,0))}
  .og .c1{transform:translateX(80px) rotate(22deg);--dim:.28}
  .og .c2{transform:translateX(40px) rotate(11deg);--dim:.15}
  .og .c3{transform:rotate(0deg)}
  .og .pill{position:absolute;left:-10px;top:250px;display:flex;align-items:center;gap:10px;padding:12px 22px 12px 16px;border-radius:999px;background:var(--bgs-vote-play);color:#1f261a;font:600 24px var(--ui);box-shadow:0 10px 24px rgba(0,0,0,.4);transform:rotate(-6deg)}
  .og .pill svg{width:22px;height:22px}
  .og .pass{position:absolute;right:-26px;top:70px;width:48px;height:48px;border-radius:50%;background:var(--bgs-vote-pass);display:flex;align-items:center;justify-content:center;color:#2a1a12;font:600 26px var(--ui);box-shadow:0 8px 20px rgba(0,0,0,.4);opacity:.85}
</style>
</head>
<body>
<div class="wrap" id="root" data-view="full">
  <div class="bar">
    <span class="label">view</span>
    <div class="seg" id="view">
      <button aria-pressed="true" data-v="full">1200×630</button>
      <button aria-pressed="false" data-v="preview">Link preview</button>
    </div>
  </div>

  <div class="stage"><div class="og" id="canvas"></div></div>
  <div class="preview">
    <div class="img"><div class="og"></div></div>
    <div class="meta"><div class="t">BoardgameShelf</div><div class="d">boardgameshelf.vercel.app</div><div class="time">Yesterday</div></div>
  </div>
</div>

<template id="tpl">
  <div class="og">
    <div class="eyebrow"><i></i>BoardgameShelf</div>
    <h1>Pick tonight's game, together.</h1>
    <div class="sub">Everyone swipes. The table decides.</div>
    <div class="fan">
      <div class="card c1"><div class="inner"></div><div class="gem"></div><div class="dim"></div></div>
      <div class="card c2"><div class="inner"></div><div class="gem"></div><div class="dim"></div></div>
      <div class="card c3"><div class="inner"></div><div class="gem"></div></div>
      <div class="pass">×</div>
      <div class="pill"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5L20 7"/></svg>Play</div>
    </div>
    <div class="url">boardgameshelf.vercel.app</div>
  </div>
</template>

<script>
  const tpl = document.getElementById('tpl').content.firstElementChild;
  document.querySelectorAll('.og').forEach(el => el.replaceWith(tpl.cloneNode(true)));
  function scale(){
    document.querySelectorAll('.stage, .preview .img').forEach(box=>{
      const el = box.querySelector('.og'); el.style.transform = 'scale(' + (box.clientWidth/1200) + ')';
    });
  }
  document.getElementById('view').addEventListener('click', e=>{
    const b=e.target.closest('button'); if(!b) return;
    document.getElementById('root').dataset.view = b.dataset.v;
    document.querySelectorAll('#view button').forEach(x=>x.setAttribute('aria-pressed', String(x===b)));
    requestAnimationFrame(scale);
  });
  window.addEventListener('resize', scale);
  document.fonts?.ready.then(scale);
  scale();
</script>
</body>
</html>
