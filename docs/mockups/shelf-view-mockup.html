<!DOCTYPE html>
<html lang="en" data-theme="walnut"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Shelf page — shelf view + toggle (locked: covers only, default Shelf, toggle for everyone)</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,600;1,9..144,500;1,9..144,600&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>/* css/base.css verbatim *//* Shared foundation for every page: design tokens and page chrome.
   Link this before any other stylesheet and before the page's own <style>,
   so a page can still override what it needs to.

   This exists because the shelf and the waiting-room pages each carried their
   own copy of the palette and the body background, and the copies drifted —
   the waiting room's background lost its solid colour layer and overscrolling
   showed the browser's white canvas. Change a token or the page chrome here
   and every page follows. */

/* Themes (docs/claude-code-spec-themes.md). The surface tokens — page bg,
   plate, ivory, their RGB variants and the ivory hairline — live in one
   block per theme below, walnut doubling as the :root default. Everything
   else, gold above all, is shared and stays in :root. <html data-theme="…"> is set by the inline resolver in
   each page's <head> and by js/themes.js; a theme is one block here plus
   one entry in the registry. */

:root{
  --bgs-gold:#E4B54D;
  --bgs-gold-rgb:228,181,77;
  /* ink on a gold fill — warm, not the page bg; full-contrast black on brass glares */
  --bgs-on-gold:#2A1F0C;
  /* the brighter brass for :hover on a gold fill */
  --bgs-gold-hover:#F0C455;
  /* extended: dimmed gold for mono/meta labels — no token in spec sec.2 covers this role, closest match to legacy --brass-dim.
     Mixed from the brighter brass (#F0C455) at .80, not from --bgs-gold: the eyebrow and mono meta went muddy at .62 of the fill colour. */
  --bgs-gold-dim:rgba(240,196,85,0.80);
  --bgs-icon-gold:#E4B54D;
  /* hairlines — the shelf's ivory rule between rows, and the gold plate edge
     base.css already draws on .deck-card; settings ledger rows and the link
     plate use these instead of repeating the literals */
  --line-gold:rgba(228,181,77,0.22);
  /* warning — a gap in what a bag covers (docs/bag-pack-bar-spec.md) */
  --bgs-amber:#E0A83A;
  /* destructive actions — cancelling a game night */
  --bgs-danger:#B84A40;
  --bgs-danger-hover:#D2665B;
  /* swipe-vote colours — warm sage + warm clay, deliberately distinct from
     --bgs-danger above: passing on a game isn't destructive and must not
     borrow the cancel-a-game-night colour. */
  --bgs-vote-play:#5FB07F;
  --bgs-vote-play-rgb:95,176,127;
  --bgs-vote-pass:#D9645A;
  --bgs-vote-pass-rgb:217,100,90;
  /* live-voting / presence surfaces — reserved, nothing consumes it yet */
  --bgs-info:#5B9CDB;
  --bgs-info-rgb:91,156,219;

  /* Liquid Glass (docs/claude-code-spec-liquid-glass.md). The material itself
     lives in css/glass.css, which shelf.html loads; the tokens sit here so
     every page can use the easing and the card layout without it. */
  --glass-fill-a:.52;                 /* plate tint alpha; pressed .74 */
  --glass-blur:22px;
  --glass-sat:1.6;
  --glass-rim-w:1.5px;                /* refraction ring width */
  --glass-rim-light:rgba(var(--bgs-ivory-rgb),.22);
  --glass-rim-gold:rgba(var(--bgs-gold-rgb),.28);
  --glass-shadow:0 12px 32px rgba(0,0,0,.45), 0 1px 0 rgba(0,0,0,.4);
  --glass-sheen:rgba(var(--bgs-ivory-rgb),.10);
  --light-x:20%;                      /* specular position; JS moves it on scroll */
  --ease-liquid:cubic-bezier(.32,.72,0,1);
  --dur:.55s;
}

/* Brown themes. The hairline and muted roles the spec names --bgs-line and
   --bgs-muted are the existing --line and --bgs-ivory-45: the spec's opaque
   line colour is what each theme's ivory at .10 lands on over its plate, and
   its muted colour is ivory at .45 over the plate, so the alpha tokens keep
   compositing correctly over covers and glass. --bgs-bg-radial sits between
   bg and plate, the same step navy takes.

   Walnut is the default: :root carries it so a page with no data-theme, or
   an unknown one, renders walnut. It comes first because :root and an
   attribute selector tie on specificity, so the later block wins and every
   named theme has to follow it. */
:root, [data-theme="walnut"]{
  --bgs-bg:#171110;
  --bgs-bg-rgb:23,17,16;
  --bgs-bg-radial:#1F1816;
  --bgs-plate:#211915;
  --bgs-plate-rgb:33,25,21;
  --bgs-ivory:#F2E9DA;
  --bgs-ivory-rgb:242,233,218;
  --bgs-ivory-70:rgba(242,233,218,0.72);
  --bgs-ivory-45:rgba(242,233,218,0.45);
  --line:rgba(242,233,218,0.10);
}
/* Navy — the values :root carried before themes existed, moved here
   unchanged. */
[data-theme="navy"]{
  --bgs-bg:#0B0E13;
  --bgs-bg-rgb:11,14,19;
  --bgs-bg-radial:#131821;
  --bgs-plate:#161A21;
  --bgs-plate-rgb:22,26,33;
  --bgs-ivory:#EEF1F5;
  --bgs-ivory-rgb:238,241,245;
  --bgs-ivory-70:rgba(238,241,245,0.72);
  --bgs-ivory-45:rgba(238,241,245,0.45);
  /* hairlines — the shelf's ivory rule between rows, and the gold plate edge
     base.css already draws on .deck-card; settings ledger rows and the link
     plate use these instead of repeating the literals */
  --line:rgba(238,241,245,0.10);
}

[data-theme="mahogany"]{
  --bgs-bg:#1A100D;
  --bgs-bg-rgb:26,16,13;
  --bgs-bg-radial:#241611;
  --bgs-plate:#2A1812;
  --bgs-plate-rgb:42,24,18;
  --bgs-ivory:#F4E8D8;
  --bgs-ivory-rgb:244,232,216;
  --bgs-ivory-70:rgba(244,232,216,0.72);
  --bgs-ivory-45:rgba(244,232,216,0.45);
  --line:rgba(244,232,216,0.10);
}
[data-theme="oak"]{
  --bgs-bg:#1E1812;
  --bgs-bg-rgb:30,24,18;
  --bgs-bg-radial:#28201A;
  --bgs-plate:#2B231A;
  --bgs-plate-rgb:43,35,26;
  --bgs-ivory:#F3EBDA;
  --bgs-ivory-rgb:243,235,218;
  --bgs-ivory-70:rgba(243,235,218,0.72);
  --bgs-ivory-45:rgba(243,235,218,0.45);
  --line:rgba(243,235,218,0.10);
}

/* Theme cross-fade. js/themes.js puts .theme-switching on <html> for the
   250ms around a switch, so these surfaces fade instead of snapping. Inert
   surfaces only: WebKit silently drops a transition whose property an
   animation on the same element already owns, so nothing that animates
   background-color, border-color or color (the Game Night pill, toasts,
   pulse rings, .sel-ring) is listed here; those snap, which is fine. */
html.theme-switching, html.theme-switching body,
html.theme-switching .game-card{
  transition:background-color 200ms ease, border-color 200ms ease, color 200ms ease;
}
@media (prefers-reduced-motion:reduce){
  html.theme-switching *{transition:none !important;}
}

*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
/* The theme's ground behind everything, so overscroll and the first frame
   are already the theme's colour, never a literal. */
html{background:var(--bgs-bg);color:var(--bgs-ivory);}

body{
  /* The solid colour under the gradient is load-bearing: a gradient alone
     leaves background-color transparent, and overscrolling then shows the
     browser's white canvas. */
  background:
    radial-gradient(ellipse at top, var(--bgs-bg-radial) 0%, var(--bgs-bg) 55%),
    var(--bgs-bg);
  color:var(--bgs-ivory);
  font-family:'Inter',sans-serif;
  /* svh, not vh: on a phone 100vh is the *large* viewport — the height with the
     toolbars retracted — so it makes the body taller than what's actually visible
     and the page scrolls even when nothing overflows. 100svh is the smallest
     visible viewport, so a page whose content fits cannot scroll. dvh would track
     the toolbars sliding in and out and reflow mid-scroll. The vh line stays as a
     fallback for Safari <15.4 / Chrome <108. */
  min-height:100vh;
  min-height:100svh;
  -webkit-font-smoothing:antialiased;
}

/* Set by js/scroll-lock.js while any overlay is open, so the page behind it
   cannot scroll. `overflow:hidden` alone is ignored by iOS Safari, so the body
   is taken out of flow and offset by the scroll position it was locked at —
   the offset cancels the scroll, leaving the view unchanged with nothing left
   to scroll. The offset and the scrollbar-gutter padding are set inline. */
body.scroll-locked{
  position:fixed;
  left:0;
  right:0;
  overflow:hidden;
}

/* Each page sets its own body padding — the shelf is a wide grid, the
   game-night pages are a narrow phone column with a safe-area inset. */

/* The face-down/face-up deck-preview card, shared by night-host.html,
   vote.html and vote-swipe.html (the waiting room's deck preview and the
   swipe screen's tallying shuffle both draw the same card back — one
   component, not a third copy). */
.deck-card{
  width:44px;aspect-ratio:3/4;border-radius:6px;flex-shrink:0;overflow:hidden;
  display:flex;align-items:center;justify-content:center;font-size:15px;
  background:var(--bgs-plate);
  border:1px solid rgba(var(--bgs-gold-rgb),.22);
}
.deck-card img{width:100%;height:100%;object-fit:cover;display:block;}
.deck-card.back{
  background:
    repeating-linear-gradient(45deg,
      rgba(var(--bgs-gold-rgb),.07) 0 4px,
      transparent 4px 8px),
    var(--bgs-plate);
  color:var(--bgs-gold-dim);font-size:15px;
}
.deck-card.clickable{cursor:pointer;transition:transform .12s ease;}
.deck-card.clickable:active{transform:scale(.92);}

/* Three face-down cards being shuffled — the waiting animation for every
   game-night screen that has to hold the table for a moment: waiting for the
   host to start, waiting for the others to finish, and tallying.
   Built from .deck-card.back above rather than drawn again, and face-down
   deliberately, so a screen that must not leak a result cannot.
   Markup comes from shuffleHTML() in js/waiting-room.js. */
.shuffle-wrap{height:66px;display:flex;align-items:center;justify-content:center;}
.shuffle{position:relative;width:104px;height:64px;}
.shuffle .deck-card{
  position:absolute;top:0;left:30px;width:46px;height:62px;
  box-shadow:0 7px 15px rgba(0,0,0,.5);
  animation:bgs-deal 1.9s cubic-bezier(.45,0,.3,1) infinite;
}
@keyframes bgs-deal{
  0%{transform:translateX(0) rotate(0) scale(1);opacity:1;}
  28%{transform:translateX(-36px) rotate(-13deg) scale(.97);opacity:1;}
  62%{transform:translateX(36px) rotate(10deg) scale(.94);opacity:.7;}
  100%{transform:translateX(0) rotate(0) scale(1);opacity:1;}
}
.shuffle .deck-card:nth-child(1){z-index:3;}
.shuffle .deck-card:nth-child(2){z-index:2;animation-delay:.63s;}
.shuffle .deck-card:nth-child(3){z-index:1;animation-delay:1.26s;}

/* Four face-down cards dealt into a neat deck, then a gold ring pulse — the
   loading animation for every game-night screen's static shell, the stretch
   between page load and the first render. Built from .deck-card.back above,
   like the shuffle, and distinct from it on purpose: the shuffle holds the
   table, this one gathers the games.
   Pure CSS, so it runs before a page's module script resolves — an import
   that 404s leaves the shell on screen, and it should still look alive.
   Cards animate transform+opacity only; the ring animates box-shadow only, on
   its own element. One animation per element and no transition on an animated
   property: WebKit silently drops a transition that fights an animation, which
   is also why these cards never take .clickable. */
.deal-wrap{height:120px;display:flex;align-items:center;justify-content:center;margin:26px 0 0;}
.deal{position:relative;width:64px;height:85px;}
.deal .deck-card{
  position:absolute;inset:0;width:64px;height:85px;
  border-radius:8px;font-size:18px;
  box-shadow:0 8px 18px rgba(0,0,0,.45);
  opacity:0;
  animation:bgs-deal-in 3.4s cubic-bezier(.3,.7,.3,1) infinite;
}
.deal .deck-card:nth-child(1){--rest:rotate(-5deg);}
.deal .deck-card:nth-child(2){--rest:rotate(4deg);animation-delay:.22s;}
.deal .deck-card:nth-child(3){--rest:rotate(-2deg);animation-delay:.44s;}
.deal .deck-card:nth-child(4){--rest:rotate(0deg);animation-delay:.66s;}
@keyframes bgs-deal-in{
  0%   {opacity:0;transform:translate(110px,-90px) rotate(28deg);}
  12%  {opacity:1;transform:translate(0,0) var(--rest);}   /* lands, tilted */
  16%  {transform:translate(0,0) var(--rest);}
  30%  {transform:translate(0,0) rotate(0deg);}            /* squares up */
  84%  {opacity:1;transform:translate(0,0) rotate(0deg);}
  94%,100%{opacity:0;transform:translate(0,0) rotate(0deg);}
}
/* Gold ring: inset box-shadow, never outline. */
.deal-ring{
  position:absolute;inset:-7px;border-radius:13px;pointer-events:none;
  box-shadow:inset 0 0 0 2px rgba(var(--bgs-gold-rgb),0);
  animation:bgs-ring-pulse 3.4s infinite;
}
@keyframes bgs-ring-pulse{
  0%,30%{box-shadow:inset 0 0 0 2px rgba(var(--bgs-gold-rgb),0);}
  40%   {box-shadow:inset 0 0 0 2px rgba(var(--bgs-gold-rgb),.7);}
  58%,100%{box-shadow:inset 0 0 0 2px rgba(var(--bgs-gold-rgb),0);}
}

/* Reduced motion: a static assembled deck under a steady half-strength ring
   says the same thing the motion did. Nothing here needs an animation to
   become visible, so dropping it can never leave the shell blank. */
@media (prefers-reduced-motion:reduce){
  .shuffle .deck-card{animation:none;}
  .deal .deck-card{animation:none;opacity:1;transform:translate(0,0) rotate(0deg);}
  .deal-ring{animation:none;box-shadow:inset 0 0 0 2px rgba(var(--bgs-gold-rgb),.45);}
}

/* ---- cover light (docs/claude-code-spec-vote-cover-light.md) ----
   Behind ?coverlight=1. The screen takes the colour of the card on top of
   the deck: one heavily blurred, enlarged copy of that card's cover sits
   behind everything, and a veil fades it back to the theme background so the
   heading, the caption and the rounds stay legible over a bright cover.

   The two copies cross-fade on OPACITY ONLY, and neither carries an
   animation: an animation and a transition on the same property of the same
   element is the WebKit bug that drops the transition altogether. Their
   transform is static.

   The source box is 160x200 and scaled up from there, so the blur is
   computed at that size and stays cheap on a phone.

   The layer is fixed to the viewport, not parented to #screen. #screen is a
   400px column inside the page's 16px gutters, so a light scoped to it
   stopped in dark bands down both sides and cut off in a hard line under the
   hint — the whole screen is meant to take the colour, and on a phone the
   column is not the screen. Fixed also means the wash holds still while the
   page scrolls, and clipping it here keeps the enlarged image from widening
   the page.

   It sits at z-index:0 rather than behind everything at -1, because a
   negative layer inside <body> paints *under* body's own background and
   would never be seen. Everything the page draws is lifted over it instead,
   below. The confirm dialog and the game modal are both z-index:30 and so
   stay clear of this without help. */
.cover-light{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none;}
/* #screen is already positioned; the footer is not, and a static block
   paints under a positioned layer however early it comes in the markup. */
body.coverlight #screen,
body.coverlight .shelf-footer{position:relative;z-index:1;}
.cover-light img{
  position:absolute;left:50%;top:50%;
  width:160px;height:200px;object-fit:cover;
  opacity:0;transition:opacity .6s;
  filter:blur(22px) saturate(1.6);
  /* Scaled, never resized: the blur is computed on the small box and the
     result is scaled by the compositor, which is what keeps it cheap on a
     phone. 4.6 is the locked value and covers a phone at 736x920; a desktop
     window is wider than that, so it steps up rather than leaving the wash
     as a blob with dark edges either side. */
  transform:translate(-50%,-50%) scale(var(--cl-scale,4.6));
}
@media (min-width:560px){ .cover-light img{--cl-scale:9;} }
.cover-light img.on{opacity:.62;}
/* Tokens only: the veil fades to whichever theme is on, so Walnut, Navy,
   Mahogany and Oak each fade to their own background with no per-theme rule. */
.cover-light::after{
  content:"";position:absolute;inset:0;
  background:linear-gradient(to bottom,
    var(--bgs-bg) 0,
    rgba(var(--bgs-bg-rgb),.35) 22%,
    rgba(var(--bgs-bg-rgb),.25) 70%,
    rgba(var(--bgs-bg-rgb),.85) 100%);
}
@media (prefers-reduced-motion:reduce){
  .cover-light img{transition:none;}
}

/* Site footer colophon, shared by every page (docs/footer-redesign-spec.md,
   Option A, centred to match the centred pages). A stack: BGG badge,
   links, then the legal lines. Pages override max-width to
   match their own column, and the shelf sets --fab-clearance so the Game
   Night FAB never covers the legal lines. The badge is never tinted, dimmed
   or hidden: BGG's API terms want the logo legible wherever their data is
   shown. */
.shelf-footer{
  max-width:960px;
  margin:40px auto 0;
  border-top:1px solid rgba(var(--bgs-ivory-rgb),.10);
  padding:22px 0 calc(22px + var(--fab-clearance,0px));
  text-align:center;
}
.shelf-footer__row{display:flex;justify-content:center;}
.shelf-footer .bgg-badge{display:inline-block;line-height:0;border-radius:4px;flex:none;}
.shelf-footer .bgg-badge--small{height:28px;}
.shelf-footer .bgg-badge--small img{display:block;height:28px;width:auto;}
.shelf-footer .bgg-badge:focus-visible{
  outline:none;
  box-shadow:0 0 0 2px var(--bgs-bg),0 0 0 4px var(--bgs-gold);
}
.shelf-footer__links{display:flex;justify-content:center;gap:18px;margin:18px 0 20px;font:500 13px/1 'Inter',sans-serif;}
/* Same text-link treatment as body links on the privacy and terms pages. */
.shelf-footer__links a{color:var(--bgs-gold);text-decoration:underline;text-underline-offset:3px;border-radius:3px;}
.shelf-footer__links a:hover{color:var(--bgs-ivory);}
.shelf-footer__links a:focus-visible{
  outline:none;
  box-shadow:0 0 0 2px var(--bgs-bg),0 0 0 4px var(--bgs-gold);
}
.shelf-footer__legal{
  margin:0;font:400 11px/1.55 'IBM Plex Mono',monospace;
  color:rgba(var(--bgs-ivory-rgb),.36);
}
.shelf-footer__legal + .shelf-footer__legal{margin-top:2px;}

/* Beta pill beside the wordmark (spec: docs/beta-tag-spec.md). Each page
   carries its own wordmark markup, so the pill is placed per page; the styles
   live here once. A <button>, not a <span>, so the tooltip is keyboard
   reachable. Upright and mono on purpose: the wordmark's italic serif must
   not leak into it. Negative vertical margins cancel the pill's own height
   against the wordmark line so the header does not grow. */
.bgs-wordmark{position:relative;}
.bgs-beta{
  display:inline-block;
  margin:-4px 0 -4px 10px;
  padding:3px 8px;
  border:1px solid rgba(var(--bgs-gold-rgb),0.6);
  border-radius:999px;
  background:transparent;
  color:var(--bgs-gold);
  font-family:'IBM Plex Mono',monospace;
  font-style:normal;
  font-weight:500;
  font-size:11px;
  letter-spacing:0.14em;
  line-height:1;
  text-transform:uppercase;
  vertical-align:middle;
  position:relative;
  top:-1px;
  cursor:default;
  -webkit-appearance:none;
  appearance:none;
}
/* Gold ring via box-shadow, same as every other focus ring on the site. */
.bgs-beta:focus-visible{
  outline:none;
  box-shadow:0 0 0 2px var(--bgs-bg),0 0 0 4px var(--bgs-gold);
}

/* Beta tooltip, built by js/beta-tag.js as the pill's next sibling inside
   .bgs-wordmark, so it positions against the wordmark. Transition only —
   never an animation on this element too; WebKit drops a transition that
   fights an animation. The pill's uppercase mono styling is reset here since
   the wordmark's italic serif would otherwise cascade in. */
.bgs-beta-tip{
  position:absolute;
  top:calc(100% + 8px);
  left:0;
  z-index:30;
  width:max-content;
  max-width:260px;
  padding:10px 12px 11px;
  /* A callout, not a field: the search box is plate + faint gold hairline +
     12px radius, so this sits on the darker page ground with a firmer gold
     edge, a tight radius, a lifted shadow and a caret at the pill. */
  border:1px solid rgba(var(--bgs-gold-rgb),0.45);
  border-radius:5px;
  background:var(--bgs-bg);
  box-shadow:0 14px 28px -12px rgba(0,0,0,.85),0 2px 6px rgba(0,0,0,.35);
  color:var(--bgs-ivory);
  font-family:'Inter',sans-serif;
  font-style:normal;
  font-weight:400;
  font-size:13px;
  line-height:1.45;
  letter-spacing:0;
  text-transform:none;
  text-align:left;
  opacity:0;
  transform:translateY(-4px);
  transition:opacity 120ms ease-out,transform 120ms ease-out;
  pointer-events:none;
}
.bgs-beta-tip.is-open{
  opacity:1;
  transform:translateY(0);
  pointer-events:auto;
}
/* Caret under the pill. js/beta-tag.js sets --bgs-tip-caret to the pill's
   centre measured from the tooltip's left edge, so it stays under the pill
   when the tooltip flips or is pinned to the viewport gutter. A rotated
   square that shares the border, clipped to its top-left half by the tip. */
.bgs-beta-tip::before{
  content:"";
  position:absolute;
  top:-6px;
  left:calc(var(--bgs-tip-caret,18px) - 5px);
  width:10px;height:10px;
  background:inherit;
  border:inherit;
  border-right:0;border-bottom:0;
  border-radius:1px 0 0 0;
  transform:rotate(45deg);
}
/* Would overflow the right edge of the viewport: hang from the wordmark's
   right edge instead. */
.bgs-beta-tip.is-flipped{left:auto;right:0;}
/* Two classes: the legal pages' own `.mark a{color:inherit;text-decoration:none}`
   would otherwise win over the link styling. */
.bgs-beta-tip .bgs-beta-tip__link{
  display:block;
  margin-top:6px;
  color:var(--bgs-gold);
  text-decoration:underline;
  text-underline-offset:3px;
  border-radius:3px;
}
.bgs-beta-tip .bgs-beta-tip__link:focus-visible{
  outline:none;
  box-shadow:0 0 0 2px var(--bgs-bg),0 0 0 4px var(--bgs-gold);
}
@media (prefers-reduced-motion:reduce){
  .bgs-beta-tip{transition:none;transform:none;}
}
</style>
<style>/* css/glass.css verbatim *//* Liquid Glass material — docs/claude-code-spec-liquid-glass.md.

   Loaded by shelf.html for everyone unless the device opted out with
   ?glass=0 (localStorage.bgsGlass). Nothing in here is prefixed by a flag
   selector: the .glass class sits in the markup regardless, and is inert
   until this file loads.

   Rules (engineering-principles):
   - transitions only, never @keyframes — WebKit drops a transition that
     shares a property with an animation;
   - the rim and every ring are box-shadow, never border, never outline;
   - tokens are the --glass-* set in css/base.css;
   - transitions move only transform and opacity (and, for the sheets and
     the Game Night box, their size). Never background or box-shadow: a
     paint change on a blurred surface re-blurs it every frame, which is
     what made the buttons stutter on the phone. Press and state changes
     in fill or shadow snap.
   Game cards never get .glass: 197 backdrop-filters would not scroll. */

.glass{
  position:relative;
  isolation:isolate;
  border:0;
  background:
    linear-gradient(135deg, var(--glass-sheen) 0%, transparent 38%, transparent 70%, rgba(var(--bgs-ivory-rgb),.04) 100%)
      var(--light-x) 0 / 220% 100% no-repeat,
    rgba(var(--bgs-plate-rgb),var(--glass-fill-a));
  -webkit-backdrop-filter:blur(var(--glass-blur)) saturate(var(--glass-sat));
  backdrop-filter:blur(var(--glass-blur)) saturate(var(--glass-sat));
  /* --glass-focus is the focus ring slot: empty by default, a gold ring on
     :focus-visible, so focus composes with the rim instead of replacing it. */
  --glass-focus:0 0 0 0 transparent;
  box-shadow:
    var(--glass-focus),
    inset 1px 1px 0 var(--glass-rim-light),
    inset -1px -1px 0 rgba(0,0,0,.45),
    inset 0 0 0 1px var(--glass-rim-gold),
    var(--glass-shadow);
  transition:transform .28s var(--ease-liquid);
}
/* Refraction ring: a masked band along the edge lit by a conic gradient.
   It used to carry its own backdrop-filter as well; a masked layer with a
   backdrop-filter is a combination WebKit allocates full-size buffers for
   and has crashed on, and the shelf page kept reloading on iOS until every
   such layer was gone. The gradient alone reads as the same rim. */
.glass::before{
  content:"";
  position:absolute; inset:0;
  border-radius:inherit;
  z-index:-1;
  pointer-events:none;
  padding:var(--glass-rim-w);
  -webkit-mask:linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
  -webkit-mask-composite:xor;
  mask-composite:exclude;
  background:conic-gradient(from 210deg at 50% 50%,
    rgba(var(--bgs-ivory-rgb),.30), rgba(var(--bgs-ivory-rgb),.18) 25%,
    transparent 45%, rgba(var(--bgs-ivory-rgb),.10) 60%, transparent 80%,
    rgba(var(--bgs-ivory-rgb),.30));
}
/* Inner glow that reads as thickness. */
.glass::after{
  content:"";
  position:absolute; inset:0;
  border-radius:inherit;
  z-index:-1;
  pointer-events:none;
  box-shadow:inset 0 0 18px rgba(var(--bgs-ivory-rgb),.05), inset 0 -10px 20px rgba(0,0,0,.18);
}
/* Press: fill thickens, control shrinks. Only on things you press — a sheet
   is :active while any row inside it is, and must not scale. */
button.glass:active,
a.glass:active,
[role="button"].glass:active{
  --glass-fill-a:.74;
  transform:scale(.97);
}
.glass:focus-visible{
  outline:none; /* the ring is the box-shadow slot below */
  --glass-focus:0 0 0 2px var(--bgs-bg), 0 0 0 4px var(--bgs-gold);
}

/* No blur available, or the OS asks for less transparency: a near-solid
   plate keeps the text readable, the rim stays. */
@supports not (backdrop-filter:blur(1px)){
  .glass{--glass-fill-a:.92;}
  .glass::before{background:none;}
}
@media (prefers-reduced-transparency:reduce){
  .glass{--glass-fill-a:.92; -webkit-backdrop-filter:none; backdrop-filter:none;}
  .glass::before{background:none;}
}

/* ---- Header controls: search field, filter + sort (44px, radius 14) ----
   44px is the standard thumb target; 52 read as oversized on the phone. */

/* The full header scrolls away; the compact topbar below takes over past
   150px. So the bar is no longer sticky, and its is-stuck chrome is off.
   The controls in it carry no backdrop-filter of their own: at the top of
   the page only the background gradient sits behind them, so the blur was
   invisible, and a blurred layer inside a sticky container vanished on iOS
   when the keyboard resized the viewport. */
.filter-sort-bar{position:static;}
.filter-sort-bar.is-stuck{
  background:transparent;
  -webkit-backdrop-filter:none; backdrop-filter:none;
}
.filter-sort-bar .glass,
.filter-sort-bar .glass::before{
  -webkit-backdrop-filter:none; backdrop-filter:none;
}
.filter-sort-bar .glass{--glass-fill-a:.72;}

/* ---- Compact topbar: fixed glass bar, slides in once the header is gone ----
   Search field + filter button only, no wordmark. The field and button inside
   are plain (no glass of their own): the bar is the one blurred layer. */

.topbar{
  display:flex;
  align-items:center;
  gap:8px;
  position:fixed;
  top:calc(10px + env(safe-area-inset-top));
  left:12px;
  right:12px;
  /* Above the header bar (15) and the bag dock (16), under every scrim,
     sheet and modal (20 and up): a sheet always covers the topbar. */
  z-index:17;
  height:56px;
  max-width:456px;
  margin:0 auto;
  padding:0 6px 0 8px;
  border-radius:22px;
  --glass-fill-a:.62;
  transform:translateY(-140%) scale(.96);
  opacity:0;
  /* visibility flips at the end of the slide out and at once on the way in:
     an invisible blurred surface still holds its layers, a hidden one does not. */
  visibility:hidden;
  transition:transform var(--dur) var(--ease-liquid), opacity .3s ease, visibility 0s linear var(--dur);
}
.topbar.is-in{
  transform:none;
  opacity:1;
  visibility:visible;
  transition:transform var(--dur) var(--ease-liquid), opacity .3s ease, visibility 0s;
}
/* While its search has focus (the keyboard is up) the bar drops its blur
   for a near-solid fill: a blurred fixed element vanished under the iOS
   keypad, as the old sticky field did. It also stops transitioning, since
   JS pins it to the visual viewport as the keyboard moves. */
.topbar.is-typing{
  -webkit-backdrop-filter:none; backdrop-filter:none;
  --glass-fill-a:.94;
  transition:none;
}
.topbar.is-typing::before{-webkit-backdrop-filter:none; backdrop-filter:none;}
/* Every overlay on the site locks the body while it is open; the topbar
   leaves for as long as one is, and returns when the lock lifts. */
body.scroll-locked .topbar.is-in{
  transform:translateY(-140%) scale(.96);
  opacity:0;
  visibility:hidden;
  pointer-events:none;
  transition:transform var(--dur) var(--ease-liquid), opacity .3s ease, visibility 0s linear var(--dur);
}
.topbar .search{
  height:40px;
  border:0;
  border-radius:14px;
  padding:0 12px;
  background:rgba(var(--bgs-bg-rgb),.35);
  box-shadow:inset 0 0 0 1px rgba(var(--bgs-ivory-rgb),.06);
  color:var(--bgs-ivory);
}
.topbar .search:focus{box-shadow:inset 0 0 0 1px rgba(var(--bgs-gold-rgb),.7);}
.topbar .search::placeholder{color:var(--bgs-ivory-45);}
.topbar .icon-btn{
  width:40px;
  height:40px;
  border:0;
  border-radius:14px;
  background:none;
  color:var(--bgs-gold);
}
.topbar .icon-btn:hover{color:var(--bgs-ivory);}
.topbar .icon-btn:focus-visible{outline:none;box-shadow:0 0 0 2px var(--bgs-bg),0 0 0 4px var(--bgs-gold);}
.topbar .filter-badge{box-shadow:0 0 0 2px var(--bgs-plate);}
.search.glass{
  height:44px;
  border-radius:14px;
  padding:0 36px 0 16px;
  color:var(--bgs-ivory);
}
.search.glass::placeholder{color:var(--bgs-ivory-45);}
.search-wrap .search-clear{right:8px;}
.icon-btn.glass{
  width:44px;
  height:44px;
  border-radius:14px;
  color:var(--bgs-gold);
}
.icon-btn.glass:hover{color:var(--bgs-ivory);}
.icon-btn.glass.active{--glass-fill-a:.7; color:var(--bgs-gold);}

/* ---- Beta pill ---- */

.bgs-beta.glass{
  padding:5px 12px;
  border-radius:999px;
  --glass-blur:10px;
  --glass-shadow:0 2px 8px rgba(0,0,0,.35);
}
.bgs-beta.glass:focus-visible{
  box-shadow:
    var(--glass-focus),
    inset 1px 1px 0 var(--glass-rim-light),
    inset -1px -1px 0 rgba(0,0,0,.45),
    inset 0 0 0 1px var(--glass-rim-gold),
    var(--glass-shadow);
}

/* ---- Bags button (on the count line) ---- */

.shelf-bags-btn.glass{
  margin:-8px 0;
  padding:6px 12px;
  border-radius:12px;
  --glass-blur:12px;
  --glass-shadow:0 4px 12px rgba(0,0,0,.35);
}
/* bag.css loads lazily, after this file, so its outline ring needs a more
   specific override here: the ring is the box-shadow slot. */
.shelf-bags-btn.glass:focus-visible{outline:none;border-radius:12px;}
.shelf-bags-btn.glass .shelf-bags-btn__label{color:var(--bgs-gold);}

/* ---- Sheets: the filter sheet and every bottom sheet (bags, share) ----
   Same box as the open Game Night sheet: 12px in from the edges, radius 30,
   entering from translateY(112%). The sheet's own transform transition
   replaces .glass's press transition — a sheet is never pressed. */

.filter-sheet.glass,
.bsheet.glass{
  position:fixed; /* .glass says relative; a sheet floats */
  left:12px;
  right:12px;
  bottom:calc(12px + env(safe-area-inset-bottom));
  max-width:456px;
  border-radius:30px;
  --glass-fill-a:.66;
  transform:translateY(112%);
  transition:transform var(--dur) var(--ease-liquid);
}
.filter-sheet.glass{max-height:calc(100vh - 24px - env(safe-area-inset-bottom));}
.filter-sheet.glass.open{transform:none;}
.bsheet.glass{
  padding-bottom:20px;
  transition:transform var(--dur) var(--ease-liquid), visibility 0s linear var(--dur);
}
.bsheet.glass.is-open{
  transform:none;
  transition:transform var(--dur) var(--ease-liquid), visibility 0s;
}
.sheet-scrim,
.bsheet-scrim{
  background:rgba(var(--bgs-bg-rgb),.45);
  transition:opacity .35s;
}
/* Sheet rows: lighter glass, no drop shadow, so they sit in the plate. */
.bags-sheet.glass .bags-sheet__row{
  background:rgba(var(--bgs-plate-rgb),.3);
  box-shadow:inset 1px 1px 0 var(--glass-rim-light), inset 0 0 0 1px rgba(var(--bgs-ivory-rgb),.06);
}
.bags-sheet.glass .bags-sheet__row:hover{background:rgba(var(--bgs-plate-rgb),.5);}
.bags-sheet.glass .bags-sheet__row--new{background:transparent;}

/* ---- Game Night: the pill that morphs into a sheet ----
   The box's width/height/bottom/radius transitions live in shelf.html; the
   material adds fill and shadow to that list. The press scale is on the pill
   button inside, so the box itself never scales. */

.gn-fab.glass{
  position:fixed; /* .glass says relative; the pill floats */
  /* No backdrop blur on this element or its rim. It resizes over half a
     second, and WebKit re-allocates a blurred, masked backdrop for the new
     size on every frame of that — the one thing that reliably made iOS
     Safari reload the page. A near-solid plate (fill .94, .97 open) under
     the scrim reads the same; the sheen, rim and morph are untouched. */
  -webkit-backdrop-filter:none; backdrop-filter:none;
  --glass-fill-a:.94;
  color:var(--bgs-gold);
  transition:width var(--dur) var(--ease-liquid), height var(--dur) var(--ease-liquid), bottom var(--dur) var(--ease-liquid), border-radius var(--dur) var(--ease-liquid), transform .28s var(--ease-liquid), opacity .18s ease;
}
.gn-fab.glass::before{-webkit-backdrop-filter:none; backdrop-filter:none;}
.gn-fab.glass.is-open{--glass-fill-a:.97;}
body.is-selecting .gn-fab.glass{
  transform:translateX(-50%) translateY(14px) scale(.9);
  visibility:hidden;
  transition:width var(--dur) var(--ease-liquid), height var(--dur) var(--ease-liquid), bottom var(--dur) var(--ease-liquid), border-radius var(--dur) var(--ease-liquid), transform .28s var(--ease-liquid), opacity .18s ease, visibility 0s linear .28s;
}
/* The selection-mode entrance animates every card on the shelf at once.
   A blurred surface re-samples what is behind it on every frame of that,
   and with several of them (pill, Beta, bags, topbar, each with its rim)
   iOS Safari ran out of memory and reloaded. So for the wave's duration
   (body.gn-waving, 800ms) no surface blurs; the tint and rim stay, and the
   blur returns as the wave ends. */
body.gn-waving .glass,
body.gn-waving .glass::before{
  -webkit-backdrop-filter:none; backdrop-filter:none;
}
/* Sheet options: lighter fill, no drop shadow, and no backdrop-filter of
   their own. The box around them is already blurred and is resizing while
   they show; nesting more blur layers inside a resizing one is what tipped
   iOS Safari into reloading the page. The rim gradient stays — it is a
   plain gradient, not a filter. */
.gn-opt.glass{
  --glass-fill-a:.3;
  --glass-shadow:none;
  -webkit-backdrop-filter:none; backdrop-filter:none;
}
.gn-opt.glass::before{-webkit-backdrop-filter:none; backdrop-filter:none;}
.gn-opt.glass:hover{--glass-fill-a:.45;}

/* ---- Filter sheet tabs: a sliding glass puck under the active tab ---- */

.filter-sheet.glass .mode-tabs{
  padding:4px;
  border-bottom:0;
  border-radius:16px;
  background:rgba(var(--bgs-bg-rgb),.4);
  box-shadow:inset 0 0 0 1px rgba(var(--bgs-ivory-rgb),.06);
}
.filter-sheet.glass .mode-tab{
  position:relative;
  z-index:1;
  padding:9px 6px 10px;
  border-radius:12px;
  text-align:center;
}
.filter-sheet.glass .mode-tab:nth-child(2){text-align:center;}
.filter-sheet.glass .mode-ink{display:none;}
.filter-sheet.glass .mode-puck{
  display:block;
  position:absolute;
  top:4px;bottom:4px;left:4px;
  width:calc((100% - 8px) / 2);
  border-radius:12px;
  --glass-fill-a:.5;
  --glass-shadow:0 2px 8px rgba(0,0,0,.35);
  /* Same rule as the sheet options: no blur nested inside the sheet's. */
  -webkit-backdrop-filter:none; backdrop-filter:none;
  transition:transform .45s var(--ease-liquid);
}
.filter-sheet.glass .mode-puck::before{-webkit-backdrop-filter:none; backdrop-filter:none;}
.filter-sheet.glass .mode-tabs[data-mode=numbers] .mode-puck{transform:translateX(100%);}

/* ---- Reduced motion: no transitions; the refraction ring is static and
   stays. Sheets still open and close, they just don't slide. ---- */

@media (prefers-reduced-motion:reduce){
  .glass,
  .glass::before,
  .glass::after,
  .glass.open,
  .glass.is-open,
  .filter-sheet.glass,
  .bsheet.glass,
  .bsheet.glass.is-open,
  .topbar,
  .topbar.is-in,
  body.scroll-locked .topbar.is-in,
  .gn-fab.glass,
  body.is-selecting .gn-fab.glass,
  .filter-sheet.glass .mode-puck,
  .sheet-scrim,
  .bsheet-scrim{transition:none;}
}

/* ---- Game Night selection bar: status chip + action pill ----
   docs/claude-code-spec-selection-bar.md. Replaces .gn-bar and the tray
   while the glass path is on; the markup for both is always there and
   updateGnBar renders both, so this is a pure view swap. The list opens on
   the tray's own state (body.gn-tray-open) and its scrim (#gnScrim). */

body.gn-selecting .gn-bar{display:none;}
.gn-tray{display:none;}
.gn-scrim{background:rgba(var(--bgs-bg-rgb),.4);transition:opacity .3s ease;}

body.gn-selecting .selbar{
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:10px;
  position:fixed;
  left:12px;
  right:12px;
  bottom:calc(16px + env(safe-area-inset-bottom));
  max-width:406px;
  margin:0 auto;
  z-index:15; /* the old bar's layer: over the shelf and the scrim (13), under every sheet */
}
.selbar__row{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:10px;
  width:100%;
}

/* chip */
.selbar__chip{
  height:34px;
  padding:0 6px 0 14px;
  border-radius:999px;
  display:flex;
  align-items:center;
  gap:6px;
  font-family:'IBM Plex Mono',monospace;
  font-size:12.5px;
  color:var(--bgs-ivory-70);
  cursor:pointer;
  --glass-fill-a:.45;
  --glass-blur:14px;
  --glass-shadow:0 4px 12px rgba(0,0,0,.35);
  transition:color .25s ease, transform .28s var(--ease-liquid);
}
.selbar__chip.ok{color:var(--bgs-ivory);}
.selbar__chip:disabled{pointer-events:none;}
.selbar__chev{
  width:22px;
  height:22px;
  display:grid;
  place-items:center;
  color:var(--bgs-gold);
  transition:transform .35s var(--ease-liquid), opacity .2s ease;
}
.selbar__chev svg{width:14px;height:14px;transform:rotate(180deg);} /* GN_CHEV_SVG points down; this one points up */
.selbar__chip:disabled .selbar__chev{opacity:0;width:0;}
body.gn-tray-open .selbar__chev{transform:rotate(180deg);}

/* round buttons: cancel, share */
.selbar__round{
  width:52px;
  height:52px;
  flex:none;
  border-radius:999px;
  display:grid;
  place-items:center;
  padding:0;
  color:var(--bgs-ivory);
  cursor:pointer;
  --glass-fill-a:.5;
  transition:transform .28s var(--ease-liquid), opacity .3s ease;
}
.selbar__round svg{width:18px;height:18px;}
/* Hidden = faded and shrunk in place, never a width change: the slot stays
   52px so the pill's width is fixed and nothing relays out mid-transition. */
.selbar__round.hide{
  opacity:0;
  transform:scale(.6);
  pointer-events:none;
}

/* action pill */
.selbar__pill{
  height:56px;
  flex:1;
  max-width:260px;
  padding:0 26px;
  border-radius:999px;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:10px;
  font-family:'Inter',sans-serif;
  font-weight:600;
  font-size:17px;
  color:var(--bgs-ivory-70);
  white-space:nowrap;
  cursor:pointer;
  --glass-fill-a:.58;
  transition:color .25s ease, transform .28s var(--ease-liquid);
}
.selbar__pill:disabled{cursor:default;}
.selbar__pill:disabled:active{transform:none;--glass-fill-a:.58;}
.selbar__pill svg{width:22px;height:22px;flex:none;display:none;}
.selbar__pill.gold{
  background:var(--bgs-gold);
  color:var(--bgs-on-gold);
  box-shadow:var(--glass-focus), 0 6px 18px rgba(0,0,0,.35), inset 0 1px 0 rgba(255,255,255,.35);
}
.selbar__pill.gold svg{display:block;}
.selbar__pill.gold::before,
.selbar__pill.gold::after{display:none;}

/* selected list: rises from the chip */
.selbar__list{
  position:absolute;
  left:0;
  right:0;
  bottom:calc(100% + 10px);
  border-radius:24px;
  padding:8px;
  --glass-fill-a:.66;
  transform-origin:50% 100%;
  transform:translateY(12px) scale(.94);
  opacity:0;
  pointer-events:none;
  transition:transform .45s var(--ease-liquid), opacity .25s ease;
}
body.gn-tray-open .selbar__list{transform:none;opacity:1;pointer-events:auto;}
/* The scroller is a child, not the glass box itself: on iOS WebKit the
   children of an element with both backdrop-filter and overflow scrolling
   do not paint. */
.selbar__scroll{
  max-height:min(50vh, 420px);
  overflow-y:auto;
  -webkit-overflow-scrolling:touch;
  border-radius:16px;
}
.selbar__list h4{
  margin:0;
  padding:8px 10px 6px;
  font-family:'IBM Plex Mono',monospace;
  font-weight:500;
  font-size:11px;
  letter-spacing:.12em;
  text-transform:uppercase;
  color:var(--bgs-gold);
}
.selbar__item{
  display:flex;
  align-items:center;
  gap:12px;
  padding:8px;
  border-radius:16px;
}
.selbar__item:hover{background:rgba(var(--bgs-ivory-rgb),.05);}
.selbar__item img{
  width:36px;
  height:45px;
  flex:none;
  border-radius:8px;
  object-fit:cover;
  object-position:center top;
  background:var(--bgs-plate);
}
.selbar__txt{flex:1;min-width:0;}
.selbar__txt b{
  display:block;
  font-family:'Fraunces',serif;
  font-weight:600;
  font-size:15px;
  line-height:1.2;
  color:var(--bgs-ivory);
}
.selbar__txt span{
  display:block;
  font-family:'IBM Plex Mono',monospace;
  font-size:12px;
  color:var(--bgs-ivory-70);
}
.selbar__rm{
  width:32px;
  height:32px;
  flex:none;
  padding:0;
  border:0;
  border-radius:10px;
  display:grid;
  place-items:center;
  background:rgba(var(--bgs-ivory-rgb),.06);
  color:var(--bgs-ivory-70);
  cursor:pointer;
}
.selbar__rm svg{width:14px;height:14px;}
.selbar__rm:hover{color:var(--bgs-ivory);}
.selbar__rm:focus-visible{outline:none;box-shadow:0 0 0 2px var(--bgs-bg),0 0 0 4px var(--bgs-gold);}
.selbar__empty{padding:14px 12px 16px;font-size:14px;color:var(--bgs-ivory-70);}

@media (prefers-reduced-motion:reduce){
  .selbar__chip,
  .selbar__chev,
  .selbar__round,
  .selbar__pill,
  .selbar__list,
  .gn-scrim{transition:none;}
}

/* ---- "Tonight's surprise": pinned glass footer, cancel as × ----
   docs/claude-code-spec-surprise-footer.md. The sheet, its heading and the
   cards are untouched; the action row becomes a footer pinned inside the
   sheet, the Cancel link gives way to a × in the header. Same handlers. */

.gn-sheet{position:relative;}
.gn-sheet h3{padding-right:48px;}
.gn-sheet .gn-sheet__x{
  display:grid;
  place-items:center;
  position:absolute;
  top:26px; /* centred on the 24px heading: 12px sheet padding + grab + 16px */
  right:14px;
  width:40px;
  height:40px;
  padding:0;
  border-radius:999px;
  color:var(--bgs-ivory);
  cursor:pointer;
  z-index:6;
  --glass-fill-a:.4;
  --glass-shadow:0 4px 12px rgba(0,0,0,.3);
}
.gn-sheet .gn-sheet__x svg{width:16px;height:16px;stroke-width:2.5;}
.gn-sheet .gn-cancel-link{display:none;}

/* The last card row clears the footer; the footer never scrolls. */
.gn-sheet .gn-surprise-grid{margin-bottom:0;padding-bottom:110px;}
.gn-sheet .gn-row{
  position:absolute;
  left:12px;
  right:12px;
  bottom:calc(14px + env(safe-area-inset-bottom));
  display:flex;
  gap:10px;
  z-index:5;
}
.gn-sheet .gn-row .gn-secondary-btn,
.gn-sheet .gn-row .gn-primary-btn{
  height:54px;

    font-family:'Fraunces',serif;
    font-weight:600;
    font-size:13.5px;
    line-height:1.2;
    letter-spacing:-.005em;
    color:var(--bgs-ivory);
    margin:0;
    display:-webkit-box;
    -webkit-line-clamp:2;
    -webkit-box-orient:vertical;
    overflow:hidden;
    min-height:2.4em; /* two lines, so the meta rows line up across the grid */
  }
  .game-card .meta-row{ display:flex; align-items:center; justify-content:space-between; gap:4px; }
  /* Gold ring only, no fill — an inset box-shadow, never a border. */
  .game-card .rating-pill{
    display:inline-flex; align-items:center; gap:4px;
    background:none;
    border:0;
    box-shadow:inset 0 0 0 1px rgba(var(--bgs-gold-rgb),.45);
    border-radius:999px;
    padding:3px 8px;
    font-size:12.5px; font-weight:600;
    color:var(--bgs-gold);
    white-space:nowrap;
  }
  .game-card .players{ font-family:'IBM Plex Mono',monospace; font-size:12px; color:var(--bgs-ivory-45); font-weight:400; white-space:nowrap; }

  @keyframes shimmer{
    0%{background-position:150% 0;}
    100%{background-position:-50% 0;}
  }
  .game-card-skeleton{
    cursor:default;
    pointer-events:none;
  }
  .game-card-skeleton .art{
    background:linear-gradient(100deg, var(--bgs-plate) 30%, rgba(var(--bgs-ivory-rgb),0.08) 50%, var(--bgs-plate) 70%);
    background-size:250% 100%;
    animation:shimmer 1.7s ease-in-out infinite;
  }
  .game-card-skeleton:nth-child(6n+2) .art{animation-delay:0.15s;}
  .game-card-skeleton:nth-child(6n+3) .art{animation-delay:0.3s;}
  .game-card-skeleton:nth-child(6n+4) .art{animation-delay:0.45s;}
  .game-card-skeleton:nth-child(6n+5) .art{animation-delay:0.6s;}
  .game-card-skeleton:nth-child(6n) .art{animation-delay:0.75s;}
  .game-card-skeleton .skeleton-line{
    height:8px;
    border-radius:4px;
    background:rgba(var(--bgs-ivory-rgb),0.08);
  }
  .game-card-skeleton .skeleton-line.short{ width:60%; }


  /* Footer lives in css/base.css. The shelf adds FAB clearance so the pill
     never covers the legal lines: --fab-clearance = .gn-fab height (48px)
     + its bottom offset (16px + safe-area) + 16px breathing room. */
  .shelf-footer{--fab-clearance:calc(80px + env(safe-area-inset-bottom));}

  /* ==== Game Night (Stage 1: session creation) ==== */

  /* Floating entry point, bottom-centre. z-index 12 keeps it under the selection
     bar (15), tray (14), and scrim (13), and well under the filter sheet (21)
     and detail modal (30) — it can never sit on top of a sheet or modal.

     One element, two states: closed it is the pill; .is-open morphs the same
     box into a sheet (width, height, bottom, radius transition) while the
     pill's content fades out and the sheet's content rises in. Nothing is
     swapped, so there is no flash. The sheet holds the single entry action
     the pill used to fire directly, plus close (docs/claude-code-spec-liquid-glass.md). */
  .gn-fab{
    position:fixed;
    left:50%;
    bottom:calc(16px + env(safe-area-inset-bottom));
    /* Centered. translateX lives here as the base transform; every other
       transform on this element must include it or the pill jumps left. It
       also keeps the box centred while its width transitions. */
    transform:translateX(-50%);
    z-index:12;
    width:152px;
    height:48px;
    /* Tinted glass. Tint stays >= .82: gold text is lower-contrast than ivory,
       and .82 is where it clears 4.5:1 over a white cover (4.87:1). */
    background:rgba(var(--bgs-plate-rgb),0.82);
    -webkit-backdrop-filter:blur(16px) saturate(1.2);
    backdrop-filter:blur(16px) saturate(1.2);
    border:1.5px solid rgba(var(--bgs-gold-rgb),0.55);
    border-radius:999px;
    color:var(--bgs-gold);
    overflow:hidden;
    text-align:left;
    box-shadow:0 1px 0 rgba(var(--bgs-ivory-rgb),0.08) inset,
               0 8px 24px -10px rgba(0,0,0,0.7);
    transition:width var(--dur) var(--ease-liquid), height var(--dur) var(--ease-liquid),
               bottom var(--dur) var(--ease-liquid), border-radius var(--dur) var(--ease-liquid),
               transform 0.18s cubic-bezier(.2,.8,.3,1), opacity 0.18s ease, border-color 0.18s ease;
  }
  .gn-fab:hover{border-color:var(--bgs-gold);}
  .gn-fab.is-open{
    width:calc(100vw - 24px);
    max-width:456px;
    height:312px; /* title, line, two options */
    bottom:calc(12px + env(safe-area-inset-bottom));
    border-radius:30px;
    z-index:60; /* above the compact topbar (17) and every bottom sheet; its scrim is 50 */
  }
  .gn-fab__pill{
    position:absolute;inset:0;
    display:flex;align-items:center;justify-content:center;gap:8px;
    padding:0;border:0;background:none;
    color:inherit;
    font-family:'Inter',sans-serif;
    font-size:14px;
    font-weight:700;
    letter-spacing:0.01em;
    white-space:nowrap;
    cursor:pointer;
    transition:opacity 0.2s ease, transform 0.35s var(--ease-liquid);
  }
  .gn-fab__pill svg{width:18px;height:18px;flex:none;}
  .gn-fab__pill:active{transform:scale(0.97);}
  .gn-fab__pill:focus-visible{outline:0;box-shadow:inset 0 0 0 2px var(--bgs-gold);border-radius:inherit;}
  .gn-fab.is-open .gn-fab__pill{opacity:0;transform:scale(0.9);pointer-events:none;}
  .gn-fab__sheet{
    position:absolute;inset:0;
    padding:22px 20px;
    color:var(--bgs-ivory);
    opacity:0;
    transform:translateY(14px);
    pointer-events:none;
    transition:opacity 0.35s ease 0.18s, transform 0.5s var(--ease-liquid) 0.12s;
  }
  .gn-fab.is-open .gn-fab__sheet{opacity:1;transform:none;pointer-events:auto;}
  .gn-fab__sheet h2{
    margin:0;
    display:flex;align-items:center;gap:12px;
    font-family:'Fraunces',serif;font-weight:700;font-size:26px;line-height:1.1;letter-spacing:-0.01em;
    color:var(--bgs-ivory);
  }
  .gn-fab__sheet h2 svg{width:26px;height:26px;flex:none;color:var(--bgs-gold);}
  .gn-fab__sheet p{margin:6px 0 0;font-size:15px;color:var(--bgs-ivory-70);}
  .gn-fab__close{
    position:absolute;top:16px;right:16px;
    width:36px;height:36px;
    display:grid;place-items:center;
    border:0;border-radius:12px;
    background:rgba(var(--bgs-ivory-rgb),0.06);
    color:var(--bgs-ivory-70);
    font-size:18px;line-height:1;
    cursor:pointer;
  }
  .gn-fab__close:hover{color:var(--bgs-ivory);}
  .gn-fab__close:focus-visible{outline:0;box-shadow:0 0 0 2px var(--bgs-bg),0 0 0 4px var(--bgs-gold);}
  .gn-opt{
    display:flex;align-items:center;gap:14px;
    width:100%;
    margin-top:12px;
    padding:16px;
    border:1px solid rgba(var(--bgs-gold-rgb),0.3);
    border-radius:20px;
    background:rgba(var(--bgs-ivory-rgb),0.05);
    color:var(--bgs-ivory);
    font:inherit;
    text-align:left;
    cursor:pointer;
  }
  .gn-opt:first-of-type{margin-top:22px;}
  .gn-opt:hover{border-color:var(--bgs-gold);}
  .gn-opt:focus-visible{outline:0;box-shadow:0 0 0 2px var(--bgs-bg),0 0 0 4px var(--bgs-gold);}
  .gn-opt__ic{
    width:44px;height:44px;flex:none;
    display:grid;place-items:center;
    border-radius:14px;
    color:var(--bgs-gold);
    background:rgba(var(--bgs-gold-rgb),0.12);
  }
  .gn-opt__ic svg{width:22px;height:22px;}
  .gn-opt__txt{flex:1;min-width:0;}
  .gn-opt__txt b{display:block;font-weight:600;font-size:16px;}
  .gn-opt__txt span{display:block;margin-top:2px;font-size:13.5px;color:var(--bgs-ivory-70);}
  .gn-opt__chev{flex:none;color:var(--bgs-ivory-45);font-size:18px;line-height:1;}
  .gn-fab-scrim{
    position:fixed;inset:0;
    z-index:50;
    background:rgba(var(--bgs-bg-rgb),0.45);
    opacity:0;
    pointer-events:none;
    transition:opacity 0.35s ease;
  }
  .gn-fab-scrim.open{opacity:1;pointer-events:auto;}
  /* Solid plate when blur isn't available or the OS asks for less transparency. */
  @supports not (backdrop-filter:blur(1px)){
    .gn-fab{background:var(--bgs-plate);}
  }
  @media (prefers-reduced-transparency:reduce){
    .gn-fab{
      background:var(--bgs-plate);
      -webkit-backdrop-filter:none;backdrop-filter:none;
    }
  }
  /* Selection mode hands off to the bottom bar — the pill animates down and
     out. Packing a bag takes the same handoff. */
  body.is-selecting .gn-fab{
    opacity:0;
    transform:translateX(-50%) translateY(14px) scale(0.9);
    pointer-events:none;
  }


  .gn-toast{
    position:fixed;
    left:50%;
    /* Clears the floating pill (46px tall at a 16px offset) so the toast
       never lands on top of the control that raises it. */
    bottom:calc(78px + env(safe-area-inset-bottom));
    transform:translateX(-50%) translateY(8px);
    z-index:50;
    background:var(--bgs-plate);
    border:1px solid rgba(var(--bgs-gold-rgb),0.35);
    color:var(--bgs-ivory);
    font-family:'Inter',sans-serif;
    font-size:13px;
    font-weight:500;
    padding:12px 18px;
    border-radius:12px;
    box-shadow:0 8px 24px -6px rgba(0,0,0,0.6);
    opacity:0;
    pointer-events:none;
    transition:opacity 0.2s ease, transform 0.2s ease;
  }
  .gn-toast.open{opacity:1;transform:translateX(-50%) translateY(0);}

  /* generic modal shell reused by the chooser, surprise, and confirm steps */
  .gn-backdrop{
    position:fixed;inset:0;
    background:rgba(var(--bgs-bg-rgb),0.66);
    backdrop-filter:blur(3px);
    display:none;
    align-items:center;
    justify-content:center;
    padding:24px;
    z-index:40;
  }
  .gn-backdrop.open{display:flex;}
  .gn-panel{
    background:var(--bgs-plate);
    border:1px solid rgba(var(--bgs-gold-rgb),0.3);
    border-radius:16px;
    max-width:420px;
    width:100%;
    max-height:85vh;
    overflow-y:auto;
    padding:26px 26px 22px;
    animation:pop 0.18s ease;
  }
  @keyframes pop{from{opacity:0;transform:scale(0.96);}to{opacity:1;transform:scale(1);}}
  .gn-panel h3{
    font-family:'Fraunces',serif;
    font-weight:600;
    font-size:19px;
    margin:0 0 6px;
  }
  .gn-panel .gn-sub{
    font-size:13px;
    color:var(--bgs-ivory-70);
    margin:0 0 18px;
    line-height:1.5;
  }
  .gn-cancel-link{
    display:flex;
    align-items:center;
    justify-content:center;
    width:100%;
    /* 44px is the smallest comfortable thumb target; the old 10px-top-padding
       box was barely taller than the text itself. */
    min-height:44px;
    background:none;
    border:none;
    color:var(--bgs-ivory-45);
    font:inherit;
    font-size:13px;
    font-weight:600;
    text-align:center;
    padding:12px 0;
    cursor:pointer;
  }
  .gn-cancel-link:hover{color:var(--bgs-ivory);}

  .gn-surprise-grid{
    display:grid;
    grid-template-columns:repeat(3, 1fr);
    gap:8px;
    margin:0 0 18px;
  }
  /* Shell matched to .game-card on the shelf — same plate, same radius, same
     shadow — so a game reads identically in the sheet and in the grid behind it. */
  .gn-surprise-card{
    border-radius:10px;
    overflow:hidden;
    background:var(--bgs-plate);
    box-shadow:0 3px 10px rgba(0,0,0,.35);
  }
  .gn-surprise-card .art{aspect-ratio:3/4;width:100%;overflow:hidden;background:var(--bgs-plate);}
  .gn-surprise-card .art img{width:100%;height:100%;object-fit:cover;display:block;}
  .gn-surprise-card .t{
    font-family:'Fraunces',serif;
    font-weight:600;
    font-size:10.5px;
    line-height:1.25;
    padding:5px 5px 6px;
    display:-webkit-box;
    -webkit-line-clamp:2;
    -webkit-box-orient:vertical;
    overflow:hidden;
  }
  .gn-row{display:flex;gap:10px;}
  .gn-row .gn-secondary-btn{flex:1;}
  .gn-row .gn-primary-btn{flex:1;}

  .gn-secondary-btn{
    background:transparent;
    border:1.5px solid rgba(var(--bgs-ivory-rgb),0.22);
    color:var(--bgs-ivory-70);
    font:inherit;
    font-size:13px;
    font-weight:600;
    padding:12px;
    border-radius:10px;
    cursor:pointer;
  }
  .gn-secondary-btn:hover{border-color:var(--bgs-gold);color:var(--bgs-ivory);}
  .gn-primary-btn{
    background:var(--bgs-gold);
    color:var(--bgs-on-gold);
    border:none;
    font:inherit;
    font-size:13px;
    font-weight:700;
    padding:12px;
    border-radius:10px;
    cursor:pointer;
  }
  .gn-primary-btn:hover{filter:brightness(1.06);}
  .gn-primary-btn:disabled{opacity:0.4;cursor:not-allowed;filter:none;}

  /* ---- Tonight's surprise: bottom sheet, lock & re-roll ---- */
  /* Sheet variant of the shared shell. .gn-panel itself is deliberately
     untouched — the confirm dialog still uses it centered. */
  .gn-backdrop--sheet{align-items:flex-end;padding:0;}
  .gn-sheet{
    max-width:none;
    max-height:88vh;
    border-radius:24px 24px 0 0;
    border-width:1px 0 0;
    padding:12px 20px calc(16px + env(safe-area-inset-bottom));
    box-shadow:0 -20px 60px rgba(0,0,0,0.5);
    /* Overrides .gn-panel's `pop`. Animation and nothing else on this node:
       WebKit drops one of the two when a transition shares an element with an
       animation, so every transition in this feature lives on a child. */
    animation:gn-rise 0.34s cubic-bezier(0.2,0.8,0.2,1);
  }
  @keyframes gn-rise{from{transform:translateY(24px);opacity:0;}to{transform:none;opacity:1;}}
  /* The shelf pairs --bgs-plate cards with a --bgs-bg page. Matching the card
     to the shelf means the sheet has to take the darker ground too — a plate
     card on a plate sheet has no visible edge at all. .gn-panel keeps its plate
     background for the confirm dialog. */
  .gn-sheet{background:var(--bgs-bg);}
  .gn-sheet__grab{
    width:40px;height:4px;border-radius:2px;
    background:rgba(var(--bgs-ivory-rgb),0.22);
    margin:0 auto 16px;
  }
  .gn-sheet h3{font-size:24px;}
  /* All six cards stay on screen at any window height — nothing here scrolls.
     Six 3:4 cards outgrow the sheet's 88vh cap on a short, wide window (a
     1024x768 laptop pushed Cancel clean off the bottom), so the sheet is a flex
     column: the chrome keeps its natural size and the grid takes what's left.
     Inside it the rows share that height and each card's cover shrinks out of
     its 3:4 base rather than overflowing. object-fit:cover already crops the
     art, so a shorter cover stays undistorted; the title and meta never shrink. */
  .gn-sheet{display:flex;flex-direction:column;overflow:hidden;}
  .gn-sheet > *{flex:none;}
  .gn-sheet .gn-surprise-grid{
    flex:0 1 auto;
    min-height:0;
    /* Never grows past the cards' natural size, so a tall window still gets a
       3:4 cover; shrinks when the sheet is squeezed, and the 1fr rows hand that
       reduction to the cards. auto (not hidden) is the safety net: below any
       realistic window height the grid scrolls rather than clipping a card. */
    overflow-y:auto;
    overscroll-behavior:contain;
    /* 140px floor = the title/meta block plus a readable sliver of cover. Below
       that the rows stop shrinking and the grid scrolls, rather than collapsing
       the art to nothing and clipping the title (a landscape phone did exactly
       that). No realistic window height reaches the floor. */
    grid-auto-rows:minmax(140px,1fr);
  }
  /* height:100% is what forces the card into its row: a grid item is stretched
     up to its track but never compressed below its own content, so without this
     the card keeps its full height and overflows the row instead of shrinking. */
  .gn-surprise-card{display:flex;flex-direction:column;height:100%;min-height:0;}
  .gn-surprise-card .art{flex:0 1 auto;min-height:0;}
  .gn-surprise-card .meta{flex:none;}

  .gn-surprise-grid{gap:10px;margin-bottom:20px;perspective:900px;}
  .gn-surprise-card{
    position:relative;
    cursor:pointer;
    -webkit-tap-highlight-color:transparent;
  }
  .gn-surprise-card:focus-visible{outline:2px solid var(--bgs-gold);outline-offset:2px;}
  .gn-surprise-card .meta{padding:8px 8px 10px;}
  /* Clamp fix: the padding that used to sit inside the clamped box moved to
     .meta, so the 2-line box is exactly 2 lines and no third line bleeds. */
  .gn-surprise-card .t{font-size:13px;line-height:1.2;padding:0;min-height:2.4em;}
  .gn-surprise-card .s{
    margin-top:4px;
    font-family:'IBM Plex Mono',monospace;
    font-size:10.5px;
    color:var(--bgs-ivory-45);
  }
  /* The kept badge sits exactly where the swap die was, so the corner changes
     state rather than gaining a second control. No ring, no border change. */
  .gn-surprise-card .lock{
    position:absolute;top:8px;right:8px;
    width:32px;height:32px;border-radius:999px;
    background:var(--bgs-gold);
    color:var(--bgs-on-gold);
    display:grid;place-items:center;
    transform:scale(0);
    transition:transform 0.18s cubic-bezier(0.2,0.9,0.3,1.3);
  }
  .gn-surprise-card .lock svg{width:15px;height:15px;}
  .gn-surprise-card[aria-pressed="true"] .lock{transform:scale(1);}
  /* Sits over arbitrary cover art, so it carries its own scrim + hairline. */
  .gn-surprise-card .swap{
    position:absolute;top:8px;right:8px;
    width:32px;height:32px;border-radius:999px;
    border:1px solid rgba(255,255,255,0.25);
    background:rgba(var(--bgs-bg-rgb),0.55);
    backdrop-filter:blur(6px);
    color:var(--bgs-ivory);
    display:grid;place-items:center;
    cursor:pointer;
  }
  .gn-surprise-card .swap svg{width:16px;height:16px;}
  .gn-surprise-card .swap[hidden]{display:none;}

  /* Re-roll flip. The animation lives on this wrapper and only here; the card's
     .lock keeps its transition one level down. Never both on one node. */
  .gn-surprise-flip{transform-style:preserve-3d;backface-visibility:hidden;border-radius:10px;}
  .gn-surprise-flip.out{animation:gn-flip-out 0.18s ease-in forwards;}
  .gn-surprise-flip.in{animation:gn-flip-in 0.28s cubic-bezier(0.2,0.8,0.2,1);}
  @keyframes gn-flip-out{to{transform:rotateY(90deg);}}
  @keyframes gn-flip-in{from{transform:rotateY(-90deg);}}

  /* Re-roll sizes to its label rather than taking a fixed share of the row —
     "Re-roll 6" in a half-width slab read as mostly empty. Continue absorbs the
     rest. Scoped to the sheet so the confirm dialog's own row is untouched. */
  .gn-sheet .gn-row .gn-secondary-btn{
    display:flex;align-items:center;justify-content:center;gap:6px;
    flex:0 0 auto;
    padding:12px 18px;
  }
  .gn-sheet .gn-row .gn-secondary-btn svg{width:16px;height:16px;}
  .gn-sheet .gn-row .gn-secondary-btn:disabled{opacity:0.4;cursor:not-allowed;}
  /* Holds the button's width steady as the count ticks down. */
  #gnRerollN{display:inline-block;min-width:1ch;text-align:center;}

  .sr-only{
    position:absolute;width:1px;height:1px;
    padding:0;margin:-1px;overflow:hidden;
    clip:rect(0,0,0,0);white-space:nowrap;border:0;
  }

  @media (prefers-reduced-motion:reduce){
    .gn-sheet{animation:none;}
    .gn-surprise-flip.out,.gn-surprise-flip.in{animation:none;}
    .gn-surprise-card .lock{transition:none;}
  }
  @media (prefers-reduced-transparency:reduce){
    .gn-surprise-card .swap{background:rgba(var(--bgs-bg-rgb),0.92);backdrop-filter:none;}
  }
  @supports not (backdrop-filter:blur(1px)){
    .gn-surprise-card .swap{background:rgba(var(--bgs-bg-rgb),0.92);}
  }
  @media (min-width:640px){
    .gn-sheet{max-width:520px;margin:0 auto;}
  }

  .gn-field{margin-bottom:16px;}
  .gn-field label{
    display:block;
    font-family:'IBM Plex Mono',monospace;
    font-size:11px;
    letter-spacing:0.06em;
    text-transform:uppercase;
    color:var(--bgs-gold-dim);
    margin-bottom:8px;
  }
  .gn-text-input{
    width:100%;
    background:var(--bgs-bg);
    border:1px solid rgba(var(--bgs-gold-rgb),0.22);
    border-radius:10px;
    color:var(--bgs-ivory);
    font-family:'Inter',sans-serif;
    /* 16px, not smaller: iOS Safari zooms the page in when you focus an input
       whose text is under 16px, and never zooms back out. Matches .search. */
    font-size:16px;
    padding:11px 13px;
    outline:none;
  }
  .gn-text-input:focus{border-color:var(--bgs-gold);}
  .gn-toggle-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
    background:none;
    border:none;
    padding:0;
    width:100%;
    cursor:pointer;
    text-align:left;
  }
  .gn-toggle-row .toggle-label{
    font-family:'Inter',sans-serif;
    font-size:13px;
    font-weight:500;
    color:var(--bgs-ivory);
  }
  .gn-summary{
    font-family:'IBM Plex Mono',monospace;
    font-size:12px;
    color:var(--bgs-gold-dim);
    margin:2px 0 18px;
  }
  .gn-error{
    font-size:12.5px;
    color:var(--bgs-danger-hover);
    margin:0 0 14px;
    display:none;
  }
  .gn-error.show{display:block;}

  /* ---- selection overlays on the shelf card ----
     Shared: body.is-selecting is set by game night's selection mode and by the
     bag's packing mode alike, so picking games looks and moves the same either
     way. Only the bar at the bottom differs. */
  .sel-ring,.checkbox,.info-btn{display:none;}

@media (min-width:800px){.planks{--n:6;--g:22px}}
.plankrow{position:relative;display:flex;justify-content:center;align-items:flex-end;gap:var(--g);padding:22px var(--pad,10px) 48px;isolation:isolate;content-visibility:auto;contain-intrinsic-size:auto 240px}
.plankrow .plank{position:absolute;left:4px;right:4px;bottom:34px;height:14px;border-radius:2px 2px 3px 3px;z-index:3;
  background:linear-gradient(to bottom,#5a4231 0 22%,#3a2a20 22% 48%,#2a1d16 48%,#1a110d 100%);
  box-shadow:inset 0 1px 0 rgba(var(--bgs-gold-rgb),.6),inset 0 -1px 0 rgba(0,0,0,.75),0 1px 0 rgba(0,0,0,.6)}
/* the plank's shadow on the wall: wide, soft, darkest just under the board and gone by ~50px */
.plankrow .plank::before{content:"";position:absolute;left:0;right:0;top:100%;height:34px;pointer-events:none;
  background:linear-gradient(to bottom,rgba(0,0,0,.7) 0,rgba(0,0,0,.4) 30%,rgba(0,0,0,.12) 68%,transparent 100%);
  -webkit-mask-image:linear-gradient(to right,transparent,#000 6%,#000 94%,transparent);mask-image:linear-gradient(to right,transparent,#000 6%,#000 94%,transparent)}
/* the boxes' own shadow, cast back onto the wall and down onto the plank */
.plankrow .plank::after{content:"";position:absolute;left:2%;right:2%;bottom:100%;height:16px;pointer-events:none;
  background:linear-gradient(to top,rgba(0,0,0,.45),transparent)}
.plankrow .lamp{position:absolute;left:0;right:0;top:0;height:100%;z-index:0;pointer-events:none;background:radial-gradient(ellipse 50% 50% at 50% 45%,rgba(var(--bgs-ivory-rgb),.05),transparent 100%)}
.gbox{position:relative;flex:none;width:var(--bw);aspect-ratio:3/4;z-index:2;padding:0;border:0;background:none;color:inherit;font:inherit;text-align:center;cursor:pointer;transform:translateY(0);transition:transform .35s var(--ease-liquid)}
.gbox .face{position:absolute;inset:0;z-index:2;border-radius:5px;overflow:hidden;background:var(--bgs-plate);box-shadow:inset 0 0 0 1px rgba(var(--bgs-ivory-rgb),.14),-5px 10px 18px -9px rgba(0,0,0,.9);transform:perspective(600px) rotateY(var(--lean,0deg));transform-origin:50% 100%}
.gbox .face img{width:100%;height:100%;object-fit:cover;object-position:center top;display:block}
.gbox .face::after{content:"";position:absolute;inset:0;background:linear-gradient(105deg,rgba(255,255,255,.14) 0,transparent 30%,transparent 72%,rgba(0,0,0,.22) 100%)}
/* one shared warm light per box. No blur filter and no breathing here: 196 boxes must stay cheap. */
.gbox .glow{position:absolute;left:-20%;right:-20%;top:-14%;bottom:-3%;z-index:1;pointer-events:none;background:radial-gradient(ellipse 46% 46% at 50% 56%,rgba(var(--bgs-gold-rgb),.42) 0,rgba(var(--bgs-gold-rgb),.16) 45%,transparent 100%);opacity:.9}
.gbox .foot{position:absolute;left:4%;right:4%;bottom:-3px;height:10px;border-radius:50%;background:rgba(0,0,0,.8);filter:blur(3px);z-index:1}
.gbox:hover,.gbox:focus-visible,.gbox.up{transform:translateY(-8px) scale(1.04);z-index:5}
.gbox:hover .face,.gbox.up .face{transform:perspective(600px) rotateY(0)}
.gbox:focus-visible{outline:0}.gbox:focus-visible .face{box-shadow:0 0 0 2px var(--bgs-gold),inset 0 0 0 1px rgba(var(--bgs-ivory-rgb),.14)}
.gbox .cap{position:absolute;left:-6px;right:-6px;top:calc(100% + 20px);font:600 11px/1.25 'Fraunces',serif;color:var(--bgs-ivory-70);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;z-index:4}
/* label mode (demo bar): none | hover | always */
.planks[data-labels="none"] .cap{display:none}
.planks[data-labels="hover"] .cap{top:auto;bottom:8px;left:6px;right:6px;padding:6px 7px;border-radius:8px;background:rgba(var(--bgs-bg-rgb),.72);box-shadow:inset 0 0 0 1px rgba(var(--bgs-ivory-rgb),.16);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);color:var(--bgs-ivory);opacity:0;transform:translateY(4px);transition:opacity .25s,transform .25s}
.planks[data-labels="hover"] .gbox:hover .cap,.planks[data-labels="hover"] .gbox.up .cap{opacity:1;transform:none}

/* selection mode + packing: same ring and checkbox language as the cards */
.gbox .sel{position:absolute;inset:-4px;border-radius:8px;box-shadow:inset 0 0 0 2px rgba(var(--bgs-ivory-rgb),.35);display:none;z-index:3;pointer-events:none}
.gbox .chk{position:absolute;top:6px;left:6px;width:22px;height:22px;border-radius:50%;background:rgba(var(--bgs-bg-rgb),.7);box-shadow:inset 0 0 0 1.5px rgba(var(--bgs-ivory-rgb),.6);display:none;place-items:center;z-index:4;color:var(--bgs-on-gold);font:700 12px/1 'Inter',sans-serif}
body.is-selecting .gbox .sel,body.is-selecting .gbox .chk{display:grid}
body.is-selecting .gbox:not(.selected) .face img{opacity:.62}
body.is-selecting .gbox.selected .sel{box-shadow:inset 0 0 0 2px var(--bgs-gold)}
body.is-selecting .gbox.selected .chk{background:var(--bgs-gold);box-shadow:none}
body.is-selecting .gbox.selected .glow{background:radial-gradient(ellipse 46% 46% at 50% 56%,rgba(var(--bgs-gold-rgb),.8) 0,rgba(var(--bgs-gold-rgb),.3) 45%,transparent 100%)}
.shelf-empty-shelf{padding:40px 0}

.demobar{position:fixed;left:0;right:0;bottom:0;z-index:60;display:flex;gap:6px;align-items:center;padding:9px 10px calc(9px + env(safe-area-inset-bottom,0px));overflow-x:auto;white-space:nowrap;background:#0b0908;border-top:1px solid rgba(255,255,255,.1);font:400 11.5px/1 'IBM Plex Mono',monospace;color:#eee}
.demobar b{font-weight:400;opacity:.55;margin:0 2px 0 8px}.demobar button{padding:7px 10px;border-radius:99px;border:1px solid rgba(255,255,255,.16);background:none;color:inherit;font:inherit;flex:none;cursor:pointer}
.demobar button[aria-pressed="true"]{background:#f3eadb;color:#111}
body{padding-bottom:70px}
</style>

const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const LEAN=[-6,4,-3,5,-5,3,-4,6,-2,4,-6,2];
const im=g=>`<img src="${g.i}" alt="${g.t} cover" loading="lazy" decoding="async" referrerpolicy="no-referrer" onerror="this.style.visibility='hidden'">`;
const shelf=$('#shelf');
function cards(list){shelf.className='shelf';shelf.innerHTML=list.map(g=>`<button class="game-card" data-id="${g.id}"><span class="sel-ring"></span><div class="art">${im(g)}</div><div class="info"><h3 class="title">${g.t}</h3><div class="meta-row"><span class="rating-pill">★ ${g.r.toFixed(1)}</span><span class="players">${g.p[0]===g.p[1]?g.p[0]:g.p[0]+'–'+g.p[1]}</span></div></div></button>`).join('')}
function planks(list){const n=innerWidth>=800?6:innerWidth>=560?4:3;shelf.className='planks';shelf.dataset.labels=state.labels;let h='';
  for(let i=0;i<list.length;i+=n){h+=`<div class="plankrow">`+list.slice(i,i+n).map((g,k)=>`<button class="gbox" data-id="${g.id}" style="--lean:${LEAN[(i+k)%LEAN.length]}deg" aria-label="${g.t}"><span class="glow"></span><span class="sel"></span><span class="chk">✓</span><span class="face">${im(g)}</span><span class="foot"></span><span class="cap">${g.t}</span></button>`).join('')+`<span class="lamp"></span><span class="plank"></span></div>`}
  shelf.innerHTML=h}
const state={view:'shelf',labels:'none',count:196,select:false};   // titles: covers only (locked)
function render(){const list=G.slice(0,state.count);(state.view==='shelf'?planks:cards)(list);
  $('#shelf-count-text').textContent=`${list.length} of ${G.length} games`;
  $$('#shelf .gbox,#shelf .game-card').forEach(b=>b.addEventListener('click',()=>{if(state.select){b.classList.toggle('selected');return}
    if(b.classList.contains('gbox')){$$('.gbox').forEach(x=>x.classList.remove('up'));b.classList.add('up');setTimeout(()=>b.classList.remove('up'),1400)}}))}
function setView(v){state.view=v;try{localStorage.setItem('bgs:view',v)}catch(e){}const T=$('#viewToggle');T.dataset.view=v;$$('.view-opt').forEach(o=>o.setAttribute('aria-checked',o.dataset.view===v));render()}
$$('.view-opt').forEach(o=>o.onclick=()=>setView(o.dataset.view));
let rw;addEventListener('resize',()=>{clearTimeout(rw);rw=setTimeout(render,120)});
/* demo bar */
$$('.demobar [data-labels]').forEach(b=>b.onclick=()=>{state.labels=b.dataset.labels;$$('.demobar [data-labels]').forEach(x=>x.setAttribute('aria-pressed',x===b));render()});
$$('.demobar [data-count]').forEach(b=>b.onclick=()=>{state.count=+b.dataset.count;$$('.demobar [data-count]').forEach(x=>x.setAttribute('aria-pressed',x===b));render()});
$('#selMode').onclick=e=>{state.select=!state.select;document.body.classList.toggle('is-selecting',state.select);e.currentTarget.setAttribute('aria-pressed',state.select)};
$$('.demobar [data-theme]').forEach(b=>b.onclick=()=>{document.documentElement.dataset.theme=b.dataset.theme;$$('.demobar [data-theme]').forEach(x=>x.setAttribute('aria-pressed',x===b))});
setView('shelf');
</script>
