<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BoardgameShelf — sign-in section options</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;1,9..144,500&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bgs-bg:#160F0A;--bgs-bg-rgb:22,15,10;--bgs-bg-radial:#241708;
  --bgs-plate:#241A10;--bgs-plate-rgb:36,26,16;
  --bgs-ivory:#F4EBDA;--bgs-ivory-rgb:244,235,218;
  --bgs-ivory-70:rgba(244,235,218,0.72);--bgs-ivory-45:rgba(244,235,218,0.45);
  --bgs-gold:#E3B04B;--bgs-gold-rgb:227,176,75;--bgs-gold-dim:rgba(227,176,75,0.62);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:radial-gradient(ellipse at top,var(--bgs-bg-radial) 0%,var(--bgs-bg) 55%),var(--bgs-bg);color:var(--bgs-ivory);font-family:'Inter',sans-serif;min-height:100svh;-webkit-font-smoothing:antialiased}
.bar{position:sticky;top:0;z-index:50;display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:10px 14px;background:rgba(var(--bgs-bg-rgb),.92);border-bottom:1px solid rgba(var(--bgs-gold-rgb),.18);font-family:'IBM Plex Mono',monospace;font-size:12px;backdrop-filter:blur(8px)}
.bar .lbl{color:var(--bgs-gold-dim)}
.bar button{font:inherit;color:var(--bgs-ivory-70);background:transparent;border:1px solid rgba(var(--bgs-gold-rgb),.3);border-radius:999px;padding:5px 11px;cursor:pointer}
.bar button[aria-pressed="true"]{color:var(--bgs-bg);background:var(--bgs-gold);border-color:var(--bgs-gold)}
.bar button:focus-visible{outline:none;box-shadow:0 0 0 2px var(--bgs-bg),0 0 0 4px var(--bgs-gold)}
.opt{display:none}.opt.on{display:block}

.wrap{max-width:560px;margin:0 auto;padding:40px 20px 0;text-align:center}
.mark{font-family:'Fraunces',serif;font-style:italic;font-weight:500;font-size:17px;color:var(--bgs-gold);margin:0}
.hand{position:relative;height:210px;margin:8px auto 0;max-width:520px}
.hand .cover{position:absolute;left:50%;bottom:0;width:132px;aspect-ratio:1/1;border-radius:6px;overflow:hidden;background:var(--c);border:1px solid rgba(var(--bgs-ivory-rgb),.12);box-shadow:0 10px 24px rgba(0,0,0,.45);transform-origin:50% 160%;transform:translateX(-50%) rotate(var(--r)) translateY(var(--y))}
.hand .cover img{display:block;width:100%;height:100%;object-fit:cover}
.hand .cover:nth-child(1){--r:-22deg;--y:8px}.hand .cover:nth-child(2){--r:-11deg;--y:-2px}
.hand .cover:nth-child(3){--r:0deg;--y:-8px;z-index:2;box-shadow:0 0 0 2px var(--bgs-gold),0 16px 30px rgba(0,0,0,.6)}
.hand .cover:nth-child(4){--r:11deg;--y:-2px}.hand .cover:nth-child(5){--r:22deg;--y:8px}
h1{font-family:'Fraunces',serif;font-weight:600;font-variation-settings:'opsz' 144;font-size:clamp(38px,9vw,64px);line-height:1.02;letter-spacing:-.015em;margin:28px 0 14px}
.sub{font-size:17px;line-height:1.45;color:var(--bgs-ivory-70);margin:0 auto 0;max-width:32ch}

.btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;min-height:52px;padding:0 18px;border-radius:12px;font:600 16px/1 'Inter',sans-serif;cursor:pointer;border:1.5px solid rgba(var(--bgs-gold-rgb),.55);background:transparent;color:var(--bgs-gold)}
.btn.gold{background:var(--bgs-gold);color:var(--bgs-bg);border-color:var(--bgs-gold)}
.btn:focus-visible{outline:none;box-shadow:0 0 0 2px var(--bgs-bg),0 0 0 4px var(--bgs-gold)}
.g{width:22px;height:22px;border-radius:50%;background:#fff;display:grid;place-items:center;flex:none}
.g svg{width:14px;height:14px}
.field{width:100%;min-height:52px;padding:0 16px;border-radius:12px;font:400 16px 'Inter',sans-serif;color:var(--bgs-ivory);background:rgba(var(--bgs-bg-rgb),.6);border:1.5px solid rgba(var(--bgs-ivory-rgb),.14)}
.field::placeholder{color:var(--bgs-ivory-45)}
.field:focus-visible{outline:none;box-shadow:0 0 0 2px var(--bgs-bg),0 0 0 4px var(--bgs-gold)}
.link{background:none;border:0;padding:0;font:500 15px 'Inter',sans-serif;color:var(--bgs-gold);text-decoration:underline;text-underline-offset:4px;text-decoration-color:rgba(var(--bgs-gold-rgb),.4);cursor:pointer}
.link:focus-visible{outline:none;box-shadow:0 0 0 2px var(--bgs-bg),0 0 0 4px var(--bgs-gold);border-radius:4px}
.or{display:flex;align-items:center;gap:14px;margin:16px 0;font-family:'Fraunces',serif;font-style:italic;font-size:15px;color:var(--bgs-ivory-45)}
.or::before,.or::after{content:"";flex:1;height:1px;background:rgba(var(--bgs-ivory-rgb),.12)}
.row{display:grid;gap:10px}
@media(min-width:560px){.row{grid-template-columns:1fr auto}.row .btn{width:auto;padding:0 22px}}

.guest{display:flex;align-items:center;gap:14px;text-align:left;text-decoration:none;color:inherit;padding:12px 14px;border-radius:14px;background:rgba(var(--bgs-ivory-rgb),.04);border:1px solid rgba(var(--bgs-ivory-rgb),.1)}
.guest:focus-visible{outline:none;box-shadow:0 0 0 2px var(--bgs-bg),0 0 0 4px var(--bgs-gold)}
.stack{position:relative;width:60px;height:54px;flex:none}
.stack img{position:absolute;width:38px;height:38px;object-fit:cover;border-radius:4px;box-shadow:0 4px 10px rgba(0,0,0,.5)}
.stack img:nth-child(1){left:0;top:14px;transform:rotate(-8deg)}
.stack img:nth-child(2){left:11px;top:7px;transform:rotate(3deg)}
.stack img:nth-child(3){left:22px;top:0;transform:rotate(11deg)}
.guest b{display:block;font-weight:600;font-size:15px}
.guest span{font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--bgs-ivory-70)}
.guest .chev{margin-left:auto;color:var(--bgs-gold-dim);font-size:18px}

footer{max-width:960px;margin:44px auto 0;padding:24px 20px 40px;text-align:center;font-family:'IBM Plex Mono',monospace;border-top:1px solid rgba(var(--bgs-gold-rgb),.18)}
footer img{display:block;width:150px;height:33px;margin:0 auto 14px}
footer p{font-size:12px;color:var(--bgs-gold-dim);margin:0}
footer a{color:var(--bgs-gold)}

/* ---- A: one primary ---- */
#a .signin{max-width:420px;margin:30px auto 0}
#a .more{margin:18px 0 0;font-size:15px;color:var(--bgs-ivory-70)}
#a .email{display:none;margin-top:14px;text-align:left}
#a .email.open{display:block}
#a .guestline{margin:32px 0 0;font-size:14px;color:var(--bgs-ivory-45)}
#a .guestline a{color:var(--bgs-gold-dim);text-decoration:none;border-bottom:1px solid rgba(var(--bgs-gold-rgb),.35)}

/* ---- B: card + look first ---- */
#b .plate{max-width:440px;margin:30px auto 0;padding:20px;border-radius:16px;background:var(--bgs-plate);border:1px solid rgba(var(--bgs-gold-rgb),.22);text-align:left;box-shadow:0 12px 30px -18px rgba(0,0,0,.8)}
#b .plate label{display:block;font-size:13px;color:var(--bgs-ivory-70);margin:0 0 6px}
#b .look{max-width:440px;margin:40px auto 0;text-align:left}
#b .look h2{font-family:'Fraunces',serif;font-weight:500;font-size:20px;margin:0 0 4px}
#b .look p{font-size:14px;color:var(--bgs-ivory-45);margin:0 0 12px}

/* ---- C: shelf first ---- */
#c .demo{max-width:440px;margin:26px auto 0}
#c .demo .guest{padding:14px 16px;background:var(--bgs-plate);border-color:rgba(var(--bgs-gold-rgb),.3)}
#c .demo .btn{margin-top:12px}
#c .strip{max-width:440px;margin:36px auto 0}
#c .strip .h{font-family:'Fraunces',serif;font-weight:500;font-size:20px;margin:0 0 4px}
#c .strip .p{font-size:14px;color:var(--bgs-ivory-45);margin:0 0 14px}
#c .strip .alt{margin:12px 0 0;font-size:14px;color:var(--bgs-ivory-45)}
</style>
</head>
<body>

<div class="bar" role="toolbar" aria-label="Mockup options">
  <span class="lbl">Option</span>
  <button data-opt="a" aria-pressed="true">A · One primary</button>
  <button data-opt="b" aria-pressed="false">B · Card + look first</button>
  <button data-opt="c" aria-pressed="false">C · Shelf first</button>
</div>

<template id="hero">
  <p class="mark">BoardgameShelf</p>
  <div class="hand" aria-hidden="true" data-hand></div>
  <h1>Your shelf, judged by its covers.</h1>
  <p class="sub">A page for your collection and a vote for your table, from any phone.</p>
</template>
<template id="gbtn">
  <span class="g" aria-hidden="true"><svg viewBox="0 0 24 24"><path fill="#4285F4" d="M21.6 12.23c0-.68-.06-1.33-.17-1.96H12v3.7h5.38a4.6 4.6 0 0 1-2 3.02v2.5h3.24c1.9-1.75 2.98-4.32 2.98-7.26z"/><path fill="#34A853" d="M12 22c2.7 0 4.97-.9 6.62-2.42l-3.24-2.5c-.9.6-2.04.95-3.38.95-2.6 0-4.8-1.75-5.6-4.1H3.06v2.58A10 10 0 0 0 12 22z"/><path fill="#FBBC05" d="M6.4 13.92A6 6 0 0 1 6.08 12c0-.67.12-1.31.32-1.92V7.5H3.06A10 10 0 0 0 2 12c0 1.61.39 3.14 1.06 4.5l3.34-2.58z"/><path fill="#EA4335" d="M12 5.98c1.47 0 2.78.5 3.82 1.5l2.86-2.86C16.96 3.02 14.7 2 12 2a10 10 0 0 0-8.94 5.5l3.34 2.58C7.2 7.73 9.4 5.98 12 5.98z"/></svg></span>Continue with Google
</template>
<template id="guestrow">
  <a class="guest" href="#"><span class="stack" aria-hidden="true"><img data-c="0" alt=""><img data-c="1" alt=""><img data-c="2" alt=""></span><span><b>Nok.Naruephon</b><span>196 games · synced 19 h ago</span></span><span class="chev" aria-hidden="true">›</span></a>
</template>

<!-- A -->
<section class="opt on" id="a"><div class="wrap">
  <div data-hero></div>
  <div class="signin">
    <button class="btn gold" data-g></button>
    <p class="more">Prefer email? <button class="link" data-toggle>Send me a sign-in link</button></p>
    <div class="email" data-email>
      <div class="row"><input class="field" type="email" placeholder="you@example.com" aria-label="Email"><button class="btn">Send link</button></div>
    </div>
    <p class="guestline">Just looking? <a href="#">Browse Nok's shelf as a guest</a></p>
  </div>
</div></section>

<!-- B -->
<section class="opt" id="b"><div class="wrap">
  <div data-hero></div>
  <div class="plate">
    <button class="btn gold" data-g></button>
    <div class="or">or</div>
    <label for="b-email">Email a sign-in link</label>
    <div class="row"><input class="field" id="b-email" type="email" placeholder="you@example.com"><button class="btn">Send link</button></div>
  </div>
  <div class="look">
    <h2>Have a look first</h2>
    <p>Browse a stocked shelf as a guest. No account needed.</p>
    <div data-guest></div>
  </div>
</div></section>

<!-- C -->
<section class="opt" id="c"><div class="wrap">
  <div data-hero></div>
  <div class="demo">
    <div data-guest></div>
    <button class="btn">Open the shelf as a guest</button>
  </div>
  <div class="strip">
    <p class="h">Ready for your own?</p>
    <p class="p">Sign in, enter your BoardGameGeek username, and your collection is on the shelf in a minute.</p>
    <button class="btn gold" data-g></button>
    <p class="alt">or <button class="link" data-toggle>use email instead</button></p>
    <div class="email" data-email style="display:none;margin-top:12px;text-align:left"><div class="row"><input class="field" type="email" placeholder="you@example.com" aria-label="Email"><button class="btn">Send link</button></div></div>
  </div>
</div></section>

<footer>
  <img src="powered-by-bgg.svg" alt="Powered by BoardGameGeek">
  <p><a href="#">Privacy policy</a> · <a href="#">Terms of service</a></p>
</footer>

<script>
const covers=["https://cf.geekdo-images.com/MjeJZfulbsM1DSV3DrGJYA__original/img/B374C04Eip7fmQBGJzgiOTp-jyQ=/0x0/filters:format(jpeg)/pic5100691.jpg","https://cf.geekdo-images.com/SoU8p28Sk1s8MSvoM4N8pQ__itemrep@2x/img/Pr8zSaMINlALYjR0agud0_EFESs=/fit-in/492x600/filters:strip_icc()/pic6293412.jpg","https://cf.geekdo-images.com/UVUkjMV_Q2paVUIUP30Vvw__original/img/BoUtCkd1NRO0bR1R5EwL51xIuXA=/0x0/filters:format(jpeg)/pic7664424.jpg","https://cf.geekdo-images.com/URkI3cTZ9NHdlPNRPSd2_g__original/img/97yvW76xxAirQc7Jebosu-6FM9I=/0x0/filters:format(jpeg)/pic2891964.jpg","https://cf.geekdo-images.com/HINb2nkFn5IiZxAlzQIs4g__itemrep@2x/img/f8s-g70BViz6Thkzu5_jYoGf8BA=/fit-in/492x600/filters:strip_icc()/pic7009391.jpg","https://cf.geekdo-images.com/Naw8y8J_s-8cvq1GoTON6w__original/img/8wVEVzdf5BoPvSiscnGvCAPNe2Q=/0x0/filters:format(jpeg)/pic7416519.jpg","https://cf.geekdo-images.com/nC6ifPCDnAItwoKSKXVrnw__original/img/Id-jjIer_61ZbvI2_RVRCeBZFY4=/0x0/filters:format(jpeg)/pic8907965.jpg","https://cf.geekdo-images.com/JUrmY8GgFPQlENiPT7BGZw__original/img/whCMdZhta-uXHgNJfVnetnjZueU=/0x0/filters:format(jpeg)/pic6884563.jpg"];
const cols=['#3E5C3E','#3B4F76','#7A3B2E','#A64B32','#8B3A3A'];
document.querySelectorAll('[data-hero]').forEach(h=>{h.replaceWith(document.getElementById('hero').content.cloneNode(true));});
document.querySelectorAll('[data-hand]').forEach(hand=>{covers.slice(0,5).forEach((src,i)=>{const d=document.createElement('div');d.className='cover';d.style.setProperty('--c',cols[i]);const im=document.createElement('img');im.src=src;im.alt='';d.appendChild(im);hand.appendChild(d);});});
document.querySelectorAll('[data-g]').forEach(b=>b.appendChild(document.getElementById('gbtn').content.cloneNode(true)));
document.querySelectorAll('[data-guest]').forEach(g=>{g.replaceWith(document.getElementById('guestrow').content.cloneNode(true));});
document.querySelectorAll('.stack img').forEach(im=>im.src=covers[5+ +im.dataset.c]);
document.querySelectorAll('[data-toggle]').forEach(t=>t.addEventListener('click',()=>{const e=t.closest('section').querySelector('[data-email]');const open=e.style.display==='block'||e.classList.contains('open');e.classList.toggle('open',!open);e.style.display=open?'none':'block';if(!open)e.querySelector('input').focus();}));
const opts=document.querySelectorAll('.opt');
document.querySelectorAll('.bar [data-opt]').forEach(b=>b.addEventListener('click',()=>{document.querySelectorAll('.bar [data-opt]').forEach(x=>x.setAttribute('aria-pressed',x===b));opts.forEach(o=>o.classList.toggle('on',o.id===b.dataset.opt));window.scrollTo({top:0});}));
</script>
</body>
</html>
