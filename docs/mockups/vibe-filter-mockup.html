<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BoardgameShelf — vibe filter mockup (v2, real sheet)</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=IBM+Plex+Mono:wght@400;500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  /* ---- real tokens from css/base.css ---- */
  :root{
    --bgs-bg:#160F0A; --bgs-bg-rgb:22,15,10; --bgs-plate:#241A10; --bgs-plate-rgb:36,26,16;
    --bgs-gold:#E3B04B; --bgs-gold-rgb:227,176,75; --bgs-gold-dim:rgba(227,176,75,0.62);
    --bgs-ivory:#F4EBDA; --bgs-ivory-rgb:244,235,218; --bgs-ivory-70:rgba(244,235,218,0.72); --bgs-ivory-45:rgba(244,235,218,0.45);
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bgs-bg);color:var(--bgs-ivory);font-family:'Inter',sans-serif;-webkit-font-smoothing:antialiased}
  button{font:inherit;color:inherit}
  .rm *{transition:none!important}

  /* ---- mockup toolbar (not product) ---- */
  .tools{position:sticky;top:0;z-index:40;display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:10px 16px;background:#000;border-bottom:1px solid #333;font:12px/1 'IBM Plex Mono',monospace;color:#bbb}
  .tools b{color:#fff;font-weight:500;margin-right:4px}
  .tools button{padding:6px 10px;border:1px solid #444;border-radius:4px;color:#ddd;background:none;cursor:pointer}
  .tools button[aria-pressed=true]{background:#ddd;color:#000;border-color:#ddd}
  .tools label{margin-left:auto;display:flex;gap:6px;align-items:center}

  /* ---- existing shelf chrome (copied from index.html) ---- */
  .wrap{max-width:1060px;margin:0 auto;padding:22px 16px 80px}
  .filter-sort-bar{display:flex;gap:8px;align-items:center;margin-bottom:12px}
  .search-wrap{position:relative;flex:1;min-width:0}
  .search{width:100%;background:var(--bgs-plate);border:1px solid rgba(var(--bgs-gold-rgb),0.18);border-radius:12px;color:var(--bgs-ivory);font-size:16px;padding:10px 34px 10px 14px;outline:none}
  .icon-btn{position:relative;flex:none;width:40px;height:40px;padding:0;display:flex;align-items:center;justify-content:center;background:var(--bgs-plate);border:1px solid rgba(var(--bgs-gold-rgb),0.18);border-radius:12px;color:var(--bgs-ivory-70);cursor:pointer;transition:border-color .15s ease,color .15s ease}
  .icon-btn:hover{border-color:var(--bgs-gold);color:var(--bgs-ivory)}
  .icon-btn.active{border-color:var(--bgs-gold);color:var(--bgs-gold)}
  .filter-badge{position:absolute;top:-5px;right:-5px;width:16px;height:16px;border-radius:50%;background:var(--bgs-gold);color:var(--bgs-bg);font:700 9.5px 'IBM Plex Mono',monospace;display:flex;align-items:center;justify-content:center;box-shadow:0 0 0 2px var(--bgs-bg)}
  .filter-badge[hidden]{display:none}
  .chips-row{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 16px}
  .chips-row[hidden]{display:none}
  .chip{display:inline-flex;align-items:center;gap:6px;background:rgba(var(--bgs-gold-rgb),0.16);border:1px solid rgba(var(--bgs-gold-rgb),0.4);color:var(--bgs-gold);font-size:12.5px;font-weight:500;padding:5px 8px 5px 12px;border-radius:999px}
  .chip button{background:none;border:none;color:inherit;font-size:13px;line-height:1;padding:2px;cursor:pointer;opacity:.75}
  .shelf-count{font:12px 'IBM Plex Mono',monospace;color:var(--bgs-gold-dim);margin:0 0 14px}
  .shelf{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;min-height:260px}
  @media(min-width:560px){.shelf{grid-template-columns:repeat(4,1fr);gap:14px}}
  @media(min-width:800px){.shelf{grid-template-columns:repeat(6,1fr);gap:16px}}
  .empty-state{color:var(--bgs-ivory-70);font-size:14px;padding:60px 10px;text-align:center;grid-column:1/-1}
  .empty-state button{background:none;border:0;color:var(--bgs-gold);cursor:pointer;text-decoration:underline;text-underline-offset:3px;font-size:14px;margin-top:10px;display:block;margin-inline:auto}
  .game-card{border-radius:10px;overflow:hidden;background:var(--bgs-plate);box-shadow:0 3px 10px rgba(0,0,0,.35);display:flex;flex-direction:column}
  .game-card .art{aspect-ratio:3/4;width:100%;overflow:hidden;background:var(--bgs-plate)}
  .game-card .art img{width:100%;height:100%;object-fit:cover;display:block}
  .game-card .plate-body{padding:8px 8px 9px;display:flex;flex-direction:column;gap:4px}
  .game-card .title{font:600 12.5px/1.24 'Fraunces',serif;margin:0;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .game-card .s{font:11px 'IBM Plex Mono',monospace;color:var(--bgs-ivory-45)}

  .filter-label{font:11px 'IBM Plex Mono',monospace;letter-spacing:.08em;text-transform:uppercase;color:var(--bgs-gold-dim)}
  .pill{font-size:13px;font-weight:500;color:var(--bgs-ivory-70);background:transparent;border:1px solid rgba(var(--bgs-ivory-rgb),0.22);border-radius:999px;padding:6px 13px;cursor:pointer;transition:all .15s ease}
  .pill:hover{border-color:var(--bgs-gold);color:var(--bgs-ivory)}
  .pill.active{background:var(--bgs-gold);border-color:var(--bgs-gold);color:var(--bgs-bg);font-weight:600}
  .pill:disabled{opacity:.35;cursor:default}
  .pill:disabled:hover{border-color:rgba(var(--bgs-ivory-rgb),0.22);color:var(--bgs-ivory-70)}
  .pill:focus-visible{outline:0;box-shadow:0 0 0 2px var(--bgs-gold) inset}

  .sheet-scrim{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:20;opacity:0;pointer-events:none;transition:opacity .25s ease}
  .sheet-scrim.open{opacity:1;pointer-events:auto}
  .filter-sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;max-width:600px;margin:0 auto;max-height:78vh;display:flex;flex-direction:column;background:var(--bgs-plate);border:1px solid rgba(var(--bgs-gold-rgb),0.18);border-bottom:none;border-radius:22px 22px 0 0;box-shadow:0 -12px 32px -8px rgba(0,0,0,.6);transform:translateY(100%);transition:transform .32s cubic-bezier(.32,.72,0,1)}
  .filter-sheet.open{transform:translateY(0)}
  .sheet-handle{width:36px;height:4px;border-radius:2px;background:rgba(var(--bgs-ivory-rgb),0.22);margin:12px auto 4px;flex:none}
  .sheet-header{display:flex;align-items:center;justify-content:space-between;padding:8px 20px 14px;border-bottom:1px solid rgba(var(--bgs-ivory-rgb),0.10);flex:none}
  .sheet-header h2{font:600 19px 'Fraunces',serif;margin:0}
  .reset-link{background:none;border:none;color:var(--bgs-gold);font:11.5px 'IBM Plex Mono',monospace;letter-spacing:.06em;text-transform:uppercase;cursor:pointer;padding:6px}
  .sheet-body{overflow-y:auto;padding:18px 20px 8px}
  .sheet-group{margin-bottom:26px}
  .sheet-group .filter-label{display:block;margin-bottom:10px}
  .segmented{display:flex;flex-wrap:wrap;gap:8px}
  .range-wrap{position:relative;height:28px;margin:6px 2px 2px}
  .range-track{position:absolute;top:50%;left:0;right:0;height:4px;border-radius:2px;background:rgba(var(--bgs-ivory-rgb),0.16);transform:translateY(-50%)}
  .range-fill{position:absolute;top:50%;height:4px;border-radius:2px;background:var(--bgs-gold);transform:translateY(-50%)}
  .range-input{position:absolute;top:0;left:0;width:100%;height:28px;margin:0;background:transparent;-webkit-appearance:none;appearance:none;pointer-events:none}
  .range-input::-webkit-slider-runnable-track{background:transparent;height:28px}
  .range-input::-webkit-slider-thumb{-webkit-appearance:none;pointer-events:auto;width:20px;height:20px;margin-top:4px;border-radius:50%;background:var(--bgs-gold);border:2px solid var(--bgs-plate);box-shadow:0 1px 4px rgba(0,0,0,.5);cursor:pointer}
  .toggle-row{display:flex;align-items:center;gap:10px;background:none;border:0;padding:8px 0 0;cursor:pointer;color:var(--bgs-ivory-70);font-size:13px}
  .toggle-switch{width:32px;height:18px;border-radius:9px;background:rgba(var(--bgs-ivory-rgb),.18);position:relative}
  .toggle-switch::after{content:"";position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;background:var(--bgs-ivory-70)}
  .sheet-footer{flex:none;padding:14px 20px calc(14px + env(safe-area-inset-bottom));border-top:1px solid rgba(var(--bgs-ivory-rgb),0.10)}
  .apply-btn{width:100%;background:var(--bgs-gold);color:var(--bgs-bg);border:none;border-radius:12px;font-size:15px;font-weight:600;padding:13px;cursor:pointer}

  /* ---- NEW: mode tabs inside the sheet ---- */
  .mode-tabs{position:relative;display:grid;grid-template-columns:1fr 1fr;margin:0 0 18px;border-bottom:1px solid rgba(var(--bgs-ivory-rgb),0.10)}
  .mode-tab{background:none;border:0;padding:6px 0 12px;cursor:pointer;text-align:left;color:var(--bgs-ivory-45);transition:color .15s ease}
  .mode-tab:nth-child(2){text-align:right}
  .mode-tab strong{display:block;font:600 16px/1.1 'Fraunces',serif;color:inherit}
  .mode-tab em{display:block;font-style:normal;font-size:12px;margin-top:3px;opacity:.85}
  .mode-tab[aria-selected=true]{color:var(--bgs-ivory)}
  .mode-tab:focus-visible{outline:0;box-shadow:0 0 0 2px var(--bgs-gold) inset;border-radius:6px}
  .mode-ink{position:absolute;bottom:-1px;left:0;width:50%;height:2px;background:var(--bgs-gold);transition:transform .18s cubic-bezier(.2,.7,.2,1)}
  .mode-tabs[data-mode=numbers] .mode-ink{transform:translateX(100%)}
  .mode-panel{display:none}
  .mode-panel[data-show]{display:block}
  .pill .n{font:400 11px 'IBM Plex Mono',monospace;opacity:.6;margin-left:6px}
  .pill.active .n{opacity:.7}
  .vibe-hint{margin:12px 0 0;min-height:1.4em;font-size:13px;color:var(--bgs-ivory-70)}
  .vibe-hint b{color:var(--bgs-ivory);font-weight:500}

  @media(prefers-reduced-motion:reduce){.sheet-scrim,.filter-sheet,.mode-ink,.mode-tab,.pill{transition:none}}
</style>
</head>
<body>

<div class="tools">
  <b>state</b>
  <button data-state="sheet-vibe" aria-pressed="true">Sheet · Vibe · Party</button>
  <button data-state="sheet-numbers">Sheet · Time &amp; weight</button>
  <button data-state="applied">Applied · Party, 4 players</button>
  <button data-state="empty">Empty result</button>
  <label><input type="checkbox" id="rm"> reduced motion</label>
</div>

<div class="wrap">
  <div class="filter-sort-bar">
    <div class="search-wrap"><input class="search" type="text" placeholder="Search titles…" readonly></div>
    <button class="icon-btn" id="filterBtn" aria-label="Open filters" aria-expanded="false">
      <svg width="15" height="15" viewBox="0 0 15 15" fill="none"><line x1="0" y1="2.5" x2="15" y2="2.5" stroke="currentColor" stroke-width="1.4"/><circle cx="9.5" cy="2.5" r="2.2" fill="var(--bgs-plate)" stroke="currentColor" stroke-width="1.4"/><line x1="0" y1="7.5" x2="15" y2="7.5" stroke="currentColor" stroke-width="1.4"/><circle cx="4.5" cy="7.5" r="2.2" fill="var(--bgs-plate)" stroke="currentColor" stroke-width="1.4"/><line x1="0" y1="12.5" x2="15" y2="12.5" stroke="currentColor" stroke-width="1.4"/><circle cx="11" cy="12.5" r="2.2" fill="var(--bgs-plate)" stroke="currentColor" stroke-width="1.4"/></svg>
      <span class="filter-badge" id="filterBadge" hidden>0</span>
    </button>
    <button class="icon-btn" aria-label="Sort"><svg width="15" height="15" viewBox="0 0 15 15" fill="none"><path d="M7.5 12.5V2.5M7.5 2.5L3 7M7.5 2.5L12 7" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
  </div>
  <div class="chips-row" id="chipsRow" hidden></div>
  <p class="shelf-count" id="shelfCount"></p>
  <div class="shelf" id="shelf"></div>
</div>

<div class="sheet-scrim" id="scrim"></div>
<div class="filter-sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
  <div class="sheet-handle" aria-hidden="true"></div>
  <div class="sheet-header"><h2 id="sheetTitle">Filters</h2><button class="reset-link" id="resetLink" type="button">Reset</button></div>
  <div class="sheet-body">

    <div class="sheet-group">
      <span class="filter-label" id="playersLabel">Players — Any</span>
      <div class="range-wrap">
        <div class="range-track"></div><div class="range-fill" id="rangeFill"></div>
        <input type="range" min="1" max="11" step="1" value="1" id="rangeMin" class="range-input" aria-label="Minimum players">
        <input type="range" min="1" max="11" step="1" value="11" id="rangeMax" class="range-input" aria-label="Maximum players">
      </div>
      <button type="button" class="toggle-row" role="switch" aria-checked="false"><span class="toggle-switch" aria-hidden="true"></span><span>Recommended counts only</span></button>
    </div>

    <!-- NEW: the tab pair sits between Players and the lower groups -->
    <div class="mode-tabs" role="tablist" data-mode="vibe" id="modeTabs">
      <button class="mode-tab" role="tab" id="tab-vibe" aria-selected="true" aria-controls="panel-vibe"><strong>Vibe</strong><em>What kind of night is it?</em></button>
      <button class="mode-tab" role="tab" id="tab-numbers" aria-selected="false" aria-controls="panel-numbers"><strong>Time &amp; weight</strong><em>If you already know</em></button>
      <span class="mode-ink" aria-hidden="true"></span>
    </div>

    <div class="mode-panel" id="panel-vibe" role="tabpanel" aria-labelledby="tab-vibe" data-show>
      <div class="sheet-group">
        <div class="segmented" id="vibePills"></div>
        <p class="vibe-hint" id="vibeHint" aria-live="polite"></p>
      </div>
    </div>

    <div class="mode-panel" id="panel-numbers" role="tabpanel" aria-labelledby="tab-numbers">
      <div class="sheet-group">
        <span class="filter-label">Time</span>
        <div class="segmented" data-type="time">
          <button class="pill" data-value="any">Any</button><button class="pill" data-value="quick">Quick</button><button class="pill" data-value="medium">Medium</button><button class="pill" data-value="long">Long</button>
        </div>
      </div>
      <div class="sheet-group">
        <span class="filter-label">Weight</span>
        <div class="segmented" data-type="weight">
          <button class="pill" data-value="any">Any</button><button class="pill" data-value="light">Light</button><button class="pill" data-value="medium">Medium</button><button class="pill" data-value="heavy">Heavy</button>
        </div>
      </div>
    </div>
  </div>
  <div class="sheet-footer"><button class="apply-btn" id="applyBtn" type="button">Show 196 games</button></div>
</div>

<script>

const VIBES = [
  ['party','Party','Loud, silly, everyone talks at once.'],
  ['bluffing','Bluffing','Someone at the table is lying.'],
  ['coop','Co-op','Win or lose together.'],
  ['duel','Duel','Head to head, just the two of you.'],
  ['strategy','Strategy','Build an engine, plan three turns ahead.'],
  ['family','Family','Easy to teach, everyone can join.'],
  ['chill','Chill','Low conflict, pretty tiles, quiet turns.'],
  ['story','Story','A theme that pulls you in.'],
  ['other','Others','Doesn\u2019t fit a box yet.'],
];
const $=s=>document.querySelector(s);
const F = {min:1,max:11,mode:'vibe',vibe:null,time:'any',weight:'any'};
const timeBucket=t=>{const a=(t[0]+t[1])/2;return a<30?'quick':a<=60?'medium':'long'};
const wBand=w=>w<2?'light':w<3?'medium':'heavy';
const playersMatch=g=>F.max===11?g.p[1]>=F.min:(g.p[0]<=F.max&&g.p[1]>=F.min);
function filtered(vibeOverride){
  const vibe = vibeOverride===undefined?F.vibe:vibeOverride;
  let l=GAMES.filter(playersMatch);
  if(F.mode==='vibe'){ if(vibe) l=l.filter(g=>g.v.includes(vibe)); }
  else { if(F.time!=='any') l=l.filter(g=>timeBucket(g.tm)===F.time); if(F.weight!=='any') l=l.filter(g=>wBand(g.w)===F.weight); }
  return l;
}
function playersLabel(){ if(F.min===1&&F.max===11)return'Any'; if(F.max===11)return F.min+'+'; return F.min===F.max?String(F.min):F.min+'–'+F.max; }

function renderSheet(){
  $('#modeTabs').dataset.mode=F.mode;
  document.querySelectorAll('.mode-tab').forEach(t=>t.setAttribute('aria-selected',t.id==='tab-'+F.mode));
  document.querySelectorAll('.mode-panel').forEach(p=>p.toggleAttribute('data-show',p.id==='panel-'+F.mode));
  $('#vibePills').innerHTML=VIBES.map(([k,l])=>{const n=filtered(k).length;return`<button class="pill${F.vibe===k?' active':''}" data-vibe="${k}" aria-pressed="${F.vibe===k}" ${n?'':'disabled'}>${l}<span class="n">${n}</span></button>`}).join('');
  const v=VIBES.find(x=>x[0]===F.vibe);
  $('#vibeHint').innerHTML=v?`<b>${v[1]}</b> — ${v[2]}`:'Pick one. Or switch to Time & weight if you already know how long you have.';
  document.querySelectorAll('[data-type=time] .pill').forEach(b=>b.classList.toggle('active',b.dataset.value===F.time));
  document.querySelectorAll('[data-type=weight] .pill').forEach(b=>b.classList.toggle('active',b.dataset.value===F.weight));
  $('#playersLabel').textContent='Players — '+playersLabel();
  $('#rangeMin').value=F.min;$('#rangeMax').value=F.max;
  const pct=n=>((n-1)/10*100); $('#rangeFill').style.left=pct(F.min)+'%'; $('#rangeFill').style.width=(pct(F.max)-pct(F.min))+'%';
  $('#applyBtn').textContent=`Show ${filtered().length} game${filtered().length===1?'':'s'}`;
}
function renderShelf(){
  const l=[...filtered()]; if(F.mode==='vibe'&&F.vibe) l.sort((a,b)=>(a.tm[0]+a.tm[1])-(b.tm[0]+b.tm[1]));
  const chips=[]; if(F.min!==1||F.max!==11)chips.push(['players',playersLabel()+' players']);
  if(F.mode==='vibe'&&F.vibe)chips.push(['vibe',VIBES.find(x=>x[0]===F.vibe)[1]]);
  if(F.mode==='numbers'){ if(F.time!=='any')chips.push(['time',{quick:'Quick',medium:'Medium',long:'Long'}[F.time]]); if(F.weight!=='any')chips.push(['weight',{light:'Light',medium:'Medium',heavy:'Heavy'}[F.weight]]); }
  const row=$('#chipsRow'); row.hidden=!chips.length;
  row.innerHTML=chips.map(([k,l])=>`<span class="chip" data-key="${k}">${l}<button type="button" aria-label="Remove ${l} filter">✕</button></span>`).join('');
  $('#filterBadge').hidden=!chips.length; $('#filterBadge').textContent=chips.length; $('#filterBtn').classList.toggle('active',!!chips.length);
  $('#shelfCount').textContent=chips.length?`${l.length} of ${GAMES.length} games`:`${GAMES.length} games`;
  $('#shelf').innerHTML=l.length?l.map(g=>`<div class="game-card"><div class="art"><img src="${g.img}" alt="" loading="lazy"></div><div class="plate-body"><p class="title">${g.t}</p><div class="s">${g.p[0]===g.p[1]?g.p[0]:g.p[0]+'–'+g.p[1]} · ${g.tm[0]===g.tm[1]?g.tm[0]:g.tm[0]+'–'+g.tm[1]}m</div></div></div>`).join('')
    :`<p class="empty-state">Nothing on the shelf for that.<br>Try another vibe, or widen the player count.<button id="emptyReset">Clear filters</button></p>`;
}
function render(){renderSheet();renderShelf();}
function openSheet(o){$('#sheet').classList.toggle('open',o);$('#scrim').classList.toggle('open',o);$('#filterBtn').setAttribute('aria-expanded',o);}

document.addEventListener('click',e=>{
  const t=e.target.closest('button'); if(!t)return;
  if(t.id==='filterBtn'){openSheet(true);return}
  if(t.id==='applyBtn'){openSheet(false);render();return}
  if(t.classList.contains('mode-tab')){F.mode=t.id.replace('tab-','');F.vibe=null;F.time='any';F.weight='any';}
  else if(t.dataset.vibe){F.vibe=F.vibe===t.dataset.vibe?null:t.dataset.vibe;}
  else if(t.closest('[data-type=time]')){F.time=t.dataset.value;}
  else if(t.closest('[data-type=weight]')){F.weight=t.dataset.value;}
  else if(t.id==='resetLink'||t.id==='emptyReset'){Object.assign(F,{min:1,max:11,vibe:null,time:'any',weight:'any'});}
  else if(t.closest('.chip')){const k=t.closest('.chip').dataset.key; if(k==='players'){F.min=1;F.max=11} else if(k==='vibe')F.vibe=null; else F[k]='any';}
  else if(t.dataset.state){
    document.querySelectorAll('.tools [data-state]').forEach(b=>b.setAttribute('aria-pressed',b===t));
    Object.assign(F,{min:1,max:11,mode:'vibe',vibe:null,time:'any',weight:'any'});
    ({'sheet-vibe':()=>{F.vibe='party';openSheet(true)},
      'sheet-numbers':()=>{F.mode='numbers';F.time='medium';F.weight='medium';openSheet(true)},
      'applied':()=>{F.vibe='party';F.min=4;F.max=4;openSheet(false)},
      'empty':()=>{F.vibe='coop';F.min=11;F.max=11;openSheet(false)}})[t.dataset.state]();
  }
  else return;
  render();
});
$('#scrim').addEventListener('click',()=>openSheet(false));
['rangeMin','rangeMax'].forEach(id=>$('#'+id).addEventListener('input',e=>{const v=+e.target.value; if(id==='rangeMin')F.min=Math.min(v,F.max); else F.max=Math.max(v,F.min); render();}));
$('#rm').addEventListener('change',e=>document.body.classList.toggle('rm',e.target.checked));
F.vibe='party'; render(); openSheet(true);
</script>
</body>
</html>
