<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>BoardgameShelf — vote screen cover light (A Wash, locked)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400..600;1,9..144,400..600&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* Token names follow css/base.css; VALUES APPROXIMATED (repo private). Vote-screen chrome is rebuilt from the locked
   gamenight-vote-actions design (64px x/check, 44px info flush to the card's right edge), not copied from source. */
:root,[data-theme="navy"]{--bgs-bg:#0f1626;--bgs-bg-rgb:15,22,38;--bgs-plate:#1a2438}
[data-theme="walnut"]{--bgs-bg:#171110;--bgs-bg-rgb:23,17,16;--bgs-plate:#241b17}
:root{
  --bgs-ivory:#f3eadb;--bgs-ivory-rgb:243,234,219;--bgs-gold:#d9a94f;--bgs-gold-rgb:217,169,79;
  --mk-play:#8fb08a;--mk-pass:#c9694c;--mk-hair:rgba(var(--bgs-ivory-rgb),.12);--mk-dim:rgba(var(--bgs-ivory-rgb),.7);
  --mk-ui:"Inter",system-ui,sans-serif;--mk-mono:"IBM Plex Mono",ui-monospace,monospace;--mk-display:"Fraunces",Georgia,serif;
  --mk-focus:0 0 0 2px var(--bgs-bg),0 0 0 4px var(--bgs-gold);
  --card-w:min(300px,calc(100vw - 72px));
}
*{box-sizing:border-box}
body{margin:0;min-height:100svh;background:#07090d;color:var(--bgs-ivory);font:400 15px/1.5 var(--mk-ui);-webkit-font-smoothing:antialiased;display:grid;place-items:center;padding:0 0 64px}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
button:focus-visible{outline:0;box-shadow:var(--mk-focus)}
.mono{font:400 12px/1.3 var(--mk-mono);color:var(--mk-dim)}

/* ── The vote screen */
.screen{position:relative;isolation:isolate;overflow:hidden;width:100%;max-width:400px;height:min(800px,calc(100svh - 64px));background:var(--bgs-bg);display:flex;flex-direction:column;align-items:center;padding:14px 20px 28px;transition:background-color .3s}
@media (min-width:520px){.screen{border-radius:40px;box-shadow:0 0 0 1px var(--mk-hair),0 40px 90px -30px #000}}
.bar{width:100%;display:flex;align-items:center;gap:12px}
.glassbtn{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:rgba(var(--bgs-ivory-rgb),.08);box-shadow:inset 0 0 0 1px rgba(var(--bgs-ivory-rgb),.16);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.glassbtn svg,.round svg{fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.bar .mid{flex:1;text-align:center}
.bar .title{font:italic 500 18px/1.1 var(--mk-display)}
.live{display:inline-flex;align-items:center;gap:6px}
.live i{width:6px;height:6px;border-radius:50%;background:var(--mk-play)}
.progress{width:var(--card-w);height:3px;border-radius:9px;background:rgba(var(--bgs-ivory-rgb),.12);margin-top:18px;overflow:hidden}
.progress b{display:block;height:100%;width:20%;background:var(--bgs-gold);border-radius:9px;transition:width .3s}

.stage{position:relative;flex:1;width:100%;display:flex;flex-direction:column;align-items:center;justify-content:center}
.deck{position:relative;width:var(--card-w);aspect-ratio:4/5}
.slot{position:absolute;inset:0;transition:transform .35s cubic-bezier(.2,.8,.2,1),opacity .35s} /* outer: stack position */
.card{position:absolute;inset:0;border-radius:22px;overflow:hidden;background:var(--bgs-plate);box-shadow:0 26px 50px -20px rgba(0,0,0,.85),inset 0 0 0 1px var(--mk-hair);touch-action:pan-y;user-select:none;-webkit-user-select:none} /* inner: drag */
.card.snap{transition:transform .32s cubic-bezier(.2,.8,.2,1)}
.card img{width:100%;height:100%;object-fit:cover;pointer-events:none;display:block}
.stamp{position:absolute;top:16px;padding:7px 14px;border-radius:99px;font:600 15px/1 var(--mk-ui);opacity:0}
.stamp.play{left:16px;background:var(--mk-play);color:#10210f}.stamp.pass{right:16px;background:var(--mk-pass);color:#fff}
.actions{position:relative;width:var(--card-w);height:64px;margin-top:40px;display:flex;justify-content:center;align-items:center;gap:26px}
.round{width:64px;height:64px;border-radius:50%;display:grid;place-items:center;background:rgba(var(--bgs-ivory-rgb),.09);box-shadow:inset 0 0 0 1px rgba(var(--bgs-ivory-rgb),.2),inset 0 1px 0 rgba(255,255,255,.18);backdrop-filter:blur(16px) saturate(1.4);-webkit-backdrop-filter:blur(16px) saturate(1.4)}
.round svg{width:26px;height:26px;stroke-width:2.2}
.round.no{color:var(--mk-pass)}.round.yes{color:var(--mk-play)}
.round.info{position:absolute;right:0;width:44px;height:44px;color:var(--bgs-ivory)}
.round.info svg{width:20px;height:20px}

/* ── Cover light. Two stacked copies cross-fade on OPACITY only (never animation+transition on one property).
      Source is rendered small and scaled up, so the blur stays cheap on phones. */
.light{position:absolute;z-index:-1;pointer-events:none;inset:0}
.light img{position:absolute;left:50%;top:50%;width:160px;height:200px;object-fit:cover;opacity:0;transition:opacity .6s;filter:blur(22px) saturate(1.6);transform:translate(-50%,-50%) scale(var(--ls,4))}
.light img.on{opacity:var(--lo,.6)}
.goldglow{position:absolute;inset:-14px 12%;z-index:-1;background:radial-gradient(closest-side,rgba(var(--bgs-gold-rgb),.2),transparent);filter:blur(10px);pointer-events:none} /* today's fixed glow */

/* Wash (locked): the whole screen takes the cover's colour; bars fade back to the theme */
[data-opt="a"] .light{--ls:4.6;--lo:.62}
[data-opt="a"] .light::after{content:"";position:absolute;inset:0;background:linear-gradient(to bottom,var(--bgs-bg) 0,rgba(var(--bgs-bg-rgb),.35) 22%,rgba(var(--bgs-bg-rgb),.25) 70%,rgba(var(--bgs-bg-rgb),.85) 100%)}
[data-opt="a"] .goldglow{display:none}

/* Off — today */
[data-opt="off"] .light{display:none}

/* ── Demo bar */
.demobar{position:fixed;left:0;right:0;bottom:0;z-index:50;display:flex;flex-wrap:wrap;gap:8px 10px;align-items:center;padding:10px 14px calc(10px + env(safe-area-inset-bottom,0px));background:rgba(8,8,10,.9);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-top:1px solid rgba(255,255,255,.1);font:400 12px/1 var(--mk-mono);color:#eee}
.demobar b{font-weight:500;opacity:.6;margin-left:4px}
.demobar button{padding:8px 11px;border-radius:99px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.16);font:inherit}
.demobar button[aria-pressed="true"]{background:#f3eadb;color:#111}
html.rm *{transition:none!important;animation:none!important}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>

<main class="screen" id="screen" data-opt="a" data-theme="navy">
  <div class="light" id="light"><img alt=""><img alt=""></div>

  <div class="bar">
    <button class="glassbtn" aria-label="Leave vote"><svg width="18" height="18" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    <div class="mid"><div class="title">Game night</div><div class="mono live"><i></i>4 at the table</div></div>
    <span class="mono" id="count" style="width:40px;text-align:right">1/5</span>
  </div>
  <div class="progress"><b id="prog"></b></div>

  <div class="stage">
    <div class="deck" id="deck"></div>
    <div class="actions">
      <div class="goldglow"></div>
      <button class="round no" id="btnNo" aria-label="Pass"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
      <button class="round yes" id="btnYes" aria-label="Play"><svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></button>
      <button class="round info" aria-label="Game info"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/></svg></button>
    </div>
  </div>
</main>

<div class="demobar" role="group" aria-label="Mockup controls">
  <b>Light</b>
  <button data-opt="a" aria-pressed="true">On</button>
  <button data-opt="off" aria-pressed="false">Off (today)</button>
  <b>Theme</b>
  <button data-theme="navy" aria-pressed="true">Navy</button>
  <button data-theme="walnut" aria-pressed="false">Walnut</button>
  <b>Motion</b>
  <button id="rm" aria-pressed="false">Reduced</button>
</div>

<script>
/* Real covers (from the live landing fan). If hotlinking fails, a flat colour stand-in keeps the light testable. */
const COVERS=[
 "https://cf.geekdo-images.com/MjeJZfulbsM1DSV3DrGJYA__original/img/B374C04Eip7fmQBGJzgiOTp-jyQ=/0x0/filters:format(jpeg)/pic5100691.jpg",
 "https://cf.geekdo-images.com/SoU8p28Sk1s8MSvoM4N8pQ__itemrep@2x/img/Pr8zSaMINlALYjR0agud0_EFESs=/fit-in/492x600/filters:strip_icc()/pic6293412.jpg",
 "https://cf.geekdo-images.com/UVUkjMV_Q2paVUIUP30Vvw__original/img/BoUtCkd1NRO0bR1R5EwL51xIuXA=/0x0/filters:format(jpeg)/pic7664424.jpg",
 "https://cf.geekdo-images.com/URkI3cTZ9NHdlPNRPSd2_g__original/img/97yvW76xxAirQc7Jebosu-6FM9I=/0x0/filters:format(jpeg)/pic2891964.jpg",
 "https://cf.geekdo-images.com/HINb2nkFn5IiZxAlzQIs4g__itemrep@2x/img/f8s-g70BViz6Thkzu5_jYoGf8BA=/fit-in/492x600/filters:strip_icc()/pic7009391.jpg"];
const STANDIN=[['#c8442e','#f2b33d'],['#2f8f83','#d7e26a'],['#6b3fa0','#e86aa6'],['#2a63c9','#7fd0f0'],['#d9772b','#7a2d2d']]
  .map(([a,b])=>'data:image/svg+xml,'+encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 4 5"><defs><linearGradient id="g" x2="1" y2="1"><stop stop-color="${a}"/><stop offset="1" stop-color="${b}"/></linearGradient></defs><rect width="4" height="5" fill="url(#g)"/></svg>`));
const src=COVERS.slice();
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const rm=()=>document.documentElement.classList.contains('rm');
window.coverFail=(el,i)=>{src[i]=STANDIN[i];el.onerror=null;el.src=STANDIN[i];if(i===idx)light(i)};
const img=i=>`<img src="${src[i]}" alt="" draggable="false" referrerpolicy="no-referrer" onerror="coverFail(this,${i})">`;

const lights=$$('#light img');let li=0;
function light(i){const next=lights[li^=1];next.referrerPolicy='no-referrer';next.src=src[i];next.classList.add('on');lights[li^1].classList.remove('on')}

const deck=$('#deck');let idx=0;const REST=[[0,0,0],[10,12,3.5],[-9,22,-3.5]];
function layout(){
  $$('#deck .slot').forEach(s=>{const d=+s.dataset.i-idx;
    if(d<0){s.style.opacity=0;s.style.pointerEvents='none';return}
    const [x,y,r]=REST[Math.min(d,2)];
    s.style.transform=`translate(${x}px,${y}px) rotate(${r}deg) scale(${1-Math.min(d,2)*.04})`;
    s.style.opacity=d>2?0:1;s.style.zIndex=10-d});
  $('#count').textContent=`${idx+1}/5`;$('#prog').style.width=`${(idx+1)*20}%`;light(idx)}
function deal(){idx=0;
  deck.innerHTML=src.map((_,i)=>`<div class="slot" data-i="${i}"><div class="card">${img(i)}<span class="stamp play">Play</span><span class="stamp pass">Pass</span></div></div>`).join('');
  $$('#deck .card').forEach(bindDrag);layout()}
function vote(dir){const slot=$(`#deck .slot[data-i="${idx}"]`);if(!slot)return;
  const card=slot.firstElementChild;card.classList.add('snap');
  card.style.transform=`translate(${dir*460}px,-30px) rotate(${dir*24}deg)`;
  card.querySelector(dir>0?'.play':'.pass').style.opacity=1;idx++;
  if(idx<5)layout();else setTimeout(deal,rm()?0:320)} /* mockup loops the deck */
function bindDrag(card){let sx=0,dx=0,on=false;
  card.addEventListener('pointerdown',e=>{if(+card.parentElement.dataset.i!==idx)return;on=true;sx=e.clientX;dx=0;card.classList.remove('snap');card.setPointerCapture(e.pointerId)});
  card.addEventListener('pointermove',e=>{if(!on)return;dx=e.clientX-sx;card.style.transform=`translate(${dx}px,${-Math.abs(dx)*.06}px) rotate(${dx*.06}deg)`;
    card.querySelector('.play').style.opacity=Math.max(0,Math.min(1,dx/90));card.querySelector('.pass').style.opacity=Math.max(0,Math.min(1,-dx/90))});
  const end=()=>{if(!on)return;on=false;if(Math.abs(dx)>90)return vote(Math.sign(dx));
    card.classList.add('snap');card.style.transform='';card.querySelectorAll('.stamp').forEach(s=>s.style.opacity=0)};
  card.addEventListener('pointerup',end);card.addEventListener('pointercancel',end)}
$('#btnYes').onclick=()=>vote(1);$('#btnNo').onclick=()=>vote(-1);
deal();

function press(k,v){$$(`.demobar [data-${k}]`).forEach(b=>b.setAttribute('aria-pressed',b.dataset[k]===v))}
$$('.demobar [data-opt]').forEach(b=>b.onclick=()=>{$('#screen').dataset.opt=b.dataset.opt;press('opt',b.dataset.opt)});
$$('.demobar [data-theme]').forEach(b=>b.onclick=()=>{$('#screen').dataset.theme=b.dataset.theme;press('theme',b.dataset.theme)});
$('#rm').onclick=e=>{const on=document.documentElement.classList.toggle('rm');e.currentTarget.setAttribute('aria-pressed',on)};
</script>
</body>
</html>
