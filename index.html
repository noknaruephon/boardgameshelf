<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BoardgameShelf</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://cf.geekdo-images.com" crossorigin>
<link rel="dns-prefetch" href="https://cf.geekdo-images.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --walnut:#2B1D14;
    --walnut-light:#3D2A1C;
    --walnut-panel:#4A3323;
    --brass:#C9A24B;
    --brass-dim:#8C7239;
    --parchment:#F0E6D2;
    --parchment-dim:#C9BBA0;
    --ink:#1A120B;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(ellipse at top, #3a2717 0%, var(--walnut) 55%),
      var(--walnut);
    color:var(--parchment);
    font-family:'Inter',sans-serif;
    min-height:100vh;
    padding:32px 20px 80px;
  }
  .wrap{max-width:960px;margin:0 auto;}

  header{margin-bottom:28px;}
  .eyebrow{
    font-family:'IBM Plex Mono',monospace;
    font-size:12px;
    letter-spacing:0.14em;
    text-transform:uppercase;
    color:var(--brass);
    margin:0 0 10px;
  }
  h1{
    font-family:'Fraunces',serif;
    font-weight:600;
    font-size:clamp(30px,5vw,44px);
    margin:0 0 8px;
    letter-spacing:-0.01em;
  }
  .sub{
    color:var(--brass);
    font-size:15px;
    margin:0;
    max-width:50ch;
    line-height:1.5;
  }

  .panel{
    background:var(--walnut-light);
    border:1px solid rgba(201,162,75,0.18);
    border-radius:14px;
    padding:18px 20px;
    margin:28px 0 34px;
    position:sticky;
    top:12px;
    z-index:5;
    backdrop-filter:blur(6px);
  }
  .filter-row{
    display:flex;
    flex-wrap:wrap;
    gap:8px 26px;
    align-items:center;
  }
  .filter-group{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
  .filter-label{
    font-family:'IBM Plex Mono',monospace;
    font-size:11px;
    letter-spacing:0.08em;
    text-transform:uppercase;
    color:var(--brass-dim);
    margin-right:2px;
  }
  .pill{
    font-family:'Inter',sans-serif;
    font-size:13px;
    font-weight:500;
    color:var(--parchment-dim);
    background:transparent;
    border:1px solid rgba(240,230,210,0.22);
    border-radius:999px;
    padding:6px 13px;
    cursor:pointer;
    transition:all 0.15s ease;
  }
  .pill:hover{border-color:var(--brass);color:var(--parchment);}
  .pill.active{
    background:var(--brass);
    border-color:var(--brass);
    color:var(--ink);
    font-weight:600;
  }
  .search{
    margin-left:auto;
    background:var(--walnut);
    border:1px solid rgba(240,230,210,0.22);
    border-radius:8px;
    color:var(--parchment);
    font-family:'Inter',sans-serif;
    font-size:13px;
    padding:8px 12px;
    width:180px;
    outline:none;
  }
  .search:focus{border-color:var(--brass);}
  .search::placeholder{color:var(--parchment-dim);}

  .shelf-count{
    font-family:'IBM Plex Mono',monospace;
    font-size:12px;
    color:var(--brass-dim);
    margin:0 0 14px;
  }

  .shelf{
    display:flex;
    flex-wrap:wrap;
    align-items:flex-end;
    gap:6px;
    padding:0 6px 18px;
    border-bottom:6px solid var(--brass);
    border-radius:2px;
    box-shadow:0 6px 14px -6px rgba(0,0,0,0.6);
    min-height:260px;
  }
  .empty-state{
    font-family:'Inter',sans-serif;
    color:var(--parchment-dim);
    font-size:14px;
    padding:60px 10px;
    width:100%;
    text-align:center;
  }

  .spine{
    width:68px;
    height:210px;
    border-radius:5px 5px 2px 2px;
    cursor:pointer;
    border:none;
    box-shadow:inset -6px 0 10px -6px rgba(0,0,0,0.45), 0 3px 6px rgba(0,0,0,0.35);
    transition:transform 0.18s ease, box-shadow 0.18s ease, opacity 0.2s ease;
    position:relative;
    overflow:hidden;
    padding:0;
  }
  .spine:hover{
    transform:translateY(-14px);
    box-shadow:inset -6px 0 10px -6px rgba(0,0,0,0.45), 0 14px 20px -8px rgba(0,0,0,0.55);
  }
  .spine-img{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    object-fit:cover;
    object-position:center;
  }
  .spine-img.is-real-spine{
    object-fit:contain;
    background:var(--walnut);
  }
  .spine-overlay{
    position:relative;
    z-index:1;
    height:100%;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:space-between;
    padding:14px 0 10px;
    background:linear-gradient(180deg, rgba(20,14,9,0.58) 0%, rgba(20,14,9,0.4) 35%, rgba(20,14,9,0.62) 100%);
  }
  .spine-overlay.is-real-spine{
    justify-content:flex-end;
    background:linear-gradient(180deg, rgba(20,14,9,0) 70%, rgba(20,14,9,0.5) 100%);
  }
  .spine-title{
    writing-mode:vertical-rl;
    font-family:'Fraunces',serif;
    font-weight:600;
    font-size:13px;
    color:var(--parchment);
    letter-spacing:0.01em;
    max-height:150px;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
    text-shadow:0 1px 4px rgba(0,0,0,0.7);
  }
  .spine-rating{
    line-height:0;
  }
  .spine-rating svg{
    display:block;
  }

  /* modal */
  .backdrop{
    position:fixed;inset:0;
    background:rgba(15,10,6,0.66);
    backdrop-filter:blur(3px);
    display:none;
    align-items:center;
    justify-content:center;
    padding:24px;
    z-index:10;
  }
  .backdrop.open{display:flex;}
  .card{
    background:var(--walnut-panel);
    border:1px solid rgba(201,162,75,0.3);
    border-radius:16px;
    max-width:440px;
    width:100%;
    position:relative;
    animation:pop 0.18s ease;
    max-height:85vh;
    overflow:hidden;
  }
  #card-body{
    padding:30px 30px 26px;
    max-height:85vh;
    overflow-y:auto;
  }
  @keyframes pop{from{opacity:0;transform:scale(0.96);}to{opacity:1;transform:scale(1);}}
  .card-cover-wrap{
    width:100%;
    min-height:80px;
    border-radius:10px;
    margin:-6px 0 18px;
    box-shadow:0 6px 16px -6px rgba(0,0,0,0.5);
    overflow:hidden;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .card-cover{
    display:block;
    max-width:100%;
    max-height:360px;
    width:auto;
    height:auto;
  }
  .flip-scene{
    width:100%;
    margin:-6px 0 18px;
    perspective:1400px;
  }
  .flip-card{
    position:relative;
    width:100%;
    height:340px;
    cursor:pointer;
    touch-action:pan-y;
    transform-style:preserve-3d;
    transition:transform 0.55s cubic-bezier(.4,.2,.2,1);
  }
  .flip-card.flipped{
    transform:rotateY(180deg);
  }
  .flip-face{
    position:absolute;
    inset:0;
    display:flex;
    align-items:center;
    justify-content:center;
    border-radius:10px;
    box-shadow:0 6px 16px -6px rgba(0,0,0,0.5);
    overflow:hidden;
    backface-visibility:hidden;
    background:var(--walnut);
  }
  .flip-back{
    transform:rotateY(180deg);
  }
  .flip-card:not(.flipped) .flip-back{
    pointer-events:none;
  }
  .flip-card.flipped .flip-front{
    pointer-events:none;
  }
  .flip-face .card-cover{
    max-width:100%;
    max-height:100%;
    width:auto;
    height:auto;
    object-fit:contain;
  }
  .flip-hint{
    font-family:'IBM Plex Mono',monospace;
    font-size:11px;
    color:var(--brass-dim);
    text-align:center;
    margin:8px 0 0;
  }
  .card h2{
    font-family:'Fraunces',serif;
    font-weight:600;
    font-size:24px;
    margin:0 0 14px;
    line-height:1.2;
  }
  .stat-row{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
    margin-bottom:16px;
  }
  .stat-chip{
    font-family:'IBM Plex Mono',monospace;
    font-size:12px;
    color:var(--parchment);
    background:rgba(240,230,210,0.08);
    border:1px solid rgba(240,230,210,0.16);
    border-radius:6px;
    padding:5px 10px;
    display:flex;
    align-items:center;
    gap:6px;
  }
  .card p.blurb{
    font-size:15px;
    line-height:1.6;
    color:var(--parchment-dim);
    margin:0 0 18px;
  }
  .card .tag{
    font-family:'IBM Plex Mono',monospace;
    font-size:11px;
    letter-spacing:0.06em;
    text-transform:uppercase;
    color:var(--brass);
  }
  .why-heading{
    font-family:'IBM Plex Mono',monospace;
    font-size:11px;
    letter-spacing:0.08em;
    text-transform:uppercase;
    color:var(--brass-dim);
    margin:20px 0 10px;
  }
  .why-list{
    list-style:none;
    margin:0 0 20px;
    padding:0;
    display:flex;
    flex-direction:column;
    gap:8px;
  }
  .why-list li{
    font-size:14px;
    line-height:1.5;
    color:var(--parchment);
    padding-left:18px;
    position:relative;
  }
  .why-list li::before{
    content:"";
    position:absolute;
    left:0;
    top:8px;
    width:6px;
    height:6px;
    border-radius:50%;
    background:var(--brass);
  }
  .close-btn{
    position:absolute;
    top:16px;right:16px;
    z-index:10;
    background:rgba(20,14,9,0.55);
    border:none;
    border-radius:50%;
    width:30px;
    height:30px;
    display:flex;
    align-items:center;
    justify-content:center;
    color:var(--parchment);
    font-size:16px;
    cursor:pointer;
    line-height:1;
    padding:0;
  }
  .close-btn:hover{color:var(--parchment);}

  footer{
    max-width:960px;
    margin:40px auto 0;
    font-family:'IBM Plex Mono',monospace;
    font-size:12px;
    color:var(--brass-dim);
    text-align:center;
    line-height:1.6;
  }

  @media (max-width:520px){
    .search{width:100%;margin-left:0;order:99;}
    .panel{position:static;}
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>BoardgameShelf</h1>
    <p class="sub">Browse the shelf, pick your next game.</p>
  </header>

  <div class="panel">
    <div class="filter-row">
      <div class="filter-group">
        <span class="filter-label">Players</span>
        <button class="pill active" data-type="players" data-value="any">Any</button>
        <button class="pill" data-type="players" data-value="1">1</button>
        <button class="pill" data-type="players" data-value="2">2</button>
        <button class="pill" data-type="players" data-value="3">3</button>
        <button class="pill" data-type="players" data-value="4">4</button>
        <button class="pill" data-type="players" data-value="5">5</button>
        <button class="pill" data-type="players" data-value="6">6</button>
        <button class="pill" data-type="players" data-value="7">7</button>
        <button class="pill" data-type="players" data-value="8">8</button>
        <button class="pill" data-type="players" data-value="9">9</button>
        <button class="pill" data-type="players" data-value="10">10+</button>
      </div>
      <div class="filter-group">
        <span class="filter-label">Time</span>
        <button class="pill active" data-type="time" data-value="any">Any</button>
        <button class="pill" data-type="time" data-value="quick">Quick</button>
        <button class="pill" data-type="time" data-value="medium">Medium</button>
        <button class="pill" data-type="time" data-value="long">Long</button>
      </div>
      <div class="filter-group">
        <span class="filter-label">Weight</span>
        <button class="pill active" data-type="weight" data-value="any">Any</button>
        <button class="pill" data-type="weight" data-value="light">Light</button>
        <button class="pill" data-type="weight" data-value="medium">Medium</button>
        <button class="pill" data-type="weight" data-value="heavy">Heavy</button>
      </div>
      <input class="search" id="search" type="text" placeholder="Search titles…">
    </div>
  </div>

  <p class="shelf-count" id="shelf-count"></p>
  <div class="shelf" id="shelf"></div>
</div>

<footer>Built from Naruephon's BoardGameGeek collection, 16 Aug &middot; showing the 30 highest-rated of 199 owned games<br>Descriptions sourced from BoardGameGeek and publisher listings</footer>

<div class="backdrop" id="backdrop">
  <div class="card" id="card">
    <button class="close-btn" id="close-btn">✕</button>
    <div id="card-body"></div>
  </div>
</div>

const state = { players:"any", time:"any", weight:"any", search:"" };

function timeBucket(t){
  const avg = (t[0]+t[1])/2;
  if(avg < 30) return "quick";
  if(avg <= 60) return "medium";
  return "long";
}
function playersMatch(g, val){
  if(val==="any") return true;
  if(val==="10") return g.players[1] >= 10;
  const n = parseInt(val,10);
  return n >= g.players[0] && n <= g.players[1];
}
function weightLabel(score){
  return `${score.toFixed(1)} / 5`;

function starBadge(rating10){
  const stars5 = Math.max(0, Math.min(5, rating10 / 2));
  const count = Math.round(stars5);
  return count === 0 ? "" : STAR_SVGS[count];
}
function timeLabel(t){
  return t[0]===t[1] ? `${t[0]}m` : `${t[0]}–${t[1]}m`;
}

function render(){
  const shelf = document.getElementById('shelf');
  const countEl = document.getElementById('shelf-count');
  shelf.innerHTML = "";

  const filtered = games.filter(g=>{
    if(!playersMatch(g, state.players)) return false;
    if(state.time!=="any" && timeBucket(g.time)!==state.time) return false;
    if(state.weight!=="any" && g.weight!==state.weight) return false;
    if(state.search && !g.title.toLowerCase().includes(state.search)) return false;
    return true;
  });

  countEl.textContent = `${filtered.length} of ${games.length} on the shelf`;

  if(filtered.length===0){
    shelf.innerHTML = `<p class="empty-state">Nothing fits that combo. Try loosening a filter.</p>`;
    return;
  }

  filtered.forEach(g=>{
    const el = document.createElement('button');
    el.className = 'spine';
    el.style.background = g.color;
    const badge = starBadge(g.bggRating);
    const ratingHtml = badge ? `<span class="spine-rating">${badge}</span>` : '';
    const isRealSpine = !!g.spineImage;
    const spineSrc = g.spineImage || g.image;
    const titleHtml = isRealSpine ? '' : `<span class="spine-title">${g.title}</span>`;
    el.innerHTML = `
      <img class="spine-img${isRealSpine ? ' is-real-spine' : ''}" src="${spineSrc}" alt="${g.title} spine" loading="lazy" decoding="async" onerror="this.remove()">
      <div class="spine-overlay${isRealSpine ? ' is-real-spine' : ''}">
        ${titleHtml}
        ${ratingHtml}
      </div>
    `;
    el.addEventListener('click', ()=>openCard(g));
    shelf.appendChild(el);
  });
}

function openCard(g){
  const body = document.getElementById('card-body');
  const coverHtml = g.backImage ? `
    <div class="flip-scene">
      <div class="flip-card" id="flip-card">
        <div class="flip-face flip-front">
          <img class="card-cover" src="${g.image}" alt="${g.title} box cover" loading="lazy" decoding="async" onerror="this.style.display='none'">
        </div>
        <div class="flip-face flip-back">
          <img class="card-cover" src="${g.backImage}" alt="${g.title} back of box" loading="lazy" decoding="async" onerror="this.style.display='none'">
        </div>
      </div>
      <p class="flip-hint">⟲ tap or swipe to see the back of the box</p>
    </div>
  ` : `
    <div class="card-cover-wrap" style="background:${g.color}22">
      <img class="card-cover" src="${g.image}" alt="${g.title} box cover" width="600" height="450" loading="lazy" decoding="async" fetchpriority="low" onerror="this.parentElement.style.background='${g.color}';this.style.display='none'">
    </div>
  `;
  body.innerHTML = `
    ${coverHtml}
    <h2>${g.title}</h2>
    <div class="stat-row">
      <span class="stat-chip">👥 ${g.players[0]}${g.players[1]!==g.players[0] ? '–'+g.players[1] : ''}</span>
      <span class="stat-chip">⏱ ${timeLabel(g.time)}</span>
      <span class="stat-chip">⚖ ${weightLabel(g.weightScore)}</span>
    </div>
    <p class="blurb">${g.blurb}</p>
    <p class="why-heading">Highlights</p>
    <ul class="why-list">
      ${g.why.map(w => `<li>${w}</li>`).join("")}
    </ul>
    <span class="tag">${g.tag}</span>
  `;

  if(g.backImage){
    const flipCard = document.getElementById('flip-card');
    let startX = 0, startY = 0;
    const toggle = () => flipCard.classList.toggle('flipped');
    flipCard.addEventListener('click', toggle);
    flipCard.addEventListener('touchstart', e=>{
      startX = e.touches[0].clientX;
      startY = e.touches[0].clientY;
    }, {passive:true});
    flipCard.addEventListener('touchend', e=>{
      const dx = e.changedTouches[0].clientX - startX;
      const dy = e.changedTouches[0].clientY - startY;
      if(Math.abs(dx) > 20 && Math.abs(dx) > Math.abs(dy)){
        toggle();
        e.preventDefault();
      }
    });
  }
  document.getElementById('backdrop').classList.add('open');
}

document.getElementById('close-btn').addEventListener('click', ()=>{
  document.getElementById('backdrop').classList.remove('open');
});
document.getElementById('backdrop').addEventListener('click', (e)=>{
  if(e.target.id==='backdrop') e.currentTarget.classList.remove('open');
});

document.querySelectorAll('.pill').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    const type = btn.dataset.type;
    document.querySelectorAll(`.pill[data-type="${type}"]`).forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    state[type] = btn.dataset.value;
    render();
  });
});

document.getElementById('search').addEventListener('input', (e)=>{
  state.search = e.target.value.toLowerCase();
  render();
});

render();
</script>
