<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BoardgameShelf</title>
<link rel="icon" href="/assets/icon.svg" type="image/svg+xml">
<link rel="icon" href="/assets/icon-32.png" sizes="32x32" type="image/png">
<link rel="icon" href="/assets/icon-64.png" sizes="64x64" type="image/png">
<link rel="apple-touch-icon" href="/assets/icon-180.png">
<link rel="manifest" href="/site.webmanifest">
<meta name="theme-color" content="#160F0A">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://cf.geekdo-images.com" crossorigin>
<link rel="dns-prefetch" href="https://cf.geekdo-images.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<script defer src="/_vercel/insights/script.js"></script>
<style>
  :root{
    --bgs-bg:#160F0A;
    --bgs-bg-rgb:22,15,10;
    --bgs-bg-radial:#241708;
    --bgs-plate:#241A10;
    --bgs-ivory:#F4EBDA;
    --bgs-ivory-rgb:244,235,218;
    --bgs-ivory-70:rgba(244,235,218,0.72);
    --bgs-ivory-45:rgba(244,235,218,0.45);
    --bgs-gold:#E3B04B;
    --bgs-gold-rgb:227,176,75;
    /* extended: dimmed gold for mono/meta labels — no token in spec sec.2 covers this role, closest match to legacy --brass-dim */
    --bgs-gold-dim:rgba(227,176,75,0.62);
    --bgs-icon-gold:#e2b463;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(ellipse at top, var(--bgs-bg-radial) 0%, var(--bgs-bg) 55%),
      var(--bgs-bg);
    color:var(--bgs-ivory);
    font-family:'Inter',sans-serif;
    min-height:100vh;
    padding:32px 20px 80px;
  }
  .wrap{max-width:960px;margin:0 auto;}

  header{margin-bottom:0;}
  .eyebrow{
    font-family:'IBM Plex Mono',monospace;
    font-size:12px;
    letter-spacing:0.14em;
    text-transform:uppercase;
    color:var(--bgs-gold);
    margin:0 0 10px;
  }
  h1{
    font-family:'Fraunces',serif;
    font-weight:600;
    font-size:clamp(30px,5vw,44px);
    margin:0 0 8px;
    letter-spacing:-0.01em;
  }
  .sub{
    color:var(--bgs-gold);
    font-size:15px;
    margin:0;
    max-width:50ch;
    line-height:1.5;
  }

  .filter-sort-bar{
    display:flex;
    align-items:center;
    gap:8px;
    margin:28px 0 10px;
    padding:10px 0;
    position:sticky;
    top:0;
    z-index:15;
    transition:background-color 0.2s ease;
  }
  .filter-sort-bar.is-stuck{
    background:rgba(var(--bgs-bg-rgb),0.82);
    backdrop-filter:blur(8px);
    -webkit-backdrop-filter:blur(8px);
  }
  .sticky-sentinel{
    height:1px;
  }
  .search-wrap{
    position:relative;
    flex:1;
    min-width:0;
  }
  .search{
    width:100%;
    background:var(--bgs-plate);
    border:1px solid rgba(var(--bgs-gold-rgb),0.18);
    border-radius:12px;
    color:var(--bgs-ivory);
    font-family:'Inter',sans-serif;
    font-size:16px;
    padding:10px 34px 10px 14px;
    outline:none;
  }
  .search:focus{border-color:var(--bgs-gold);}
  .search::placeholder{color:var(--bgs-ivory-70);}
  .search-clear{
    position:absolute;
    top:50%;
    right:4px;
    transform:translateY(-50%);
    width:28px;
    height:28px;
    padding:0;
    display:flex;
    align-items:center;
    justify-content:center;
    background:none;
    border:none;
    border-radius:50%;
    color:var(--bgs-ivory-70);
    font-size:13px;
    line-height:1;
    cursor:pointer;
  }
  .search-clear:hover{color:var(--bgs-ivory);}
  .search-clear[hidden]{display:none;}

  .icon-btn{
    position:relative;
    flex:none;
    width:40px;
    height:40px;
    padding:0;
    display:flex;
    align-items:center;
    justify-content:center;
    background:var(--bgs-plate);
    border:1px solid rgba(var(--bgs-gold-rgb),0.18);
    border-radius:12px;
    color:var(--bgs-ivory-70);
    cursor:pointer;
    transition:border-color 0.15s ease, color 0.15s ease;
  }
  .icon-btn::before{
    content:"";
    position:absolute;
    inset:-4px;
  }
  .icon-btn:hover{border-color:var(--bgs-gold);color:var(--bgs-ivory);}
  .icon-btn.active{border-color:var(--bgs-gold);color:var(--bgs-gold);}
  .filter-badge{
    position:absolute;
    top:-5px;
    right:-5px;
    width:16px;
    height:16px;
    border-radius:50%;
    background:var(--bgs-gold);
    color:var(--bgs-bg);
    font-family:'IBM Plex Mono',monospace;
    font-size:9.5px;
    font-weight:700;
    display:flex;
    align-items:center;
    justify-content:center;
    box-shadow:0 0 0 2px var(--bgs-bg);
  }
  .filter-badge[hidden]{display:none;}

  .chips-row{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
    margin:0 0 16px;
  }
  .chips-row[hidden]{display:none;}
  .chip{
    display:inline-flex;
    align-items:center;
    gap:6px;
    background:rgba(var(--bgs-gold-rgb),0.16);
    border:1px solid rgba(var(--bgs-gold-rgb),0.4);
    color:var(--bgs-gold);
    font-family:'Inter',sans-serif;
    font-size:12.5px;
    font-weight:500;
    padding:5px 8px 5px 12px;
    border-radius:999px;
  }
  .chip button{
    background:none;
    border:none;
    color:inherit;
    font-size:13px;
    line-height:1;
    padding:2px;
    cursor:pointer;
    opacity:0.75;
  }
  .chip button:hover{opacity:1;}

  .filter-label{
    font-family:'IBM Plex Mono',monospace;
    font-size:11px;
    letter-spacing:0.08em;
    text-transform:uppercase;
    color:var(--bgs-gold-dim);
    margin-right:2px;
  }
  .pill{
    font-family:'Inter',sans-serif;
    font-size:13px;
    font-weight:500;
    color:var(--bgs-ivory-70);
    background:transparent;
    border:1px solid rgba(var(--bgs-ivory-rgb),0.22);
    border-radius:999px;
    padding:6px 13px;
    cursor:pointer;
    transition:all 0.15s ease;
  }
  .pill:hover{border-color:var(--bgs-gold);color:var(--bgs-ivory);}
  .pill.active{
    background:var(--bgs-gold);
    border-color:var(--bgs-gold);
    color:var(--bgs-bg);
    font-weight:600;
  }

  .sheet-scrim{
    position:fixed;
    inset:0;
    background:rgba(var(--bgs-bg-rgb),0.6);
    z-index:20;
    opacity:0;
    pointer-events:none;
    transition:opacity 0.28s ease;
  }
  .sheet-scrim.open{opacity:1;pointer-events:auto;}
  .filter-sheet{
    position:fixed;
    left:0;
    right:0;
    bottom:0;
    z-index:21;
    max-width:600px;
    margin:0 auto;
    max-height:78vh;
    display:flex;
    flex-direction:column;
    background:var(--bgs-plate);
    border:1px solid rgba(var(--bgs-gold-rgb),0.18);
    border-bottom:none;
    border-radius:22px 22px 0 0;
    box-shadow:0 -12px 32px -8px rgba(0,0,0,0.6);
    transform:translateY(100%);
    transition:transform 0.32s cubic-bezier(.32,.72,0,1);
  }
  .filter-sheet.open{transform:translateY(0);}
  .sheet-handle{
    width:36px;
    height:4px;
    border-radius:2px;
    background:rgba(var(--bgs-ivory-rgb),0.22);
    margin:12px auto 4px;
    flex:none;
  }
  .sheet-header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:8px 20px 14px;
    border-bottom:1px solid rgba(var(--bgs-ivory-rgb),0.10);
    flex:none;
  }
  .sheet-header h2{
    font-family:'Fraunces',serif;
    font-size:19px;
    font-weight:600;
    margin:0;
  }
  .reset-link{
    background:none;
    border:none;
    color:var(--bgs-gold);
    font-family:'IBM Plex Mono',monospace;
    font-size:11.5px;
    letter-spacing:0.06em;
    text-transform:uppercase;
    cursor:pointer;
    padding:6px;
  }
  .reset-link:hover{color:var(--bgs-ivory);}
  .sheet-body{
    overflow-y:auto;
    padding:18px 20px 8px;
  }
  .sheet-group{margin-bottom:26px;}
  .sheet-group .filter-label{display:block;margin-bottom:10px;}
  .sheet-group .segmented{display:flex;flex-wrap:wrap;gap:8px;}

  .range-wrap{
    position:relative;
    height:28px;
    margin:6px 2px 2px;
  }
  .range-track{
    position:absolute;
    top:50%;
    left:0;
    right:0;
    height:4px;
    border-radius:2px;
    background:rgba(var(--bgs-ivory-rgb),0.16);
    transform:translateY(-50%);
  }
  .range-fill{
    position:absolute;
    top:50%;
    height:4px;
    border-radius:2px;
    background:var(--bgs-gold);
    transform:translateY(-50%);
  }
  .range-input{
    position:absolute;
    top:0;
    left:0;
    width:100%;
    height:28px;
    margin:0;
    background:transparent;
    -webkit-appearance:none;
    appearance:none;
    pointer-events:none;
  }
  .range-input::-webkit-slider-runnable-track{background:transparent;height:28px;}
  .range-input::-moz-range-track{background:transparent;height:28px;}
  .range-input::-webkit-slider-thumb{
    -webkit-appearance:none;
    pointer-events:auto;
    width:20px;
    height:20px;
    margin-top:4px;
    border-radius:50%;
    background:var(--bgs-gold);
    border:2px solid var(--bgs-plate);
    box-shadow:0 1px 4px rgba(0,0,0,0.5);
    cursor:pointer;
  }
  .range-input::-moz-range-thumb{
    pointer-events:auto;
    width:20px;
    height:20px;
    border-radius:50%;
    background:var(--bgs-gold);
    border:2px solid var(--bgs-plate);
    box-shadow:0 1px 4px rgba(0,0,0,0.5);
    cursor:pointer;
  }
  .number-cue-row{
    position:relative;
    height:12px;
    font-family:'IBM Plex Mono',monospace;
    font-size:9.5px;
    color:var(--bgs-ivory-70);
    opacity:0.55;
    margin:0 2px;
  }
  .number-cue-row span{
    position:absolute;
    top:0;
    transform:translateX(-50%);
    white-space:nowrap;
  }
  .number-cue-row span.active{color:var(--bgs-gold);font-weight:600;opacity:1;}

  .toggle-row{
    display:flex;
    align-items:center;
    gap:12px;
    margin-top:16px;
    background:none;
    border:none;
    padding:0;
    cursor:pointer;
  }
  .toggle-switch{
    position:relative;
    flex:none;
    width:34px;
    height:20px;
    border-radius:999px;
    background:rgba(var(--bgs-ivory-rgb),0.16);
    border:1px solid rgba(var(--bgs-ivory-rgb),0.22);
    transition:background 0.15s ease,border-color 0.15s ease;
  }
  .toggle-switch::after{
    content:"";
    position:absolute;
    top:1px;
    left:1px;
    width:16px;
    height:16px;
    border-radius:50%;
    background:var(--bgs-ivory-70);
    transition:transform 0.15s ease,background 0.15s ease;
  }
  .toggle-row[aria-checked="true"] .toggle-switch{
    background:var(--bgs-gold);
    border-color:var(--bgs-gold);
  }
  .toggle-row[aria-checked="true"] .toggle-switch::after{
    transform:translateX(14px);
    background:var(--bgs-bg);
  }
  .toggle-label{
    font-family:'Inter',sans-serif;
    font-size:13px;
    font-weight:500;
    color:var(--bgs-ivory);
  }

  .sheet-footer{
    flex:none;
    padding:14px 20px calc(14px + env(safe-area-inset-bottom));
    border-top:1px solid rgba(var(--bgs-ivory-rgb),0.10);
  }
  .apply-btn{
    width:100%;
    background:var(--bgs-gold);
    color:var(--bgs-bg);
    border:none;
    border-radius:12px;
    font-family:'Inter',sans-serif;
    font-size:15px;
    font-weight:600;
    padding:13px;
    cursor:pointer;
  }
  .apply-btn:hover{filter:brightness(1.06);}

  @media (prefers-reduced-motion:reduce){
    .sheet-scrim, .filter-sheet{transition:none;}
  }

  .shelf-count{
    font-family:'IBM Plex Mono',monospace;
    font-size:12px;
    color:var(--bgs-gold-dim);
    margin:0 0 14px;
  }

  .shelf{
    display:grid;
    grid-template-columns:repeat(3, 1fr);
    gap:10px;
    min-height:260px;
  }
  @media (min-width:560px){ .shelf{ grid-template-columns:repeat(4, 1fr); gap:14px; } }
  @media (min-width:800px){ .shelf{ grid-template-columns:repeat(6, 1fr); gap:16px; } }
  .empty-state{
    font-family:'Inter',sans-serif;
    color:var(--bgs-ivory-70);
    font-size:14px;
    padding:60px 10px;
    width:100%;
    text-align:center;
    grid-column:1 / -1;
  }

  .game-card{
    border-radius:10px;
    overflow:hidden;
    background:var(--bgs-plate);
    box-shadow:0 3px 10px rgba(0,0,0,.35);
    display:flex;
    flex-direction:column;
    transition:transform .15s ease;
    cursor:pointer;
    border:none;
    padding:0;
    text-align:left;
    font:inherit;
    color:inherit;
  }
  .game-card:hover{ transform:translateY(-2px); }

  .game-card .art{
    aspect-ratio:3/4;
    width:100%;
    overflow:hidden;
    background:#000;
  }
  .game-card .art img{ width:100%; height:100%; object-fit:cover; display:block; }

  .game-card .plate-body{
    padding:8px 8px 9px;
    display:flex;
    flex-direction:column;
    gap:6px;
  }
  .game-card .title{
    font-family:'Fraunces',serif;
    font-weight:600;
    font-size:12.5px;
    line-height:1.24;
    color:var(--bgs-ivory);
    margin:0;
    display:-webkit-box;
    -webkit-line-clamp:2;
    -webkit-box-orient:vertical;
    overflow:hidden;
  }
  .game-card .meta-row{ display:flex; align-items:center; justify-content:space-between; gap:4px; }
  .game-card .rating-pill{
    display:inline-flex; align-items:center; gap:3px;
    background:rgba(0,0,0,.3);
    border:1px solid rgba(var(--bgs-gold-rgb),.35);
    border-radius:20px;
    padding:2px 6px 2px 5px;
    font-size:10.5px; font-weight:700;
    color:var(--bgs-gold);
    white-space:nowrap;
  }
  .game-card .players{ font-size:10px; color:var(--bgs-ivory-45); font-weight:500; white-space:nowrap; }

  @keyframes shimmer{
    0%{background-position:150% 0;}
    100%{background-position:-50% 0;}
  }
  .game-card-skeleton{
    cursor:default;
    pointer-events:none;
  }
  .game-card-skeleton .art{
    background:linear-gradient(100deg, var(--bgs-plate) 30%, rgba(var(--bgs-ivory-rgb),0.08) 50%, var(--bgs-plate) 70%);
    background-size:250% 100%;
    animation:shimmer 1.7s ease-in-out infinite;
  }
  .game-card-skeleton:nth-child(6n+2) .art{animation-delay:0.15s;}
  .game-card-skeleton:nth-child(6n+3) .art{animation-delay:0.3s;}
  .game-card-skeleton:nth-child(6n+4) .art{animation-delay:0.45s;}
  .game-card-skeleton:nth-child(6n+5) .art{animation-delay:0.6s;}
  .game-card-skeleton:nth-child(6n) .art{animation-delay:0.75s;}
  .game-card-skeleton .skeleton-line{
    height:8px;
    border-radius:4px;
    background:rgba(var(--bgs-ivory-rgb),0.08);
  }
  .game-card-skeleton .skeleton-line.short{ width:60%; }

  /* modal */
  .backdrop{
    position:fixed;inset:0;
    background:rgba(var(--bgs-bg-rgb),0.66);
    backdrop-filter:blur(3px);
    display:none;
    align-items:center;
    justify-content:center;
    padding:24px;
    z-index:30;
  }
  .backdrop.open{display:flex;}
  .card{
    background:var(--bgs-plate);
    border:1px solid rgba(var(--bgs-gold-rgb),0.3);
    border-radius:16px;
    max-width:440px;
    width:100%;
    position:relative;
    animation:pop 0.18s ease;
    max-height:85vh;
    overflow:hidden;
  }
  #card-body{
    padding:30px 30px 26px;
    max-height:85vh;
    overflow-y:auto;
  }
  @keyframes pop{from{opacity:0;transform:scale(0.96);}to{opacity:1;transform:scale(1);}}
  .card-cover-wrap{
    width:100%;
    min-height:80px;
    border-radius:10px;
    margin:-6px 0 18px;
    box-shadow:0 6px 16px -6px rgba(0,0,0,0.5);
    overflow:hidden;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .card-cover{
    display:block;
    max-width:100%;
    max-height:360px;
    width:auto;
    height:auto;
  }
  .flip-scene{
    width:100%;
    margin:-6px 0 18px;
    perspective:1400px;
  }
  .flip-card{
    position:relative;
    width:100%;
    aspect-ratio:4 / 3;
    max-height:360px;
    cursor:pointer;
    touch-action:pan-y;
    transform-style:preserve-3d;
    transition:transform 0.55s cubic-bezier(.4,.2,.2,1);
  }
  .flip-card.flipped{
    transform:rotateY(180deg);
  }
  .flip-face{
    position:absolute;
    inset:0;
    display:flex;
    align-items:center;
    justify-content:center;
    border-radius:10px;
    box-shadow:0 6px 16px -6px rgba(0,0,0,0.5);
    overflow:hidden;
    backface-visibility:hidden;
    background:var(--bgs-bg);
  }
  .flip-back{
    transform:rotateY(180deg);
  }
  .flip-card:not(.flipped) .flip-back{
    pointer-events:none;
  }
  .flip-card.flipped .flip-front{
    pointer-events:none;
  }
  .flip-face .card-cover{
    max-width:100%;
    max-height:100%;
    width:auto;
    height:auto;
    object-fit:contain;
  }
  .flip-hint{
    font-family:'IBM Plex Mono',monospace;
    font-size:11px;
    color:var(--bgs-gold-dim);
    text-align:center;
    margin:8px 0 0;
  }
  .card h2{
    font-family:'Fraunces',serif;
    font-weight:600;
    font-size:24px;
    margin:0 0 14px;
    line-height:1.2;
  }
  .stat-row{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
    margin-bottom:16px;
  }
  .stat-chip{
    font-family:'IBM Plex Mono',monospace;
    font-size:12px;
    color:var(--bgs-ivory);
    background:rgba(var(--bgs-ivory-rgb),0.08);
    border:1px solid rgba(var(--bgs-ivory-rgb),0.16);
    border-radius:6px;
    padding:5px 10px;
    display:flex;
    align-items:center;
    gap:6px;
  }
  .stat-icon{ color:var(--bgs-icon-gold); flex-shrink:0; }
  .card p.blurb{
    font-size:15px;
    line-height:1.6;
    color:var(--bgs-ivory-70);
    margin:0 0 18px;
  }
  .card .tag{
    font-family:'IBM Plex Mono',monospace;
    font-size:11px;
    letter-spacing:0.06em;
    text-transform:uppercase;
    color:var(--bgs-gold);
  }
  .why-heading{
    font-family:'IBM Plex Mono',monospace;
    font-size:11px;
    letter-spacing:0.08em;
    text-transform:uppercase;
    color:var(--bgs-gold-dim);
    margin:20px 0 10px;
  }
  .why-list{
    list-style:none;
    margin:0 0 20px;
    padding:0;
    display:flex;
    flex-direction:column;
    gap:8px;
  }
  .why-list li{
    font-size:14px;
    line-height:1.5;
    color:var(--bgs-ivory);
    padding-left:18px;
    position:relative;
  }
  .why-list li::before{
    content:"";
    position:absolute;
    left:0;
    top:8px;
    width:6px;
    height:6px;
    border-radius:50%;
    background:var(--bgs-gold);
  }
  .close-btn{
    position:absolute;
    top:16px;right:16px;
    z-index:10;
    background:rgba(var(--bgs-bg-rgb),0.55);
    border:none;
    border-radius:50%;
    width:30px;
    height:30px;
    display:flex;
    align-items:center;
    justify-content:center;
    color:var(--bgs-ivory);
    font-size:16px;
    cursor:pointer;
    line-height:1;
    padding:0;
  }
  .close-btn:hover{color:var(--bgs-ivory);}

  footer{
    max-width:960px;
    margin:40px auto 0;
    font-family:'IBM Plex Mono',monospace;
    text-align:center;
  }

</style>
</head>
<body>
<div class="wrap">
  <header>
    <p class="eyebrow" style="color:var(--bgs-ivory-70)">noknaruephon</p>
    <h1>BoardgameShelf</h1>
    <p class="sub">Browse the game, judge by its cover.</p>
  </header>

  <div class="sticky-sentinel" id="stickySentinel" aria-hidden="true"></div>
  <div class="filter-sort-bar" id="filterSortBar">
    <div class="search-wrap">
      <input class="search" id="search" type="text" placeholder="Search titles…">
      <button class="search-clear" id="searchClear" type="button" aria-label="Clear search" hidden>✕</button>
    </div>
    <button class="icon-btn" id="filterBtn" aria-label="Open filters" aria-haspopup="dialog" aria-expanded="false" aria-controls="filterSheet">
      <svg width="15" height="15" viewBox="0 0 15 15" fill="none" xmlns="http://www.w3.org/2000/svg">
        <line x1="0" y1="2.5" x2="15" y2="2.5" stroke="currentColor" stroke-width="1.4"/>
        <circle cx="9.5" cy="2.5" r="2.2" fill="var(--bgs-plate)" stroke="currentColor" stroke-width="1.4"/>
        <line x1="0" y1="7.5" x2="15" y2="7.5" stroke="currentColor" stroke-width="1.4"/>
        <circle cx="4.5" cy="7.5" r="2.2" fill="var(--bgs-plate)" stroke="currentColor" stroke-width="1.4"/>
        <line x1="0" y1="12.5" x2="15" y2="12.5" stroke="currentColor" stroke-width="1.4"/>
        <circle cx="11" cy="12.5" r="2.2" fill="var(--bgs-plate)" stroke="currentColor" stroke-width="1.4"/>
      </svg>
      <span class="filter-badge" id="filterBadge" hidden>0</span>
    </button>
    <button class="icon-btn" id="sortBtn" aria-label="Sort ascending" aria-pressed="false">
      <svg id="sortIcon" width="15" height="15" viewBox="0 0 15 15" fill="none" xmlns="http://www.w3.org/2000/svg" style="transition:transform 0.2s ease;">
        <path d="M7.5 12.5V2.5M7.5 2.5L3 7M7.5 2.5L12 7" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </button>
  </div>

  <div class="chips-row" id="chipsRow" hidden></div>

  <p class="shelf-count" id="shelf-count">Loading the shelf…</p>
  <div class="shelf" id="shelf">
    <div class="game-card game-card-skeleton"><div class="art"></div><div class="plate-body"><div class="skeleton-line"></div><div class="skeleton-line short"></div></div></div>
    <div class="game-card game-card-skeleton"><div class="art"></div><div class="plate-body"><div class="skeleton-line"></div><div class="skeleton-line short"></div></div></div>
    <div class="game-card game-card-skeleton"><div class="art"></div><div class="plate-body"><div class="skeleton-line"></div><div class="skeleton-line short"></div></div></div>
    <div class="game-card game-card-skeleton"><div class="art"></div><div class="plate-body"><div class="skeleton-line"></div><div class="skeleton-line short"></div></div></div>
    <div class="game-card game-card-skeleton"><div class="art"></div><div class="plate-body"><div class="skeleton-line"></div><div class="skeleton-line short"></div></div></div>
    <div class="game-card game-card-skeleton"><div class="art"></div><div class="plate-body"><div class="skeleton-line"></div><div class="skeleton-line short"></div></div></div>
    <div class="game-card game-card-skeleton"><div class="art"></div><div class="plate-body"><div class="skeleton-line"></div><div class="skeleton-line short"></div></div></div>
    <div class="game-card game-card-skeleton"><div class="art"></div><div class="plate-body"><div class="skeleton-line"></div><div class="skeleton-line short"></div></div></div>
    <div class="game-card game-card-skeleton"><div class="art"></div><div class="plate-body"><div class="skeleton-line"></div><div class="skeleton-line short"></div></div></div>
    <div class="game-card game-card-skeleton"><div class="art"></div><div class="plate-body"><div class="skeleton-line"></div><div class="skeleton-line short"></div></div></div>
    <div class="game-card game-card-skeleton"><div class="art"></div><div class="plate-body"><div class="skeleton-line"></div><div class="skeleton-line short"></div></div></div>
    <div class="game-card game-card-skeleton"><div class="art"></div><div class="plate-body"><div class="skeleton-line"></div><div class="skeleton-line short"></div></div></div>
  </div>
</div>

<footer>
<p class="primary">195 games in the collection (expansions excluded) &middot; synced daily from BoardGameGeek</p>
<p class="secondary">Descriptions sourced from BoardGameGeek and publisher listings</p>
</footer>

<div class="backdrop" id="backdrop">
  <div class="card" id="card">
    <button class="close-btn" id="close-btn">✕</button>
    <div id="card-body"></div>
  </div>
</div>

<div class="sheet-scrim" id="sheetScrim"></div>
<div class="filter-sheet" id="filterSheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
  <div class="sheet-handle" aria-hidden="true"></div>
  <div class="sheet-header">
    <h2 id="sheetTitle">Filters</h2>
    <button class="reset-link" id="resetLink" type="button">Reset</button>
  </div>
  <div class="sheet-body">
    <div class="sheet-group">
      <span class="filter-label" id="playersGroupLabel">Players — Any</span>
      <div class="range-wrap">
        <div class="range-track"></div>
        <div class="range-fill" id="rangeFill"></div>
        <input type="range" min="1" max="11" step="1" value="1" id="rangeMin" class="range-input" aria-label="Minimum players">
        <input type="range" min="1" max="11" step="1" value="11" id="rangeMax" class="range-input" aria-label="Maximum players">
      </div>
      <div class="number-cue-row" id="numberCueRow">
        <span data-n="1" style="left:calc(10px + (100% - 20px) * 0)">1</span><span data-n="2" style="left:calc(10px + (100% - 20px) * 0.1)">2</span><span data-n="3" style="left:calc(10px + (100% - 20px) * 0.2)">3</span><span data-n="4" style="left:calc(10px + (100% - 20px) * 0.3)">4</span><span data-n="5" style="left:calc(10px + (100% - 20px) * 0.4)">5</span><span data-n="6" style="left:calc(10px + (100% - 20px) * 0.5)">6</span><span data-n="7" style="left:calc(10px + (100% - 20px) * 0.6)">7</span><span data-n="8" style="left:calc(10px + (100% - 20px) * 0.7)">8</span><span data-n="9" style="left:calc(10px + (100% - 20px) * 0.8)">9</span><span data-n="10" style="left:calc(10px + (100% - 20px) * 0.9)">10</span><span data-n="11" style="left:calc(10px + (100% - 20px) * 1)">11+</span>
      </div>
      <button type="button" class="toggle-row" id="bestFitToggle" role="switch" aria-checked="false">
        <span class="toggle-switch" aria-hidden="true"></span>
        <span class="toggle-label">Recommended counts only</span>
      </button>
    </div>
    <div class="sheet-group">
      <span class="filter-label">Time</span>
      <div class="segmented" data-type="time" role="group" aria-label="Time">
        <button class="pill active" data-value="any" aria-pressed="true">Any</button>
        <button class="pill" data-value="quick" aria-pressed="false">Quick</button>
        <button class="pill" data-value="medium" aria-pressed="false">Medium</button>
        <button class="pill" data-value="long" aria-pressed="false">Long</button>
      </div>
    </div>
    <div class="sheet-group">
      <span class="filter-label">Weight</span>
      <div class="segmented" data-type="weight" role="group" aria-label="Weight">
        <button class="pill active" data-value="any" aria-pressed="true">Any</button>
        <button class="pill" data-value="light" aria-pressed="false">Light</button>
        <button class="pill" data-value="medium" aria-pressed="false">Medium</button>
        <button class="pill" data-value="heavy" aria-pressed="false">Heavy</button>
      </div>
    </div>
  </div>
  <div class="sheet-footer">
    <button class="apply-btn" id="applyBtn" type="button">Show 195 games</button>
  </div>
</div>

<script type="module">
import {
  DEFAULT_FILTERS, isFilterActive, activeGroupCount, playersLabel,
  timeBucket, playersMatch, bestFitMatch, applyFilters,
  weightLabel, timeLabel, playersRangeLabel
} from './js/filters.js';

let games = [];

async function loadGames(){
  const res = await fetch('/games.json');
  if(!res.ok) throw new Error('Failed to load games');
  games = await res.json();
}
const state = {
  filters: { ...DEFAULT_FILTERS },
  search: "",
  sort: "off", // 'off' (ascending, default) | 'desc'
};
let draftFilters = { ...DEFAULT_FILTERS };


function render(){
  const shelf = document.getElementById('shelf');
  const countEl = document.getElementById('shelf-count');
  shelf.innerHTML = "";

  let filtered = applyFilters(games, state.filters, state.search);
  filtered = filtered.slice().sort((a,b)=> state.sort==="desc" ? a.bggRating - b.bggRating : b.bggRating - a.bggRating);

  countEl.textContent = `${filtered.length} of ${games.length} on the shelf`;

  updateFilterButton();
  renderChips();

  if(filtered.length===0){
    shelf.innerHTML = `<p class="empty-state">Nothing fits that combo. Try loosening a filter.</p>`;
    return;
  }

  filtered.forEach(g=>{
    const el = document.createElement('button');
    el.className = 'game-card';
    el.innerHTML = `
      <div class="art">
        <img src="${g.image}" alt="${g.title} cover" loading="lazy" decoding="async" onerror="this.closest('.art').style.background='var(--bgs-plate)';this.remove()">
      </div>
      <div class="plate-body">
        <h3 class="title">${g.title}</h3>
        <div class="meta-row">
          <span class="rating-pill">★ ${g.bggRating.toFixed(1)}</span>
          <span class="players">${playersRangeLabel(g.players)}</span>
        </div>
      </div>
    `;
    el.addEventListener('click', ()=>openCard(g));
    shelf.appendChild(el);
  });
}

function openCard(g){
  const body = document.getElementById('card-body');
  const coverHtml = g.backImage ? `
    <div class="flip-scene">
      <div class="flip-card" id="flip-card">
        <div class="flip-face flip-front">
          <img class="card-cover" src="${g.image}" alt="${g.title} box cover" loading="lazy" decoding="async" onerror="this.style.display='none'">
        </div>
        <div class="flip-face flip-back">
          <img class="card-cover" src="${g.backImage}" alt="${g.title} back of box" loading="lazy" decoding="async" onerror="this.style.display='none'">
        </div>
      </div>
      <p class="flip-hint">⟲ tap or swipe to see the back of the box</p>
    </div>
  ` : `
    <div class="card-cover-wrap" style="background:${g.color}22">
      <img class="card-cover" src="${g.image}" alt="${g.title} box cover" width="600" height="450" loading="lazy" decoding="async" fetchpriority="low" onerror="this.parentElement.style.background='${g.color}';this.style.display='none'">
    </div>
  `;
  body.innerHTML = `
    ${coverHtml}
    <h2>${g.title}</h2>
    <div class="stat-row">
      <span class="stat-chip"><svg class="stat-icon" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="7" r="3"/><circle cx="16" cy="8" r="2.5"/><path d="M3 20c0-3 2.5-5 6-5s6 2 6 5"/><path d="M14.5 15c2.5.3 4.5 2 4.5 5"/></svg> ${g.players[0]}${g.players[1]!==g.players[0] ? '–'+g.players[1] : ''}</span>
      <span class="stat-chip"><svg class="stat-icon" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l3 2"/><path d="M9 2h6"/></svg> ${timeLabel(g.time)}</span>
      <span class="stat-chip"><svg class="stat-icon" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v18"/><path d="M5 7l-3 6a3 3 0 006 0z"/><path d="M19 7l-3 6a3 3 0 006 0z"/><path d="M5 7h14"/><path d="M9 21h6"/></svg> ${weightLabel(g.weightScore)}</span>
    </div>
    <p class="blurb">${g.blurb}</p>
    <p class="why-heading">Highlights</p>
    <ul class="why-list">
      ${g.why.map(w => `<li>${w}</li>`).join("")}
    </ul>
    <span class="tag">${g.tag}</span>
  `;

  if(g.backImage){
    const flipCard = document.getElementById('flip-card');
    const frontImg = flipCard.querySelector('.flip-front .card-cover');
    const applyRatio = () => {
      if(frontImg.naturalWidth && frontImg.naturalHeight){
        flipCard.style.aspectRatio = `${frontImg.naturalWidth} / ${frontImg.naturalHeight}`;
      }
    };
    if(frontImg.complete) applyRatio();
    else frontImg.addEventListener('load', applyRatio, {once:true});
    let startX = 0, startY = 0;
    const toggle = () => flipCard.classList.toggle('flipped');
    flipCard.addEventListener('click', toggle);
    flipCard.addEventListener('touchstart', e=>{
      startX = e.touches[0].clientX;
      startY = e.touches[0].clientY;
    }, {passive:true});
    flipCard.addEventListener('touchend', e=>{
      const dx = e.changedTouches[0].clientX - startX;
      const dy = e.changedTouches[0].clientY - startY;
      if(Math.abs(dx) > 20 && Math.abs(dx) > Math.abs(dy)){
        toggle();
        e.preventDefault();
      }
    });
  }
  document.getElementById('backdrop').classList.add('open');
}

document.getElementById('close-btn').addEventListener('click', ()=>{
  document.getElementById('backdrop').classList.remove('open');
});
document.getElementById('backdrop').addEventListener('click', (e)=>{
  if(e.target.id==='backdrop') e.currentTarget.classList.remove('open');
});

// ---- Filter/sort bar: badge + chips ----

function updateFilterButton(){
  const btn = document.getElementById('filterBtn');
  const badge = document.getElementById('filterBadge');
  const count = activeGroupCount(state.filters);
  const active = count > 0;
  btn.classList.toggle('active', active);
  if(active){
    badge.hidden = false;
    badge.textContent = String(count);
  } else {
    badge.hidden = true;
  }
}

function renderChips(){
  const row = document.getElementById('chipsRow');
  const chips = [];
  if(state.filters.minPlayers !== 1 || state.filters.maxPlayers !== 11){
    chips.push({ key:'players', label:`${playersLabel(state.filters)} players` });
  }
  if(state.filters.time !== 'any'){
    const labels = { quick:'Quick', medium:'Medium', long:'Long' };
    chips.push({ key:'time', label: labels[state.filters.time] });
  }
  if(state.filters.weight !== 'any'){
    const labels = { light:'Light', medium:'Medium', heavy:'Heavy' };
    chips.push({ key:'weight', label: labels[state.filters.weight] });
  }
  if(state.filters.bestFit){
    chips.push({ key:'bestFit', label: 'Recommended counts only' });
  }
  if(chips.length===0){
    row.hidden = true;
    row.innerHTML = '';
    return;
  }
  row.hidden = false;
  row.innerHTML = chips.map(c=>`
    <span class="chip" data-key="${c.key}">
      ${c.label}
      <button type="button" aria-label="Remove ${c.label} filter">✕</button>
    </span>
  `).join('');
  row.querySelectorAll('.chip button').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const key = btn.closest('.chip').dataset.key;
      if(key==='players'){ state.filters.minPlayers = 1; state.filters.maxPlayers = 11; }
      else if(key==='bestFit'){ state.filters.bestFit = false; }
      else state.filters[key] = 'any';
      render();
    });
  });
}

// ---- Filter sheet ----

const filterSheet = document.getElementById('filterSheet');
const sheetScrim = document.getElementById('sheetScrim');
const rangeMin = document.getElementById('rangeMin');
const rangeMax = document.getElementById('rangeMax');
const rangeFill = document.getElementById('rangeFill');
const numberCueRow = document.getElementById('numberCueRow');
const playersGroupLabel = document.getElementById('playersGroupLabel');
const applyBtn = document.getElementById('applyBtn');
const bestFitToggle = document.getElementById('bestFitToggle');

function syncSheetUI(){
  rangeMin.value = draftFilters.minPlayers;
  rangeMax.value = draftFilters.maxPlayers;
  document.querySelectorAll('.segmented').forEach(group=>{
    const type = group.dataset.type;
    group.querySelectorAll('.pill').forEach(p=>{
      const isActive = p.dataset.value === draftFilters[type];
      p.classList.toggle('active', isActive);
      p.setAttribute('aria-pressed', String(isActive));
    });
  });
  bestFitToggle.setAttribute('aria-checked', String(draftFilters.bestFit));
  updateLiveCount();
}

function updateLiveCount(){
  const pct = v => ((v-1)/(11-1))*100;
  rangeFill.style.left = pct(draftFilters.minPlayers)+'%';
  rangeFill.style.width = (pct(draftFilters.maxPlayers)-pct(draftFilters.minPlayers))+'%';
  numberCueRow.querySelectorAll('span').forEach(s=>{
    const n = parseInt(s.dataset.n,10);
    s.classList.toggle('active', n>=draftFilters.minPlayers && n<=draftFilters.maxPlayers);
  });
  playersGroupLabel.textContent = `Players — ${playersLabel(draftFilters)}`;
  const liveCount = applyFilters(games, draftFilters, state.search).length;
  applyBtn.textContent = `Show ${liveCount} game${liveCount===1?'':'s'}`;
}

function clampRange(){
  let min = parseInt(rangeMin.value,10);
  let max = parseInt(rangeMax.value,10);
  if(min > max){
    if(document.activeElement === rangeMin) max = min; else min = max;
    rangeMin.value = min;
    rangeMax.value = max;
  }
  draftFilters.minPlayers = min;
  draftFilters.maxPlayers = max;
  updateLiveCount();
}
rangeMin.addEventListener('input', clampRange);
rangeMax.addEventListener('input', clampRange);

bestFitToggle.addEventListener('click', ()=>{
  draftFilters.bestFit = !draftFilters.bestFit;
  bestFitToggle.setAttribute('aria-checked', String(draftFilters.bestFit));
  updateLiveCount();
});

document.querySelectorAll('.segmented').forEach(group=>{
  group.addEventListener('click', (e)=>{
    const btn = e.target.closest('.pill');
    if(!btn) return;
    const type = group.dataset.type;
    group.querySelectorAll('.pill').forEach(p=>{
      p.classList.remove('active');
      p.setAttribute('aria-pressed','false');
    });
    btn.classList.add('active');
    btn.setAttribute('aria-pressed','true');
    draftFilters[type] = btn.dataset.value;
    updateLiveCount();
  });
});

let sheetLastFocused = null;
function getFocusable(){
  return Array.from(filterSheet.querySelectorAll('button, input, [tabindex]:not([tabindex="-1"])'))
    .filter(el => !el.disabled && el.offsetParent !== null);
}
function openSheet(){
  draftFilters = { ...state.filters };
  syncSheetUI();
  sheetLastFocused = document.activeElement;
  sheetScrim.classList.add('open');
  filterSheet.classList.add('open');
  document.getElementById('filterBtn').setAttribute('aria-expanded','true');
  const focusable = getFocusable();
  if(focusable.length) focusable[0].focus();
}
function closeSheet(){
  sheetScrim.classList.remove('open');
  filterSheet.classList.remove('open');
  document.getElementById('filterBtn').setAttribute('aria-expanded','false');
  if(sheetLastFocused) sheetLastFocused.focus();
}
function isSheetOpen(){
  return filterSheet.classList.contains('open');
}

document.getElementById('filterBtn').addEventListener('click', openSheet);
sheetScrim.addEventListener('click', closeSheet);
document.getElementById('resetLink').addEventListener('click', ()=>{
  draftFilters = { ...DEFAULT_FILTERS };
  syncSheetUI();
});
applyBtn.addEventListener('click', ()=>{
  state.filters = { ...draftFilters };
  closeSheet();
  render();
});

document.addEventListener('keydown', (e)=>{
  if(e.key !== 'Escape' && e.key !== 'Tab') return;
  if(!isSheetOpen()) return;
  if(e.key === 'Escape'){
    closeSheet();
    return;
  }
  // focus trap
  const focusable = getFocusable();
  if(!focusable.length) return;
  const first = focusable[0];
  const last = focusable[focusable.length-1];
  if(e.shiftKey && document.activeElement === first){
    e.preventDefault();
    last.focus();
  } else if(!e.shiftKey && document.activeElement === last){
    e.preventDefault();
    first.focus();
  }
});

// ---- Sort button ----

const sortBtn = document.getElementById('sortBtn');
const sortIcon = document.getElementById('sortIcon');
sortBtn.addEventListener('click', ()=>{
  state.sort = state.sort === 'off' ? 'desc' : 'off';
  const isDesc = state.sort === 'desc';
  sortBtn.classList.toggle('active', isDesc);
  sortBtn.setAttribute('aria-pressed', String(isDesc));
  sortBtn.setAttribute('aria-label', isDesc ? 'Sort descending' : 'Sort ascending');
  sortIcon.style.transform = isDesc ? 'rotate(180deg)' : 'rotate(0deg)';
  render();
});

// ---- Search ----

const searchInput = document.getElementById('search');
const searchClear = document.getElementById('searchClear');

function updateSearchClear(){
  searchClear.hidden = searchInput.value.length === 0;
}

searchInput.addEventListener('input', (e)=>{
  state.search = e.target.value.toLowerCase();
  updateSearchClear();
  render();
});
searchClear.addEventListener('click', ()=>{
  searchInput.value = '';
  state.search = '';
  searchInput.focus();
  updateSearchClear();
  render();
});

// ---- Sticky bar background (only while actually pinned) ----

const stickySentinel = document.getElementById('stickySentinel');
const filterSortBar = document.getElementById('filterSortBar');
if('IntersectionObserver' in window){
  new IntersectionObserver(
    ([entry]) => filterSortBar.classList.toggle('is-stuck', !entry.isIntersecting),
    { threshold: 0 }
  ).observe(stickySentinel);
}

try {
  await loadGames();
  render();
} catch {
  document.getElementById('shelf').innerHTML = `<p class="empty-state">Couldn't load the collection. Try refreshing.</p>`;
  document.getElementById('shelf-count').textContent = '';
}
</script>
</body>
</html>
