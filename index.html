<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BoardgameShelf</title>
<link rel="icon" href="/assets/icon.svg" type="image/svg+xml">
<link rel="icon" href="/assets/icon-32.png" sizes="32x32" type="image/png">
<link rel="icon" href="/assets/icon-64.png" sizes="64x64" type="image/png">
<link rel="apple-touch-icon" href="/assets/icon-180.png">
<link rel="manifest" href="/site.webmanifest">
<meta name="theme-color" content="#160F0A">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://cf.geekdo-images.com" crossorigin>
<link rel="dns-prefetch" href="https://cf.geekdo-images.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/base.css">
<link rel="stylesheet" href="/css/game-modal.css">
<script defer src="/_vercel/insights/script.js"></script>
<style>
  /* Tokens and page chrome come from css/base.css. */
  body{
    padding:32px 20px 80px;
  }
  .wrap{max-width:960px;margin:0 auto;}

  header{margin-bottom:0;}
  .eyebrow{
    font-family:'IBM Plex Mono',monospace;
    font-size:12px;
    letter-spacing:0.14em;
    text-transform:uppercase;
    color:var(--bgs-gold);
    margin:0 0 10px;
  }
  h1{
    font-family:'Fraunces',serif;
    font-weight:600;
    font-size:clamp(30px,5vw,44px);
    margin:0 0 8px;
    letter-spacing:-0.01em;
  }
  .sub{
    color:var(--bgs-gold);
    font-size:15px;
    margin:0;
    max-width:50ch;
    line-height:1.5;
  }

  .filter-sort-bar{
    display:flex;
    align-items:center;
    gap:8px;
    margin:28px 0 10px;
    padding:10px 0;
    position:sticky;
    top:0;
    z-index:15;
    transition:background-color 0.2s ease;
  }
  .filter-sort-bar.is-stuck{
    background:rgba(var(--bgs-bg-rgb),0.82);
    backdrop-filter:blur(8px);
    -webkit-backdrop-filter:blur(8px);
  }
  .sticky-sentinel{
    height:1px;
  }
  .search-wrap{
    position:relative;
    flex:1;
    min-width:0;
  }
  .search{
    width:100%;
    background:var(--bgs-plate);
    border:1px solid rgba(var(--bgs-gold-rgb),0.18);
    border-radius:12px;
    color:var(--bgs-ivory);
    font-family:'Inter',sans-serif;
    font-size:16px;
    padding:10px 34px 10px 14px;
    outline:none;
  }
  .search:focus{border-color:var(--bgs-gold);}
  .search::placeholder{color:var(--bgs-ivory-70);}
  .search-clear{
    position:absolute;
    top:50%;
    right:4px;
    transform:translateY(-50%);
    width:28px;
    height:28px;
    padding:0;
    display:flex;
    align-items:center;
    justify-content:center;
    background:none;
    border:none;
    border-radius:50%;
    color:var(--bgs-ivory-70);
    font-size:13px;
    line-height:1;
    cursor:pointer;
  }
  .search-clear:hover{color:var(--bgs-ivory);}
  .search-clear[hidden]{display:none;}

  .icon-btn{
    position:relative;
    flex:none;
    width:40px;
    height:40px;
    padding:0;
    display:flex;
    align-items:center;
    justify-content:center;
    background:var(--bgs-plate);
    border:1px solid rgba(var(--bgs-gold-rgb),0.18);
    border-radius:12px;
    color:var(--bgs-ivory-70);
    cursor:pointer;
    transition:border-color 0.15s ease, color 0.15s ease;
  }
  .icon-btn::before{
    content:"";
    position:absolute;
    inset:-4px;
  }
  .icon-btn:hover{border-color:var(--bgs-gold);color:var(--bgs-ivory);}
  .icon-btn.active{border-color:var(--bgs-gold);color:var(--bgs-gold);}
  .filter-badge{
    position:absolute;
    top:-5px;
    right:-5px;
    width:16px;
    height:16px;
    border-radius:50%;
    background:var(--bgs-gold);
    color:var(--bgs-bg);
    font-family:'IBM Plex Mono',monospace;
    font-size:9.5px;
    font-weight:700;
    display:flex;
    align-items:center;
    justify-content:center;
    box-shadow:0 0 0 2px var(--bgs-bg);
  }
  .filter-badge[hidden]{display:none;}

  .chips-row{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
    margin:0 0 16px;
  }
  .chips-row[hidden]{display:none;}
  .chip{
    display:inline-flex;
    align-items:center;
    gap:6px;
    background:rgba(var(--bgs-gold-rgb),0.16);
    border:1px solid rgba(var(--bgs-gold-rgb),0.4);
    color:var(--bgs-gold);
    font-family:'Inter',sans-serif;
    font-size:12.5px;
    font-weight:500;
    padding:5px 8px 5px 12px;
    border-radius:999px;
  }
  .chip button{
    background:none;
    border:none;
    color:inherit;
    font-size:13px;
    line-height:1;
    padding:2px;
    cursor:pointer;
    opacity:0.75;
  }
  .chip button:hover{opacity:1;}

  .filter-label{
    font-family:'IBM Plex Mono',monospace;
    font-size:11px;
    letter-spacing:0.08em;
    text-transform:uppercase;
    color:var(--bgs-gold-dim);
    margin-right:2px;
  }
  .pill{
    font-family:'Inter',sans-serif;
    font-size:13px;
    font-weight:500;
    color:var(--bgs-ivory-70);
    background:transparent;
    border:1px solid rgba(var(--bgs-ivory-rgb),0.22);
    border-radius:999px;
    padding:6px 13px;
    cursor:pointer;
    transition:all 0.15s ease;
  }
  .pill:hover{border-color:var(--bgs-gold);color:var(--bgs-ivory);}
  .pill.active{
    background:var(--bgs-gold);
    border-color:var(--bgs-gold);
    color:var(--bgs-bg);
    font-weight:600;
  }

  .sheet-scrim{
    position:fixed;
    inset:0;
    background:rgba(var(--bgs-bg-rgb),0.6);
    z-index:20;
    opacity:0;
    pointer-events:none;
    transition:opacity 0.28s ease;
  }
  .sheet-scrim.open{opacity:1;pointer-events:auto;}
  .filter-sheet{
    position:fixed;
    left:0;
    right:0;
    bottom:0;
    z-index:21;
    max-width:600px;
    margin:0 auto;
    max-height:78vh;
    display:flex;
    flex-direction:column;
    background:var(--bgs-plate);
    border:1px solid rgba(var(--bgs-gold-rgb),0.18);
    border-bottom:none;
    border-radius:22px 22px 0 0;
    box-shadow:0 -12px 32px -8px rgba(0,0,0,0.6);
    transform:translateY(100%);
    transition:transform 0.32s cubic-bezier(.32,.72,0,1);
  }
  .filter-sheet.open{transform:translateY(0);}
  .sheet-handle{
    width:36px;
    height:4px;
    border-radius:2px;
    background:rgba(var(--bgs-ivory-rgb),0.22);
    margin:12px auto 4px;
    flex:none;
  }
  .sheet-header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:8px 20px 14px;
    border-bottom:1px solid rgba(var(--bgs-ivory-rgb),0.10);
    flex:none;
  }
  .sheet-header h2{
    font-family:'Fraunces',serif;
    font-size:19px;
    font-weight:600;
    margin:0;
  }
  .reset-link{
    background:none;
    border:none;
    color:var(--bgs-gold);
    font-family:'IBM Plex Mono',monospace;
    font-size:11.5px;
    letter-spacing:0.06em;
    text-transform:uppercase;
    cursor:pointer;
    padding:6px;
  }
  .reset-link:hover{color:var(--bgs-ivory);}
  .sheet-body{
    overflow-y:auto;
    padding:18px 20px 8px;
  }
  .sheet-group{margin-bottom:26px;}
  .sheet-group .filter-label{display:block;margin-bottom:10px;}
  .sheet-group .segmented{display:flex;flex-wrap:wrap;gap:8px;}

  .range-wrap{
    position:relative;
    height:28px;
    margin:6px 2px 2px;
  }
  .range-track{
    position:absolute;
    top:50%;
    left:0;
    right:0;
    height:4px;
    border-radius:2px;
    background:rgba(var(--bgs-ivory-rgb),0.16);
    transform:translateY(-50%);
  }
  .range-fill{
    position:absolute;
    top:50%;
    height:4px;
    border-radius:2px;
    background:var(--bgs-gold);
    transform:translateY(-50%);
  }
  .range-input{
    position:absolute;
    top:0;
    left:0;
    width:100%;
    height:28px;
    margin:0;
    background:transparent;
    -webkit-appearance:none;
    appearance:none;
    pointer-events:none;
  }
  .range-input::-webkit-slider-runnable-track{background:transparent;height:28px;}
  .range-input::-moz-range-track{background:transparent;height:28px;}
  .range-input::-webkit-slider-thumb{
    -webkit-appearance:none;
    pointer-events:auto;
    width:20px;
    height:20px;
    margin-top:4px;
    border-radius:50%;
    background:var(--bgs-gold);
    border:2px solid var(--bgs-plate);
    box-shadow:0 1px 4px rgba(0,0,0,0.5);
    cursor:pointer;
  }
  .range-input::-moz-range-thumb{
    pointer-events:auto;
    width:20px;
    height:20px;
    border-radius:50%;
    background:var(--bgs-gold);
    border:2px solid var(--bgs-plate);
    box-shadow:0 1px 4px rgba(0,0,0,0.5);
    cursor:pointer;
  }
  .number-cue-row{
    position:relative;
    height:12px;
    font-family:'IBM Plex Mono',monospace;
    font-size:9.5px;
    color:var(--bgs-ivory-70);
    opacity:0.55;
    margin:0 2px;
  }
  .number-cue-row span{
    position:absolute;
    top:0;
    transform:translateX(-50%);
    white-space:nowrap;
  }
  .number-cue-row span.active{color:var(--bgs-gold);font-weight:600;opacity:1;}

  .toggle-row{
    display:flex;
    align-items:center;
    gap:12px;
    margin-top:16px;
    background:none;
    border:none;
    padding:0;
    cursor:pointer;
  }
  .toggle-switch{
    position:relative;
    flex:none;
    width:34px;
    height:20px;
    border-radius:999px;
    background:rgba(var(--bgs-ivory-rgb),0.16);
    border:1px solid rgba(var(--bgs-ivory-rgb),0.22);
    transition:background 0.15s ease,border-color 0.15s ease;
  }
  .toggle-switch::after{
    content:"";
    position:absolute;
    top:1px;
    left:1px;
    width:16px;
    height:16px;
    border-radius:50%;
    background:var(--bgs-ivory-70);
    transition:transform 0.15s ease,background 0.15s ease;
  }
  .toggle-row[aria-checked="true"] .toggle-switch{
    background:var(--bgs-gold);
    border-color:var(--bgs-gold);
  }
  .toggle-row[aria-checked="true"] .toggle-switch::after{
    transform:translateX(14px);
    background:var(--bgs-bg);
  }
  .toggle-label{
    font-family:'Inter',sans-serif;
    font-size:13px;
    font-weight:500;
    color:var(--bgs-ivory);
    transition:color 0.15s ease;
  }
  /* Active state: the label goes gold with the switch, so a toggle reads as on
     from the text as well as the track. Labels stay a fixed phrase — swapping
     the wording to describe the state made the label do the switch's job and
     read as a button. */
  .toggle-row[aria-checked="true"] .toggle-label{
    color:var(--bgs-gold);
  }

  .sheet-footer{
    flex:none;
    padding:14px 20px calc(14px + env(safe-area-inset-bottom));
    border-top:1px solid rgba(var(--bgs-ivory-rgb),0.10);
  }
  .apply-btn{
    width:100%;
    background:var(--bgs-gold);
    color:var(--bgs-bg);
    border:none;
    border-radius:12px;
    font-family:'Inter',sans-serif;
    font-size:15px;
    font-weight:600;
    padding:13px;
    cursor:pointer;
  }
  .apply-btn:hover{filter:brightness(1.06);}

  @media (prefers-reduced-motion:reduce){
    .sheet-scrim, .filter-sheet{transition:none;}
  }

  .shelf-count{
    font-family:'IBM Plex Mono',monospace;
    font-size:12px;
    color:var(--bgs-gold-dim);
    margin:0 0 14px;
  }

  .shelf{
    display:grid;
    grid-template-columns:repeat(3, 1fr);
    gap:10px;
    min-height:260px;
  }
  @media (min-width:560px){ .shelf{ grid-template-columns:repeat(4, 1fr); gap:14px; } }
  @media (min-width:800px){ .shelf{ grid-template-columns:repeat(6, 1fr); gap:16px; } }
  .empty-state{
    font-family:'Inter',sans-serif;
    color:var(--bgs-ivory-70);
    font-size:14px;
    padding:60px 10px;
    width:100%;
    text-align:center;
    grid-column:1 / -1;
  }

  .game-card{
    border-radius:10px;
    overflow:hidden;
    background:var(--bgs-plate);
    box-shadow:0 3px 10px rgba(0,0,0,.35);
    display:flex;
    flex-direction:column;
    transition:transform .15s ease;
    cursor:pointer;
    border:none;
    padding:0;
    text-align:left;
    font:inherit;
    color:inherit;
    position:relative;
  }
  .game-card:hover{ transform:translateY(-2px); }

  .game-card .art{
    aspect-ratio:3/4;
    width:100%;
    overflow:hidden;
    background:var(--bgs-plate);
    position:relative;
  }
  .game-card .art img{ width:100%; height:100%; object-fit:cover; display:block; }

  .game-card .plate-body{
    padding:8px 8px 9px;
    display:flex;
    flex-direction:column;
    gap:6px;
  }
  .game-card .title{
    font-family:'Fraunces',serif;
    font-weight:600;
    font-size:12.5px;
    line-height:1.24;
    color:var(--bgs-ivory);
    margin:0;
    display:-webkit-box;
    -webkit-line-clamp:2;
    -webkit-box-orient:vertical;
    overflow:hidden;
  }
  .game-card .meta-row{ display:flex; align-items:center; justify-content:space-between; gap:4px; }
  .game-card .rating-pill{
    display:inline-flex; align-items:center; gap:3px;
    background:rgba(0,0,0,.3);
    border:1px solid rgba(var(--bgs-gold-rgb),.35);
    border-radius:20px;
    padding:2px 6px 2px 5px;
    font-size:10.5px; font-weight:700;
    color:var(--bgs-gold);
    white-space:nowrap;
  }
  .game-card .players{ font-size:10px; color:var(--bgs-ivory-45); font-weight:500; white-space:nowrap; }

  @keyframes shimmer{
    0%{background-position:150% 0;}
    100%{background-position:-50% 0;}
  }
  .game-card-skeleton{
    cursor:default;
    pointer-events:none;
  }
  .game-card-skeleton .art{
    background:linear-gradient(100deg, var(--bgs-plate) 30%, rgba(var(--bgs-ivory-rgb),0.08) 50%, var(--bgs-plate) 70%);
    background-size:250% 100%;
    animation:shimmer 1.7s ease-in-out infinite;
  }
  .game-card-skeleton:nth-child(6n+2) .art{animation-delay:0.15s;}
  .game-card-skeleton:nth-child(6n+3) .art{animation-delay:0.3s;}
  .game-card-skeleton:nth-child(6n+4) .art{animation-delay:0.45s;}
  .game-card-skeleton:nth-child(6n+5) .art{animation-delay:0.6s;}
  .game-card-skeleton:nth-child(6n) .art{animation-delay:0.75s;}
  .game-card-skeleton .skeleton-line{
    height:8px;
    border-radius:4px;
    background:rgba(var(--bgs-ivory-rgb),0.08);
  }
  .game-card-skeleton .skeleton-line.short{ width:60%; }


  footer{
    max-width:960px;
    margin:40px auto 0;
    font-family:'IBM Plex Mono',monospace;
    text-align:center;
  }
  footer .primary{
    font-size:12px;
    letter-spacing:0.015em;
    color:var(--bgs-gold-dim);
    margin:0 0 7px;
    line-height:1.55;
  }
  footer .secondary{
    font-size:11px;
    letter-spacing:0.015em;
    color:rgba(var(--bgs-gold-rgb),0.4);
    margin:0;
    line-height:1.55;
  }

  /* ==== Game Night (Stage 1: session creation) ==== */

  /* Floating entry point, bottom-centre. z-index 12 keeps it under the selection
     bar (15), tray (14), and scrim (13), and well under the filter sheet (21)
     and detail modal (30) — it can never sit on top of a sheet or modal. */
  .gn-fab{
    position:fixed;
    left:50%;
    bottom:calc(16px + env(safe-area-inset-bottom));
    /* Centered. translateX lives here as the base transform; every other
       transform on this element must include it or the pill jumps left. */
    transform:translateX(-50%);
    z-index:12;
    display:inline-flex;
    align-items:center;
    gap:8px;
    height:46px;
    padding:0 18px 0 15px;
    /* Tinted glass. Tint stays >= .82: gold text is lower-contrast than ivory,
       and .82 is where it clears 4.5:1 over a white cover (4.87:1). */
    background:rgba(var(--bgs-plate-rgb),0.82);
    -webkit-backdrop-filter:blur(16px) saturate(1.2);
    backdrop-filter:blur(16px) saturate(1.2);
    border:1.5px solid rgba(var(--bgs-gold-rgb),0.55);
    border-radius:999px;
    color:var(--bgs-gold);
    font-family:'Inter',sans-serif;
    font-size:13.5px;
    font-weight:700;
    letter-spacing:0.01em;
    cursor:pointer;
    white-space:nowrap;
    box-shadow:0 1px 0 rgba(var(--bgs-ivory-rgb),0.08) inset,
               0 8px 24px -10px rgba(0,0,0,0.7);
    transition:transform 0.18s cubic-bezier(.2,.8,.3,1), opacity 0.18s ease, border-color 0.18s ease;
  }
  .gn-fab:hover{border-color:var(--bgs-gold);}
  .gn-fab:active{transform:translateX(-50%) scale(0.95);}
  .gn-fab svg{width:17px;height:17px;flex:none;}
  /* Solid plate when blur isn't available or the OS asks for less transparency. */
  @supports not (backdrop-filter:blur(1px)){
    .gn-fab{background:var(--bgs-plate);}
  }
  @media (prefers-reduced-transparency:reduce){
    .gn-fab{
      background:var(--bgs-plate);
      -webkit-backdrop-filter:none;backdrop-filter:none;
    }
  }
  .gn-fab:focus-visible{outline:2px solid var(--bgs-gold);outline-offset:3px;}
  /* Selection mode hands off to the bottom bar — the pill animates down and out. */
  body.gn-selecting .gn-fab{
    opacity:0;
    transform:translateX(-50%) translateY(14px) scale(0.9);
    pointer-events:none;
  }

  /* Random: icon FAB that lives above the bar while selecting. Same glass
     recipe as .gn-fab. z-index 14 = the tray's layer, under the bar (15). */
  .gn-random-fab{
    position:fixed;right:16px;
    bottom:calc(64px + 14px + env(safe-area-inset-bottom)); /* bar min-height + gap */
    z-index:14;
    display:inline-flex;align-items:center;gap:0;height:46px;padding:0 14px;
    background:rgba(var(--bgs-plate-rgb),0.82);
    -webkit-backdrop-filter:blur(16px) saturate(1.2);backdrop-filter:blur(16px) saturate(1.2);
    border:1.5px solid rgba(var(--bgs-gold-rgb),0.55);border-radius:999px;
    color:var(--bgs-gold);font-family:'Inter',sans-serif;font-size:13.5px;font-weight:700;
    white-space:nowrap;cursor:pointer;
    box-shadow:0 1px 0 rgba(var(--bgs-ivory-rgb),0.08) inset,0 8px 24px -10px rgba(0,0,0,0.7);
    opacity:0;transform:translateY(14px) scale(0.9);pointer-events:none;
    transition:opacity 0.2s ease,transform 0.24s cubic-bezier(.2,.8,.3,1),gap 0.3s ease,padding 0.3s ease;
  }
  .gn-random-fab svg{width:18px;height:18px;flex:none;}
  .gn-random-fab .lbl{max-width:0;overflow:hidden;opacity:0;transition:max-width 0.3s ease,opacity 0.2s ease;}
  /* Arrives as the wave settles, not with it. */
  body.gn-selecting .gn-random-fab{opacity:1;transform:none;pointer-events:auto;transition-delay:0.42s,0.42s,0s,0s;}
  /* On entry the label is written out for ~2s, then collapses to the icon. */
  .gn-random-fab.labelled{gap:8px;padding:0 18px 0 14px;}
  .gn-random-fab.labelled .lbl{max-width:70px;opacity:1;}
  .gn-random-fab:active{transform:scale(0.95);}
  .gn-random-fab:focus-visible{outline:2px solid var(--bgs-gold);outline-offset:3px;}
  @supports not (backdrop-filter:blur(1px)){.gn-random-fab{background:var(--bgs-plate);}}
  @media (prefers-reduced-transparency:reduce){
    .gn-random-fab{background:var(--bgs-plate);-webkit-backdrop-filter:none;backdrop-filter:none;}
  }

  .gn-toast{
    position:fixed;
    left:50%;
    /* Clears the floating pill (46px tall at a 16px offset) so the toast
       never lands on top of the control that raises it. */
    bottom:calc(78px + env(safe-area-inset-bottom));
    transform:translateX(-50%) translateY(8px);
    z-index:50;
    background:var(--bgs-plate);
    border:1px solid rgba(var(--bgs-gold-rgb),0.35);
    color:var(--bgs-ivory);
    font-family:'Inter',sans-serif;
    font-size:13px;
    font-weight:500;
    padding:12px 18px;
    border-radius:12px;
    box-shadow:0 8px 24px -6px rgba(0,0,0,0.6);
    opacity:0;
    pointer-events:none;
    transition:opacity 0.2s ease, transform 0.2s ease;
  }

  body.gn-selecting.gn-waving .checkbox,

  @keyframes gn-ring-pass{0%{border-color:transparent;}35%{border-color:rgba(var(--bgs-gold-rgb),0.9);}100%{border-color:transparent;}}

  /* ---- selected-games tray ---- */

  .gn-tray{

</style>

<script type="module">
import {
  DEFAULT_FILTERS, isFilterActive, activeGroupCount, playersLabel,
  timeBucket, playersMatch, bestFitMatch, applyFilters,
  weightLabel, timeLabel, playersRangeLabel
} from './js/filters.js';
import { createGameModal } from './js/game-modal.js';
import { registerOverlay, syncScrollLock } from './js/scroll-lock.js';

// ---- Game Night feature flag ----
// Live: every visitor gets the Game Night pill. All four stages — session
// creation, waiting room, swipe voting, results — are merged and working, so
// the flag is now a kill switch rather than a curtain. Set it back to false to
// pull the feature without reverting anything; ?gamenight=1 still reveals it
// while it is off.
const GAME_NIGHT_ENABLED = true;
const gameNightVisible =
  GAME_NIGHT_ENABLED || new URLSearchParams(location.search).has('gamenight');

let games = [];

async function loadGames(){
  const res = await fetch('/games.json');
  if(!res.ok) throw new Error('Failed to load games');
  games = await res.json();
}
const state = {
  filters: { ...DEFAULT_FILTERS },
  search: "",
  sort: "off", // 'off' (ascending, default) | 'desc'
  selectionMode: false,
  selectedIds: new Set(), // bggId strings, in selection order — persists across filter changes
};
let draftFilters = { ...DEFAULT_FILTERS };


function render(){
  const shelf = document.getElementById('shelf');
  const countEl = document.getElementById('shelf-count');
  shelf.innerHTML = "";

  let filtered = applyFilters(games, state.filters, state.search);
  filtered = filtered.slice().sort((a,b)=> state.sort==="desc" ? a.bggRating - b.bggRating : b.bggRating - a.bggRating);

  countEl.textContent = `${filtered.length} of ${games.length} on the shelf`;

  // Cached for the tray's "hidden by filters" tags. Only what's *filtered* can
  // change it, and every such change comes through here — so selection toggles
  // never need to re-run applyFilters.
  gnFilteredIds = new Set(filtered.map(g => g.bggId));

  updateFilterButton();
  renderChips();

  if(filtered.length===0){
    shelf.innerHTML = `<p class="empty-state">Nothing fits that combo. Try loosening a filter.</p>`;
    if(gameNightVisible && state.selectionMode) updateGnBar();
    return;
  }

  filtered.forEach(g=>{
    const el = document.createElement('button');
    const isSelected = gameNightVisible && state.selectedIds.has(g.bggId);
    el.className = 'game-card' + (isSelected ? ' selected' : '');
    el.dataset.id = g.bggId;
    el.innerHTML = `
      ${gameNightVisible ? '<span class="sel-ring"></span>' : ''}
      <div class="art">
        ${gameNightVisible ? `<span class="checkbox">${GN_CHECK_SVG}</span><span class="info-btn" data-gn-info role="button" aria-label="${g.title} details"><i>i</i></span>` : ''}
        <img src="${g.image}" alt="${g.title} cover" loading="lazy" decoding="async" onerror="this.closest('.art').style.background='var(--bgs-plate)';this.remove()">
      </div>
      <div class="plate-body">
        <h3 class="title">${g.title}</h3>
        <div class="meta-row">
          <span class="rating-pill">★ ${g.bggRating.toFixed(1)}</span>
          <span class="players">${playersRangeLabel(g.players)}</span>
        </div>
      </div>
    `;
    el.addEventListener('click', (ev)=>{
      if(gameNightVisible && state.selectionMode){
        if(ev.target.closest('[data-gn-info]')){ openCard(g); return; }
        toggleSelect(g);
        return;
      }
      openCard(g);
    });
    shelf.appendChild(el);
  });

  // Filters/search stay live while selecting; selections persist regardless,
  // so the tray's "hidden by filters" tags need to stay in sync with every
  // re-render, not just the ones that came from toggling a selection.
  if(gameNightVisible && state.selectionMode) updateGnBar();
}

// The detail modal itself lives in js/game-modal.js + css/game-modal.css, shared
// with the game-night waiting room so an enhancement to it lands on every page.
// The deck button is only wired up in game-night builds; CSS keeps it hidden
// until selection mode is actually entered.
const gameModal = createGameModal(gameNightVisible ? {
  selection: {
    isSelected: g => state.selectedIds.has(g.bggId),
    toggle: toggleSelect,
  },
} : {});

function openCard(g){
  gameModal.open(g);
}

function closeDetailModal(){
  gameModal.close();
}

// ---- Filter/sort bar: badge + chips ----

function updateFilterButton(){
  const btn = document.getElementById('filterBtn');
  const badge = document.getElementById('filterBadge');
  const count = activeGroupCount(state.filters);
  const active = count > 0;
  btn.classList.toggle('active', active);
  if(active){
    badge.hidden = false;
    badge.textContent = String(count);
  } else {
    badge.hidden = true;
  }
}

function renderChips(){
  const row = document.getElementById('chipsRow');
  const chips = [];
  if(state.filters.minPlayers !== 1 || state.filters.maxPlayers !== 11){
    chips.push({ key:'players', label:`${playersLabel(state.filters)} players` });
  }
  if(state.filters.time !== 'any'){
    const labels = { quick:'Quick', medium:'Medium', long:'Long' };
    chips.push({ key:'time', label: labels[state.filters.time] });
  }
  if(state.filters.weight !== 'any'){
    const labels = { light:'Light', medium:'Medium', heavy:'Heavy' };
    chips.push({ key:'weight', label: labels[state.filters.weight] });
  }
  if(state.filters.bestFit){
    chips.push({ key:'bestFit', label: 'Recommended counts only' });
  }
  if(chips.length===0){
    row.hidden = true;
    row.innerHTML = '';
    return;
  }
  row.hidden = false;
  row.innerHTML = chips.map(c=>`
    <span class="chip" data-key="${c.key}">
      ${c.label}
      <button type="button" aria-label="Remove ${c.label} filter">✕</button>
    </span>
  `).join('');
  row.querySelectorAll('.chip button').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const key = btn.closest('.chip').dataset.key;
      if(key==='players'){ state.filters.minPlayers = 1; state.filters.maxPlayers = 11; }
      else if(key==='bestFit'){ state.filters.bestFit = false; }
      else state.filters[key] = 'any';
      render();
    });
  });
}

// ---- Filter sheet ----

const filterSheet = document.getElementById('filterSheet');
const sheetScrim = document.getElementById('sheetScrim');
const rangeMin = document.getElementById('rangeMin');
const rangeMax = document.getElementById('rangeMax');
const rangeFill = document.getElementById('rangeFill');
const numberCueRow = document.getElementById('numberCueRow');
const playersGroupLabel = document.getElementById('playersGroupLabel');
const applyBtn = document.getElementById('applyBtn');
const bestFitToggle = document.getElementById('bestFitToggle');

function syncSheetUI(){
  rangeMin.value = draftFilters.minPlayers;
  rangeMax.value = draftFilters.maxPlayers;
  document.querySelectorAll('.segmented').forEach(group=>{
    const type = group.dataset.type;
    group.querySelectorAll('.pill').forEach(p=>{
      const isActive = p.dataset.value === draftFilters[type];
      p.classList.toggle('active', isActive);
      p.setAttribute('aria-pressed', String(isActive));
    });
  });
  bestFitToggle.setAttribute('aria-checked', String(draftFilters.bestFit));
  updateLiveCount();
}

function updateLiveCount(){
  const pct = v => ((v-1)/(11-1))*100;
  rangeFill.style.left = pct(draftFilters.minPlayers)+'%';
  rangeFill.style.width = (pct(draftFilters.maxPlayers)-pct(draftFilters.minPlayers))+'%';
  numberCueRow.querySelectorAll('span').forEach(s=>{
    const n = parseInt(s.dataset.n,10);
    s.classList.toggle('active', n>=draftFilters.minPlayers && n<=draftFilters.maxPlayers);
  });
  playersGroupLabel.textContent = `Players — ${playersLabel(draftFilters)}`;
  const liveCount = applyFilters(games, draftFilters, state.search).length;
  applyBtn.textContent = `Show ${liveCount} game${liveCount===1?'':'s'}`;
}

function clampRange(){
  let min = parseInt(rangeMin.value,10);
  let max = parseInt(rangeMax.value,10);
  if(min > max){
    if(document.activeElement === rangeMin) max = min; else min = max;
    rangeMin.value = min;
    rangeMax.value = max;
  }
  draftFilters.minPlayers = min;
  draftFilters.maxPlayers = max;
  updateLiveCount();
}
rangeMin.addEventListener('input', clampRange);
rangeMax.addEventListener('input', clampRange);

bestFitToggle.addEventListener('click', ()=>{
  draftFilters.bestFit = !draftFilters.bestFit;
  bestFitToggle.setAttribute('aria-checked', String(draftFilters.bestFit));
  updateLiveCount();
});

document.querySelectorAll('.segmented').forEach(group=>{
  group.addEventListener('click', (e)=>{
    const btn = e.target.closest('.pill');
    if(!btn) return;
    const type = group.dataset.type;
    group.querySelectorAll('.pill').forEach(p=>{
      p.classList.remove('active');
      p.setAttribute('aria-pressed','false');
    });
    btn.classList.add('active');
    btn.setAttribute('aria-pressed','true');
    draftFilters[type] = btn.dataset.value;
    updateLiveCount();
  });
});

let sheetLastFocused = null;
function getFocusable(){
  return Array.from(filterSheet.querySelectorAll('button, input, [tabindex]:not([tabindex="-1"])'))
    .filter(el => !el.disabled && el.offsetParent !== null);
}
function openSheet(){
  draftFilters = { ...state.filters };
  syncSheetUI();
  sheetLastFocused = document.activeElement;
  sheetScrim.classList.add('open');
  filterSheet.classList.add('open');
  document.getElementById('filterBtn').setAttribute('aria-expanded','true');
  syncScrollLock();
  const focusable = getFocusable();
  if(focusable.length) focusable[0].focus();
}
function closeSheet(){
  sheetScrim.classList.remove('open');
  filterSheet.classList.remove('open');
  document.getElementById('filterBtn').setAttribute('aria-expanded','false');
  syncScrollLock();
  if(sheetLastFocused) sheetLastFocused.focus();
}
function isSheetOpen(){
  return filterSheet.classList.contains('open');
}
registerOverlay(isSheetOpen);

document.getElementById('filterBtn').addEventListener('click', openSheet);
sheetScrim.addEventListener('click', closeSheet);
document.getElementById('resetLink').addEventListener('click', ()=>{
  draftFilters = { ...DEFAULT_FILTERS };
  syncSheetUI();
});
applyBtn.addEventListener('click', ()=>{
  state.filters = { ...draftFilters };
  closeSheet();
  render();
});

document.addEventListener('keydown', (e)=>{
  if(e.key !== 'Escape' && e.key !== 'Tab') return;
  if(!isSheetOpen()) return;
  if(e.key === 'Escape'){
    closeSheet();
    return;
  }
  // focus trap
  const focusable = getFocusable();
  if(!focusable.length) return;
  const first = focusable[0];
  const last = focusable[focusable.length-1];
  if(e.shiftKey && document.activeElement === first){
    e.preventDefault();
    last.focus();
  } else if(!e.shiftKey && document.activeElement === last){
    e.preventDefault();
    first.focus();
  }
});

// ---- Sort button ----

const sortBtn = document.getElementById('sortBtn');
const sortIcon = document.getElementById('sortIcon');
sortBtn.addEventListener('click', ()=>{
  state.sort = state.sort === 'off' ? 'desc' : 'off';
  const isDesc = state.sort === 'desc';
  sortBtn.classList.toggle('active', isDesc);
  sortBtn.setAttribute('aria-pressed', String(isDesc));
  sortBtn.setAttribute('aria-label', isDesc ? 'Sort descending' : 'Sort ascending');
  sortIcon.style.transform = isDesc ? 'rotate(180deg)' : 'rotate(0deg)';

});

const searchInput = document.getElementById('search');

  searchClear.hidden = searchInput.value.length === 0;
}

searchInput.addEventListener('input', (e)=>{

searchClear.addEventListener('click', ()=>{

});

// ==== Game Night (Stage 1: session creation) ====
// Selection happens inside this shelf: same cards, same filters, same search,
// same applyFilters — no second filter UI, no second card component.

const GN_MIN_POOL = 2;
const GN_SURPRISE_COUNT = 6;
const GN_MIN_SELECT = 2;

const GN_CHECK_SVG = '<svg viewBox="0 0 24 24" fill="none" stroke="#241A10" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>';
const GN_CHEV_SVG  = '<svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>';
const GN_X_SVG      = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>';
const GN_DIE_SVG    = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="4"/><circle cx="8.5" cy="8.5" r="1.4" fill="currentColor" stroke="none"/><circle cx="12" cy="12" r="1.4" fill="currentColor" stroke="none"/><circle cx="15.5" cy="15.5" r="1.4" fill="currentColor" stroke="none"/></svg>';
// Tilted five-face with motion arcs, so it reads as "roll" rather than repeating
// the Game Night mark.
const GN_ROLL_SVG   = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><g transform="rotate(-18 13 13)"><rect x="6" y="6" width="14" height="14" rx="3.2"/><circle cx="9.6" cy="9.6" r="1.2" fill="currentColor" stroke="none"/><circle cx="16.4" cy="9.6" r="1.2" fill="currentColor" stroke="none"/><circle cx="13" cy="13" r="1.2" fill="currentColor" stroke="none"/><circle cx="9.6" cy="16.4" r="1.2" fill="currentColor" stroke="none"/><circle cx="16.4" cy="16.4" r="1.2" fill="currentColor" stroke="none"/></g><path d="M3 9.5a9 9 0 0 1 1.6-3.2" opacity=".7"/><path d="M2.2 13.5a10 10 0 0 1 .2-2.2" opacity=".45"/></svg>';

// Ephemeral flow state that doesn't belong on `state` (selectionMode/selectedIds
// do, per spec — this is just which path we're on and the surprise sample).
const gnState = { mode: null, surprisePool: [], revealDeck: false };

// Built in initGameNight(), but enter/exitSelectionMode need them from here.
let gnWave = null;
let gnRandomBtn = null;

let gnSessionModPromise = null;

function gnPool(){
  return applyFilters(games, state.filters, state.search);
}

// Kept in sync by render(); see the note there.
let gnFilteredIds = new Set();

function gnFilteredIdSet(){
  return gnFilteredIds;
}

// Null when the game is filtered out of the current view — selections persist
// across filter changes, so every caller has to tolerate that.
function cardNodeFor(id){
  return document.getElementById('shelf').querySelector(`.game-card[data-id="${id}"]`);
}

function clearSelectedCards(){
  document.getElementById('shelf')
    .querySelectorAll('.game-card.selected')
    .forEach(el => el.classList.remove('selected'));
}

// Deliberately does NOT call render(): selecting a game changes neither what
// matches the filters nor the order, so rebuilding the grid would only throw
// away the cover images and the scroll position.
function toggleSelect(g){
  const nowSelected = !state.selectedIds.has(g.bggId);
  if(nowSelected) state.selectedIds.add(g.bggId);
  else state.selectedIds.delete(g.bggId);
  cardNodeFor(g.bggId)?.classList.toggle('selected', nowSelected);
  updateGnBar();
  gameModal.refreshFooter();
}


function showGnToast(msg){
  const toast = document.getElementById('gnToast');
  toast.textContent = msg;
  toast.classList.add('open');
  clearTimeout(showGnToast._t);
  showGnToast._t = setTimeout(()=> toast.classList.remove('open'), 2600);
}

function openGnBackdrop(el){
  el.classList.add('open');
  syncScrollLock();
}
function closeGnBackdrop(el){
  el.classList.remove('open');
  syncScrollLock();
}

function sampleN(arr, n){
  const copy = arr.slice();
  for(let i = copy.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [copy[i], copy[j]] = [copy[j], copy[i]];
  }
  return copy.slice(0, n);
}

function currentGnGameIds(){
  return gnState.mode === 'random'
    ? gnState.surprisePool.map(g => g.bggId)
    : Array.from(state.selectedIds);
}

// ---- selection mode: bottom bar + tray ----

// The cards carry their checkbox and info button whenever gameNightVisible is
// true; only `body.gn-selecting` decides whether they show. So switching modes
// is a body-class flip, not a re-render.
// Wavefront speed, px/s — the one knob for the entrance. It sets both how fast the
// ring travels and how far apart the card pops are staggered, which is what keeps
// the two in step. 1900 lands the top corners of a phone viewport at ~0.44s.
const GN_WAVE_SPEED = 1900;
const GN_RANDOM_LABEL_MS = 2200;

// Half the wave dot's 12px, i.e. its radius at scale 1.
const GN_WAVE_DOT_R = 6;

function primeGnWave(){
  const origin = document.getElementById('gnStartBtn');
  if(!origin) return;
  const r = origin.getBoundingClientRect();
  const ox = r.left + r.width / 2, oy = r.top + r.height / 2;

  document.querySelectorAll('.game-card').forEach(card => {
    const b = card.getBoundingClientRect();
    // Offscreen cards snap in so scrolling never reveals a half-finished animation.
    if(b.bottom < 0 || b.top > window.innerHeight){ card.style.setProperty('--gn-d', '0s'); return; }
    const d = Math.hypot(b.left + b.width / 2 - ox, b.top + b.height / 2 - oy);
    card.style.setProperty('--gn-d', (d / GN_WAVE_SPEED).toFixed(3) + 's');
  });
}

// The ring expands at GN_WAVE_SPEED — the same px/s the card stagger uses — so the
// wavefront and the pops it sets off stay in step. It stops at the furthest
// viewport corner: going further only stretches the border into a smear. A fixed
// scale and duration cleared a phone screen in about 100ms, three times ahead of
// the ripple and gone before it registered.
function startGnWave(){
  if(!gnWave) return;
  gnWave.getAnimations().forEach(a => a.cancel());
  if(window.matchMedia('(prefers-reduced-motion:reduce)').matches) return;

  const origin = document.getElementById('gnStartBtn');
  if(!origin) return;
  const r = origin.getBoundingClientRect();
  const ox = r.left + r.width / 2, oy = r.top + r.height / 2;
  const reach = Math.max(
    Math.hypot(ox, oy), Math.hypot(window.innerWidth - ox, oy),
    Math.hypot(ox, window.innerHeight - oy), Math.hypot(window.innerWidth - ox, window.innerHeight - oy)
  );

  gnWave.animate(
    [
      { transform: 'scale(1)', opacity: 0.9, borderWidth: '2px' },
      { opacity: 0.5, offset: 0.55 },
      { transform: `scale(${(reach / GN_WAVE_DOT_R).toFixed(1)})`, opacity: 0, borderWidth: '0.5px' },
    ],
    { duration: (reach / GN_WAVE_SPEED) * 1000, easing: 'linear', fill: 'forwards' }
  );
}

function enterSelectionMode(){
  state.selectionMode = true;
  primeGnWave();                       // measure before the class flip
  document.body.classList.add('gn-selecting', 'gn-waving');
  startGnWave();
  clearTimeout(enterSelectionMode._wave);
  enterSelectionMode._wave = setTimeout(()=>document.body.classList.remove('gn-waving'), 800);
  if(gnRandomBtn){
    gnRandomBtn.classList.add('labelled');
    clearTimeout(enterSelectionMode._label);
    enterSelectionMode._label = setTimeout(()=>gnRandomBtn.classList.remove('labelled'), GN_RANDOM_LABEL_MS);
  }
  updateGnBar();
}

function exitSelectionMode(){
  state.selectionMode = false;
  state.selectedIds.clear();
  clearSelectedCards();
  clearTimeout(enterSelectionMode._wave);
  clearTimeout(enterSelectionMode._label);
  document.body.classList.remove('gn-selecting', 'gn-waving');
  if(gnWave) gnWave.getAnimations().forEach(a => a.cancel());
  if(gnRandomBtn) gnRandomBtn.classList.remove('labelled');
  gnState.mode = null;
  closeGnTray();
  updateGnBar();
}

function openGnTray(){ document.body.classList.add('gn-tray-open'); syncScrollLock(); }
function closeGnTray(){ document.body.classList.remove('gn-tray-open'); syncScrollLock(); }

// The chooser, surprise, and confirm dialogs share one predicate — only ever
// one is open, and which of them it is makes no difference to the lock.
registerOverlay(() => document.querySelector('.gn-backdrop.open') !== null);
registerOverlay(() => document.body.classList.contains('gn-tray-open'));

function updateGnBar(){
  const n = state.selectedIds.size;
  const hint = n < GN_MIN_SELECT ? `Pick at least ${GN_MIN_SELECT - n} more` : 'Ready to go';
  const btn = document.getElementById('gnBarCount');
  // Always shown, including at zero, so the bar states the target up front
  // rather than appearing only once the host has already guessed at it. The
  // button still disables at zero — there's no tray to open — and the CSS
  // hides the chevron in that state so it reads as a label, not an affordance.
  btn.innerHTML = `
    <span class="count-line">${n} selected${GN_CHEV_SVG}</span>
    <small>${hint}</small>
  `;
  btn.disabled = n === 0;
  document.getElementById('gnBarContinue').disabled = n < GN_MIN_SELECT;
  if(n === 0) closeGnTray();
  renderGnTray();
}

function renderGnTray(){
  const list = document.getElementById('gnTrayList');
  const visible = gnFilteredIdSet();
  const ids = Array.from(state.selectedIds);
  list.innerHTML = ids.map(id => {
    const g = games.find(x => x.bggId === id);
    if(!g) return '';
    const off = visible.has(id) ? '' : '<span class="gn-tray__offscreen">hidden by filters</span>';
    return `
      <div class="gn-tray__row">
        <div class="gn-tray__thumb"><img src="${g.image}" alt="" loading="lazy" onerror="this.remove()"></div>
        <div class="gn-tray__meta">
          <b>${g.title}</b>
          <span>${playersRangeLabel(g.players)} · ${timeLabel(g.time)}</span>${off}
        </div>
        <button class="gn-tray__remove" type="button" data-remove="${id}" aria-label="Remove ${g.title}">${GN_X_SVG}</button>
      </div>
    `;
  }).join('');
  list.querySelectorAll('[data-remove]').forEach(btn => {
    btn.addEventListener('click', ()=>{
      const id = btn.dataset.remove;
      state.selectedIds.delete(id);
      cardNodeFor(id)?.classList.remove('selected');
      updateGnBar();
      gameModal.refreshFooter();
    });
  });
}

// ---- surprise-us path ----

function sampleSurprise(){
  const pool = gnPool();
  gnState.surprisePool = sampleN(pool, Math.min(GN_SURPRISE_COUNT, pool.length));
}

function renderSurprise(){
  const grid = document.getElementById('gnSurpriseGrid');
  grid.innerHTML = gnState.surprisePool.map(g => `
    <div class="gn-surprise-card">
      <div class="art"><img src="${g.image}" alt="${g.title} cover" loading="lazy" onerror="this.remove()"></div>
      <div class="t">${g.title}</div>
    </div>
  `).join('');
  const n = gnState.surprisePool.length;
  document.getElementById('gnSurpriseSub').textContent =
    `${n} game${n === 1 ? '' : 's'} picked at random from your filtered shelf.`;
}

// ---- confirm step (both paths converge here) ----

function syncRevealToggleUI(){
  const toggle = document.getElementById('gnRevealToggle');
  // The label is a fixed phrase; aria-checked carries the state, which is what
  // both the gold active styling and screen readers read it from.
  toggle.setAttribute('aria-checked', String(gnState.revealDeck));
}

function updateConfirmSummary(){
  const n = currentGnGameIds().length;
  const modeLabel = gnState.mode === 'random' ? 'Random picks' : 'You picked them';
  document.getElementById('gnSummary').textContent = `${n} game${n === 1 ? '' : 's'} · ${modeLabel}`;
}

function openConfirm(){
  const errorEl = document.getElementById('gnConfirmError');
  errorEl.classList.remove('show');
  const revealField = document.getElementById('gnRevealField');
  if(gnState.mode === 'random'){
    revealField.hidden = true;
    gnState.revealDeck = false;
  } else {
    revealField.hidden = false;
    syncRevealToggleUI();
  }
  updateConfirmSummary();
  openGnBackdrop(document.getElementById('gnConfirmBackdrop'));
  document.getElementById('gnHostName').focus();
}

async function handleGnStart(){
  const nameInput = document.getElementById('gnHostName');
  const hostName = nameInput.value.trim();
  const errorEl = document.getElementById('gnConfirmError');
  if(!hostName){
    errorEl.textContent = 'Enter your name to continue.';
    errorEl.classList.add('show');
    nameInput.focus();
    return;
  }
  const mode = gnState.mode === 'random' ? 'random' : 'manual';
  const gameIds = currentGnGameIds();
  const revealDeck = mode === 'random' ? false : gnState.revealDeck;

  const startBtn = document.getElementById('gnConfirmStart');
  errorEl.classList.remove('show');
  startBtn.disabled = true;
  startBtn.textContent = 'Starting…';
  try {
    const { createGameNight } = await gnSessionModPromise;
    const code = await createGameNight({ hostName, mode, revealDeck, gameIds });
    sessionStorage.setItem(`gamenight:${code}:name`, hostName);
    location.href = `/night/${code}/host`;
  } catch (err) {
    errorEl.textContent = "Couldn't start the game night. Try again.";
    errorEl.classList.add('show');
    startBtn.disabled = false;
    startBtn.textContent = 'Start Game Night';
  }
}

// ---- wiring ----

function initGameNight(){
  gnSessionModPromise = import('./js/session.js');

  // Entry point: a floating pill fixed bottom-centre, above the grid but below
  // every bar, sheet, and modal. Labelled, because an icon alone would give no
  // clue what it does. Still built only when the flag is on, so with the flag
  // off it is absent from the DOM rather than merely hidden.
  const gnStartBtn = document.createElement('button');
  gnStartBtn.className = 'gn-fab';
  gnStartBtn.type = 'button';
  gnStartBtn.id = 'gnStartBtn';
  // Shorter label in the pill; the accessible name stays the full action.
  gnStartBtn.setAttribute('aria-label', 'Start Game Night');
  gnStartBtn.innerHTML = `${GN_DIE_SVG}Game Night`;
  document.body.appendChild(gnStartBtn);

  // Random: the surprise path, now an icon FAB inside selection mode rather
  // than an option on a chooser panel. Label shows briefly on entry.
  gnRandomBtn = document.createElement('button');
  gnRandomBtn.className = 'gn-random-fab';
  gnRandomBtn.type = 'button';
  gnRandomBtn.id = 'gnRandomBtn';
  gnRandomBtn.setAttribute('aria-label', 'Random — pick 6 games for us');
  gnRandomBtn.innerHTML = `${GN_ROLL_SVG}<span class="lbl">Random</span>`;
  document.body.appendChild(gnRandomBtn);

  gnWave = document.createElement('div');
  gnWave.className = 'gn-wave';
  gnWave.setAttribute('aria-hidden', 'true');
  document.body.appendChild(gnWave);

  document.body.insertAdjacentHTML('beforeend', `
    <div class="gn-toast" id="gnToast"></div>

    <div class="gn-backdrop" id="gnSurpriseBackdrop">
      <div class="gn-panel" role="dialog" aria-modal="true" aria-labelledby="gnSurpriseTitle">
        <h3 id="gnSurpriseTitle">Tonight's surprise</h3>
        <p class="gn-sub" id="gnSurpriseSub"></p>
        <div class="gn-surprise-grid" id="gnSurpriseGrid"></div>
        <div class="gn-row">
          <button class="gn-secondary-btn" id="gnShuffleBtn" type="button">Shuffle again</button>
          <button class="gn-primary-btn" id="gnSurpriseContinue" type="button">Continue</button>
        </div>
        <button class="gn-cancel-link" id="gnSurpriseCancel" type="button">Cancel</button>
      </div>
    </div>

    <div class="gn-backdrop" id="gnConfirmBackdrop">
      <div class="gn-panel" role="dialog" aria-modal="true" aria-labelledby="gnConfirmTitle">
        <h3 id="gnConfirmTitle">Almost ready</h3>
        <p class="gn-error" id="gnConfirmError">Couldn't start the game night. Try again.</p>
        <div class="gn-field">
          <label for="gnHostName">Your name</label>
          <input class="gn-text-input" id="gnHostName" type="text" placeholder="e.g. Nok" autocomplete="off">
        </div>
        <div class="gn-field" id="gnRevealField">
          <button type="button" class="toggle-row" id="gnRevealToggle" role="switch" aria-checked="false">
            <span class="toggle-switch" aria-hidden="true"></span>
            <span class="toggle-label">Reveal selection</span>
          </button>
        </div>
        <p class="gn-summary" id="gnSummary"></p>
        <div class="gn-row">
          <button class="gn-secondary-btn" id="gnConfirmBack" type="button">Back</button>
          <button class="gn-primary-btn" id="gnConfirmStart" type="button">Start Game Night</button>
        </div>
      </div>
    </div>

    <div class="gn-scrim" id="gnScrim"></div>
    <div class="gn-tray" id="gnTray">
      <div class="gn-tray__head">
        <h4>Tonight's deck</h4>
        <button class="gn-tray__clear" id="gnTrayClear" type="button">Clear all</button>
      </div>
      <div class="gn-tray__list" id="gnTrayList"></div>
    </div>
    <div class="gn-bar" id="gnBar">
      <button class="gn-bar__cancel" id="gnBarCancel" type="button">Cancel</button>
      <button class="gn-bar__count" id="gnBarCount" type="button" disabled></button>
      <button class="gn-bar__continue" id="gnBarContinue" type="button" disabled>Continue</button>
    </div>
  `);

  // entry point → selection mode, directly
  gnStartBtn.addEventListener('click', ()=>{
    const pool = gnPool();
    if(pool.length < GN_MIN_POOL){
      showGnToast('Not enough games match these filters');
      return;
    }
    gnState.mode = 'manual';
    enterSelectionMode();
  });
  gnRandomBtn.addEventListener('click', ()=>{
    gnRandomBtn.classList.remove('labelled');
    gnState.mode = 'random';
    sampleSurprise();
    renderSurprise();
    openGnBackdrop(document.getElementById('gnSurpriseBackdrop'));
  });

  // surprise view
  document.getElementById('gnShuffleBtn').addEventListener('click', ()=>{
    sampleSurprise(); // zero network requests — resamples from what's already loaded
    renderSurprise();
  });
  document.getElementById('gnSurpriseContinue').addEventListener('click', ()=>{
    closeGnBackdrop(document.getElementById('gnSurpriseBackdrop'));
    openConfirm();
  });
  document.getElementById('gnSurpriseCancel').addEventListener('click', ()=>{
    closeGnBackdrop(document.getElementById('gnSurpriseBackdrop'));
    // Back to selection mode, which is still live underneath — not out of the flow.
    gnState.mode = 'manual';
    gnState.surprisePool = [];
  });

  // selection-mode bottom bar
  document.getElementById('gnBarCancel').addEventListener('click', exitSelectionMode);
  document.getElementById('gnBarCount').addEventListener('click', ()=>{
    document.body.classList.contains('gn-tray-open') ? closeGnTray() : openGnTray();
  });
  document.getElementById('gnScrim').addEventListener('click', closeGnTray);
  document.getElementById('gnTrayClear').addEventListener('click', ()=>{
    state.selectedIds.clear();
    clearSelectedCards();
    updateGnBar();
    gameModal.refreshFooter();
  });
  document.getElementById('gnBarContinue').addEventListener('click', ()=>{
    if(state.selectedIds.size < GN_MIN_SELECT) return;
    closeGnTray();
    gnState.mode = 'manual';
    openConfirm();
  });

  // confirm step
  document.getElementById('gnRevealToggle').addEventListener('click', ()=>{
    gnState.revealDeck = !gnState.revealDeck;
    syncRevealToggleUI();
  });
  document.getElementById('gnConfirmBack').addEventListener('click', ()=>{
    closeGnBackdrop(document.getElementById('gnConfirmBackdrop'));
    if(gnState.mode === 'random'){
      openGnBackdrop(document.getElementById('gnSurpriseBackdrop'));
    }
    // manual: selection mode's bar/tray are still live underneath — nothing else to do
  });
  document.getElementById('gnConfirmStart').addEventListener('click', handleGnStart);

  // click outside a panel closes that modal, matching the existing detail-card backdrop
  [
    document.getElementById('gnSurpriseBackdrop'),
    document.getElementById('gnConfirmBackdrop'),
  ].forEach(backdrop => {
    backdrop.addEventListener('click', (e)=>{
      if(e.target !== backdrop) return;
      closeGnBackdrop(backdrop);
      // Dismissing the surprise panel drops back into selection mode, which is
      // still live underneath — same fallback as its Cancel button.
      if(backdrop.id === 'gnSurpriseBackdrop'){
        gnState.mode = 'manual';
        gnState.surprisePool = [];
      }
    });
  });
}

// ---- Sticky bar background (only while actually pinned) ----

const stickySentinel = document.getElementById('stickySentinel');
const filterSortBar = document.getElementById('filterSortBar');
if('IntersectionObserver' in window){
  new IntersectionObserver(
    ([entry]) => filterSortBar.classList.toggle('is-stuck', !entry.isIntersecting),
    { threshold: 0 }
  ).observe(stickySentinel);
}

try {
  await loadGames();
  render();
  if(gameNightVisible) initGameNight();
} catch {
  document.getElementById('shelf').innerHTML = `<p class="empty-state">Couldn't load the collection. Try refreshing.</p>`;
  document.getElementById('shelf-count').textContent = '';
}
</script>
</body>
</html>
