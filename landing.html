<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#160F0A">
<title>BoardgameShelf</title>
<link rel="icon" href="/assets/icon.svg" type="image/svg+xml">
<link rel="icon" href="/assets/icon-32.png" sizes="32x32" type="image/png">
<link rel="icon" href="/assets/icon-64.png" sizes="64x64" type="image/png">
<link rel="apple-touch-icon" href="/assets/icon-180.png">
<link rel="manifest" href="/site.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/base.css">
<script defer src="/_vercel/insights/script.js"></script>
<style>
  /* Tokens and page chrome come from css/base.css. Layout follows
     docs/landing-mockup.html, option C ("The hand"); spec in
     docs/claude-code-landing-hand.md. */
  body{padding:40px 20px 0;}
  .wrap{max-width:560px;margin:0 auto;text-align:center;}

  .mark{font-family:'Fraunces',serif;font-style:italic;font-weight:500;font-size:17px;color:var(--bgs-gold);margin:0;}

  /* Five fanned covers. Decorative: the caption under them is the text.
     Transition on transform only, and no animation on the same element —
     WebKit drops a transition that fights an animation. */
  /* The fan is 181px tall once rotated and offset; the box is sized to it so
     the lowest cover sits exactly on the box's bottom edge and the headline's
     margin below is real whitespace, not a guess. */
  .hand{position:relative;height:212px;margin:12px auto 0;max-width:520px;}
  .hand .cover{
    position:absolute;left:50%;bottom:36px;width:132px;aspect-ratio:1/1;border-radius:6px;overflow:hidden;
    background:var(--c);border:1px solid rgba(var(--bgs-ivory-rgb),.12);
    box-shadow:0 10px 24px rgba(0,0,0,.45);
    transform-origin:50% 160%;
    transform:translateX(-50%) rotate(var(--r)) translateY(var(--y));
    transition:transform .25s ease;
  }
  .hand .cover img{display:block;width:100%;height:100%;object-fit:cover;}
  .hand .cover:hover{transform:translateX(-50%) rotate(var(--r)) translateY(calc(var(--y) - 14px));}
  .hand .cover:nth-child(1){--r:-22deg;--y:8px}
  .hand .cover:nth-child(2){--r:-11deg;--y:-2px}
  .hand .cover:nth-child(3){--r:0deg;--y:-8px;z-index:2;box-shadow:0 0 0 2px var(--bgs-gold),0 16px 30px rgba(0,0,0,.6)}
  .hand .cover:nth-child(4){--r:11deg;--y:-2px}
  .hand .cover:nth-child(5){--r:22deg;--y:8px}
  @media(prefers-reduced-motion:reduce){.hand .cover{transition:none}}

  h1{font-family:'Fraunces',serif;font-weight:600;font-variation-settings:'opsz' 144;font-size:clamp(38px,9vw,64px);line-height:1.02;letter-spacing:-.015em;margin:18px 0 14px;}
  .sub{font-size:17px;line-height:1.45;color:var(--bgs-ivory-70);margin:0 auto 26px;max-width:32ch;}

  .signin{max-width:420px;margin:30px auto 0;text-align:left;}

  .btn{
    display:flex;align-items:center;justify-content:center;gap:10px;width:100%;
    min-height:52px;padding:0 16px;border-radius:12px;cursor:pointer;
    font-family:'Inter',sans-serif;font-size:16px;font-weight:600;
    border:1.5px solid rgba(var(--bgs-gold-rgb),.55);
    background:rgba(var(--bgs-gold-rgb),.1);color:var(--bgs-ivory);
    text-decoration:none;
    transition:background .15s ease,transform .1s ease;
  }
  .btn:hover{background:rgba(var(--bgs-gold-rgb),.18);}
  .btn:active{transform:scale(.985);}
  .btn:focus-visible{outline:none;box-shadow:0 0 0 2px var(--bgs-bg),0 0 0 4px var(--bgs-gold);}
  .btn[disabled]{opacity:.6;cursor:default;}
  .btn.gold{background:var(--bgs-gold);color:var(--bgs-bg);border-color:var(--bgs-gold);}
  .btn.gold:hover{background:#ecbd5b;}
  .btn svg{width:18px;height:18px;flex:none;}
  .google-wrap{position:relative;}
  /* Google's button (an iframe, fixed 40–44px tall) stretched over the 52px
     gold button and made transparent. It is scaled rather than resized
     because its height is not ours to set. */
  .gsi{position:absolute;inset:0;overflow:hidden;opacity:0;display:flex;align-items:center;justify-content:center;}
  .gsi > div{transform:scale(1.08,1.3);transform-origin:center;}
  .gsi > div,.gsi iframe{width:100%!important;}

  .or{
    display:flex;align-items:center;gap:12px;margin:18px 0 14px;
    color:var(--bgs-ivory-45);font-family:'IBM Plex Mono',monospace;font-size:11px;
    letter-spacing:.12em;text-transform:uppercase;
  }
  .or::before,.or::after{content:"";flex:1;height:1px;background:rgba(var(--bgs-ivory-rgb),.12);}

  .field{
    width:100%;min-height:52px;padding:0 14px;border-radius:12px;
    background:rgba(var(--bgs-bg-rgb),.6);border:1.5px solid rgba(var(--bgs-ivory-rgb),.14);
    color:var(--bgs-ivory);font:inherit;font-size:16px;
  }
  .field::placeholder{color:var(--bgs-ivory-45);}
  .field:focus-visible{outline:none;box-shadow:0 0 0 2px var(--bgs-bg),0 0 0 4px var(--bgs-gold);}

  .row{display:grid;gap:10px;}
  @media(min-width:560px){.row{grid-template-columns:1fr auto;}.row .btn{width:auto;padding:0 22px;}}

  .msg{margin:10px 0 0;font-size:14px;line-height:1.45;color:var(--bgs-ivory-70);min-height:1.2em;}
  .msg.ok{color:var(--bgs-vote-play);}
  .msg.err{color:var(--bgs-vote-pass);}

  .signed-in{display:flex;flex-direction:column;gap:10px;}
  .signed-in h2{font-family:'Fraunces',serif;font-weight:600;font-size:20px;margin:0 0 4px;text-align:center;}

  footer{max-width:960px;margin:44px auto 0;padding:24px 20px 40px;text-align:center;font-family:'IBM Plex Mono',monospace;border-top:1px solid rgba(var(--bgs-gold-rgb),.18);}
  footer .bgg-badge{display:inline-block;line-height:0;margin:0;border-radius:4px;}
  footer .bgg-badge img{display:block;}
  footer .bgg-badge:focus-visible{outline:none;box-shadow:0 0 0 2px var(--bgs-bg),0 0 0 4px var(--bgs-gold);}
  footer .legal{font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:.015em;color:rgba(var(--bgs-gold-rgb),.4);margin:14px 0 0;}
  footer .legal a{color:var(--bgs-gold-dim);text-decoration:underline;text-underline-offset:3px;border-radius:3px;}
  footer .legal a:hover{color:var(--bgs-gold);}
  footer .legal a:focus-visible{outline:none;box-shadow:0 0 0 2px var(--bgs-bg),0 0 0 4px var(--bgs-gold);}
  footer .primary{font-size:12px;line-height:1.55;letter-spacing:.015em;color:var(--bgs-gold-dim);margin:0 0 6px;}
  footer .primary a{color:var(--bgs-gold);text-decoration:underline;text-underline-offset:3px;}
  footer .secondary{font-size:11px;line-height:1.55;letter-spacing:.015em;color:rgba(var(--bgs-gold-rgb),.4);margin:0;}

  [hidden]{display:none!important;}
</style>
</head>
<body>
<div class="wrap">
  <p class="mark">BoardgameShelf</p>
  <div class="hand" aria-hidden="true">
    <div class="cover" style="--c:#3E5C3E"><img src="https://cf.geekdo-images.com/MjeJZfulbsM1DSV3DrGJYA__original/img/B374C04Eip7fmQBGJzgiOTp-jyQ=/0x0/filters:format(jpeg)/pic5100691.jpg" alt="" loading="eager" decoding="async"></div>
    <div class="cover" style="--c:#3B4F76"><img src="https://cf.geekdo-images.com/SoU8p28Sk1s8MSvoM4N8pQ__itemrep@2x/img/Pr8zSaMINlALYjR0agud0_EFESs=/fit-in/492x600/filters:strip_icc()/pic6293412.jpg" alt="" loading="eager" decoding="async"></div>
    <div class="cover" style="--c:#7A3B2E"><img src="https://cf.geekdo-images.com/UVUkjMV_Q2paVUIUP30Vvw__original/img/BoUtCkd1NRO0bR1R5EwL51xIuXA=/0x0/filters:format(jpeg)/pic7664424.jpg" alt="" loading="eager" decoding="async"></div>
    <div class="cover" style="--c:#A64B32"><img src="https://cf.geekdo-images.com/URkI3cTZ9NHdlPNRPSd2_g__original/img/97yvW76xxAirQc7Jebosu-6FM9I=/0x0/filters:format(jpeg)/pic2891964.jpg" alt="" loading="eager" decoding="async"></div>
    <div class="cover" style="--c:#8B3A3A"><img src="https://cf.geekdo-images.com/HINb2nkFn5IiZxAlzQIs4g__itemrep@2x/img/f8s-g70BViz6Thkzu5_jYoGf8BA=/fit-in/492x600/filters:strip_icc()/pic7009391.jpg" alt="" loading="eager" decoding="async"></div>
  </div>
  <h1>Your shelf, judged by its covers.</h1>
  <p class="sub">A page for your collection and a vote for your table, from any phone.</p>

  <section class="signin" id="signIn" aria-label="Sign in">
    <!-- Google's sign-in (Google Identity Services) must render its own
         button, so it is laid invisibly over the gold one: the gold button is
         what people see, Google's is what receives the tap. Without a client
         ID, or if Google's script fails, the gold button itself runs the
         redirect flow through Supabase. -->
    <div class="google-wrap">
    <button class="btn gold" id="googleBtn" type="button">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M21.6 12.23c0-.68-.06-1.33-.17-1.96H12v3.7h5.38a4.6 4.6 0 0 1-2 3.02v2.5h3.24c1.9-1.75 2.98-4.32 2.98-7.26z"/><path fill="currentColor" opacity=".8" d="M12 22c2.7 0 4.97-.9 6.62-2.42l-3.24-2.5c-.9.6-2.04.95-3.38.95-2.6 0-4.8-1.75-5.6-4.1H3.06v2.58A10 10 0 0 0 12 22z"/><path fill="currentColor" opacity=".6" d="M6.4 13.92A6 6 0 0 1 6.08 12c0-.67.12-1.31.32-1.92V7.5H3.06A10 10 0 0 0 2 12c0 1.61.39 3.14 1.06 4.5l3.34-2.58z"/><path fill="currentColor" opacity=".9" d="M12 5.98c1.47 0 2.78.5 3.82 1.5l2.86-2.86C16.96 3.02 14.7 2 12 2a10 10 0 0 0-8.94 5.5l3.34 2.58C7.2 7.73 9.4 5.98 12 5.98z"/></svg>
      Continue with Google
    </button>
    <div id="gsiBtn" class="gsi" hidden aria-hidden="true"></div>
    </div>
    <div class="or">or</div>
    <form id="emailForm" class="row" novalidate>
      <input class="field" id="email" name="email" type="email" autocomplete="email" inputmode="email" placeholder="you@example.com" aria-label="Email" required>
      <button class="btn" id="emailBtn" type="submit">Send magic link</button>
    </form>
    <p class="msg" id="msg" aria-live="polite"></p>
  </section>

  <section class="signin signed-in" id="signedIn" hidden>
    <h2 id="hello">Welcome back</h2>
    <a class="btn gold" id="shelfLink" href="/settings">Open your shelf</a>
    <a class="btn" href="/settings">Settings &amp; sync</a>
  </section>
</div>

<footer>
  <a class="bgg-badge" href="https://boardgamegeek.com" target="_blank" rel="noopener" aria-label="Powered by BoardGameGeek (opens in a new tab)">
    <img src="/assets/powered-by-bgg.svg" alt="" width="150" height="33">
  </a>
  <p class="legal"><a href="/privacy">Privacy policy</a> · <a href="/terms">Terms of service</a></p>
</footer>

<script type="module">
import { getUser, signInWithGoogle, signInWithGoogleCredential, makeNonce, GOOGLE_CLIENT_ID, signInWithEmail, fetchMyProfile, userDisplayName } from '/js/auth.js';

const msg = document.getElementById('msg');
const say = (text, kind = '') => { msg.textContent = text; msg.className = `msg ${kind}`; };

const googleBtn = document.getElementById('googleBtn');
googleBtn.addEventListener('click', async () => {
  googleBtn.disabled = true;
  say('Opening Google…');
  try { await signInWithGoogle(); }
  catch (err) { say(err.message || "Couldn't start Google sign-in.", 'err'); googleBtn.disabled = false; }
});

// ---- Google's button on this site (Google Identity Services) ----
// Google names the site that receives the token, so the consent screen reads
// "to continue to boardgameshelf.vercel.app" (or the verified app name)
// instead of the Supabase project address. If the script fails to load or no
// client ID is configured, the gold button above keeps the old redirect flow.
async function mountGoogleButton() {
  if (!GOOGLE_CLIENT_ID) return;
  const host = document.getElementById('gsiBtn');
  const { raw, hashed } = await makeNonce();
  await new Promise((resolve, reject) => {
    const s = document.createElement('script');
    s.src = 'https://accounts.google.com/gsi/client';
    s.async = true;
    s.onload = resolve;
    s.onerror = () => reject(new Error('gsi failed to load'));
    document.head.appendChild(s);
  });
  if (!window.google?.accounts?.id) throw new Error('gsi unavailable');
  window.google.accounts.id.initialize({
    client_id: GOOGLE_CLIENT_ID,
    nonce: hashed,
    ux_mode: 'popup',
    callback: async ({ credential }) => {
      say('Signing you in…');
      try {
        await signInWithGoogleCredential(credential, raw);
        location.replace('/welcome');
      } catch (err) {
        say(err.message || "Couldn't finish Google sign-in.", 'err');
      }
    },
  });
  const width = Math.min(400, Math.max(200, Math.floor(host.getBoundingClientRect().width || 360)));
  window.google.accounts.id.renderButton(host, {
    type: 'standard', theme: 'filled_black', size: 'large', shape: 'pill',
    text: 'continue_with', logo_alignment: 'left', width,
  });
  host.hidden = false;
  // Taps now go to Google's button; keep the gold one visible but out of the
  // way for keyboard users, so Tab reaches Google's control instead.
  googleBtn.tabIndex = -1;
  googleBtn.setAttribute('aria-hidden', 'true');
  host.removeAttribute('aria-hidden');
}
mountGoogleButton().catch((err) => { console.warn('Google button not mounted, using redirect flow:', err.message); });

document.getElementById('emailForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const input = document.getElementById('email');
  const email = input.value.trim();
  if (!input.checkValidity() || !email) { say('Enter a valid email address.', 'err'); input.focus(); return; }
  const btn = document.getElementById('emailBtn');
  btn.disabled = true;
  say('Sending…');
  try {
    await signInWithEmail(email);
    say(`Check ${email} for a sign-in link. It brings you straight back here, signed in.`, 'ok');
  } catch (err) {
    say(err.message || "Couldn't send the link. Try again in a minute.", 'err');
    btn.disabled = false;
  }
});

// Already signed in: skip the pitch and point at the shelf.
try {
  const user = await getUser();
  if (user) {
    const profile = await fetchMyProfile().catch(() => null);
    document.getElementById('hello').textContent = `Welcome back, ${profile?.display_name || userDisplayName(user) || 'friend'}`;
    // Signed in but never claimed a BGG name: onboarding, not the pitch.
    if (!profile?.slug) {
      location.replace('/welcome');
    } else {
      document.getElementById('shelfLink').href = `/u/${profile.slug}`;
      document.getElementById('signIn').hidden = true;
      document.getElementById('signedIn').hidden = false;
    }
  }
} catch { /* stay on the sign-in card */ }
</script>
</body>
</html>
