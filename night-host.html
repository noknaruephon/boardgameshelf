<script>
/* Theme resolver (docs/claude-code-spec-themes.md), before the stylesheet so
   the first frame is already the right theme: ?theme= (preview only) →
   localStorage['bgs:theme'] → walnut. Ids are shape-checked here only; an
   unknown id matches no [data-theme] block and renders walnut, and
   js/themes.js normalises it later. The meta theme-color follows the
   applied theme's --bgs-bg once the stylesheet has resolved. */
(function(){var d=document.documentElement,ok=/^[a-z][a-z0-9-]{0,23}$/,q=null,s=null;
try{q=new URLSearchParams(location.search).get('theme');}catch(e){}
try{s=localStorage.getItem('bgs:theme');}catch(e){}
d.dataset.theme=ok.test(q||'')?q:ok.test(s||'')?s:'walnut';
document.addEventListener('DOMContentLoaded',function(){var m=document.querySelector('meta[name="theme-color"]'),bg=getComputedStyle(d).getPropertyValue('--bgs-bg').trim();if(m&&bg)m.content=bg;});})();
</script>

<style>
  /* Tokens and page chrome come from css/base.css. */
  body{
    padding:24px 16px calc(40px + env(safe-area-inset-bottom));
  }
  .screen{max-width:420px;margin:0 auto;}
  .shelf-footer{max-width:420px;}
  .eyebrow{
    font-family:'IBM Plex Mono',monospace;font-size:10.5px;letter-spacing:.16em;
    text-transform:uppercase;color:var(--bgs-gold-dim);text-align:center;margin-bottom:6px;
  }
  h1{
    font-family:'Fraunces',serif;font-weight:600;font-size:23px;
    text-align:center;margin:0 0 20px;letter-spacing:-.01em;
  }

  /* ---- QR panel ---- */
  .qr-card{
    background:var(--bgs-plate);border-radius:16px;padding:20px;
    border:1px solid rgba(var(--bgs-gold-rgb),.18);
    display:flex;flex-direction:column;align-items:center;gap:14px;margin-bottom:16px;
  }
  .qr-frame{
    background:var(--bgs-ivory);padding:10px;border-radius:10px;
    width:172px;height:172px;display:flex;align-items:center;justify-content:center;
  }
  .qr-frame svg{width:100%;height:100%;display:block;}
  .code-row{display:flex;flex-direction:column;align-items:center;gap:9px;width:100%;}
  .code-small{
    font-family:'IBM Plex Mono',monospace;font-weight:600;font-size:12.5px;
    letter-spacing:.14em;color:var(--bgs-ivory-45);padding-left:.14em;
  }
  .copy-btn{
    background:transparent;border:1.5px solid rgba(var(--bgs-gold-rgb),.4);
    color:var(--bgs-gold);border-radius:999px;padding:9px 18px;
    font:inherit;font-size:12px;font-weight:600;cursor:pointer;
    transition:border-color .15s ease;
  }
  .copy-btn:hover{border-color:var(--bgs-gold);}
  /* Copy link and Show on TV side by side (TV mode, behind the flag below). */
  .code-actions{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;}

  /* ---- Show on TV sheet (docs/claude-code-spec-tv-mode.md, Casting) ----
     Built on createBottomSheet with the share sheet's parts (css/share-sheet.css);
     only the Cast row and the big code are its own. */
  .tv-sheet__cast[hidden],.tv-sheet__on[hidden],.tv-sheet__err[hidden]{display:none;}
  .tv-sheet__on{
    display:flex;align-items:center;justify-content:space-between;gap:10px;
    height:44px;padding:0 6px 0 14px;border-radius:22px;
    box-shadow:inset 0 0 0 1px rgba(var(--bgs-gold-rgb),.45);
    font-size:13px;font-weight:600;color:var(--bgs-gold);
  }
  .tv-sheet__err{font-size:12px;color:var(--bgs-danger-hover);text-align:center;margin:8px 0 0;}
  .tv-sheet__or{
    font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.12em;text-transform:uppercase;
    color:var(--bgs-ivory-45);text-align:center;margin:14px 0 0;
  }
  .tv-sheet__label{font-size:12px;color:var(--bgs-ivory-45);text-align:center;margin:12px 0 8px;}
  .tv-sheet__code{
    display:flex;align-items:baseline;justify-content:center;gap:12px;flex-wrap:wrap;margin:0 0 12px;
    font-family:'IBM Plex Mono',monospace;font-size:14px;color:var(--bgs-ivory-70);
  }
  .tv-sheet__code b{
    font-family:'Fraunces',serif;font-weight:600;font-size:26px;letter-spacing:.18em;
    color:var(--bgs-gold);padding-left:.18em;
  }
  .tv-sheet a.share-sheet__btn{text-decoration:none;}

  .recap{
    font-size:11.5px;color:var(--bgs-ivory-45);text-align:center;margin-bottom:20px;
    display:flex;align-items:center;justify-content:center;gap:7px;flex-wrap:wrap;
  }
  .recap b{color:var(--bgs-ivory-70);font-weight:600;}
  .recap .dot{opacity:.4;}

  /* ---- deck preview ---- */
  .deck{margin-bottom:22px;}
  .deck h2{
    font-size:11px;text-transform:uppercase;letter-spacing:.12em;
    color:var(--bgs-ivory-45);font-weight:600;margin:0 0 9px;text-align:center;
  }
  .deck-row{display:flex;gap:7px;justify-content:center;flex-wrap:wrap;}
  /* .deck-card / .deck-card.back live in css/base.css, shared with vote.html. */

  /* The game detail modal is styled by css/game-modal.css, shared with the shelf. */

  /* ---- roster ---- */
  .roster{margin-bottom:24px;}
  .roster-head{
    display:flex;align-items:center;justify-content:center;gap:8px;margin-bottom:12px;
  }
  .roster-head h2{
    font-family:'Fraunces',serif;font-weight:600;font-size:15px;margin:0;
  }
  .pulse{
    width:6px;height:6px;border-radius:50%;background:var(--bgs-gold);
    animation:pulse 1.8s ease-in-out infinite;
  }
  @keyframes pulse{0%,100%{opacity:1;}50%{opacity:.25;}}
  .names{display:flex;flex-wrap:wrap;gap:7px;justify-content:center;}
  .name-chip{
    display:inline-flex;align-items:center;gap:6px;
    background:var(--bgs-plate);border:1px solid rgba(var(--bgs-ivory-rgb),.1);
    border-radius:999px;padding:7px 13px;font-size:12.5px;font-weight:600;
    animation:pop .28s cubic-bezier(.2,1.2,.4,1);
  }
  @keyframes pop{from{opacity:0;transform:scale(.85);}to{opacity:1;transform:scale(1);}}
  .name-chip .tag{
    font-size:9.5px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;
    color:var(--bgs-gold-dim);
  }
  .name-chip.you{border-color:rgba(var(--bgs-gold-rgb),.4);}

  /* ---- actions ---- */
  .start-btn{
    display:block;width:100%;background:var(--bgs-gold);color:var(--bgs-on-gold);border:none;
    border-radius:12px;padding:16px;font:inherit;font-size:14.5px;font-weight:700;
    cursor:pointer;transition:opacity .18s ease;text-align:center;text-decoration:none;
    box-sizing:border-box;
  }
  .start-btn:disabled{opacity:.3;cursor:not-allowed;}
  .start-hint{
    text-align:center;font-size:11.5px;color:var(--bgs-ivory-45);margin-top:10px;
  }
  .cancel-btn{
    display:block;margin:14px auto 0;background:transparent;border:none;
    color:var(--bgs-ivory-45);font:inherit;font-size:12.5px;font-weight:600;
    cursor:pointer;padding:10px 14px;border-radius:8px;
    transition:color .15s ease;
  }
  .cancel-btn:hover{color:var(--bgs-danger-hover);}

  /* ---- name gate (host opening the link on a fresh device) ---- */
  .join-card{
    background:var(--bgs-plate);border-radius:16px;padding:22px;
    border:1px solid rgba(var(--bgs-gold-rgb),.18);
  }
  .join-card label{
    display:block;font-size:11px;text-transform:uppercase;letter-spacing:.12em;
    color:var(--bgs-ivory-45);font-weight:600;margin-bottom:8px;
  }
  .join-card input{
    width:100%;background:rgba(0,0,0,.28);border:1.5px solid rgba(var(--bgs-ivory-rgb),.14);
    border-radius:10px;padding:14px;color:var(--bgs-ivory);
    /* 16px, not smaller: iOS Safari zooms the page in when you focus an input
       whose text is under 16px, and never zooms back out. */
    font:inherit;font-size:16px;margin-bottom:14px;box-sizing:border-box;
  }
  .join-card input:focus{outline:none;border-color:var(--bgs-gold);}
  .join-card input::placeholder{color:rgba(var(--bgs-ivory-rgb),.28);}
  .form-error{
    text-align:center;font-size:12px;color:var(--bgs-danger-hover);margin:-6px 0 14px;
  }

  /* ---- ended / not found ---- */
  .ended p{
    text-align:center;font-size:13px;color:var(--bgs-ivory-70);line-height:1.6;margin:0 0 22px;
  }
</style>

<script type="module">
import QRCode from 'https://esm.sh/qrcode@1.5.3';
// Absolute paths: this page is reached via a Vercel rewrite (/night/:code/host),
// so the browser's URL — which relative imports resolve against — is the pretty
// path, not this file's real location. A relative import here 404s silently and
// the whole module script never runs, leaving the page stuck on "Loading…".
import { fetchSession, joinGameNight, startVoting, cancelGameNight, sessionErrorMessage } from '/js/session.js';
import { joinSessionChannel, MIN_PLAYERS_TO_START } from '/js/presence.js';
import { deckHTML, attachDeckHandlers, rosterHTML, deckFromSession } from '/js/waiting-room.js';
import { registerOverlay, syncScrollLock } from '/js/scroll-lock.js';
import { fetchGamesForSession, shelfHrefForSession, backLabelForSession } from '/js/shelf-data.js';

const screen = document.getElementById('screen');
// Where "Back to the shelf" goes: the owner's shelf once the session is known.
let shelfHref = '/';
let backLabel = 'Back to the shelf';

// ---- TV mode flag (docs/claude-code-spec-tv-mode.md) ----
// Ships off, the same shape as the swipe screen's cover light flag: ?tv=1
// reveals it. On: a "Show on TV" link in the waiting room opens /tv/{code}
// for the laptop or the television. Nothing else on this screen changes.
const TV_ENABLED = false;
const tvOn = TV_ENABLED || new URLSearchParams(location.search).get('tv') === '1';

const confirmDialog = document.getElementById('confirm');
const confirmBody = document.getElementById('confirmBody');

function codeFromPath() {
  // /night/{code}/host
  const parts = window.location.pathname.split('/').filter(Boolean);
  return parts[1] || null;
}

function renderEnded(message) {
  screen.innerHTML = `
    <div class="eyebrow">Game Night</div>
    <h1>Game night over</h1>
    <div class="ended"><p>${message}</p></div>
    <a class="start-btn" href="${shelfHref}">${backLabel}</a>`;
}

const code = codeFromPath();
if (!code) {
  renderEnded('That game night has ended, or the code is wrong.');
} else {
  init(code);
}

async function init(code) {
  let session;
  try {
    session = await fetchSession(code);
  } catch (e) {
    renderEnded('Something went wrong loading this game night.');
    return;
  }
  if (session) { shelfHref = await shelfHrefForSession(session); backLabel = backLabelForSession(session); }

  if (!session || session.status === 'cancelled') {
    renderEnded('That game night has ended, or the code is wrong.');
    return;
  }

  if (session.status === 'voting' || session.status === 'done') {
    window.location.href = `/vote/${code}/swipe`;
    return;
  }

  let games;
  try {
    games = await fetchGamesForSession(session);
  } catch (e) {
    renderEnded('Something went wrong loading this game night.');
    return;
  }

  const deck = deckFromSession(session, games);

  const storageKey = `gamenight:${code}:name`;
  let hostName = sessionStorage.getItem(storageKey);

  if (!hostName) {
    hostName = await promptForName(session.host_name);
  }

  runHost({ code, session, deck, hostName });
}

function promptForName(sessionHostName) {
  return new Promise((resolve) => {
    screen.innerHTML = `
      <div class="eyebrow">Game Night</div>
      <h1>You're hosting</h1>
      <div class="join-card">
        <label for="hostNm">What should we call you?</label>
        <input id="hostNm" placeholder="Your name" autocomplete="off">
        <p class="form-error" id="hostNmError" hidden></p>
        <button class="start-btn" id="hostNmSubmit" type="button">Continue</button>
      </div>`;

    const input = document.getElementById('hostNm');
    const errEl = document.getElementById('hostNmError');
    const submit = document.getElementById('hostNmSubmit');

    submit.addEventListener('click', async () => {
      const name = input.value.trim();
      if (!name) return;
      submit.disabled = true;
      try {
        const finalName = await joinGameNight(code, name);
        sessionStorage.setItem(`gamenight:${code}:name`, finalName);
        resolve(finalName);
      } catch (e) {
        errEl.textContent = sessionErrorMessage(e, sessionHostName) || 'Something went wrong. Please try again.';
        errEl.hidden = false;
        submit.disabled = false;
      }
    });
  });
}

function runHost({ code, session, deck, hostName }) {
  let players = [];
  let cancelled = false;

  function recapLine() {
    const modeLabel = session.mode === 'random' ? 'Surprise mode' : 'You picked them';
    const deckLabel = session.reveal_deck ? 'Deck shown' : 'Deck hidden';
    return `
      <b>${deck.length} ${deck.length === 1 ? 'game' : 'games'}</b><span class="dot">·</span>
      <b>${modeLabel}</b><span class="dot">·</span>
      <b>${deckLabel}</b>`;
  }

  function render() {
    const n = players.length;
    const canStart = n >= MIN_PLAYERS_TO_START;
    const short = MIN_PLAYERS_TO_START - n;
    screen.innerHTML = `
      <div class="eyebrow">Game Night</div>
      <h1>Scan to join</h1>
      <div class="qr-card">
        <div class="qr-frame" id="qr"></div>
        <div class="code-row">
          <div class="code-small">${code}</div>
          ${tvOn ? `
          <div class="code-actions">
            <button class="copy-btn" id="copyLink">Copy link</button>
            <button class="copy-btn" id="showTv" type="button">Show on TV</button>
          </div>` : `
          <button class="copy-btn" id="copyLink">Copy link</button>`}
        </div>
      </div>
      <div class="recap">${recapLine()}</div>
      ${deckHTML(deck, session.reveal_deck)}
      ${rosterHTML(players, hostName)}
      <button class="start-btn" id="startBtn" ${canStart ? '' : 'disabled'} type="button">Start Voting</button>
      ${canStart
        ? '<p class="start-hint">Everyone swipes on their own phone.</p>'
        : `<p class="start-hint">Need ${short} more ${short === 1 ? 'player' : 'players'} to start.</p>`}
      <button class="cancel-btn" id="cancelNight" type="button">Cancel game night</button>
    `;
    drawQR();
    document.getElementById('copyLink').addEventListener('click', copyLink);
    document.getElementById('showTv')?.addEventListener('click', (e) => openTvSheet(e.currentTarget));
    document.getElementById('startBtn').addEventListener('click', onStartVoting);
    document.getElementById('cancelNight').addEventListener('click', onCancel);
  }

  async function drawQR() {
    const box = document.getElementById('qr');
    if (!box) return;
    const url = `${window.location.origin}/vote/${code}`;
    // The modules are drawn in the theme's page colour on the gold ticket.
    const dark = getComputedStyle(document.documentElement).getPropertyValue('--bgs-bg').trim() || '#000';
    try {
      const svg = await QRCode.toString(url, {
        type: 'svg', margin: 0, color: { dark, light: '#00000000' },
      });
      box.innerHTML = svg;
    } catch (e) {
      box.textContent = 'QR';
    }
  }

  function copyLink() {
    const url = `${window.location.origin}/vote/${code}`;
    const btn = document.getElementById('copyLink');
    navigator.clipboard.writeText(url).then(() => {
      const original = btn.textContent;
      btn.textContent = 'Copied!';
      setTimeout(() => { if (btn.isConnected) btn.textContent = original; }, 1600);
    }).catch(() => {});
  }

  // ---- Show on TV (docs/claude-code-spec-tv-mode.md, Casting) ----
  // One sheet, built on first tap. A Cast button where Chrome has a TV to
  // cast to; for every other TV, the short address and the code to type on
  // its browser, with Copy and Share. Both modules load lazily, so a host who
  // never taps it never fetches them.
  let tvSheet = null;
  let castModule = null;

  async function openTvSheet(opener) {
    if (!tvSheet) tvSheet = await buildTvSheet();
    tvSheet.open(opener, { focus: tvSheet.el.querySelector('[data-sheet-close]') });
  }

  async function buildTvSheet() {
    const [{ createBottomSheet }, cast] = await Promise.all([
      import('/js/share-sheet.js'),
      import('/js/cast-sender.js'),
    ]);
    castModule = cast;
    const tvUrl = `${window.location.origin}/tv/${code}`;
    const sheet = createBottomSheet({
      className: 'tv-sheet',
      titleId: 'tvSheetTitle',
      bodyHTML: `
        <h2 class="bsheet__title" id="tvSheetTitle">Show on TV</h2>
        <p class="share-sheet__sub">The big screen follows the night live</p>
        <div class="tv-sheet__cast" data-tv-cast hidden>
          <button type="button" class="share-sheet__btn share-sheet__btn--gold" data-tv-cast-btn>Cast to a TV</button>
          <div class="tv-sheet__on" data-tv-on hidden>
            <span data-tv-device></span>
            <button type="button" class="share-sheet__copy" data-tv-stop>Stop</button>
          </div>
          <p class="tv-sheet__err" data-tv-err hidden></p>
          <p class="tv-sheet__or">or</p>
        </div>
        <p class="tv-sheet__label">On the TV's browser, go to</p>
        <div class="tv-sheet__code"><span>${window.location.host}/tv</span><b>${code}</b></div>
        <div class="share-sheet__url">
          <span data-tv-url>${window.location.host}/tv/${code}</span>
          <button type="button" class="share-sheet__copy" data-tv-copy>Copy</button>
        </div>
        <div class="share-sheet__row">
          <button type="button" class="share-sheet__btn" data-tv-share>Share…</button>
          <a class="share-sheet__btn" href="/tv/${code}" target="_blank" rel="noopener">Open here</a>
          <button type="button" class="share-sheet__btn" data-sheet-close>Done</button>
        </div>`,
    });
    const el = sheet.el;
    const q = (s) => el.querySelector(s);

    const copyBtn = q('[data-tv-copy]');
    copyBtn.addEventListener('click', async () => {
      try {
        await navigator.clipboard.writeText(tvUrl);
        copyBtn.textContent = 'Copied';
        setTimeout(() => { copyBtn.textContent = 'Copy'; }, 1200);
      } catch {
        // No clipboard access: select the address so a long-press still gets it.
        const range = document.createRange();
        range.selectNodeContents(q('[data-tv-url]'));
        const sel = window.getSelection();
        sel.removeAllRanges();
        sel.addRange(range);
      }
    });

    const shareBtn = q('[data-tv-share]');
    shareBtn.hidden = typeof navigator.share !== 'function';
    shareBtn.addEventListener('click', () => {
      navigator.share({ url: tvUrl, title: 'Game night on the TV' }).catch(() => {});
    });

    // Cast: hidden until the SDK says a TV is in reach.
    const block = q('[data-tv-cast]');
    const castBtn = q('[data-tv-cast-btn]');
    const onRow = q('[data-tv-on]');
    const device = q('[data-tv-device]');
    const err = q('[data-tv-err]');
    const paint = (s) => {
      block.hidden = !s.available;
      castBtn.hidden = s.connected;
      onRow.hidden = !s.connected;
      device.textContent = s.deviceName ? `On ${s.deviceName}` : 'On the TV';
      castBtn.textContent = s.connecting ? 'Connecting…' : 'Cast to a TV';
    };
    cast.onCastState(paint);
    castBtn.addEventListener('click', async () => {
      err.hidden = true;
      try {
        await cast.castCode(code);
      } catch (e) {
        console.error('[game night] cast', e);
        err.textContent = "Couldn't reach the TV. Try again, or open the link on it.";
        err.hidden = false;
      }
    });
    q('[data-tv-stop]').addEventListener('click', () => cast.stopCasting());
    cast.loadCastSender().then((ok) => { if (ok) paint(cast.castState()); });

    return sheet;
  }

  async function onStartVoting() {
    const btn = document.getElementById('startBtn');
    btn.disabled = true;
    try {
      await startVoting(code);
      // Navigation happens for every device via the realtime status change below,
      // including this one — not here, so the whole table lands together.
    } catch (e) {
      const message = sessionErrorMessage(e, hostName);
      if (message) alert(message);
      btn.disabled = players.length < MIN_PLAYERS_TO_START;
    }
  }

  function onCancel() {
    const others = players.length - 1;
    if (others <= 0) {
      doCancel();
      return;
    }
    confirmBody.textContent =
      `${others} ${others === 1 ? 'person has' : 'people have'} already joined. ` +
      `They'll be sent back and the code will stop working.`;
    confirmDialog.classList.add('open');
    syncScrollLock();
  }

  async function doCancel() {
    confirmDialog.classList.remove('open');
    syncScrollLock();
    cancelled = true;
    try {
      await cancelGameNight(code);
    } catch (e) {
      // best-effort — leave regardless, the session is not this device's to keep open
    }
    controller.leave();
    window.location.href = shelfHref;
  }

  registerOverlay(() => confirmDialog.classList.contains('open'));
  document.getElementById('confirmKeep').onclick = () => {
    confirmDialog.classList.remove('open');
    syncScrollLock();
  };
  document.getElementById('confirmEnd').onclick = doCancel;

  render();
  attachDeckHandlers(screen, deck);

  const controller = joinSessionChannel({
    code,
    participantName: hostName,
    isHost: true,
    onPresence: ({ players: p }) => {
      if (cancelled) return;
      players = p;
      render();
    },
    onStatus: (status) => {
      if (cancelled) return;
      if (status === 'voting' || status === 'done') {
        controller.leave();
        window.location.href = `/vote/${code}/swipe`;
      } else if (status === 'cancelled') {
        controller.leave();
        renderEnded('This game night has been cancelled.');
      }
    },
  });

  window.addEventListener('pagehide', () => {
    controller.leave();
    // Leave the Cast session without closing it: the TV keeps the night while
    // this phone moves on to the swipe screen.
    castModule?.leaveCast();
  });
}
</script>
</body>
</html>
