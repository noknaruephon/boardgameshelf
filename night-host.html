<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Game Night — BoardgameShelf</title>
<meta property="og:title" content="BoardgameShelf">
<meta property="og:description" content="Track your games. Pick tonight's, together.">
<meta property="og:image" content="https://boardgameshelf.vercel.app/api/og">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="https://boardgameshelf.vercel.app/api/og">
<link rel="icon" href="/assets/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/assets/icon-180.png">
<link rel="manifest" href="/site.webmanifest">
<meta name="theme-color" content="#171110">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,600;1,9..144,500;1,9..144,600&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet">
<script>
/* Theme resolver (docs/claude-code-spec-themes.md), before the stylesheet so
   the first frame is already the right theme: ?theme= (preview only) →
   localStorage['bgs:theme'] → walnut. Ids are shape-checked here only; an
   unknown id matches no [data-theme] block and renders walnut, and
   js/themes.js normalises it later. The meta theme-color follows the
   applied theme's --bgs-bg once the stylesheet has resolved. */
(function(){var d=document.documentElement,ok=/^[a-z][a-z0-9-]{0,23}$/,q=null,s=null;
try{q=new URLSearchParams(location.search).get('theme');}catch(e){}
try{s=localStorage.getItem('bgs:theme');}catch(e){}
d.dataset.theme=ok.test(q||'')?q:ok.test(s||'')?s:'walnut';
document.addEventListener('DOMContentLoaded',function(){var m=document.querySelector('meta[name="theme-color"]'),bg=getComputedStyle(d).getPropertyValue('--bgs-bg').trim();if(m&&bg)m.content=bg;});})();
</script>
<link rel="stylesheet" href="/css/base.css">
<link rel="stylesheet" href="/css/game-modal.css">
<link rel="stylesheet" href="/css/confirm-dialog.css">
<style>
  /* Tokens and page chrome come from css/base.css. */
  body{
    padding:24px 16px calc(40px + env(safe-area-inset-bottom));
  }
  .screen{max-width:420px;margin:0 auto;}
  .shelf-footer{max-width:420px;}
  .eyebrow{
    font-family:'IBM Plex Mono',monospace;font-size:10.5px;letter-spacing:.16em;
    text-transform:uppercase;color:var(--bgs-gold-dim);text-align:center;margin-bottom:6px;
  }
  h1{
    font-family:'Fraunces',serif;font-weight:600;font-size:23px;
    text-align:center;margin:0 0 20px;letter-spacing:-.01em;
  }

  /* ---- QR panel ---- */
  .qr-card{
    background:var(--bgs-plate);border-radius:16px;padding:20px;
    border:1px solid rgba(var(--bgs-gold-rgb),.18);
    display:flex;flex-direction:column;align-items:center;gap:14px;margin-bottom:16px;
  }
  .qr-frame{
    background:var(--bgs-ivory);padding:10px;border-radius:10px;
    width:172px;height:172px;display:flex;align-items:center;justify-content:center;
  }
  .qr-frame svg{width:100%;height:100%;display:block;}
  .code-row{display:flex;flex-direction:column;align-items:center;gap:9px;width:100%;}
  .code-small{
    font-family:'IBM Plex Mono',monospace;font-weight:600;font-size:12.5px;
    letter-spacing:.14em;color:var(--bgs-ivory-45);padding-left:.14em;
  }
  .copy-btn{
    background:transparent;border:1.5px solid rgba(var(--bgs-gold-rgb),.4);
    color:var(--bgs-gold);border-radius:999px;padding:9px 18px;
    font:inherit;font-size:12px;font-weight:600;cursor:pointer;
    transition:border-color .15s ease;
  }
  .copy-btn:hover{border-color:var(--bgs-gold);}
  /* Copy link and Show on TV side by side (TV mode, behind the flag below). */
  .code-actions{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;}

  /* ---- Show on TV sheet (docs/claude-code-spec-tv-mode.md, Casting) ----
     Built on createBottomSheet with the share sheet's parts (css/share-sheet.css);
     only the Cast row and the big code are its own. */
  .tv-sheet__cast[hidden],.tv-sheet__on[hidden],.tv-sheet__err[hidden]{display:none;}
  .tv-sheet__on{
    display:flex;align-items:center;justify-content:space-between;gap:10px;
    height:44px;padding:0 6px 0 14px;border-radius:22px;
    box-shadow:inset 0 0 0 1px rgba(var(--bgs-gold-rgb),.45);
    font-size:13px;font-weight:600;color:var(--bgs-gold);
  }
  .tv-sheet__err{font-size:12px;color:var(--bgs-danger-hover);text-align:center;margin:8px 0 0;}
  .tv-sheet__or{
    font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.12em;text-transform:uppercase;
    color:var(--bgs-ivory-45);text-align:center;margin:14px 0 0;
  }
  .tv-sheet__label{font-size:12px;color:var(--bgs-ivory-45);text-align:center;margin:12px 0 8px;}
  .tv-sheet__code{
    display:flex;align-items:baseline;justify-content:center;gap:12px;flex-wrap:wrap;margin:0 0 12px;
    font-family:'IBM Plex Mono',monospace;font-size:14px;color:var(--bgs-ivory-70);
  }
  .tv-sheet__code b{
    font-family:'Fraunces',serif;font-weight:600;font-size:26px;letter-spacing:.18em;
    color:var(--bgs-gold);padding-left:.18em;
  }
  .tv-sheet a.share-sheet__btn{text-decoration:none;}

  .recap{
    font-size:11.5px;color:var(--bgs-ivory-45);text-align:center;margin-bottom:20px;
    display:flex;align-items:center;justify-content:center;gap:7px;flex-wrap:wrap;
  }
  .recap b{color:var(--bgs-ivory-70);font-weight:600;}
  .recap .dot{opacity:.4;}

  /* ---- deck preview ---- */
  .deck{margin-bottom:22px;}
  .deck h2{
    font-size:11px;text-transform:uppercase;letter-spacing:.12em;
    color:var(--bgs-ivory-45);font-weight:600;margin:0 0 9px;text-align:center;
  }
  .deck-row{display:flex;gap:7px;justify-content:center;flex-wrap:wrap;}
  /* .deck-card / .deck-card.back live in css/base.css, shared with vote.html. */

  /* The game detail modal is styled by css/game-modal.css, shared with the shelf. */

  /* ---- roster ---- */
  .roster{margin-bottom:24px;}
  .roster-head{
    display:flex;align-items:center;justify-content:center;gap:8px;margin-bottom:12px;
  }
  .roster-head h2{
    font-family:'Fraunces',serif;font-weight:600;font-size:15px;margin:0;
  }
  .pulse{
    width:6px;height:6px;border-radius:50%;background:var(--bgs-gold);
    animation:pulse 1.8s ease-in-out infinite;
  }
  @keyframes pulse{0%,100%{opacity:1;}50%{opacity:.25;}}
  .names{display:flex;flex-wrap:wrap;gap:7px;justify-content:center;}
  .name-chip{
    display:inline-flex;align-items:center;gap:6px;
    background:var(--bgs-plate);border:1px solid rgba(var(--bgs-ivory-rgb),.1);
    border-radius:999px;padding:7px 13px;font-size:12.5px;font-weight:600;
    animation:pop .28s cubic-bezier(.2,1.2,.4,1);
  }
  @keyframes pop{from{opacity:0;transform:scale(.85);}to{opacity:1;transform:scale(1);}}
  .name-chip .tag{
    font-size:9.5px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;
    color:var(--bgs-gold-dim);
  }
  .name-chip.you{border-color:rgba(var(--bgs-gold-rgb),.4);}

  /* ---- actions ---- */
  .start-btn{
    display:block;width:100%;background:var(--bgs-gold);color:var(--bgs-on-gold);border:none;
    border-radius:12px;padding:16px;font:inherit;font-size:14.5px;font-weight:700;
    cursor:pointer;transition:opacity .18s ease;text-align:center;text-decoration:none;
    box-sizing:border-box;
  }
  .start-btn:disabled{opacity:.3;cursor:not-allowed;}
  .start-hint{
    text-align:center;font-size:11.5px;color:var(--bgs-ivory-45);margin-top:10px;
  }
  .cancel-btn{
    display:block;margin:14px auto 0;background:transparent;border:none;
    color:var(--bgs-ivory-45);font:inherit;font-size:12.5px;font-weight:600;
    cursor:pointer;padding:10px 14px;border-radius:8px;
    transition:color .15s ease;
  }
  .cancel-btn:hover{color:var(--bgs-danger-hover);}

  /* ---- The stage (docs/claude-code-spec-lobby-stage.md, behind ?lobby=1) ----
     The hidden deck is the hero, the QR and code sit in a glass share bar,
     the roster is glass chips and Start voting is a pill that turns gold the
     moment the table can start. Everything below is stage-only: the classic
     render() above never emits these classes. Rings are box-shadow, never
     outline; the glass material's own focus slot covers .glass elements. */
  .stage-title{font-size:34px;line-height:1.05;text-align:left;margin:0 0 6px;}
  .stage-sub{font-size:13px;color:var(--bgs-ivory-70);text-align:left;margin:0 0 18px;}

  /* The fan: the deck as a hand of cards under a gold glow. fanHTML() sets
     --n, --step and the size set (--w/--h/--r/--q) on .fan, --i and the
     z-index per card (middle on top). Cards are .deck-card from css/base.css
     for the back pattern and border; only size, radius, glyph and position
     change here. The glow is always gold, deck shown or hidden. No motion. */
  .fan-wrap{position:relative;height:222px;margin-bottom:18px;}
  .fan-glow{
    position:absolute;top:70px;left:50%;width:300px;height:170px;margin-left:-150px;
    border-radius:999px;pointer-events:none;z-index:0;
    background:radial-gradient(closest-side, rgba(var(--bgs-gold-rgb),.38), rgba(var(--bgs-gold-rgb),0));
    filter:blur(26px);
  }
  .fan{position:absolute;inset:0;}
  .fan .deck-card{
    position:absolute;top:44px;left:calc(50% - var(--w) / 2);
    width:var(--w);height:var(--h);aspect-ratio:auto;border-radius:var(--r);
    --rot:calc((var(--i) - (var(--n) - 1) / 2) * var(--step));
    transform:rotate(var(--rot));transform-origin:50% 135%;
    box-shadow:inset 0 0 0 1px rgba(var(--bgs-gold-rgb),.22), 0 10px 24px rgba(0,0,0,.5);
  }
  .fan .deck-card.back{font:italic 600 var(--q)/1 'Fraunces',serif;}
  /* base.css presses a clickable card with scale(); keep the card's rotation under it. */
  .fan .deck-card.clickable:active{transform:rotate(var(--rot)) scale(.94);}
  .fan-more{
    position:absolute;left:50%;bottom:6px;transform:translateX(-50%);z-index:11;
    font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.12em;
    color:var(--bgs-gold);background:var(--bgs-plate);border-radius:999px;padding:5px 10px;
    box-shadow:inset 0 0 0 1px rgba(var(--bgs-gold-rgb),.35);
  }

  .share-bar{
    display:flex;gap:14px;align-items:center;border-radius:18px;padding:12px;
    margin-bottom:18px;background:var(--bgs-plate); /* css/glass.css replaces this */
  }
  .share-bar__qr{
    flex:1;min-width:0;display:flex;gap:14px;align-items:center;text-align:left;
    background:transparent;border:0;padding:0;margin:0;font:inherit;color:inherit;
    cursor:pointer;border-radius:12px;
  }
  .share-bar__qr:focus-visible{
    outline:none;box-shadow:0 0 0 3px var(--bgs-bg),0 0 0 5px var(--bgs-gold);
  }
  .qr-frame--thumb{width:76px;height:76px;padding:6px;border-radius:10px;flex-shrink:0;}
  .share-bar__text{display:block;min-width:0;}
  .share-bar__kicker{
    display:block;font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:.18em;
    text-transform:uppercase;color:var(--bgs-gold);
  }
  .share-bar__code{
    display:block;font-family:'Fraunces',serif;font-weight:600;font-size:36px;
    letter-spacing:.04em;line-height:1;margin:4px 0;
  }
  .share-bar__hint{display:block;font-size:11px;color:var(--bgs-ivory-70);}
  .share-bar__copy{
    width:44px;height:44px;border-radius:50%;flex-shrink:0;border:0;padding:0;
    background:var(--bgs-gold);color:var(--bgs-on-gold);
    display:flex;align-items:center;justify-content:center;cursor:pointer;
  }
  .share-bar__copy svg{width:18px;height:18px;display:block;}
  .share-bar__copy:focus-visible{
    outline:none;box-shadow:0 0 0 3px var(--bgs-bg),0 0 0 5px var(--bgs-gold);
  }

  .here{
    display:flex;align-items:center;margin-bottom:10px;
    font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.18em;text-transform:uppercase;
  }
  .here__label{color:var(--bgs-gold);}
  /* Dotted leader between the label and the count, without a third span. */
  .here::after{content:"";flex:1;order:1;margin:0 10px;border-top:1px dotted rgba(var(--bgs-ivory-rgb),.2);}
  .here__n{order:2;color:var(--bgs-ivory-70);}
  .here-row{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:18px;}
  .chip{
    display:inline-flex;align-items:center;gap:8px;height:40px;border-radius:999px;
    padding:0 14px 0 5px;font-size:13px;font-weight:500;box-sizing:border-box;
    background:var(--bgs-plate); /* css/glass.css replaces this */
    animation:pop .28s cubic-bezier(.2,1.2,.4,1);
  }
  /* WebKit drops a transition that shares a property with an animation:
     `pop` moves transform and opacity, so the material's transform
     transition must not apply here. Outranks .glass in css/glass.css. */
  .here-row .chip.glass{transition:none;}
  .chip__avatar{
    width:30px;height:30px;border-radius:50%;flex-shrink:0;background:var(--bgs-plate);
    box-shadow:inset 0 0 0 1.5px var(--bgs-gold);
    display:flex;align-items:center;justify-content:center;
    font-family:'Fraunces',serif;font-weight:600;font-size:14px;color:var(--bgs-ivory);
  }
  .chip__tag{
    font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:.16em;text-transform:uppercase;
    color:var(--bgs-gold);margin-left:2px;
  }
  .chip--open{
    background:transparent;border:1.5px dashed rgba(var(--bgs-ivory-rgb),.2);
    padding:0 14px 0 12px;color:var(--bgs-ivory-70);
  }
  .chip--open .pulse{flex-shrink:0;}
  .chip--open:not(.is-waiting) .pulse{animation:none;opacity:1;}

  .tv-row{display:flex;justify-content:center;margin-bottom:12px;}
  .tv-pill{
    display:inline-flex;align-items:center;gap:8px;height:44px;padding:0 18px;border-radius:999px;
    border:0;font:inherit;font-size:13px;font-weight:600;color:var(--bgs-ivory);cursor:pointer;
    background:var(--bgs-plate); /* css/glass.css replaces this */
  }
  .tv-pill svg{width:16px;height:16px;display:block;}

  .start-pill{
    display:flex;align-items:center;justify-content:center;gap:8px;width:100%;height:56px;
    border-radius:999px;border:0;padding:0 20px;box-sizing:border-box;
    font:inherit;font-size:16px;font-weight:600;color:var(--bgs-ivory);cursor:pointer;
    background:var(--bgs-plate); /* css/glass.css replaces this */
  }
  /* The glass is the dim: no opacity on the disabled pill. */
  .start-pill:disabled{color:rgba(var(--bgs-ivory-rgb),.38);cursor:default;}
  .start-pill.is-ready{
    background:var(--bgs-gold);color:var(--bgs-on-gold);
    box-shadow:0 12px 32px rgba(var(--bgs-gold-rgb),.25);
  }
  .start-pill.is-ready:disabled{color:var(--bgs-on-gold);opacity:.6;} /* while the start request is in flight */
  .start-pill.is-ready:focus-visible{
    outline:none;
    box-shadow:0 0 0 3px var(--bgs-bg),0 0 0 5px var(--bgs-gold),0 12px 32px rgba(var(--bgs-gold-rgb),.25);
  }
  .start-pill svg{width:18px;height:18px;display:block;}

  /* Full-screen QR sheet: the one intentionally light surface, on the theme's
     ivory/ink pair. Enter is a transition on this element only. */
  .qr-sheet{
    position:fixed;inset:0;z-index:50; /* above the TV sheet (css/share-sheet.css, 41) */
    background:var(--bgs-ivory);color:var(--bgs-bg);
    padding:calc(52px + env(safe-area-inset-top)) 24px calc(40px + env(safe-area-inset-bottom));
    display:flex;flex-direction:column;align-items:center;box-sizing:border-box;overflow:auto;
    opacity:0;transform:translateY(8px);
    transition:opacity .22s ease,transform .22s ease;
  }
  .qr-sheet[hidden]{display:none;}
  .qr-sheet.is-open{opacity:1;transform:none;}
  .qr-sheet__bar{
    position:absolute;top:calc(10px + env(safe-area-inset-top));left:24px;right:14px;
    display:flex;align-items:center;justify-content:space-between;
  }
  .qr-sheet__kicker{
    font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.18em;text-transform:uppercase;
    color:rgba(var(--bgs-bg-rgb),.55);
  }
  .qr-sheet__x{
    width:40px;height:40px;border-radius:50%;border:0;padding:0;background:transparent;
    color:var(--bgs-bg);font:inherit;font-size:26px;line-height:1;cursor:pointer;
    box-shadow:inset 0 0 0 1.5px rgba(var(--bgs-bg-rgb),.15);
  }
  .qr-sheet__x:focus-visible,.qr-sheet__copy:focus-visible{
    outline:none;box-shadow:0 0 0 3px var(--bgs-ivory),0 0 0 5px var(--bgs-gold);
  }
  .qr-frame--big{
    width:min(300px,100%);height:auto;aspect-ratio:1;padding:18px;border-radius:20px;
    margin-top:24px;box-shadow:0 16px 40px rgba(var(--bgs-bg-rgb),.14);
  }
  .qr-sheet__code{
    font-family:'Fraunces',serif;font-weight:600;font-size:64px;letter-spacing:.08em;
    padding-left:.08em;line-height:1;color:var(--bgs-bg);margin-top:20px;
  }
  .qr-sheet__url{
    font-family:'IBM Plex Mono',monospace;font-size:12px;color:rgba(var(--bgs-bg-rgb),.55);margin-top:8px;
  }
  .qr-sheet__help{
    font-size:14px;color:rgba(var(--bgs-bg-rgb),.7);text-align:center;line-height:1.5;
    max-width:300px;margin:auto 0 16px;
  }
  .qr-sheet__copy{
    width:100%;max-width:300px;height:48px;border-radius:999px;border:0;
    background:var(--bgs-bg);color:var(--bgs-ivory);font:inherit;font-size:14px;font-weight:600;cursor:pointer;
  }

  @media (prefers-reduced-motion:reduce){
    .chip{animation:none;}
    .chip .pulse{animation:none;}
    .qr-sheet{transform:none;transition:opacity .22s ease;}
  }

  /* ---- name gate (host opening the link on a fresh device) ---- */
  .join-card{
    background:var(--bgs-plate);border-radius:16px;padding:22px;
    border:1px solid rgba(var(--bgs-gold-rgb),.18);
  }
  .join-card label{
    display:block;font-size:11px;text-transform:uppercase;letter-spacing:.12em;
    color:var(--bgs-ivory-45);font-weight:600;margin-bottom:8px;
  }
  .join-card input{
    width:100%;background:rgba(0,0,0,.28);border:1.5px solid rgba(var(--bgs-ivory-rgb),.14);
    border-radius:10px;padding:14px;color:var(--bgs-ivory);
    /* 16px, not smaller: iOS Safari zooms the page in when you focus an input
       whose text is under 16px, and never zooms back out. */
    font:inherit;font-size:16px;margin-bottom:14px;box-sizing:border-box;
  }
  .join-card input:focus{outline:none;border-color:var(--bgs-gold);}
  .join-card input::placeholder{color:rgba(var(--bgs-ivory-rgb),.28);}
  .form-error{
    text-align:center;font-size:12px;color:var(--bgs-danger-hover);margin:-6px 0 14px;
  }

  /* ---- ended / not found ---- */
  .ended p{
    text-align:center;font-size:13px;color:var(--bgs-ivory-70);line-height:1.6;margin:0 0 22px;
  }
</style>
<script>
  // Liquid Glass (docs/claude-code-spec-liquid-glass.md). Same loader as
  // vote-swipe.html: live for everyone, ?glass=0 opts a device out (persisted
  // to localStorage.bgsGlass) and ?glass=1 opts it back in. css/glass.css is
  // appended last in <head>, so it wins over the styles above at equal
  // specificity. Only the stage lobby (?lobby=1) uses the material on this
  // page; the .glass class sits in its markup regardless and is inert without it.
  (function(){
    var GLASS_ENABLED = true;
    try{
      var q = new URLSearchParams(location.search).get('glass');
      if(q === '0') localStorage.setItem('bgsGlass', '0');
      else if(q === '1') localStorage.removeItem('bgsGlass');
      var off = localStorage.getItem('bgsGlass') === '0';
      if(GLASS_ENABLED ? off : !(q === '1')) return;
    }catch(e){ if(!GLASS_ENABLED) return; }
    var link = document.createElement('link');
    link.rel = 'stylesheet'; link.href = '/css/glass.css';
    document.head.appendChild(link);
  })();
</script>
</head>
<body>

<div class="screen" id="screen">
  <div class="deal-shell">
    <div class="deal-wrap">
      <div class="deal" aria-hidden="true">
        <div class="deal-light"></div>
        <div class="deck-card back">?</div>
        <div class="deck-card back">?</div>
        <div class="deck-card back">?</div>
        <div class="deck-card back">?</div>
        <div class="deal-ring"></div>
      </div>
    </div>
    <div class="deal-shell__copy">
      <div class="eyebrow">Game Night</div>
      <h1>Dealing tonight's picks&hellip;</h1>
    </div>
  </div>
</div>

<div class="confirm" id="confirm">
  <div class="confirm__panel">
    <h3>End this game night?</h3>
    <p id="confirmBody"></p>
    <div class="confirm__row">
      <button class="confirm__keep" id="confirmKeep" type="button">Keep going</button>
      <button class="confirm__end" id="confirmEnd" type="button">End it</button>
    </div>
  </div>
</div>

<footer class="shelf-footer">
  <div class="shelf-footer__row">
    <a class="bgg-badge bgg-badge--small" href="https://boardgamegeek.com" target="_blank" rel="noopener" aria-label="Powered by BoardGameGeek (opens in a new tab)">
      <img src="/assets/powered-by-bgg.svg" alt="" width="150" height="33" loading="lazy">
    </a>
  </div>
  <nav class="shelf-footer__links" aria-label="Legal">
    <a href="/privacy">Privacy</a>
    <a href="/terms">Terms</a>
  </nav>
  <p class="shelf-footer__legal">© 2026 BoardgameShelf.</p>
  <p class="shelf-footer__legal">Game data and images courtesy of BoardGameGeek.</p>
</footer>

<script type="module">
import QRCode from 'https://esm.sh/qrcode@1.5.3';
// Absolute paths: this page is reached via a Vercel rewrite (/night/:code/host),
// so the browser's URL — which relative imports resolve against — is the pretty
// path, not this file's real location. A relative import here 404s silently and
// the whole module script never runs, leaving the page stuck on "Loading…".
import { fetchSession, joinGameNight, startVoting, cancelGameNight, sessionErrorMessage } from '/js/session.js';
import { joinSessionChannel, MIN_PLAYERS_TO_START } from '/js/presence.js';
import { deckHTML, attachDeckHandlers, rosterHTML, lobbyRosterHTML, fanHTML, deckFromSession } from '/js/waiting-room.js';
import { registerOverlay, syncScrollLock } from '/js/scroll-lock.js';
import { fetchGamesForSession, shelfHrefForSession, backLabelForSession } from '/js/shelf-data.js';

const screen = document.getElementById('screen');
// Where "Back to the shelf" goes: the owner's shelf once the session is known.
let shelfHref = '/';
let backLabel = 'Back to the shelf';

// ---- TV mode flag (docs/claude-code-spec-tv-mode.md) ----
// Ships off, the same shape as the swipe screen's cover light flag: ?tv=1
// reveals it. On: a "Show on TV" link in the waiting room opens /tv/{code}
// for the laptop or the television. Nothing else on this screen changes.
const TV_ENABLED = false;
const tvOn = TV_ENABLED || new URLSearchParams(location.search).get('tv') === '1';

// ---- Stage lobby flag (docs/claude-code-spec-lobby-stage.md) ----
// Same shape as the TV flag. Live for everyone: the host's waiting room
// renders as "the stage" (renderStage below). ?lobby=0 shows the classic
// page on that load (renderClassic, unchanged) for comparison or as a
// per-device escape hatch; ?lobby=1 would reveal the stage were it off.
const LOBBY_ENABLED = true;
const lobbyParam = new URLSearchParams(location.search).get('lobby');
const lobbyOn = lobbyParam === '0' ? false : (LOBBY_ENABLED || lobbyParam === '1');

const confirmDialog = document.getElementById('confirm');
const confirmBody = document.getElementById('confirmBody');

function codeFromPath() {
  // /night/{code}/host
  const parts = window.location.pathname.split('/').filter(Boolean);
  return parts[1] || null;
}

function renderEnded(message) {
  screen.innerHTML = `
    <div class="eyebrow">Game Night</div>
    <h1>Game night over</h1>
    <div class="ended"><p>${message}</p></div>
    <a class="start-btn" href="${shelfHref}">${backLabel}</a>`;
}

const code = codeFromPath();
if (!code) {
  renderEnded('That game night has ended, or the code is wrong.');
} else {
  init(code);
}

async function init(code) {
  let session;
  try {
    session = await fetchSession(code);
  } catch (e) {
    renderEnded('Something went wrong loading this game night.');
    return;
  }
  if (session) { shelfHref = await shelfHrefForSession(session); backLabel = backLabelForSession(session); }

  if (!session || session.status === 'cancelled') {
    renderEnded('That game night has ended, or the code is wrong.');
    return;
  }

  if (session.status === 'voting' || session.status === 'done') {
    window.location.href = `/vote/${code}/swipe`;
    return;
  }

  let games;
  try {
    games = await fetchGamesForSession(session);
  } catch (e) {
    renderEnded('Something went wrong loading this game night.');
    return;
  }

  const deck = deckFromSession(session, games);

  const storageKey = `gamenight:${code}:name`;
  let hostName = sessionStorage.getItem(storageKey);

  if (!hostName) {
    hostName = await promptForName(session.host_name);
  }

  runHost({ code, session, deck, hostName });
}

function promptForName(sessionHostName) {
  return new Promise((resolve) => {
    screen.innerHTML = `
      <div class="eyebrow">Game Night</div>
      <h1>You're hosting</h1>
      <div class="join-card">
        <label for="hostNm">What should we call you?</label>
        <input id="hostNm" placeholder="Your name" autocomplete="off">
        <p class="form-error" id="hostNmError" hidden></p>
        <button class="start-btn" id="hostNmSubmit" type="button">Continue</button>
      </div>`;

    const input = document.getElementById('hostNm');
    const errEl = document.getElementById('hostNmError');
    const submit = document.getElementById('hostNmSubmit');

    submit.addEventListener('click', async () => {
      const name = input.value.trim();
      if (!name) return;
      submit.disabled = true;
      try {
        const finalName = await joinGameNight(code, name);
        sessionStorage.setItem(`gamenight:${code}:name`, finalName);
        resolve(finalName);
      } catch (e) {
        errEl.textContent = sessionErrorMessage(e, sessionHostName) || 'Something went wrong. Please try again.';
        errEl.hidden = false;
        submit.disabled = false;
      }
    });
  });
}

function runHost({ code, session, deck, hostName }) {
  let players = [];
  let cancelled = false;

  function recapLine() {
    const modeLabel = session.mode === 'random' ? 'Surprise mode' : 'You picked them';
    const deckLabel = session.reveal_deck ? 'Deck shown' : 'Deck hidden';
    return `
      <b>${deck.length} ${deck.length === 1 ? 'game' : 'games'}</b><span class="dot">·</span>
      <b>${modeLabel}</b><span class="dot">·</span>
      <b>${deckLabel}</b>`;
  }

  function render() {
    if (lobbyOn) renderStage();
    else renderClassic();
  }

  function renderClassic() {
    const n = players.length;
    const canStart = n >= MIN_PLAYERS_TO_START;
    const short = MIN_PLAYERS_TO_START - n;
    screen.innerHTML = `
      <div class="eyebrow">Game Night</div>
      <h1>Scan to join</h1>
      <div class="qr-card">
        <div class="qr-frame" id="qr"></div>
        <div class="code-row">
          <div class="code-small">${code}</div>
          ${tvOn ? `
          <div class="code-actions">
            <button class="copy-btn" id="copyLink">Copy link</button>
            <button class="copy-btn" id="showTv" type="button">Show on TV</button>
          </div>` : `
          <button class="copy-btn" id="copyLink">Copy link</button>`}
        </div>
      </div>
      <div class="recap">${recapLine()}</div>
      ${deckHTML(deck, session.reveal_deck)}
      ${rosterHTML(players, hostName)}
      <button class="start-btn" id="startBtn" ${canStart ? '' : 'disabled'} type="button">Start Voting</button>
      ${canStart
        ? '<p class="start-hint">Everyone swipes on their own phone.</p>'
        : `<p class="start-hint">Need ${short} more ${short === 1 ? 'player' : 'players'} to start.</p>`}
      <button class="cancel-btn" id="cancelNight" type="button">Cancel game night</button>
    `;
    drawQR();
    document.getElementById('copyLink').addEventListener('click', copyLink);
    document.getElementById('showTv')?.addEventListener('click', (e) => openTvSheet(e.currentTarget));
    document.getElementById('startBtn').addEventListener('click', onStartVoting);
    document.getElementById('cancelNight').addEventListener('click', onCancel);
  }

  // ---- The stage (docs/claude-code-spec-lobby-stage.md, behind ?lobby=1) ----
  const ICON_COPY = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>';
  const ICON_CHECK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M20 6 9 17l-5-5"/></svg>';
  const ICON_ARROW = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M5 12h14M13 6l6 6-6 6"/></svg>';
  const ICON_TV = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><rect x="2" y="7" width="20" height="14" rx="2"/><path d="m17 2-5 5-5-5"/></svg>';

  function stageSub() {
    const games = deck.length === 1 ? 'game' : 'games';
    const shown = session.reveal_deck ? 'shown' : 'hidden until voting';
    const picked = session.mode === 'random' ? 'picked at random' : 'you picked them';
    return `${deck.length} ${games} · ${shown} · ${picked}`;
  }

  function renderStage() {
    const n = players.length;
    const canStart = n >= MIN_PLAYERS_TO_START;
    screen.classList.add('stage');
    screen.innerHTML = `
      <div class="eyebrow">Game Night</div>
      <h1 class="stage-title">Tonight's deck</h1>
      <p class="stage-sub">${stageSub()}</p>
      ${fanHTML(deck, session.reveal_deck)}
      <div class="share-bar glass">
        <button class="share-bar__qr" id="qrOpen" type="button" aria-label="Show the QR code full screen">
          <span class="qr-frame qr-frame--thumb" id="qr"></span>
          <span class="share-bar__text">
            <span class="share-bar__kicker">Join code</span>
            <span class="share-bar__code">${code}</span>
            <span class="share-bar__hint">Tap the code to fill the screen</span>
          </span>
        </button>
        <button class="share-bar__copy" id="copyLink" type="button" aria-label="Copy link">${ICON_COPY}</button>
      </div>
      ${lobbyRosterHTML(players, hostName, canStart)}
      ${tvOn ? `
      <div class="tv-row">
        <button class="tv-pill glass" id="showTv" type="button">${ICON_TV}Show on TV</button>
      </div>` : ''}
      <button class="start-pill${canStart ? ' is-ready' : ' glass'}" id="startBtn" ${canStart ? '' : 'disabled'} type="button">
        ${canStart ? `Start voting · ${n} players ${ICON_ARROW}` : 'Start voting'}
      </button>
      ${canStart
        ? '<p class="start-hint">Everyone swipes on their own phone.</p>'
        : `<p class="start-hint">Need at least ${MIN_PLAYERS_TO_START} players to start</p>`}
      <button class="cancel-btn" id="cancelNight" type="button">Cancel game night</button>
    `;
    drawQR();
    document.getElementById('qrOpen').addEventListener('click', (e) => openQrSheet(e.currentTarget));
    document.getElementById('copyLink').addEventListener('click', copyLink);
    document.getElementById('showTv')?.addEventListener('click', (e) => openTvSheet(e.currentTarget));
    document.getElementById('startBtn').addEventListener('click', onStartVoting);
    document.getElementById('cancelNight').addEventListener('click', onCancel);
  }

  // The QR is encoded once per page; every frame (the ticket, the share-bar
  // thumb, the full-screen sheet) paints the same SVG string.
  let qrSvgPromise = null;

  function qrSvg() {
    if (!qrSvgPromise) {
      const url = `${window.location.origin}/vote/${code}`;
      // The modules are drawn in the theme's page colour on the gold ticket.
      const dark = getComputedStyle(document.documentElement).getPropertyValue('--bgs-bg').trim() || '#000';
      qrSvgPromise = QRCode.toString(url, {
        type: 'svg', margin: 0, color: { dark, light: '#00000000' },
      }).catch(() => '');
    }
    return qrSvgPromise;
  }

  async function drawQR() {
    const box = document.getElementById('qr');
    if (!box) return;
    const svg = await qrSvg();
    if (svg) box.innerHTML = svg;
    else box.textContent = 'QR';
  }

  function copyLink(ev) {
    const url = `${window.location.origin}/vote/${code}`;
    const btn = (ev && ev.currentTarget) || document.getElementById('copyLink');
    navigator.clipboard.writeText(url).then(() => {
      if (btn.classList.contains('share-bar__copy')) {
        // Icon-only round: the feedback is a check for 1.6s, not a text swap.
        btn.innerHTML = ICON_CHECK;
        btn.setAttribute('aria-label', 'Copied');
        setTimeout(() => {
          if (!btn.isConnected) return;
          btn.innerHTML = ICON_COPY;
          btn.setAttribute('aria-label', 'Copy link');
        }, 1600);
        return;
      }
      const original = btn.textContent;
      btn.textContent = 'Copied!';
      setTimeout(() => { if (btn.isConnected) btn.textContent = original; }, 1600);
    }).catch(() => {});
  }

  // ---- Full-screen QR sheet (stage only) ----
  // One instance, built on first open, like the TV sheet. Close: ×, Esc.
  // Focus goes to × on open and back to the opener on close; the body scroll
  // lock comes from js/scroll-lock.js like every other overlay.
  let qrSheet = null;

  function openQrSheet(opener) {
    if (!qrSheet) qrSheet = buildQrSheet();
    qrSheet.open(opener);
  }

  function buildQrSheet() {
    const el = document.createElement('div');
    el.className = 'qr-sheet';
    el.id = 'qrSheet';
    el.setAttribute('role', 'dialog');
    el.setAttribute('aria-modal', 'true');
    el.setAttribute('aria-labelledby', 'qrSheetTitle');
    el.hidden = true;
    el.innerHTML = `
      <div class="qr-sheet__bar">
        <span class="qr-sheet__kicker" id="qrSheetTitle">Scan to join</span>
        <button class="qr-sheet__x" type="button" aria-label="Close">×</button>
      </div>
      <div class="qr-frame qr-frame--big" id="qrBig"></div>
      <div class="qr-sheet__code">${code}</div>
      <div class="qr-sheet__url">${location.host}/vote/${code}</div>
      <p class="qr-sheet__help">Hold the phone up — anyone at the table can scan with their camera.</p>
      <button class="qr-sheet__copy" type="button">Copy link</button>
    `;
    document.body.appendChild(el);

    const closeBtn = el.querySelector('.qr-sheet__x');
    const big = el.querySelector('#qrBig');
    let opener = null;
    let hideTimer = 0;
    const isOpen = () => !el.hidden;

    function open(from) {
      opener = from || null;
      clearTimeout(hideTimer);
      qrSvg().then((svg) => {
        if (svg) big.innerHTML = svg;
        else big.textContent = 'QR';
      });
      el.hidden = false;
      // Two frames so the first paint is the hidden state and the class
      // change transitions from it (opacity + 8px rise, on this element only).
      requestAnimationFrame(() => requestAnimationFrame(() => el.classList.add('is-open')));
      syncScrollLock();
      closeBtn.focus({ preventScroll: true });
    }

    function close() {
      if (!isOpen()) return;
      el.classList.remove('is-open');
      hideTimer = setTimeout(() => {
        el.hidden = true;
        syncScrollLock();
      }, 240);
      const back = opener;
      opener = null;
      if (back && document.contains(back)) back.focus({ preventScroll: true });
    }

    closeBtn.addEventListener('click', close);
    el.querySelector('.qr-sheet__copy').addEventListener('click', copyLink);
    el.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') { e.preventDefault(); close(); return; }
      if (e.key !== 'Tab') return;
      // Keep focus inside the dialog: × … Copy link, wrapping.
      const items = [closeBtn, el.querySelector('.qr-sheet__copy')];
      const first = items[0], last = items[items.length - 1];
      if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
      else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
    });
    registerOverlay(isOpen);

    return { el, open, close };
  }

  // ---- Show on TV (docs/claude-code-spec-tv-mode.md, Casting) ----
  // One sheet, built on first tap. A Cast button where Chrome has a TV to
  // cast to; for every other TV, the short address and the code to type on
  // its browser, with Copy and Share. Both modules load lazily, so a host who
  // never taps it never fetches them.
  let tvSheet = null;
  let castModule = null;

  async function openTvSheet(opener) {
    if (!tvSheet) tvSheet = await buildTvSheet();
    tvSheet.open(opener, { focus: tvSheet.el.querySelector('[data-sheet-close]') });
  }

  async function buildTvSheet() {
    const [{ createBottomSheet }, cast] = await Promise.all([
      import('/js/share-sheet.js'),
      import('/js/cast-sender.js'),
    ]);
    castModule = cast;
    const tvUrl = `${window.location.origin}/tv/${code}`;
    const sheet = createBottomSheet({
      className: 'tv-sheet',
      titleId: 'tvSheetTitle',
      bodyHTML: `
        <h2 class="bsheet__title" id="tvSheetTitle">Show on TV</h2>
        <p class="share-sheet__sub">The big screen follows the night live</p>
        <div class="tv-sheet__cast" data-tv-cast hidden>
          <button type="button" class="share-sheet__btn share-sheet__btn--gold" data-tv-cast-btn>Cast to a TV</button>
          <div class="tv-sheet__on" data-tv-on hidden>
            <span data-tv-device></span>
            <button type="button" class="share-sheet__copy" data-tv-stop>Stop</button>
          </div>
          <p class="tv-sheet__err" data-tv-err hidden></p>
          <p class="tv-sheet__or">or</p>
        </div>
        <p class="tv-sheet__label">On the TV's browser, go to</p>
        <div class="tv-sheet__code"><span>${window.location.host}/tv</span><b>${code}</b></div>
        <div class="share-sheet__url">
          <span data-tv-url>${window.location.host}/tv/${code}</span>
          <button type="button" class="share-sheet__copy" data-tv-copy>Copy</button>
        </div>
        <div class="share-sheet__row">
          <button type="button" class="share-sheet__btn" data-tv-share>Share…</button>
          <a class="share-sheet__btn" href="/tv/${code}" target="_blank" rel="noopener">Open here</a>
          <button type="button" class="share-sheet__btn" data-sheet-close>Done</button>
        </div>`,
    });
    const el = sheet.el;
    const q = (s) => el.querySelector(s);

    const copyBtn = q('[data-tv-copy]');
    copyBtn.addEventListener('click', async () => {
      try {
        await navigator.clipboard.writeText(tvUrl);
        copyBtn.textContent = 'Copied';
        setTimeout(() => { copyBtn.textContent = 'Copy'; }, 1200);
      } catch {
        // No clipboard access: select the address so a long-press still gets it.
        const range = document.createRange();
        range.selectNodeContents(q('[data-tv-url]'));
        const sel = window.getSelection();
        sel.removeAllRanges();
        sel.addRange(range);
      }
    });

    const shareBtn = q('[data-tv-share]');
    shareBtn.hidden = typeof navigator.share !== 'function';
    shareBtn.addEventListener('click', () => {
      navigator.share({ url: tvUrl, title: 'Game night on the TV' }).catch(() => {});
    });

    // Cast: hidden until the SDK says a TV is in reach.
    const block = q('[data-tv-cast]');
    const castBtn = q('[data-tv-cast-btn]');
    const onRow = q('[data-tv-on]');
    const device = q('[data-tv-device]');
    const err = q('[data-tv-err]');
    const paint = (s) => {
      block.hidden = !s.available;
      castBtn.hidden = s.connected;
      onRow.hidden = !s.connected;
      device.textContent = s.deviceName ? `On ${s.deviceName}` : 'On the TV';
      castBtn.textContent = s.connecting ? 'Connecting…' : 'Cast to a TV';
    };
    cast.onCastState(paint);
    castBtn.addEventListener('click', async () => {
      err.hidden = true;
      try {
        await cast.castCode(code);
      } catch (e) {
        console.error('[game night] cast', e);
        err.textContent = "Couldn't reach the TV. Try again, or open the link on it.";
        err.hidden = false;
      }
    });
    q('[data-tv-stop]').addEventListener('click', () => cast.stopCasting());
    cast.loadCastSender().then((ok) => { if (ok) paint(cast.castState()); });

    return sheet;
  }

  async function onStartVoting() {
    const btn = document.getElementById('startBtn');
    btn.disabled = true;
    try {
      await startVoting(code);
      // Navigation happens for every device via the realtime status change below,
      // including this one — not here, so the whole table lands together.
    } catch (e) {
      const message = sessionErrorMessage(e, hostName);
      if (message) alert(message);
      btn.disabled = players.length < MIN_PLAYERS_TO_START;
    }
  }

  function onCancel() {
    const others = players.length - 1;
    if (others <= 0) {
      doCancel();
      return;
    }
    confirmBody.textContent =
      `${others} ${others === 1 ? 'person has' : 'people have'} already joined. ` +
      `They'll be sent back and the code will stop working.`;
    confirmDialog.classList.add('open');
    syncScrollLock();
  }

  async function doCancel() {
    confirmDialog.classList.remove('open');
    syncScrollLock();
    cancelled = true;
    try {
      await cancelGameNight(code);
    } catch (e) {
      // best-effort — leave regardless, the session is not this device's to keep open
    }
    controller.leave();
    window.location.href = shelfHref;
  }

  registerOverlay(() => confirmDialog.classList.contains('open'));
  document.getElementById('confirmKeep').onclick = () => {
    confirmDialog.classList.remove('open');
    syncScrollLock();
  };
  document.getElementById('confirmEnd').onclick = doCancel;

  render();
  attachDeckHandlers(screen, deck);

  const controller = joinSessionChannel({
    code,
    participantName: hostName,
    isHost: true,
    onPresence: ({ players: p }) => {
      if (cancelled) return;
      players = p;
      render();
    },
    onStatus: (status) => {
      if (cancelled) return;
      if (status === 'voting' || status === 'done') {
        controller.leave();
        window.location.href = `/vote/${code}/swipe`;
      } else if (status === 'cancelled') {
        controller.leave();
        renderEnded('This game night has been cancelled.');
      }
    },
  });

  window.addEventListener('pagehide', () => {
    controller.leave();
    // Leave the Cast session without closing it: the TV keeps the night while
    // this phone moves on to the swipe screen.
    castModule?.leaveCast();
  });
}
</script>
</body>
</html>
