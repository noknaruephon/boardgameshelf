<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Results — BoardgameShelf</title>
<meta property="og:title" content="BoardgameShelf">
<meta property="og:description" content="Track your games. Pick tonight's, together.">
<meta property="og:image" content="https://boardgameshelf.vercel.app/api/og">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="https://boardgameshelf.vercel.app/api/og">
<link rel="icon" href="/assets/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/assets/icon-180.png">
<link rel="manifest" href="/site.webmanifest">
<meta name="theme-color" content="#171110">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,600;1,9..144,500;1,9..144,600&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet">
<script>
/* Theme resolver (docs/claude-code-spec-themes.md), before the stylesheet so
   the first frame is already the right theme: ?theme= (preview only) →
   localStorage['bgs:theme'] → walnut. Ids are shape-checked here only; an
   unknown id matches no [data-theme] block and renders walnut, and
   js/themes.js normalises it later. The meta theme-color follows the
   applied theme's --bgs-bg once the stylesheet has resolved. */
(function(){var d=document.documentElement,ok=/^[a-z][a-z0-9-]{0,23}$/,q=null,s=null;
try{q=new URLSearchParams(location.search).get('theme');}catch(e){}
try{s=localStorage.getItem('bgs:theme');}catch(e){}
d.dataset.theme=ok.test(q||'')?q:ok.test(s||'')?s:'walnut';
document.addEventListener('DOMContentLoaded',function(){var m=document.querySelector('meta[name="theme-color"]'),bg=getComputedStyle(d).getPropertyValue('--bgs-bg').trim();if(m&&bg)m.content=bg;});})();
</script>
<link rel="stylesheet" href="/css/base.css">
<link rel="stylesheet" href="/css/game-modal.css">
<style>
  /* Tokens, page chrome and .deck-card / .deck-card.back come from
     css/base.css. The face-down card below is that same component scaled up —
     the one the table watched shuffle on the tallying screen. */
  body{
    padding:18px 16px calc(46px + env(safe-area-inset-bottom));
  }
  .screen{max-width:400px;margin:0 auto;}
  .shelf-footer{max-width:400px;}
  .eyebrow{
    font-family:'IBM Plex Mono',monospace;font-size:10.5px;letter-spacing:.16em;
    text-transform:uppercase;color:var(--bgs-gold-dim);text-align:center;margin-bottom:6px;
  }
  h1{
    font-family:'Fraunces',serif;font-weight:600;font-size:22px;text-align:center;
    margin:0 0 20px;letter-spacing:-.01em;min-height:28px;transition:opacity .3s ease;
  }

  /* ---- the reveal ----
     The wiggle sits on .flip and the rotation transition on .flip-inner, and
     they must stay on separate elements: an animation and a transition on the
     same property of the same element makes WebKit silently drop the
     transition, so the card snaps instead of turning — correct in Chrome,
     broken on every iPhone at the table. */
  .reveal{display:flex;justify-content:center;gap:16px;margin-bottom:18px;}
  .flip{perspective:1100px;}
  .flip.solo{width:196px;}
  .flip.duo{width:150px;}
  .flip-inner{
    position:relative;width:100%;aspect-ratio:3/4;
    transform-style:preserve-3d;transition:transform .75s cubic-bezier(.3,0,.25,1);
  }
  .flip:not(.revealed){animation:tease 1.1s ease-in-out infinite;}
  @keyframes tease{0%,100%{transform:rotate(-1.6deg);}50%{transform:rotate(1.6deg);}}
  .flip.revealed{animation:none;}
  .flip.revealed .flip-inner{transform:rotateY(180deg);}
  .face{
    position:absolute;inset:0;border-radius:14px;overflow:hidden;
    backface-visibility:hidden;-webkit-backface-visibility:hidden;
    border:1px solid rgba(var(--bgs-gold-rgb),.3);
  }
  /* The two faces are `.facedown` / `.cover`, deliberately NOT `.front` /
     `.back`: the face-down side reuses the shared `.deck-card.back` component,
     so a face class named `.back` would also match it — silently overriding
     its hatch and rotating it out of view, leaving the reveal to start from an
     empty screen. */

  /* The shared card back, resized for the reveal — same override pattern the
     tallying shuffle uses in vote-swipe.html, not a second card back. */
  .face.facedown.deck-card{
    width:auto;aspect-ratio:auto;border-radius:14px;font-size:34px;
    box-shadow:0 18px 34px -10px rgba(0,0,0,.55);
  }
  .face.cover{
    transform:rotateY(180deg);background:var(--bgs-plate);
    transition:box-shadow .6s ease .25s;
  }
  .face.cover img{width:100%;height:100%;object-fit:cover;display:block;}
  .flip.revealed .face.cover{
    box-shadow:0 0 44px rgba(var(--bgs-gold-rgb),.28), 0 18px 34px -10px rgba(0,0,0,.55);
  }
  /* Nobody won: the card never turns — no game earned the reveal. */
  .flip.nobody{animation:none;opacity:.55;transition:opacity .6s ease;}

  /* ---- count-then-crown reveal (docs/claude-code-spec-results-reveal.md) ----
     Behind ?reveal=1, alongside the flip above rather than instead of it: the
     flag-off path still uses .reveal / .flip / .face.

     WebKit rule: .rv-mini, .rv-mini .c, .rv-chip and .rv-pips i use TRANSITIONS
     only; .rv-cover, .rv-flash, h1.rv-swap and the confetti use ANIMATIONS
     only. Never both on one element. */
  .rv-stage{display:flex;flex-direction:column;align-items:center;min-height:250px;margin-bottom:18px;-webkit-tap-highlight-color:transparent;}
  /* The flash and the confetti are meant to spill past the column, and both
     widen the page while they do — a phone can be dragged sideways through the
     one second that matters most. Clipped at the viewport, not at the stage:
     the stage is only as wide as the column, and clipping there would cut the
     gold glow off two or three tied covers. `clip` not `hidden`: hidden on one
     axis forces the other to `auto`, which would cut the confetti's vertical
     travel. The class is set only behind the flag, so nothing changes with the
     reveal off, and Safari below 16 drops the declaration and behaves as it
     does today. */
  html.reveal-on{overflow-x:clip;}
  .rv-stage.skippable{cursor:pointer;}
  .rv-seats{display:flex;flex-wrap:wrap;justify-content:center;gap:9px;margin:2px 0 18px;max-width:330px;}
  .rv-seat{position:relative;width:32px;height:32px;border-radius:50%;display:grid;place-items:center;flex:none;
    font:600 12px/1 'Inter',sans-serif;color:var(--bgs-ivory-70);background:rgba(var(--bgs-ivory-rgb),.07);border:1px solid rgba(var(--bgs-ivory-rgb),.16);}
  .rv-seat.me{color:var(--bgs-gold);border-color:rgba(var(--bgs-gold-rgb),.6);}
  .rv-chip{position:absolute;right:-6px;bottom:-5px;width:17px;height:17px;border-radius:50%;display:grid;place-items:center;
    font:700 10px/1 'Inter',sans-serif;opacity:0;transform:scale(.5);transition:opacity .22s ease,transform .22s ease;}
  .rv-chip.show{opacity:1;transform:none;}
  .rv-chip.ok{background:var(--bgs-ivory);color:var(--bgs-bg);}
  /* Gold, not sage: same reasoning as .vchip.play above. */
  .rv-chip.play{background:var(--bgs-gold);color:var(--bgs-on-gold);}
  .rv-chip.pass{background:var(--bgs-plate);color:var(--bgs-ivory-45);box-shadow:inset 0 0 0 1px rgba(var(--bgs-ivory-rgb),.22);}
  .rv-chip.novote{background:var(--bgs-bg);color:var(--bgs-ivory-45);box-shadow:inset 0 0 0 1px rgba(var(--bgs-ivory-rgb),.28);font-weight:500;}

  .rv-minis{display:flex;flex-wrap:wrap;justify-content:center;gap:12px 10px;}
  .rv-mini{width:var(--mw,56px);flex:none;transition:transform .45s cubic-bezier(.2,.8,.2,1),opacity .4s ease;}
  .rv-mini .c{aspect-ratio:3/4;border-radius:7px;overflow:hidden;background:var(--bgs-bg-radial);border:1px solid rgba(var(--bgs-gold-rgb),.18);transition:box-shadow .4s ease;}
  .rv-mini .c img{width:100%;height:100%;object-fit:cover;display:block;}
  .rv-pips{display:flex;justify-content:center;gap:2px;margin-top:7px;min-height:6px;}
  .rv-pips i{width:var(--pip,5px);height:var(--pip,5px);flex:none;border-radius:50%;background:rgba(var(--bgs-ivory-rgb),.18);transition:background-color .25s ease;}
  .rv-pips i.on{background:var(--bgs-gold);}
  .rv-num{font:400 10.5px/1 'IBM Plex Mono',monospace;color:var(--bgs-ivory-45);text-align:center;margin-top:7px;}
  .rv-mini.win{transform:translateY(-9px) scale(1.13);}
  .rv-mini.win .c{box-shadow:0 0 0 2px var(--bgs-gold),0 0 26px rgba(var(--bgs-gold-rgb),.3);}
  .rv-minis.decided .rv-mini:not(.win){opacity:.36;}

  .rv-crown{display:none;position:relative;justify-content:center;gap:16px;}
  .rv-stage.done{min-height:0;}
  .rv-stage.done .rv-seats,.rv-stage.done .rv-minis{display:none;}
  .rv-stage.done .rv-crown{display:flex;}
  .rv-cover{position:relative;width:236px;aspect-ratio:3/4;border-radius:14px;overflow:hidden;background:var(--bgs-plate);
    border:1px solid rgba(var(--bgs-gold-rgb),.3);box-shadow:0 0 44px rgba(var(--bgs-gold-rgb),.28),0 18px 34px -10px rgba(0,0,0,.55);}
  .rv-crown.duo .rv-cover{width:150px;}
  .rv-crown.trio .rv-cover{width:104px;}
  .rv-cover img{width:100%;height:100%;object-fit:cover;display:block;}
  @keyframes rv-crown{0%{transform:scale(.5) rotate(-12deg);opacity:0;}55%{transform:scale(1.08) rotate(1.5deg);opacity:1;}75%{transform:scale(.98) rotate(-1deg);}100%{transform:none;opacity:1;}}
  @keyframes rv-flash{0%{opacity:0;transform:translate(-50%,-50%) scale(.3);}25%{opacity:.9;}100%{opacity:0;transform:translate(-50%,-50%) scale(1.7);}}
  @keyframes rv-rise{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:none;}}
  .rv-stage.done.play .rv-cover{animation:rv-crown .75s cubic-bezier(.2,.9,.25,1) both;}
  .rv-stage.done.play .rv-cover:nth-child(3){animation-delay:.12s;}
  /* Two rules here are load-bearing rather than decoration, because an
     absolutely positioned box still widens the page at opacity 0:
     `display:none` by default, since only a single winner ever flashes and at
     150% of a two- or three-cover crown the disc is wider than a phone; and the
     resting `transform`, because only the keyframes centre it, so without it the
     solo disc sits offset by half its own width whenever the animation is NOT
     running (skip tap, refresh, reduced motion). Both push the results screen
     into horizontal scroll. A static transform is not a transition, so the
     animation-only rule still holds for this element. */
  .rv-flash{display:none;position:absolute;left:50%;top:50%;width:150%;aspect-ratio:1;border-radius:50%;pointer-events:none;opacity:0;z-index:-1;
    transform:translate(-50%,-50%);
    background:radial-gradient(closest-side,rgba(var(--bgs-gold-rgb),.75),rgba(var(--bgs-gold-rgb),.15) 55%,transparent 72%);}
  .rv-stage.solo .rv-flash{display:block;}
  /* No fill: `both` would hold the final keyframe, and that keyframe is
     scale(1.7) — a 600px disc pinned over a 390px screen for the rest of the
     page's life. It ends at opacity 0 and the resting state is opacity 0 too,
     so dropping the fill is invisible and the disc returns to its own size. */
  .rv-stage.done.play.solo .rv-flash{animation:rv-flash 1s ease-out;}
  .rv-burst{position:absolute;left:50%;top:50%;width:0;height:0;pointer-events:none;z-index:3;}
  .rv-burst i{position:absolute;left:-4px;top:-6px;width:8px;height:12px;border-radius:2px;opacity:0;}
  h1.rv-swap{animation:rv-rise .35s ease both;}
  /* the seats move under the count pill once the winner is up */
  .winner-meta .rv-seats{margin:14px auto 0;}

  /* ---- winner meta ---- */
  .winner-meta{
    text-align:center;margin-bottom:26px;opacity:0;transform:translateY(6px);
    transition:opacity .4s ease,transform .4s ease;
  }
  .winner-meta.show{opacity:1;transform:none;}
  .winner-title{font-family:'Fraunces',serif;font-weight:600;font-size:19px;line-height:1.3;margin:0 0 4px;}
  .winner-title .amp{color:var(--bgs-ivory-45);font-style:italic;padding:0 2px;}
  .count-pill{
    display:inline-flex;align-items:center;gap:6px;margin-top:8px;cursor:pointer;
    background:rgba(var(--bgs-gold-rgb),.12);border:1px solid rgba(var(--bgs-gold-rgb),.42);
    color:var(--bgs-gold);border-radius:99px;padding:6px 13px;font-size:12px;font-weight:700;
    font-family:inherit;transition:background .15s ease;
  }
  .count-pill .chev{font-size:10px;transition:transform .2s ease;}
  .count-pill[aria-expanded="true"] .chev{transform:rotate(90deg);}
  .winner-names{margin-top:10px;}

  /* ---- vote name chips ----
     Gold, not sage: --bgs-vote-play belongs to the act of swiping right, and
     by this screen that's history — what's on display is a winner. */
  .vchips{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;}
  .vchip{font-size:11px;font-weight:600;border-radius:99px;padding:4px 11px;}
  .vchip.play{background:rgba(var(--bgs-gold-rgb),.12);color:var(--bgs-gold);border:1px solid rgba(var(--bgs-gold-rgb),.4);}
  .vchip.pass{background:transparent;color:var(--bgs-ivory-45);border:1px solid rgba(var(--bgs-ivory-rgb),.15);}
  .vchip.novote{background:transparent;color:var(--bgs-ivory-45);border:1px dashed rgba(var(--bgs-ivory-rgb),.28);font-style:italic;}

  /* ---- the rest of the ranking ---- */
  .rest{opacity:0;transform:translateY(8px);transition:opacity .45s ease,transform .45s ease;}
  .rest.show{opacity:1;transform:none;}
  .rest h2{font-family:'Fraunces',serif;font-weight:600;font-size:14px;color:var(--bgs-ivory-70);text-align:center;margin:0 0 12px;}
  .result-row{
    background:var(--bgs-plate);border:1px solid rgba(var(--bgs-ivory-rgb),.08);
    border-radius:12px;margin-bottom:7px;overflow:hidden;
    opacity:0;transform:translateY(6px);transition:opacity .4s ease,transform .4s ease;
  }
  .rest.show .result-row{opacity:1;transform:none;}
  .row-main{
    display:flex;align-items:center;gap:11px;width:100%;padding:10px 13px;
    background:none;border:none;color:inherit;font:inherit;cursor:pointer;text-align:left;
  }
  .rank{font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--bgs-ivory-45);min-width:18px;}
  .row-thumb{
    width:34px;aspect-ratio:3/4;border-radius:5px;overflow:hidden;flex-shrink:0;
    background:var(--bgs-bg-radial);border:1px solid rgba(var(--bgs-gold-rgb),.18);
  }
  .row-thumb img{width:100%;height:100%;object-fit:cover;display:block;}
  .row-info{flex:1;min-width:0;}
  .row-title{font-size:12.5px;font-weight:600;line-height:1.3;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .row-sub{display:flex;align-items:center;gap:7px;margin-top:4px;}
  .row-count{font-family:'IBM Plex Mono',monospace;font-size:10.5px;color:var(--bgs-ivory-45);white-space:nowrap;}
  .row-names{padding:0 13px 12px 42px;}
  .row-names .vchips{justify-content:flex-start;}
  .row-names[hidden]{display:none;}

  /* ---- footer actions ---- */
  .actions{margin-top:22px;opacity:0;transform:translateY(6px);transition:opacity .45s ease,transform .45s ease;}
  .actions.show{opacity:1;transform:none;}
  .btn-primary{
    display:block;width:100%;background:var(--bgs-gold);color:var(--bgs-on-gold);border:none;
    border-radius:12px;padding:16px;font:inherit;font-size:14.5px;font-weight:700;
    cursor:pointer;text-align:center;text-decoration:none;box-sizing:border-box;
  }
  .btn-primary:disabled{opacity:.5;cursor:not-allowed;}
  .actions-hint{text-align:center;font-size:11.5px;color:var(--bgs-ivory-45);margin:9px 0 0;}
  .req-line{
    display:flex;align-items:center;justify-content:center;gap:7px;
    font-size:12px;font-weight:600;color:var(--bgs-gold);margin:0 0 10px;
  }
  .req-dot{width:6px;height:6px;border-radius:50%;background:var(--bgs-gold);animation:reqpulse 1.6s ease-in-out infinite;}
  @keyframes reqpulse{0%,100%{opacity:1;}50%{opacity:.25;}}
  .btn-primary.requested{
    background:rgba(var(--bgs-gold-rgb),.12);color:var(--bgs-gold);
    border:1px solid rgba(var(--bgs-gold-rgb),.45);cursor:default;
  }
  .btn-ghost{
    display:block;width:100%;margin-top:12px;background:transparent;color:var(--bgs-gold-dim);
    border:1px solid rgba(var(--bgs-gold-rgb),.35);border-radius:12px;padding:14px;
    font:inherit;font-size:13.5px;font-weight:600;cursor:pointer;text-align:center;
    text-decoration:none;box-sizing:border-box;transition:color .15s ease,border-color .15s ease;
  }
  .btn-ghost:hover{color:var(--bgs-gold);border-color:rgba(var(--bgs-gold-rgb),.6);}

  /* ---- info buttons: same affordance as the swipe screen ---- */
  .info-btn{
    position:absolute;top:10px;right:10px;width:30px;height:30px;border-radius:50%;z-index:2;
    background:rgba(0,0,0,.42);backdrop-filter:blur(3px);color:var(--bgs-ivory);
    display:flex;align-items:center;justify-content:center;border:1px solid rgba(var(--bgs-ivory-rgb),.2);
    font-family:'Fraunces',serif;font-style:italic;font-weight:600;font-size:14px;cursor:pointer;
  }
  .row-head{display:flex;align-items:center;}
  .row-head .row-main{flex:1;min-width:0;}
  .row-ibtn{
    width:28px;height:28px;border-radius:50%;flex-shrink:0;margin-right:11px;
    background:rgba(var(--bgs-ivory-rgb),.06);color:var(--bgs-ivory-45);
    display:flex;align-items:center;justify-content:center;border:1px solid rgba(var(--bgs-ivory-rgb),.14);
    font-family:'Fraunces',serif;font-style:italic;font-weight:600;font-size:12.5px;cursor:pointer;
    transition:color .15s ease,border-color .15s ease;
  }
  .row-ibtn:hover{color:var(--bgs-gold);border-color:rgba(var(--bgs-gold-rgb),.4);}

  /* ---- ended / not found ---- */
  .ended p{text-align:center;font-size:13px;color:var(--bgs-ivory-70);line-height:1.6;margin:0 0 22px;}
  .ended-detail{
    font-family:'IBM Plex Mono',monospace;font-size:11px;line-height:1.5;
    color:var(--bgs-ivory-45);text-align:center;margin:-10px 0 22px;word-break:break-word;
  }

  /* Reduced motion: everything lands at its resting state instantly. Nothing
     here depends on animation-fill-mode, so a dropped animation can never
     leave a blank hole where the winner should be. */
  @media (prefers-reduced-motion:reduce){
    .flip{animation:none;}
    .flip-inner{transition:none;}
    .face.cover{transition:none;}
    .winner-meta,.rest,.actions,.result-row{transition:none;}
    .req-dot{animation:none;}
    .rv-mini,.rv-mini .c,.rv-chip,.rv-pips i{transition:none;}
    .rv-cover,.rv-flash,h1.rv-swap{animation:none;}
  }
</style>
</head>
<body>

<div class="screen" id="screen">
  <div class="eyebrow">Game Night</div>
  <h1>Gathering tonight's results&hellip;</h1>
  <div class="deal-wrap">
    <div class="deal" aria-hidden="true">
      <div class="deck-card back">?</div>
      <div class="deck-card back">?</div>
      <div class="deck-card back">?</div>
      <div class="deck-card back">?</div>
      <div class="deal-ring"></div>
    </div>
  </div>
</div>

<footer class="shelf-footer">
  <div class="shelf-footer__row">
    <a class="bgg-badge bgg-badge--small" href="https://boardgamegeek.com" target="_blank" rel="noopener" aria-label="Powered by BoardGameGeek (opens in a new tab)">
      <img src="/assets/powered-by-bgg.svg" alt="" width="150" height="33" loading="lazy">
    </a>
  </div>
  <nav class="shelf-footer__links" aria-label="Legal">
    <a href="/privacy">Privacy</a>
    <a href="/terms">Terms</a>
  </nav>
  <p class="shelf-footer__legal">© 2026 BoardgameShelf.</p>
  <p class="shelf-footer__legal">Game data and images courtesy of BoardGameGeek.</p>
</footer>

<script type="module">
// Absolute paths: this page is reached via a Vercel rewrite (/results/:code),
// so the browser's URL — which relative imports resolve against — is the
// pretty path, not this file's real location. A relative import here 404s
// silently and the whole module script never runs.
import {
  fetchSession, fetchSessionVotes, fetchParticipants, startRematch, sessionErrorMessage,
} from '/js/session.js';
import { joinSessionChannel } from '/js/presence.js';
import { deckFromSession, openGameModal } from '/js/waiting-room.js';
import { fetchGamesForSession, shelfHrefForSession, backLabelForSession } from '/js/shelf-data.js';
import { initCoverLight, setCoverLight } from '/js/cover-light.js';

// ---- count reveal flag (docs/claude-code-spec-results-reveal.md) ----
// Kill switch, same shape as COVER_LIGHT_ENABLED on the swipe screen. Ships
// false: with the flag off this page still teases and flips exactly as it does
// today, and ?reveal=1 is what shows the count-then-crown reveal.
const COUNT_REVEAL_ENABLED = false;
const countRevealOn =
  COUNT_REVEAL_ENABLED || new URLSearchParams(location.search).get('reveal') === '1';
// Built once, before any render: the wash reaches past #screen into the page's
// gutters, and #screen's contents are replaced wholesale on every render.
if (countRevealOn) {
  document.documentElement.classList.add('reveal-on');
  initCoverLight();
}

const screen = document.getElementById('screen');
// Where "Back to the shelf" goes: the owner's shelf once the session is known.
let shelfHref = '/';
let backLabel = 'Back to the shelf';

// Participant names are typed by people and reach markup as attribute values
// (the seat's title), where a quote would break out of the attribute. Same
// helper the shelf picker uses.
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

function codeFromPath() {
  // /results/{code}
  const parts = window.location.pathname.split('/').filter(Boolean);
  return parts[1] || null;
}

// Raw database errors are never shown to players — they get the sentence.
// The underlying error is always logged, and shown on the page only behind
// ?debug=1, matching vote-swipe.html.
const SHOW_ERROR_DETAIL = new URLSearchParams(location.search).has('debug');

function renderEnded(message, detail) {
  if (detail) console.error('[game night]', detail);
  screen.innerHTML = `
    <div class="eyebrow">Game Night</div>
    <h1>Game night over</h1>
    <div class="ended"><p>${message}</p></div>
    ${detail && SHOW_ERROR_DETAIL ? `<p class="ended-detail">${detail}</p>` : ''}
    <a class="btn-primary" href="${shelfHref}">${backLabel}</a>`;
}

function errorDetail(e) {
  return [e?.code, e?.message || String(e), e?.hint].filter(Boolean).join(' · ');
}

/** "Theo", "Theo and Priya", "Theo, Priya, and Sam" */
function joinNames(names) {
  if (names.length === 0) return '';
  if (names.length === 1) return names[0];
  if (names.length === 2) return `${names[0]} and ${names[1]}`;
  return `${names.slice(0, -1).join(', ')}, and ${names[names.length - 1]}`;
}

const code = codeFromPath();
if (!code) {
  renderEnded('That game night has ended, or the code is wrong.');
} else {
  init(code);
}

async function init(code) {
  const myName = sessionStorage.getItem(`gamenight:${code}:name`);
  if (!myName) {
    // Deep-linked without joining — send them through the real join flow.
    window.location.href = `/vote/${code}`;
    return;
  }

  let session;
  try {
    session = await fetchSession(code);
  } catch (e) {
    renderEnded('Something went wrong loading this game night.', errorDetail(e));
    return;
  }
  if (session) { shelfHref = await shelfHrefForSession(session); backLabel = backLabelForSession(session); }

  if (!session) {
    renderEnded('That game night has ended, or the code is wrong.');
    return;
  }
  if (session.status === 'cancelled') {
    renderEnded(`${session.host_name} ended this game night.`);
    return;
  }
  // A stale tab, or someone who refreshed mid-rematch.
  if (session.status === 'waiting') {
    window.location.href = `/vote/${code}`;
    return;
  }
  if (session.status === 'voting') {
    window.location.href = `/vote/${code}/swipe`;
    return;
  }

  let games, participants, votes;
  try {
    games = await fetchGamesForSession(session);
  } catch (e) {
    renderEnded('Something went wrong loading this game night.', errorDetail(e));
    return;
  }

  try {
    // Scoped to the current round: earlier rounds stay on disk so a rematch
    // cannot destroy the first result, and counting them would mix the two.
    [participants, votes] = await Promise.all([
      fetchParticipants(code),
      fetchSessionVotes(code, session.round),
    ]);
  } catch (e) {
    renderEnded('Something went wrong loading the results.', errorDetail(e));
    return;
  }

  const deck = deckFromSession(session, games);
  runResults({ code, session, deck, myName, participants, votes });
}

/**
 * Per game: who played it, who passed, and who never voted at all — the host's
 * "Show results now" can end voting before everyone finishes, so a missing row
 * is a real state and must never be quietly counted as a pass.
 */
function tally(deck, participants, votes) {
  const byGame = new Map(deck.map((g) => [g.bggId, { play: [], pass: [] }]));
  for (const v of votes) {
    const entry = byGame.get(v.game_id);
    if (!entry) continue; // a vote for a game not in this round's deck
    if (v.vote === 'play') entry.play.push(v.participant_name);
    else entry.pass.push(v.participant_name);
  }

  const rows = deck.map((g) => {
    const { play, pass } = byGame.get(g.bggId);
    const voted = new Set([...play, ...pass]);
    return {
      game: g,
      play: participants.filter((n) => play.includes(n)),
      pass: participants.filter((n) => pass.includes(n)),
      noVote: participants.filter((n) => !voted.has(n)),
    };
  });

  // Dense ranking: 1, 2, 2, 3 — ties share a number and the next game takes
  // the very next one. Never skip; a gap reads like a missing row.
  const sorted = [...rows].sort((a, b) => b.play.length - a.play.length);
  let rank = 0, prev = -1;
  return sorted.map((r) => {
    if (r.play.length !== prev) { rank += 1; prev = r.play.length; }
    return { ...r, rank };
  });
}

function runResults({ code, session, deck, myName, participants, votes }) {
  const isHost = myName === session.host_name;
  const total = participants.length;
  const rows = tally(deck, participants, votes);

  // No game earned a single play vote — there is no winner and nothing
  // reveals. Checked before ranking drives anything else.
  const nobody = rows.length === 0 || rows[0].play.length === 0;
  const winners = nobody ? [] : rows.filter((r) => r.rank === 1);
  const rest = nobody ? rows : rows.filter((r) => r.rank !== 1);
  const tie = winners.length > 1;

  let players = [];
  let requestSent = false;
  let navigated = false;
  let timers = [];

  function chipsHTML(r) {
    return `<div class="vchips">
      ${r.play.map((n) => `<span class="vchip play">${n}</span>`).join('')}
      ${r.pass.map((n) => `<span class="vchip pass">${n}</span>`).join('')}
      ${r.noVote.map((n) => `<span class="vchip novote">${n} · no vote</span>`).join('')}
    </div>`;
  }

  function countText(r) {
    const nv = r.noVote.length;
    return `${r.play.length} of ${total}${nv ? ` · ${nv} no vote` : ''}`;
  }

  /** Names of anyone other than me who has asked the host for a rematch. */
  function requesters() {
    return players.filter((p) => p.rematchRequested && p.name !== myName).map((p) => p.name);
  }

  function actionsHTML() {
    const shelf = `<a class="btn-ghost" href="${shelfHref}">${backLabel}</a>`;
    // A clear winner (or nobody at all) gets one action — nothing competes
    // with the result, and re-voting a deck everyone rejected helps nobody.
    if (!tie) return `<a class="btn-primary" href="${shelfHref}">${backLabel}</a>`;

    if (isHost) {
      const names = requesters();
      const line = names.length
        ? `<p class="req-line"><span class="req-dot"></span>${joinNames(names)} ${names.length === 1 ? 'wants' : 'want'} a rematch</p>`
        : '';
      return `${line}
        <button class="btn-primary" id="rematchBtn" type="button">Rematch</button>
        <p class="actions-hint">Everyone votes again — just the ${winners.length} tied games.</p>
        ${shelf}`;
    }
    return requestSent
      ? `<button class="btn-primary requested" type="button" disabled>Rematch requested ✓</button>
         <p class="actions-hint">${session.host_name} can start it — a rematch votes on just the tied games.</p>
         ${shelf}`
      : `<button class="btn-primary" id="requestBtn" type="button">Request a rematch</button>
         <p class="actions-hint">A rematch votes on just the tied games.</p>
         ${shelf}`;
  }

  function wireActions() {
    const rematchBtn = document.getElementById('rematchBtn');
    if (rematchBtn) {
      rematchBtn.addEventListener('click', async () => {
        rematchBtn.disabled = true;
        try {
          await startRematch(code, myName, winners.map((w) => w.game.bggId));
          // Every device navigates on the realtime status change, including
          // this one — not here, so the whole table lands together.
        } catch (e) {
          const message = sessionErrorMessage(e, session.host_name);
          if (message) alert(message);
          rematchBtn.disabled = false;
        }
      });
    }

    const requestBtn = document.getElementById('requestBtn');
    if (requestBtn) {
      requestBtn.addEventListener('click', () => {
        requestSent = true;
        controller.markRematchRequested().catch(() => {});
        refreshActions();
      });
    }
  }

  /** Re-renders just the actions block, so a live request can't restart the reveal. */
  function refreshActions() {
    const actions = document.getElementById('actions');
    if (!actions) return;
    actions.innerHTML = actionsHTML();
    wireActions();
  }

  // ---- count reveal (docs/claude-code-spec-results-reveal.md) ----
  // Layout maths for the minis: narrower covers as the deck grows, rows
  // balanced so the last one is never an orphan (6 → 3+3, 10 → 5+5), and one
  // pip per person — unless a pip would come out under 3px, when a counted-up
  // number reads better than a row of specks.
  const mw = deck.length <= 5 ? 56 : deck.length <= 8 ? 50 : 44;
  const miniRows = Math.ceil(deck.length / 5);
  const perRow = Math.ceil(deck.length / miniRows);
  const minisW = perRow * mw + (perRow - 1) * 10;
  const pip = Math.min(5, Math.floor((mw - (total - 1) * 2) / total));
  const usePips = pip >= 3;

  // The minis render in DECK order, not ranking order, so the row cannot give
  // the result away before the count reaches it.
  const deckRows = deck.map((g) => rows.find((r) => r.game.bggId === g.bggId)).filter(Boolean);

  function stageHTML() {
    const crownClass = winners.length === 2 ? 'duo' : winners.length > 2 ? 'trio' : '';
    return `
      <div class="rv-stage skippable ${tie ? '' : 'solo'}" id="stage">
        <div class="rv-seats" id="seats">
          ${participants.map((n, i) => `
            <span class="rv-seat ${n === myName ? 'me' : ''}" data-seat="${i}" title="${esc(n)}">${esc(Array.from(n)[0] || '?')}<span class="rv-chip"></span></span>`).join('')}
        </div>
        <div class="rv-minis" id="minis" style="--mw:${mw}px;--pip:${pip}px;max-width:${minisW}px">
          ${deckRows.map((r) => `
            <div class="rv-mini" data-mini="${r.game.bggId}">
              <div class="c"><img src="${r.game.image}" alt=""></div>
              ${usePips ? `<div class="rv-pips">${'<i></i>'.repeat(total)}</div>` : '<div class="rv-num">0</div>'}
            </div>`).join('')}
        </div>
        <div class="rv-crown ${crownClass}" id="crown">
          <div class="rv-flash"></div>
          ${winners.slice(0, 3).map((r) => `
            <div class="rv-cover">
              <button class="info-btn" data-info="${r.game.bggId}" aria-label="About ${r.game.title}">i</button>
              <img src="${r.game.image}" alt="${r.game.title} cover">
            </div>`).join('')}
          <div class="rv-burst" id="burst"></div>
        </div>
      </div>`;
  }

  // Seats are addressed by INDEX, never by name: names are user-typed and a
  // quote in one would not survive a selector.
  const REVEAL_KEY = `gamenight:${code}:revealed:${session.round}`;
  const finalHeadline = nobody ? "Nobody's feeling it tonight" : tie ? "It's a tie" : 'Tonight we play';
  const seatChip = (i) => screen.querySelector(`.rv-seat[data-seat="${i}"] .rv-chip`);
  const setChip = (i, kind) => {
    const c = seatChip(i);
    if (!c) return;
    c.className = `rv-chip show ${kind}`;
    c.textContent = { ok: '\u2713', play: '\u2713', pass: '\u2715', novote: '\u2013' }[kind];
  };
  const miniOf = (r) => screen.querySelector(`.rv-mini[data-mini="${r.game.bggId}"]`);
  /** Did the host's "Show results now" cut this person off on any game? */
  const unfinished = (n) => rows.some((r) => r.noVote.includes(n));
  let revealFinished = false;

  /**
   * Lands on the finished result. `animated` is false for a skip tap, a
   * refresh and reduced motion, which land with no crown pop and no confetti.
   */
  function finishReveal(animated) {
    if (revealFinished) return;
    revealFinished = true;
    timers.forEach(clearTimeout);
    timers = [];
    try { sessionStorage.setItem(REVEAL_KEY, '1'); } catch (e) { /* private mode: the count just plays again */ }
    const stage = document.getElementById('stage');
    stage.classList.remove('skippable');
    document.getElementById('headline').textContent = finalHeadline;

    // Every pip in its final state, whatever the count had reached.
    rows.forEach((r) => {
      const m = miniOf(r);
      if (!m) return;
      if (usePips) m.querySelectorAll('.rv-pips i').forEach((p, k) => p.classList.toggle('on', k < r.play.length));
      else m.querySelector('.rv-num').textContent = r.play.length;
    });

    if (nobody) {
      // No crown at all — the minis stay, dimmed. Nothing earned the reveal.
      document.getElementById('minis').classList.add('decided');
    } else {
      stage.classList.add('done');
      if (animated) stage.classList.add('play');
      // A tie has no single game to light the screen with.
      setCoverLight(tie ? null : winners[0].game.image);
      if (animated && !tie) { confetti(); buzz([18, 40, 30]); }
      if (!tie) {
        // The seats move under the count pill and turn over each person's vote
        // on the winning game, one by one.
        document.getElementById('winnerMeta').appendChild(document.getElementById('seats'));
        const w = winners[0];
        participants.forEach((n, i) => {
          const kind = w.play.includes(n) ? 'play' : w.pass.includes(n) ? 'pass' : 'novote';
          seatChip(i).className = 'rv-chip';
          timers.push(setTimeout(() => setChip(i, kind), animated ? 650 + i * 130 : 0));
        });
      }
    }

    const d = animated ? [500, 1300, 1700] : [0, 0, 0];
    timers.push(setTimeout(() => document.getElementById('winnerMeta').classList.add('show'), d[0]));
    timers.push(setTimeout(() => document.getElementById('rest').classList.add('show'), d[1]));
    timers.push(setTimeout(() => document.getElementById('actions').classList.add('show'), d[2]));
  }

  /**
   * Swaps the headline and replays the rise. The class has to come off and go
   * back on with a reflow between, or a second swap re-uses the finished
   * animation and nothing moves.
   */
  function say(text) {
    const h = document.getElementById('headline');
    h.textContent = text;
    h.classList.remove('rv-swap');
    void h.offsetWidth;
    h.classList.add('rv-swap');
  }

  /**
   * Sealed → counting → decided → crowned. Every timeout goes into `timers`,
   * so the rematch and cancelled handlers clear the whole thing by clearing
   * that array.
   */
  function runCount() {
    const stage = document.getElementById('stage');
    // Tap anywhere on the count to skip to the result.
    stage.addEventListener('click', () => { if (!revealFinished) finishReveal(false); });

    let t = 0;
    const at = (ms, f) => { t += ms; timers.push(setTimeout(f, t)); };

    at(900, () => say('Counting the votes'));

    // Ballots tick in round-robin across the deck — pip k of every game, then
    // pip k+1 — so the whole count lasts about 1.5s however many votes there
    // are, rather than dragging out with the table size.
    const totalPlays = rows.reduce((a, r) => a + r.play.length, 0);
    const step = Math.max(40, Math.min(110, Math.round(1500 / Math.max(totalPlays, 1))));
    for (let k = 0; k < total; k++) {
      deckRows.forEach((r) => {
        if (k >= r.play.length) return;
        at(step, () => {
          const m = miniOf(r);
          if (!m) return;
          if (usePips) m.querySelectorAll('.rv-pips i')[k].classList.add('on');
          else m.querySelector('.rv-num').textContent = k + 1;
        });
      });
    }
    // Nobody played anything: nothing ticks, so hold the table instead.
    if (!totalPlays) at(1100, () => {});

    at(450, () => {
      say(nobody ? finalHeadline : tie ? "It's a tie" : 'The table has decided');
      document.getElementById('minis').classList.add('decided');
      winners.forEach((r) => miniOf(r)?.classList.add('win'));
      if (!nobody && !tie) setCoverLight(winners[0].game.image);
      buzz(8);
    });
    at(nobody ? 300 : 950, () => finishReveal(true));
  }

  function buzz(pattern) { try { navigator.vibrate && navigator.vibrate(pattern); } catch (e) { /* not supported */ } }

  /**
   * The gold burst behind the winner. Pieces are created fresh and carry no
   * transition, so animating them is safe under the WebKit rule, and each one
   * removes itself when it lands.
   */
  function confetti() {
    const host = document.getElementById('burst');
    if (!host) return;
    host.innerHTML = '';
    const cols = ['var(--bgs-gold)', 'var(--bgs-vote-play)', 'var(--bgs-vote-pass)', 'var(--bgs-ivory)', 'var(--bgs-gold)'];
    for (let n = 0; n < 34; n++) {
      const el = document.createElement('i');
      el.style.background = cols[n % 5];
      host.appendChild(el);
      const ang = Math.random() * Math.PI * 2;
      const dist = 100 + Math.random() * 160;
      const x = Math.cos(ang) * dist;
      const y = Math.sin(ang) * dist - 60;
      el.animate([
        { transform: 'translate(0,0) rotate(0) scale(.4)', opacity: 1 },
        { transform: `translate(${x}px,${y}px) rotate(${Math.random() * 540 - 270}deg) scale(1)`, opacity: 1, offset: 0.6 },
        { transform: `translate(${x * 1.1}px,${y + 120}px) rotate(${Math.random() * 720 - 360}deg) scale(.9)`, opacity: 0 },
      ], { duration: 1100 + Math.random() * 700, easing: 'cubic-bezier(.15,.8,.3,1)', fill: 'forwards' }).onfinish = () => el.remove();
    }
  }

  function render() {
    timers.forEach(clearTimeout);
    timers = [];

    const revealCards = nobody ? [rows[0]] : winners;

    screen.innerHTML = `
      <div class="eyebrow">Game Night · ${code}</div>
      ${countRevealOn ? `
      <h1 id="headline" style="transition:none">Votes are sealed</h1>
      ${stageHTML()}` : `
      <h1 id="headline">And the table says…</h1>
      <div class="reveal" id="reveal">
        ${revealCards.map((r) => `
          <div class="flip ${tie ? 'duo' : 'solo'}">
            <div class="flip-inner">
              <div class="face facedown deck-card back">?</div>
              <div class="face cover">
                <button class="info-btn" data-info="${r.game.bggId}" aria-label="About ${r.game.title}">i</button>
                <img src="${r.game.image}" alt="${r.game.title} cover">
              </div>
            </div>
          </div>`).join('')}
      </div>`}
      <div class="winner-meta" id="winnerMeta">
        ${nobody ? `
          <p class="winner-title">Everyone passed on everything.</p>
          <p class="actions-hint" style="margin-top:6px;">The shelf awaits — maybe a different deck.</p>`
        : `
          <p class="winner-title">${winners.map((w) => w.game.title).join(' <span class="amp">&</span> ')}</p>
          <button class="count-pill" id="winnerPill" aria-expanded="false">
            ${tie
              ? `Tied — ${winners[0].play.length} of ${total} would play both`
              : `${winners[0].play.length} of ${total} would play`}
            <span class="chev">›</span>
          </button>
          <div class="winner-names" id="winnerNames" hidden>${chipsHTML(winners[0])}</div>`}
      </div>
      <div class="rest" id="rest">
        <h2>${nobody ? 'How the votes fell' : 'How the rest stacked up'}</h2>
        ${rest.map((r, i) => `
          <div class="result-row" style="transition-delay:${(0.08 * i).toFixed(2)}s">
            <div class="row-head">
              <button class="row-main" aria-expanded="false">
                <span class="rank">${nobody ? '–' : r.rank}</span>
                <span class="row-thumb"><img src="${r.game.image}" alt="" loading="lazy"></span>
                <span class="row-info">
                  <span class="row-title">${r.game.title}</span>
                  <span class="row-sub"><span class="row-count">${countText(r)}</span></span>
                </span>
              </button>
              <button class="row-ibtn" data-info="${r.game.bggId}" aria-label="About ${r.game.title}">i</button>
            </div>
            <div class="row-names" hidden>${chipsHTML(r)}</div>
          </div>`).join('')}
      </div>
      <div class="actions" id="actions">${actionsHTML()}</div>`;

    wireActions();

    const pill = document.getElementById('winnerPill');
    if (pill) {
      pill.addEventListener('click', () => {
        const names = document.getElementById('winnerNames');
        const opening = names.hidden;
        names.hidden = !opening;
        pill.setAttribute('aria-expanded', String(opening));
      });
    }

    // The info buttons are siblings of the row body, not nested inside it, so
    // the two adjacent targets keep their separate jobs.
    screen.querySelectorAll('[data-info]').forEach((btn) => {
      btn.addEventListener('click', (e) => {
        e.stopPropagation();
        const game = deck.find((g) => g.bggId === btn.dataset.info);
        if (game) openGameModal(game);
      });
    });

    screen.querySelectorAll('.row-main').forEach((btn) => {
      btn.addEventListener('click', () => {
        const names = btn.closest('.result-row').querySelector('.row-names');
        const opening = names.hidden;
        names.hidden = !opening;
        btn.setAttribute('aria-expanded', String(opening));
      });
    });

    const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
    if (countRevealOn) {
      // Sealed: a tick for everyone who finished, a dash for anyone the host's
      // "Show results now" cut off.
      participants.forEach((n, i) => setChip(i, unfinished(n) ? 'novote' : 'ok'));
      // Seen this round's reveal already (refresh, back-navigation), or
      // reduced motion: land on the result rather than counting it out again.
      let seen = false;
      try { seen = sessionStorage.getItem(REVEAL_KEY) === '1'; } catch (e) { /* private mode: count it again */ }
      if (seen || reduced) finishReveal(false);
      else runCount();
    } else {
      // tease → flip → title + count → ranking → actions
      const t = reduced ? [0, 0, 0, 0] : [1100, 1750, 2350, 2750];
      timers.push(setTimeout(() => {
        screen.querySelectorAll('.flip').forEach((f) => f.classList.add(nobody ? 'nobody' : 'revealed'));
        document.getElementById('headline').textContent =
          nobody ? "Nobody's feeling it tonight" : (tie ? "It's a tie" : "Tonight's game");
      }, t[0]));
      timers.push(setTimeout(() => document.getElementById('winnerMeta').classList.add('show'), t[1]));
      timers.push(setTimeout(() => document.getElementById('rest').classList.add('show'), t[2]));
      timers.push(setTimeout(() => document.getElementById('actions').classList.add('show'), t[3]));
    }
  }

  render();

  const controller = joinSessionChannel({
    code,
    participantName: myName,
    isHost,
    finished: true,
    onPresence: ({ players: p }) => {
      players = p;
      // Only the actions block depends on presence, and re-rendering the whole
      // screen would restart the reveal every time someone's tab reconnects.
      refreshActions();
    },
    onStatus: (status) => {
      if (navigated) return;
      if (status === 'voting') {
        // A rematch started — everyone lands on the swipe screen together.
        navigated = true;
        timers.forEach(clearTimeout);
        // Fade the wash before navigating, so it does not flash on the way out.
        setCoverLight(null);
        controller.leave();
        window.location.href = `/vote/${code}/swipe`;
      } else if (status === 'cancelled') {
        navigated = true;
        timers.forEach(clearTimeout);
        controller.leave();
        renderEnded(`${session.host_name} ended this game night.`);
      }
    },
  });

  window.addEventListener('pagehide', () => controller.leave());
}
</script>
</body>
</html>
