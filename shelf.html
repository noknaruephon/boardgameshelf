// across filter changes, so every caller has to tolerate that.
function cardNodeFor(id){
  return document.getElementById('shelf').querySelector(`.game-card[data-id="${id}"]`);
}

function clearSelectedCards(){
  document.getElementById('shelf')
    .querySelectorAll('.game-card.selected')
    .forEach(el => el.classList.remove('selected'));
}

// Deliberately does NOT call render(): selecting a game changes neither what
// matches the filters nor the order, so rebuilding the grid would only throw
// away the cover images and the scroll position.
function toggleSelect(g){
  const nowSelected = !state.selectedIds.has(g.bggId);
  if(nowSelected) state.selectedIds.add(g.bggId);
  else state.selectedIds.delete(g.bggId);
  cardNodeFor(g.bggId)?.classList.toggle('selected', nowSelected);
  updateGnBar();
  gameModal.refreshFooter();
}


function showGnToast(msg){
  const toast = document.getElementById('gnToast');
  toast.textContent = msg;
  toast.classList.add('open');
  clearTimeout(showGnToast._t);
  showGnToast._t = setTimeout(()=> toast.classList.remove('open'), 2600);
}

function openGnBackdrop(el){
  el.classList.add('open');
  syncScrollLock();
}
function closeGnBackdrop(el){
  el.classList.remove('open');
  syncScrollLock();
}

function sampleN(arr, n){
  const copy = arr.slice();
  for(let i = copy.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [copy[i], copy[j]] = [copy[j], copy[i]];
  }
  return copy.slice(0, n);
}

function currentGnGameIds(){
  return gnState.mode === 'random'
    ? gnState.surprisePool.map(g => g.bggId)
    : Array.from(state.selectedIds);
}

// ---- selection mode: bottom bar + tray ----

// The cards carry their checkbox and info button whenever either picking mode
// is available; only `body.is-selecting` decides whether they show. So entering
// selection or packing is a body-class flip, not a re-render.
// Wavefront speed, px/s — the one knob for the entrance. It sets both how fast the
// ring travels and how far apart the card pops are staggered, which is what keeps
// the two in step. 1900 lands the top corners of a phone viewport at ~0.44s.
const GN_WAVE_SPEED = 1900;

// Half the wave dot's 12px, i.e. its radius at scale 1.
const GN_WAVE_DOT_R = 6;

// The gold ring that travels out from whatever was tapped to start picking.
// Either mode can be the first to need it, so it is built on demand.
function ensureGnWave(){
  if(gnWave) return gnWave;
  gnWave = document.createElement('div');
  gnWave.className = 'gn-wave';
  gnWave.setAttribute('aria-hidden', 'true');
  document.body.appendChild(gnWave);
  return gnWave;
}

// One entrance for both picking modes: measure the cards from the tapped
// control, flip the class, send the wave. `gn-waving` is what carries the
// per-card stagger, and it comes off once the last card has popped.
function runSelectionWave(origin){
  if(!origin) return;
  ensureGnWave();
  primeGnWave(origin);              // measure before the class flip
  document.body.classList.add('gn-waving');
  startGnWave(origin);
  clearTimeout(runSelectionWave._t);
  runSelectionWave._t = setTimeout(()=>document.body.classList.remove('gn-waving'), 800);
}

function stopSelectionWave(){
  clearTimeout(runSelectionWave._t);
  document.body.classList.remove('gn-waving');
  if(gnWave) gnWave.getAnimations().forEach(a => a.cancel());
}

function primeGnWave(origin){
  if(!origin) return;
  const r = origin.getBoundingClientRect();
  const ox = r.left + r.width / 2, oy = r.top + r.height / 2;

  document.querySelectorAll('.game-card').forEach(card => {
    const b = card.getBoundingClientRect();
    // Offscreen cards snap in so scrolling never reveals a half-finished animation.
    if(b.bottom < 0 || b.top > window.innerHeight){ card.style.setProperty('--gn-d', '0s'); return; }
    const d = Math.hypot(b.left + b.width / 2 - ox, b.top + b.height / 2 - oy);
    card.style.setProperty('--gn-d', (d / GN_WAVE_SPEED).toFixed(3) + 's');
  });
}

// The ring expands at GN_WAVE_SPEED — the same px/s the card stagger uses — so the
// wavefront and the pops it sets off stay in step. It stops at the furthest
// viewport corner: going further only stretches the border into a smear. A fixed
// scale and duration cleared a phone screen in about 100ms, three times ahead of
// the ripple and gone before it registered.
function startGnWave(origin){
  if(!gnWave) return;
  gnWave.getAnimations().forEach(a => a.cancel());
  if(window.matchMedia('(prefers-reduced-motion:reduce)').matches) return;

  if(!origin) return;
  const r = origin.getBoundingClientRect();
  const ox = r.left + r.width / 2, oy = r.top + r.height / 2;
  const reach = Math.max(
    Math.hypot(ox, oy), Math.hypot(window.innerWidth - ox, oy),
    Math.hypot(ox, window.innerHeight - oy), Math.hypot(window.innerWidth - ox, window.innerHeight - oy)
  );

  gnWave.animate(
    [
      { transform: 'scale(1)', opacity: 0.9, borderWidth: '2px' },
      { opacity: 0.5, offset: 0.55 },
      { transform: `scale(${(reach / GN_WAVE_DOT_R).toFixed(1)})`, opacity: 0, borderWidth: '0.5px' },
    ],
    { duration: (reach / GN_WAVE_SPEED) * 1000, easing: 'linear', fill: 'forwards' }
  );
}

function enterSelectionMode(){
  state.selectionMode = true;
  document.body.classList.add('gn-selecting', 'is-selecting');
  runSelectionWave(document.getElementById('gnStartBtn'));
  updateGnBar();
}

function exitSelectionMode(){
  state.selectionMode = false;
  state.selectedIds.clear();
  clearSelectedCards();
  document.body.classList.remove('gn-selecting', 'is-selecting');
  stopSelectionWave();
  gnState.mode = null;
  closeGnTray();
  invite?.reset();
  updateGnBar();
}

function openGnTray(){ document.body.classList.add('gn-tray-open'); syncScrollLock(); syncSelbarChip(); renderGnTray(); renderSelbarList(); }
function closeGnTray(){ document.body.classList.remove('gn-tray-open'); syncScrollLock(); syncSelbarChip(); }
function syncSelbarChip(){
  document.getElementById('selbarChip')?.setAttribute('aria-expanded', String(document.body.classList.contains('gn-tray-open')));
}
document.addEventListener('keydown', (e)=>{
  if(e.key === 'Escape' && document.body.classList.contains('gn-tray-open')) closeGnTray();
});

// The chooser, surprise, and confirm dialogs share one predicate — only ever
// one is open, and which of them it is makes no difference to the lock.
registerOverlay(() => document.querySelector('.gn-backdrop.open') !== null);
registerOverlay(() => document.body.classList.contains('gn-tray-open'));

function updateGnBar(){
  const n = state.selectedIds.size;
  const hint = n < GN_MIN_SELECT ? `Pick at least ${GN_MIN_SELECT - n} more` : 'Ready to go';
  const btn = document.getElementById('gnBarCount');
  // Always shown, including at zero, so the bar states the target up front
  // rather than appearing only once the host has already guessed at it. The
  // button still disables at zero — there's no tray to open — and the CSS
  // hides the chevron in that state so it reads as a label, not an affordance.
  btn.innerHTML = `
    <span class="count-line">${n} selected${GN_CHEV_SVG}</span>
    <small>${hint}</small>
  `;
  btn.disabled = n === 0;
  document.getElementById('gnBarContinue').disabled = n < GN_MIN_SELECT;
  invite?.onSelection();
  if(n === 0) closeGnTray();
  renderSelbar();
  // The lists (tray, floating bar) rebuild their rows only while open —
  // openGnTray builds them — so a tap on a card does not re-create every
  // selected row's markup and image.
  if(document.body.classList.contains('gn-tray-open') || n === 0){ renderGnTray(); renderSelbarList(); }
}

// Deselect from a list (tray or floating bar): same routine either way.
function deselectFromList(id){
  state.selectedIds.delete(id);
  cardNodeFor(id)?.classList.remove('selected');
  updateGnBar();
  gameModal.refreshFooter();
}

// The floating glass bar: chip, pill, share and its list, all read from
// state.selectedIds. No logic of its own — see updateGnBar for the rules.
function renderSelbar(){
  const bar = document.getElementById('selbar');
  if(!bar) return;
  const n = state.selectedIds.size;
  const ok = n >= GN_MIN_SELECT;
  const chip = document.getElementById('selbarChip');
  document.getElementById('selbarChipTxt').textContent = `${n} selected`;
  chip.classList.toggle('ok', ok);
  chip.disabled = n === 0;
  const pill = document.getElementById('selbarPill');
  pill.classList.toggle('gold', ok);
  pill.disabled = !ok;
  document.getElementById('selbarPillTxt').textContent = ok ? `Continue · ${n}` : `Pick ${GN_MIN_SELECT - n} more`;
  // Share works from one pick: the invite module enables its button at n ≥ 1.
  document.getElementById('selbarShare').classList.toggle('hide', n === 0);
}

function renderSelbarList(){
  if(!document.getElementById('selbar')) return;
  const n = state.selectedIds.size;
  // Rows go in the inner scroller, not the glass box: on iOS the children of
  // an element that both blurs its backdrop and scrolls do not paint.
  const list = document.getElementById('selbarListScroll');
  const ids = Array.from(state.selectedIds);
  list.innerHTML = n ? `<h4>Selected · ${n}</h4>` + ids.map(id => {
    const g = games.find(x => x.bggId === id);
    if(!g) return '';
    return `
      <div class="selbar__item">
        <img src="${g.image}" alt="" loading="lazy" onerror="this.remove()">
        <div class="selbar__txt"><b>${g.title}</b><span>★ ${g.bggRating.toFixed(1)} · ${playersRangeLabel(g.players)}</span></div>
        <button class="selbar__rm" type="button" data-remove="${id}" aria-label="Remove ${g.title}">${GN_X_SVG}</button>
      </div>`;
  }).join('') : '<div class="selbar__empty">Nothing picked yet.</div>';
  list.querySelectorAll('[data-remove]').forEach(btn => {
    btn.addEventListener('click', ()=>deselectFromList(btn.dataset.remove));
  });
}

function renderGnTray(){
  const list = document.getElementById('gnTrayList');
  const visible = gnFilteredIdSet();
  const ids = Array.from(state.selectedIds);
  list.innerHTML = ids.map(id => {
    const g = games.find(x => x.bggId === id);
    if(!g) return '';
    const off = visible.has(id) ? '' : '<span class="gn-tray__offscreen">hidden by filters</span>';
    return `
      <div class="gn-tray__row">
        <div class="gn-tray__thumb"><img src="${g.image}" alt="" loading="lazy" onerror="this.remove()"></div>
        <div class="gn-tray__meta">
          <b>${g.title}</b>
          <span>${playersRangeLabel(g.players)} · ${timeLabel(g.time)}</span>${off}
        </div>
        <button class="gn-tray__remove" type="button" data-remove="${id}" aria-label="Remove ${g.title}">${GN_X_SVG}</button>
      </div>
    `;
  }).join('');
  list.querySelectorAll('[data-remove]').forEach(btn => {
    btn.addEventListener('click', ()=>deselectFromList(btn.dataset.remove));
  });
}

// ---- surprise-us path ----

// Refills only the unkept slots, leaving kept cards at the position they were
// already in. With both surprisePool and kept empty this is the first-open case
// and degrades to a plain sampleN. Pool-too-small is guarded by GN_MIN_POOL at
// the FAB, so there is nothing to check here.
function sampleSurprise(){
  const pool = gnPool();
  const target = Math.min(GN_SURPRISE_COUNT, pool.length);
  const keptIds = gnState.kept;
  const keptCount = gnState.surprisePool.filter(g => keptIds.has(g.bggId)).length;
  const fresh = sampleN(pool.filter(g => !keptIds.has(g.bggId)), target - keptCount);
  const next = [];
  let f = 0;
  for(const g of gnState.surprisePool){
    if(keptIds.has(g.bggId)) next.push(g);
    else if(f < fresh.length) next.push(fresh[f++]);
  }
  while(f < fresh.length) next.push(fresh[f++]);
  gnState.surprisePool = next.slice(0, target);
}

function swapSurpriseAt(index){
  const onBoard = new Set(gnState.surprisePool.map(g => g.bggId));
  const [pick] = sampleN(gnPool().filter(g => !onBoard.has(g.bggId)), 1);
  if(!pick) return; // pool exhausted — leave the card where it is
  gnState.surprisePool[index] = pick;
}

// One card, wrapper included, so rollSurpriseCards can replace a single node
// instead of rebuilding the grid.
function renderSurpriseCard(g, i){
  const kept = gnState.kept.has(g.bggId);
  return `
      <div class="gn-surprise-flip" data-index="${i}">
      <div class="gn-surprise-card" role="button" tabindex="0" aria-pressed="${kept}" data-index="${i}" data-id="${g.bggId}">
        <div class="art"><img src="${g.image}" alt="" loading="lazy" onerror="this.remove()"></div>
        <div class="meta">
          <div class="t">${g.title}</div>
          <div class="s">${playersRangeLabel(g.players)} · ${timeLabel(g.time)}</div>
        </div>
        <span class="lock" aria-hidden="true">${GN_LOCK_SVG}</span>
        <button class="swap" type="button" data-swap="${i}" aria-label="Swap ${g.title}" ${kept ? 'hidden' : ''}>${GN_ROLL_SVG}</button>
        <span class="sr-only" data-keptlabel data-title="${g.title}">${kept ? 'Kept' : 'Not kept'}: ${g.title}</span>
      </div>
      </div>`;
}

function renderSurprise(){
  const grid = document.getElementById('gnSurpriseGrid');
  grid.innerHTML = gnState.surprisePool.map(renderSurpriseCard).join('');
  updateSurpriseControls();
}

function updateSurpriseControls(){
  const total = gnState.surprisePool.length;
  const kept = gnState.surprisePool.filter(g => gnState.kept.has(g.bggId)).length;
  const loose = total - kept;
  document.getElementById('gnRerollN').textContent = loose;
  document.getElementById('gnRerollBtn').disabled = loose === 0;
}

// Cards start this far apart, so six of them read as a wave across the board
// rather than a simultaneous pop. Past ~90ms it starts to feel slow.
const GN_ROLL_STAGGER_MS = 70;
let gnRolling = false;

// indices: which slots to flip. mutate(): applies the new sample to surprisePool.
// mutate() runs *before* the wave, so currentGnGameIds() is already correct if the
// host taps Continue mid-flip; gnRolling only stops a second re-roll overlapping
// the first. The DOM is patched per card at the flip edge rather than re-rendered,
// so kept cards keep their nodes (and focus) and don't blink.
function rollSurpriseCards(indices, mutate){
  if(gnRolling || indices.length === 0) return;
  const reduced = window.matchMedia('(prefers-reduced-motion:reduce)').matches;
  const before = gnState.surprisePool.length;
  mutate();
  // A length change would leave the captured indices pointing at nothing, so
  // fall back to a full render. Reduced motion takes the same path.
  if(reduced || gnState.surprisePool.length !== before){ renderSurprise(); return; }

  gnRolling = true;
  document.getElementById('gnRerollBtn').disabled = true;
  const grid = document.getElementById('gnSurpriseGrid');
  let remaining = indices.length;

  indices.forEach((i, k) => {
    const wrap = grid.querySelector(`.gn-surprise-flip[data-index="${i}"]`);
    if(!wrap){ if(--remaining === 0){ gnRolling = false; updateSurpriseControls(); } return; }
    setTimeout(() => {
      wrap.classList.add('out');
      wrap.addEventListener('animationend', () => {
        wrap.classList.remove('out');
        wrap.outerHTML = renderSurpriseCard(gnState.surprisePool[i], i); // face swap at the edge
        const fresh = grid.querySelector(`.gn-surprise-flip[data-index="${i}"]`);
        fresh.classList.add('in');
        fresh.addEventListener('animationend', () => {
          fresh.classList.remove('in');
          if(--remaining === 0){ gnRolling = false; updateSurpriseControls(); }
        }, { once:true });
      }, { once:true });
    }, k * GN_ROLL_STAGGER_MS);
  });
}

// ---- confirm step (both paths converge here) ----

function syncRevealToggleUI(){
  const toggle = document.getElementById('gnRevealToggle');
  // The label is a fixed phrase; aria-checked carries the state, which is what
  // both the gold active styling and screen readers read it from.
  toggle.setAttribute('aria-checked', String(gnState.revealDeck));
}

function updateConfirmSummary(){
  const n = currentGnGameIds().length;
  const modeLabel = gnState.mode === 'random' ? 'Random picks' : 'You picked them';
  document.getElementById('gnSummary').textContent = `${n} game${n === 1 ? '' : 's'} · ${modeLabel}`;
}

function openConfirm(){
  const errorEl = document.getElementById('gnConfirmError');
  errorEl.classList.remove('show');
  const revealField = document.getElementById('gnRevealField');
  if(gnState.mode === 'random'){
    revealField.hidden = true;
    gnState.revealDeck = false;
  } else {
    revealField.hidden = false;
    syncRevealToggleUI();
  }
  updateConfirmSummary();
  openGnBackdrop(document.getElementById('gnConfirmBackdrop'));
  document.getElementById('gnHostName').focus();
}

async function handleGnStart(){
  const nameInput = document.getElementById('gnHostName');
  const hostName = nameInput.value.trim();
  const errorEl = document.getElementById('gnConfirmError');
  if(!hostName){
    errorEl.textContent = 'Enter your name to continue.';
    errorEl.classList.add('show');
    nameInput.focus();
    return;
  }
  const mode = gnState.mode === 'random' ? 'random' : 'manual';
  const gameIds = currentGnGameIds();
  const revealDeck = mode === 'random' ? false : gnState.revealDeck;

  const startBtn = document.getElementById('gnConfirmStart');
  errorEl.classList.remove('show');
  startBtn.disabled = true;
  startBtn.textContent = 'Starting…';
  try {
    const { createGameNight } = await gnSessionModPromise;
    const code = await createGameNight({ hostName, mode, revealDeck, gameIds, ownerId: profile.id, bagId: isBagRoute ? bagRouteId : null });
    sessionStorage.setItem(`gamenight:${code}:name`, hostName);
    location.href = `/night/${code}/host`;
  } catch (err) {
    errorEl.textContent = "Couldn't start the game night. Try again.";
    errorEl.classList.add('show');
    startBtn.disabled = false;
    startBtn.textContent = 'Start Game Night';
  }
}

// ---- wiring ----

function initGameNight(){
  gnSessionModPromise = import('/js/session.js');

  // Entry point: a floating pill fixed bottom-centre, above the grid but below
  // every bar, sheet, and modal. Labelled, because an icon alone would give no
  // clue what it does. Still built only when the flag is on, so with the flag
  // off it is absent from the DOM rather than merely hidden.
  // The pill and the sheet it morphs into are one element (see .gn-fab).
  // The pill button toggles it; the sheet holds the single entry action the
  // pill used to fire directly, plus close.
  const gnStartBtn = document.createElement('div');
  gnStartBtn.className = 'gn-fab glass';
  gnStartBtn.id = 'gnStartBtn';
  gnStartBtn.innerHTML = `
    <button class="gn-fab__pill" id="gnPill" type="button" aria-label="Start Game Night" aria-expanded="false" aria-controls="gnSheet">${GN_DIE_SVG}Game Night</button>
    <div class="gn-fab__sheet" id="gnSheet" role="dialog" aria-modal="true" aria-labelledby="gnSheetTitle" aria-hidden="true">
      <button class="gn-fab__close" id="gnSheetClose" type="button" aria-label="Close">✕</button>
      <h2 id="gnSheetTitle">${GN_DIE_SVG}Game night</h2>
      <p>Pick how tonight starts.</p>
      <button class="gn-opt glass" id="gnSelectGames" type="button">
        <span class="gn-opt__ic" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg></span>
        <span class="gn-opt__txt"><b>Select games</b><span>Pick the lineup from the shelf yourself</span></span>
        <span class="gn-opt__chev" aria-hidden="true">›</span>
      </button>
      <button class="gn-opt glass" id="gnRandom" type="button">
        <span class="gn-opt__ic" aria-hidden="true">${GN_ROLL_SVG}</span>
        <span class="gn-opt__txt"><b>Random</b><span>Pick 6 games for us, keep the ones you like</span></span>
        <span class="gn-opt__chev" aria-hidden="true">›</span>
      </button>
    </div>
  `;
  const gnFabScrim = document.createElement('div');
  gnFabScrim.className = 'gn-fab-scrim';
  document.body.append(gnFabScrim, gnStartBtn);
  const gnPill = gnStartBtn.querySelector('#gnPill');
  const gnSheet = gnStartBtn.querySelector('#gnSheet');
  const gnSelectGames = gnStartBtn.querySelector('#gnSelectGames');
  const gnRandom = gnStartBtn.querySelector('#gnRandom');

  function isGnSheetOpen(){ return gnStartBtn.classList.contains('is-open'); }
  function openGnSheet(){
    gnStartBtn.classList.add('is-open');
    gnFabScrim.classList.add('open');
    gnPill.setAttribute('aria-expanded', 'true');
    gnSheet.setAttribute('aria-hidden', 'false');
    syncScrollLock();
    gnSelectGames.focus({ preventScroll: true });
  }
  function closeGnSheet(refocus = true){
    if(!isGnSheetOpen()) return;
    gnStartBtn.classList.remove('is-open');
    gnFabScrim.classList.remove('open');
    gnPill.setAttribute('aria-expanded', 'false');
    gnSheet.setAttribute('aria-hidden', 'true');
    syncScrollLock();
    if(refocus) gnPill.focus({ preventScroll: true });
  }
  registerOverlay(isGnSheetOpen);
  // Runs fn once the box has morphed back to the pill. The morph (a blurred
  // box resizing) and what follows it (the selection wave over every card,
  // or the surprise sheet rising) are each heavy on the compositor; starting
  // both in the same frame is what made iOS Safari reload the page. With no
  // transition (reduced motion) it runs at once.
  function afterGnMorph(fn){
    if(getComputedStyle(gnStartBtn).transitionDuration.split(',').every(d => parseFloat(d) === 0)){ fn(); return; }
    let done = false;
    const go = ()=>{ if(done) return; done = true; gnStartBtn.removeEventListener('transitionend', onEnd); fn(); };
    const onEnd = (e)=>{ if(e.target === gnStartBtn && e.propertyName === 'height') go(); };
    gnStartBtn.addEventListener('transitionend', onEnd);
    setTimeout(go, 700);
  }
  gnFabScrim.addEventListener('click', ()=>closeGnSheet());
  gnStartBtn.querySelector('#gnSheetClose').addEventListener('click', ()=>closeGnSheet());
  document.addEventListener('keydown', (e)=>{
    if(e.key === 'Escape' && isGnSheetOpen()){ e.preventDefault(); closeGnSheet(); }
  });

  ensureGnWave();

  document.body.insertAdjacentHTML('beforeend', `
    <div class="gn-toast" id="gnToast"></div>

    <div class="gn-backdrop gn-backdrop--sheet" id="gnSurpriseBackdrop">
      <div class="gn-panel gn-sheet" role="dialog" aria-modal="true" aria-labelledby="gnSurpriseTitle">
        <div class="gn-sheet__grab" aria-hidden="true"></div>
        <h3 id="gnSurpriseTitle">Tonight's surprise</h3>
        <p class="gn-sub">Tap a game to keep it. Re-roll swaps the rest.</p>
        <!-- Glass path only (css/glass.css shows it): the header × takes over
             from the Cancel link below; same handler. -->
        <button class="gn-sheet__x glass" id="gnSurpriseX" type="button" aria-label="Cancel">${GN_X_SVG}</button>
        <div class="gn-surprise-grid" id="gnSurpriseGrid"></div>
        <div class="gn-row">
          <button class="gn-secondary-btn glass" id="gnRerollBtn" type="button">${GN_ROLL_SVG} Re-roll <span id="gnRerollN"></span></button>
          <button class="gn-primary-btn" id="gnSurpriseContinue" type="button">Continue</button>
        </div>
        <button class="gn-cancel-link" id="gnSurpriseCancel" type="button">Cancel</button>
      </div>
    </div>

    <div class="gn-backdrop" id="gnConfirmBackdrop">
      <div class="gn-panel" role="dialog" aria-modal="true" aria-labelledby="gnConfirmTitle">
        <h3 id="gnConfirmTitle">Almost ready</h3>
        <p class="gn-error" id="gnConfirmError">Couldn't start the game night. Try again.</p>
        <div class="gn-field">
          <label for="gnHostName">Your name</label>
          <input class="gn-text-input" id="gnHostName" type="text" placeholder="e.g. Nok" autocomplete="off">
        </div>
        <div class="gn-field" id="gnRevealField">
          <button type="button" class="toggle-row" id="gnRevealToggle" role="switch" aria-checked="false">
            <span class="toggle-switch" aria-hidden="true"></span>
            <span class="toggle-label">Reveal selection</span>
          </button>
        </div>
        <p class="gn-summary" id="gnSummary"></p>
        <div class="gn-row">
          <button class="gn-secondary-btn" id="gnConfirmBack" type="button">Back</button>
          <button class="gn-primary-btn" id="gnConfirmStart" type="button">Start Game Night</button>
        </div>
      </div>
    </div>

    <div class="gn-scrim" id="gnScrim"></div>
    <div class="gn-tray" id="gnTray">
      <div class="gn-tray__head">
        <h4>Tonight's deck</h4>
        <button class="gn-tray__clear" id="gnTrayClear" type="button">Clear all</button>
      </div>
      <div class="gn-tray__list" id="gnTrayList"></div>
    </div>
    <div class="gn-bar" id="gnBar">
      <button class="gn-bar__cancel" id="gnBarCancel" type="button">Cancel</button>
      <button class="gn-bar__count" id="gnBarCount" type="button" disabled></button>
      <button class="gn-bar__continue" id="gnBarContinue" type="button" disabled>Continue</button>
    </div>

    <!-- Floating glass selection bar (docs/claude-code-spec-selection-bar.md):
         a view over the same selection state as .gn-bar, shown by
         css/glass.css in its place. Its list opens with the tray's own
         open/close (body.gn-tray-open, the scrim, the scroll lock). -->
    <div class="selbar" id="selbar">
      <div class="selbar__list glass" id="selbar-list"><div class="selbar__scroll" id="selbarListScroll"></div></div>
      <button class="selbar__chip glass" id="selbarChip" type="button" aria-expanded="false" aria-controls="selbar-list" disabled>
        <span id="selbarChipTxt">0 selected</span><span class="selbar__chev" aria-hidden="true">${GN_CHEV_SVG}</span>
      </button>
      <div class="selbar__row">
        <button class="selbar__round glass" id="selbarCancel" type="button" aria-label="Cancel">${GN_X_SVG}</button>
        <button class="selbar__pill glass" id="selbarPill" type="button" disabled>${GN_DIE_SVG}<span id="selbarPillTxt">Pick ${GN_MIN_SELECT} more</span></button>
        <button class="selbar__round glass hide" id="selbarShare" type="button" aria-label="Share invite"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="6" cy="12" r="2"/><circle cx="18" cy="6" r="2"/><circle cx="18" cy="18" r="2"/><path d="M8 11l8-4M8 13l8 4"/></svg></button>
      </div>
    </div>
  `);

  // entry point: the pill opens the sheet with the two ways in — pick the
  // lineup yourself (selection mode), or let the shelf pick (the surprise
  // sheet). The pool check stays on the pill so a shelf with too few matches
  // gets the toast instead of a sheet with nothing to do.
  gnPill.addEventListener('click', ()=>{
    const pool = gnPool();
    if(pool.length < GN_MIN_POOL){
      showGnToast('Not enough games match these filters');
      return;
    }
    openGnSheet();
  });
  gnSelectGames.addEventListener('click', ()=>{
    closeGnSheet(false);
    gnState.mode = 'manual';
    afterGnMorph(enterSelectionMode);
  });
  gnRandom.addEventListener('click', ()=>{
    closeGnSheet(false);
    gnState.mode = 'random';
    // A reopen starts from scratch — never inherits the previous sheet's keeps.
    gnState.surprisePool = [];
    gnState.kept.clear();
    sampleSurprise();
    renderSurprise();
    afterGnMorph(()=>openGnBackdrop(document.getElementById('gnSurpriseBackdrop')));
  });

  // surprise view
  const gnSurpriseGrid = document.getElementById('gnSurpriseGrid');

  // Patches the one card in place rather than re-rendering the grid: that keeps
  // the padlock's scale transition (a fresh node would start at scale 1), keeps
  // keyboard focus on the card, and doesn't re-request the covers.
  function toggleKept(card){
    const id = card.dataset.id;
    const kept = !gnState.kept.has(id);
    kept ? gnState.kept.add(id) : gnState.kept.delete(id);
    card.setAttribute('aria-pressed', String(kept));
    card.querySelector('.swap').hidden = kept;
    const label = card.querySelector('[data-keptlabel]');
    label.textContent = `${kept ? 'Kept' : 'Not kept'}: ${label.dataset.title}`;
    updateSurpriseControls();
  }

  gnSurpriseGrid.addEventListener('click', e => {
    const swap = e.target.closest('[data-swap]');
    if(swap){
      e.stopPropagation();
      const i = Number(swap.dataset.swap);
      rollSurpriseCards([i], () => swapSurpriseAt(i));
      return;
    }
    const card = e.target.closest('.gn-surprise-card');
    if(card) toggleKept(card);
  });
  gnSurpriseGrid.addEventListener('keydown', e => {
    const card = e.target.closest('.gn-surprise-card');
    if(!card || (e.key !== 'Enter' && e.key !== ' ')) return;
    e.preventDefault();
    toggleKept(card);
  });

  document.getElementById('gnRerollBtn').addEventListener('click', ()=>{
    // Zero network requests — resamples from what's already loaded.
    const loose = gnState.surprisePool.map((g, i) => gnState.kept.has(g.bggId) ? -1 : i).filter(i => i >= 0);
    rollSurpriseCards(loose, sampleSurprise);
  });
  document.getElementById('gnSurpriseContinue').addEventListener('click', ()=>{
    closeGnBackdrop(document.getElementById('gnSurpriseBackdrop'));
    openConfirm();
  });

  // Back to where it was opened from: the Game Night sheet's Random option
  // lands on the plain shelf, the pill ready again. Cancel, scrim tap and
  // Esc all land here.
  function dismissSurprise(){
    closeGnBackdrop(document.getElementById('gnSurpriseBackdrop'));
    gnState.mode = null;
    gnState.surprisePool = [];
    gnState.kept.clear();
  }
  document.getElementById('gnSurpriseCancel').addEventListener('click', dismissSurprise);
  document.getElementById('gnSurpriseX').addEventListener('click', dismissSurprise);
  document.addEventListener('keydown', e => {
    if(e.key === 'Escape' && document.getElementById('gnSurpriseBackdrop').classList.contains('open')){
      dismissSurprise();
    }
  });

  // selection-mode bottom bar
  document.getElementById('gnBarCancel').addEventListener('click', exitSelectionMode);
  document.getElementById('gnBarCount').addEventListener('click', ()=>{
    document.body.classList.contains('gn-tray-open') ? closeGnTray() : openGnTray();
  });
  document.getElementById('gnScrim').addEventListener('click', closeGnTray);
  document.getElementById('gnTrayClear').addEventListener('click', ()=>{
    state.selectedIds.clear();
    clearSelectedCards();
    updateGnBar();
    gameModal.refreshFooter();
  });
  function continueFromSelection(){
    if(state.selectedIds.size < GN_MIN_SELECT) return;
    closeGnTray();
    gnState.mode = 'manual';
    openConfirm();
  }
  document.getElementById('gnBarContinue').addEventListener('click', continueFromSelection);

  // floating glass bar: same handlers as the bar above
  document.getElementById('selbarCancel').addEventListener('click', exitSelectionMode);
  document.getElementById('selbarPill').addEventListener('click', continueFromSelection);
  document.getElementById('selbarChip').addEventListener('click', ()=>{
    document.body.classList.contains('gn-tray-open') ? closeGnTray() : openGnTray();
  });
  // Share: the invite module owns the share button it adds to .gn-bar and
  // its handler; this one just presses it.
  document.getElementById('selbarShare').addEventListener('click', ()=>{
    document.getElementById('gnBarShare')?.click();
  });

  // confirm step
  document.getElementById('gnRevealToggle').addEventListener('click', ()=>{
    gnState.revealDeck = !gnState.revealDeck;
    syncRevealToggleUI();
  });
  document.getElementById('gnConfirmBack').addEventListener('click', ()=>{
    closeGnBackdrop(document.getElementById('gnConfirmBackdrop'));
    if(gnState.mode === 'random'){
      openGnBackdrop(document.getElementById('gnSurpriseBackdrop'));
    }
    // manual: selection mode's bar/tray are still live underneath — nothing else to do
  });
  document.getElementById('gnConfirmStart').addEventListener('click', handleGnStart);

  // click outside a panel closes that modal, matching the existing detail-card backdrop
  [
    document.getElementById('gnSurpriseBackdrop'),
    document.getElementById('gnConfirmBackdrop'),
  ].forEach(backdrop => {
    backdrop.addEventListener('click', (e)=>{
      if(e.target !== backdrop) return;
      // Dismissing the surprise sheet drops back into selection mode — same
      // path as its Cancel button, keeps included.
      if(backdrop.id === 'gnSurpriseBackdrop') dismissSurprise();
      else closeGnBackdrop(backdrop);
    });
  });
}

// ---- Game night invite (behind ?invite=1) ----

// Needs the Game Night bar, so it runs after initGameNight(): with the Game
// Night flag off there is no selection mode and nothing to add Share to.
async function initInvite(){
  const bar = document.getElementById('gnBar');
  if(!bar) return;
  const { setupInvite } = await import('/js/invite.js');
  invite = setupInvite({
    barEl: bar,
    beforeEl: document.getElementById('gnBarContinue'),
    getSelectedIds: () => Array.from(state.selectedIds),
    getGames: () => games,
  });
}

// ---- Bag (behind ?bag=1) ----

// Built only when the flag is on, so with it off js/bag-ui.js is never
// fetched, no Bags row, button or bar exists and localStorage is never
// touched. Bag pages themselves are not built here: /bag/<id> is a route of
// this page (see isBagRoute) and works with the flag off.
async function initBag(){
  const { setupBag } = await import('/js/bag-ui.js');
  // Only the shelf's owner packs; everyone else browses the Bags sheet.
  const user = await getUser().catch(() => null);
  bag = setupBag({
    canPack: !!user && user.id === profile.id,
    getGames: () => games,
    rerender: () => render(),
    headerEl: document.querySelector('header'),
    gridEl: document.getElementById('shelf'),
    // The bags control takes the right-hand end of the count line.
    countEl: document.getElementById('shelf-count'),
    ownerSlug: profile.slug,
    // Packing borrows game night's entrance: the same gold wave, out from
    // whichever control opened it.
    runWave: runSelectionWave,
    stopWave: stopSelectionWave,
  });
}

// /u/<slug>?bag=1&edit=<id>: a bag page's Edit lands here, and packing opens
// with that bag's games selected. Without the edit key for it in this
// browser the page just shows the shelf, and the address is tidied.
async function openBagEdit(){
  const editId = new URLSearchParams(location.search).get('edit');
  if(!editId || !bag) return;
  let target = null;
  try { target = await bagStore.get(editId); } catch { /* falls through */ }
  if(!target || !bag.startEdit(target)){
    history.replaceState(null, '', location.pathname);
  }
}

// ---- Scroll: compact topbar + specular light drift ----
// The topbar slides in once the full header has scrolled away. The light
// (--light-x, read by .glass backgrounds) travels across every glass surface
// as you scroll — set directly, no transition. While an overlay has locked
// the body, scrollY reads 0, so the topbar is left where it was. While its
// search field has focus the bar stays in too: a narrowing search shortens
// the page, which pulls scrollY under the threshold mid-word.
const topbar = document.getElementById('topbar');
const topbarSearch = document.getElementById('searchCompact');
let scrollRaf = 0;
function onShelfScroll(){
  if(scrollRaf) return;
  scrollRaf = requestAnimationFrame(()=>{
    scrollRaf = 0;
    const y = window.scrollY;
    if(!document.body.classList.contains('scroll-locked')){
      const inView = y > 150 || document.activeElement === topbarSearch;
      if(topbar.classList.contains('is-in') !== inView){
        topbar.classList.toggle('is-in', inView);
        topbar.inert = !inView;
        topbar.setAttribute('aria-hidden', String(!inView));
      }
      document.documentElement.style.setProperty('--light-x', `${20 + (y / 8) % 60}%`);
    }
  });
}
window.addEventListener('scroll', onShelfScroll, { passive:true });

// While the compact search has focus the bar is pinned to the visual
// viewport: when the keyboard opens, iOS scrolls the layout viewport and a
// fixed element can end up above the visible area. Following
// visualViewport.offsetTop keeps it at the top of what is on screen.
const vv = window.visualViewport;
function pinTopbar(){
  topbar.style.transform = `translateY(${Math.round(vv?.offsetTop || 0)}px)`;
}
topbarSearch.addEventListener('focus', ()=>{
  topbar.classList.add('is-typing');
  pinTopbar();
  vv?.addEventListener('resize', pinTopbar);
  vv?.addEventListener('scroll', pinTopbar);
});
topbarSearch.addEventListener('blur', ()=>{
  vv?.removeEventListener('resize', pinTopbar);
  vv?.removeEventListener('scroll', pinTopbar);
  topbar.style.transform = '';
  topbar.classList.remove('is-typing');
  onShelfScroll();
});
onShelfScroll();

// ---- Sticky bar background (only while actually pinned) ----

const stickySentinel = document.getElementById('stickySentinel');
const filterSortBar = document.getElementById('filterSortBar');
if('IntersectionObserver' in window){
  new IntersectionObserver(
    ([entry]) => filterSortBar.classList.toggle('is-stuck', !entry.isIntersecting),
    { threshold: 0 }
  ).observe(stickySentinel);
}

try {
  await loadGames();
  if(bagVisible && !isBagRoute) await initBag();
  render();
  // A bag page shows no Game Night this stage (Stage 3 brings it back scoped
  // to the bag); the invite sheet hangs off its bar, so it goes with it.
  if(gameNightVisible) initGameNight();
  if(inviteVisible) await initInvite();
  await openBagEdit();
} catch (err) {
  showShelfState(err instanceof ShelfError ? err.kind : 'error');
}
</script>
