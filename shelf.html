<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BoardgameShelf</title>
<link rel="icon" href="/assets/icon.svg" type="image/svg+xml">
<link rel="icon" href="/assets/icon-32.png" sizes="32x32" type="image/png">
<link rel="icon" href="/assets/icon-64.png" sizes="64x64" type="image/png">
<link rel="apple-touch-icon" href="/assets/icon-180.png">
<link rel="manifest" href="/site.webmanifest">
<meta name="theme-color" content="#0A0B0D">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://cf.geekdo-images.com" crossorigin>
<link rel="dns-prefetch" href="https://cf.geekdo-images.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,500&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/base.css">
<script type="module" src="/js/beta-tag.js"></script>
<link rel="stylesheet" href="/css/game-modal.css">
<script defer src="/_vercel/insights/script.js"></script>
<style>
  /* Tokens and page chrome come from css/base.css. */
  body{
    padding:32px 20px 80px;
  }
  .wrap{max-width:960px;margin:0 auto;}

  header{margin-bottom:0;}
  .eyebrow{
    font-family:'IBM Plex Mono',monospace;
    font-size:12px;
    letter-spacing:0.14em;
    text-transform:uppercase;
    color:var(--bgs-gold);
    margin:0 0 10px;
  }
  h1{
    font-family:'Fraunces',serif;
    font-weight:600;
    font-size:clamp(30px,5vw,44px);
    margin:0 0 8px;
    letter-spacing:-0.01em;
  }
  .sub{
    color:var(--bgs-gold);
    font-size:15px;
    margin:0;
    max-width:50ch;
    line-height:1.5;
  }

  .filter-sort-bar{
    display:flex;
    align-items:center;
    gap:8px;
    margin:28px 0 10px;
    padding:10px 0;
    position:sticky;
    top:0;
    z-index:15;
    transition:background-color 0.2s ease;
  }
  .filter-sort-bar.is-stuck{
    background:rgba(var(--bgs-bg-rgb),0.82);
    backdrop-filter:blur(8px);
    -webkit-backdrop-filter:blur(8px);
  }
  .sticky-sentinel{
    height:1px;
  }
  /* Compact topbar and the tab puck belong to the glass motion set
     (css/glass.css shows them); without it they do not exist on screen. */
  .topbar{display:none;}
  .mode-puck{display:none;}
  .selbar{display:none;}
  .gn-sheet__x{display:none;}
  .search-wrap{
    position:relative;
    flex:1;
    min-width:0;
  }
  .search{
    width:100%;
    background:var(--bgs-plate);
    border:1px solid rgba(var(--bgs-gold-rgb),0.18);
    border-radius:12px;
    color:var(--bgs-ivory);
    font-family:'Inter',sans-serif;
    font-size:16px;
    padding:10px 34px 10px 14px;
    outline:none;
  }
  .search:focus{border-color:var(--bgs-gold);}
  .search::placeholder{color:var(--bgs-ivory-70);}
  .search-clear{
    position:absolute;
    top:50%;
    right:4px;
    transform:translateY(-50%);
    width:28px;
    height:28px;
    padding:0;
    display:flex;
    align-items:center;
    justify-content:center;
    background:none;
    border:none;
    border-radius:50%;
    color:var(--bgs-ivory-70);
    font-size:13px;
    line-height:1;
    cursor:pointer;
  }
  .search-clear:hover{color:var(--bgs-ivory);}
  .search-clear[hidden]{display:none;}

  .icon-btn{
    position:relative;
    flex:none;
    width:40px;
    height:40px;
    padding:0;
    display:flex;
    align-items:center;
    justify-content:center;
    background:var(--bgs-plate);
    border:1px solid rgba(var(--bgs-gold-rgb),0.18);
    border-radius:12px;
    color:var(--bgs-ivory-70);
    cursor:pointer;
    transition:border-color 0.15s ease, color 0.15s ease;
  }
  .icon-btn::before{
    content:"";
    position:absolute;
    inset:-4px;
  }
  .icon-btn:hover{border-color:var(--bgs-gold);color:var(--bgs-ivory);}
  .icon-btn.active{border-color:var(--bgs-gold);color:var(--bgs-gold);}
  .filter-badge{
    position:absolute;
    top:-5px;
    right:-5px;
    width:16px;
    height:16px;
    border-radius:50%;
    background:var(--bgs-gold);
    color:var(--bgs-on-gold);
    font-family:'IBM Plex Mono',monospace;
    font-size:9.5px;
    font-weight:700;
    display:flex;
    align-items:center;
    justify-content:center;
    box-shadow:0 0 0 2px var(--bgs-bg);
  }
  .filter-badge[hidden]{display:none;}

  .chips-row{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
    margin:0 0 16px;
  }
  .chips-row[hidden]{display:none;}
  .chip{
    display:inline-flex;
    align-items:center;
    gap:6px;
    background:rgba(var(--bgs-gold-rgb),0.16);
    border:1px solid rgba(var(--bgs-gold-rgb),0.4);
    color:var(--bgs-gold);
    font-family:'Inter',sans-serif;
    font-size:12.5px;
    font-weight:500;
    padding:5px 8px 5px 12px;
    border-radius:999px;
  }
  .chip button{
    background:none;
    border:none;
    color:inherit;
    font-size:13px;
    line-height:1;
    padding:2px;
    cursor:pointer;
    opacity:0.75;
  }
  .chip button:hover{opacity:1;}

  .filter-label{
    font-family:'IBM Plex Mono',monospace;
    font-size:11px;
    letter-spacing:0.08em;
    text-transform:uppercase;
    color:var(--bgs-gold-dim);
    margin-right:2px;
  }
  .pill{
    font-family:'Inter',sans-serif;
    font-size:13px;
    font-weight:500;
    color:var(--bgs-ivory-70);
    background:transparent;
    border:1px solid rgba(var(--bgs-ivory-rgb),0.22);
    border-radius:999px;
    padding:6px 13px;
    cursor:pointer;
    transition:all 0.15s ease;
  }
  .pill:hover{border-color:var(--bgs-gold);color:var(--bgs-ivory);}
  .pill.active{
    background:var(--bgs-gold);
    border-color:var(--bgs-gold);
    color:var(--bgs-on-gold);
    font-weight:600;
  }

  .sheet-scrim{
    position:fixed;
    inset:0;
    background:rgba(var(--bgs-bg-rgb),0.6);
    z-index:20;
    opacity:0;
    pointer-events:none;
    transition:opacity 0.28s ease;
  }
  .sheet-scrim.open{opacity:1;pointer-events:auto;}
  .filter-sheet{
    position:fixed;
    left:0;
    right:0;
    bottom:0;
    z-index:21;
    max-width:600px;
    margin:0 auto;
    max-height:78vh;
    display:flex;
    flex-direction:column;
    background:var(--bgs-plate);
    border:1px solid rgba(var(--bgs-gold-rgb),0.18);
    border-bottom:none;
    border-radius:22px 22px 0 0;
    box-shadow:0 -12px 32px -8px rgba(0,0,0,0.6);
    transform:translateY(100%);
    transition:transform 0.32s cubic-bezier(.32,.72,0,1);
  }
  .filter-sheet.open{transform:translateY(0);}
  .sheet-handle{
    width:36px;
    height:4px;
    border-radius:2px;
    background:rgba(var(--bgs-ivory-rgb),0.22);
    margin:12px auto 4px;
    flex:none;
  }
  .sheet-header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:8px 20px 14px;
    border-bottom:1px solid rgba(var(--bgs-ivory-rgb),0.10);
    flex:none;
  }
  .sheet-header h2{
    font-family:'Fraunces',serif;
    font-size:19px;
    font-weight:600;
    margin:0;
  }
  .reset-link{
    background:none;
    border:none;
    color:var(--bgs-gold);
    font-family:'IBM Plex Mono',monospace;
    font-size:11.5px;
    letter-spacing:0.06em;
    text-transform:uppercase;
    cursor:pointer;
    padding:6px;
  }
  .reset-link:hover{color:var(--bgs-ivory);}
  .sheet-body{
    overflow-y:auto;
    padding:18px 20px 8px;
  }
  .sheet-group{margin-bottom:26px;}
  .sheet-group .filter-label{display:block;margin-bottom:10px;}
  .sheet-group .segmented{display:flex;flex-wrap:wrap;gap:8px;}

  .range-wrap{
    position:relative;
    height:28px;
    margin:6px 2px 2px;
  }
  .range-track{
    position:absolute;
    top:50%;
    left:0;
    right:0;
    height:4px;
    border-radius:2px;
    background:rgba(var(--bgs-ivory-rgb),0.16);
    transform:translateY(-50%);
  }
  .range-fill{
    position:absolute;
    top:50%;
    height:4px;
    border-radius:2px;
    background:var(--bgs-gold);
    transform:translateY(-50%);
  }
  .range-input{
    position:absolute;
    top:0;
    left:0;
    width:100%;
    height:28px;
    margin:0;
    background:transparent;
    -webkit-appearance:none;
    appearance:none;
    pointer-events:none;
  }
  .range-input::-webkit-slider-runnable-track{background:transparent;height:28px;}
  .range-input::-moz-range-track{background:transparent;height:28px;}
  .range-input::-webkit-slider-thumb{
    -webkit-appearance:none;
    pointer-events:auto;
    width:20px;
    height:20px;
    margin-top:4px;
    border-radius:50%;
    background:var(--bgs-gold);
    border:2px solid var(--bgs-plate);
    box-shadow:0 1px 4px rgba(0,0,0,0.5);
    cursor:pointer;
  }
  .range-input::-moz-range-thumb{
    pointer-events:auto;
    width:20px;
    height:20px;
    border-radius:50%;
    background:var(--bgs-gold);
    border:2px solid var(--bgs-plate);
    box-shadow:0 1px 4px rgba(0,0,0,0.5);
    cursor:pointer;
  }
  /* The numbers under the slider are buttons, not labels: tapping one picks
     exactly that player count, which beats dragging both thumbs onto the same
     notch. Tapping the picked one again clears back to Any. */
  .number-cue-row{
    position:relative;
    height:24px;
    margin:2px 2px 0;
  }
  .number-cue{
    position:absolute;
    top:0;
    transform:translateX(-50%);
    display:flex;
    align-items:center;
    justify-content:center;
    min-width:24px;
    height:22px;
    padding:0 4px;
    font-family:'IBM Plex Mono',monospace;
    font-size:10px;
    line-height:1;
    color:var(--bgs-ivory-70);
    opacity:0.55;
    background:transparent;
    border:1px solid transparent;
    border-radius:999px;
    white-space:nowrap;
    cursor:pointer;
    -webkit-tap-highlight-color:transparent;
    transition:color 0.15s ease,background 0.15s ease,border-color 0.15s ease,opacity 0.15s ease;
  }
  .number-cue:hover{color:var(--bgs-ivory);opacity:1;}
  .number-cue.active{color:var(--bgs-gold);font-weight:600;opacity:1;}
  .number-cue[aria-pressed="true"]{
    background:var(--bgs-gold);
    border-color:var(--bgs-gold);
    color:var(--bgs-on-gold);
    font-weight:600;
    opacity:1;
  }
  .number-cue:focus-visible{outline:2px solid var(--bgs-gold);outline-offset:2px;}

  .toggle-row{
    display:flex;
    align-items:center;
    gap:12px;
    margin-top:16px;
    background:none;
    border:none;
    padding:0;
    cursor:pointer;
  }
  .toggle-switch{
    position:relative;
    flex:none;
    width:34px;
    height:20px;
    border-radius:999px;
    background:rgba(var(--bgs-ivory-rgb),0.16);
    border:1px solid rgba(var(--bgs-ivory-rgb),0.22);
    transition:background 0.15s ease,border-color 0.15s ease;
  }
  .toggle-switch::after{
    content:"";
    position:absolute;
    top:1px;
    left:1px;
    width:16px;
    height:16px;
    border-radius:50%;
    background:var(--bgs-ivory-70);
    transition:transform 0.15s ease,background 0.15s ease;
  }
  .toggle-row[aria-checked="true"] .toggle-switch{
    background:var(--bgs-gold);
    border-color:var(--bgs-gold);
  }
  .toggle-row[aria-checked="true"] .toggle-switch::after{
    transform:translateX(14px);
    background:var(--bgs-bg);
  }
  .toggle-label{
    font-family:'Inter',sans-serif;
    font-size:13px;
    font-weight:500;
    color:var(--bgs-ivory);
    transition:color 0.15s ease;
  }
  /* Active state: the label goes gold with the switch, so a toggle reads as on
     from the text as well as the track. Labels stay a fixed phrase — swapping
     the wording to describe the state made the label do the switch's job and
     read as a button. */
  .toggle-row[aria-checked="true"] .toggle-label{
    color:var(--bgs-gold);
  }

  .sheet-footer{
    flex:none;
    padding:14px 20px calc(14px + env(safe-area-inset-bottom));
    border-top:1px solid rgba(var(--bgs-ivory-rgb),0.10);
  }
  .apply-btn{
    width:100%;
    background:var(--bgs-gold);
    color:var(--bgs-on-gold);
    border:none;
    border-radius:12px;
    font-family:'Inter',sans-serif;
    font-size:15px;
    font-weight:600;
    padding:13px;
    cursor:pointer;
  }
  .apply-btn:hover{filter:brightness(1.06);}

  /* vibe filter */
  .mode-tabs{position:relative;display:grid;grid-template-columns:1fr 1fr;margin:0 0 18px;border-bottom:1px solid rgba(var(--bgs-ivory-rgb),0.10);}
  .mode-tab{background:none;border:0;padding:6px 0 12px;cursor:pointer;text-align:left;color:var(--bgs-ivory-45);font:inherit;transition:color .15s ease;}
  .mode-tab:nth-child(2){text-align:right;}
  .mode-tab strong{display:block;font:600 16px/1.1 'Fraunces',serif;color:inherit;}
  .mode-tab em{display:block;font-style:normal;font-family:'Inter',sans-serif;font-size:12px;margin-top:3px;opacity:.85;}
  .mode-tab[aria-selected=true]{color:var(--bgs-ivory);}
  .mode-tab:focus-visible{outline:0;box-shadow:0 0 0 2px var(--bgs-gold) inset;border-radius:6px;}
  .mode-ink{position:absolute;bottom:-1px;left:0;width:50%;height:2px;background:var(--bgs-gold);transition:transform .18s cubic-bezier(.2,.7,.2,1);}
  .mode-tabs[data-mode=numbers] .mode-ink{transform:translateX(100%);}
  .mode-panel{display:none;}
  .mode-panel[data-show]{display:block;}
  .pill .n{font:400 11px 'IBM Plex Mono',monospace;opacity:.6;margin-left:6px;}
  .pill.active .n{opacity:.7;}
  .pill:focus-visible{outline:0;box-shadow:0 0 0 2px var(--bgs-gold) inset;}
  .pill:disabled{opacity:.35;cursor:default;}
  .pill:disabled:hover{border-color:rgba(var(--bgs-ivory-rgb),0.22);color:var(--bgs-ivory-70);}
  .vibe-hint{margin:12px 0 0;min-height:1.4em;font-family:'Inter',sans-serif;font-size:13px;color:var(--bgs-ivory-70);}
  .vibe-hint b{color:var(--bgs-ivory);font-weight:500;}
  .empty-state button{background:none;border:0;color:var(--bgs-gold);cursor:pointer;text-decoration:underline;text-underline-offset:3px;font:inherit;margin-top:10px;display:block;margin-inline:auto;}
  .empty-state a{color:var(--bgs-gold);text-decoration:underline;text-underline-offset:3px;margin-top:10px;display:block;}
  .empty-state code{font-family:'IBM Plex Mono',monospace;font-size:0.95em;}
  .owner-link{color:var(--bgs-gold);text-decoration:none;}
  .owner-link:hover{text-decoration:underline;text-underline-offset:3px;}
  /* Settings as a gear at the right end of the owner line. A 44px target
     around an 18px icon; pulled up so the icon centres on the text without
     making the row taller, and out past the gutter so the icon's edge, not
     the target's, sits flush with it. */
  .owner-gear{
    float:right;
    width:44px;height:44px;
    margin:-14px -12px 0 0;
    padding:0;
    border:0;
    border-radius:12px;
    background:transparent;
    color:var(--bgs-gold);
    display:flex;align-items:center;justify-content:center;
    cursor:pointer;
  }
  .owner-gear svg{width:18px;height:18px;}
  .owner-gear:hover,
  .owner-gear:focus-visible{background:var(--bgs-plate);outline:none;}
  .owner-gear:focus-visible{box-shadow:inset 0 0 0 2px var(--bgs-gold);}
  @media (max-width:400px){ .mode-tab em{display:none;} }

  @media (prefers-reduced-motion:reduce){
    .sheet-scrim, .filter-sheet, .mode-ink, .mode-tab, .mode-puck,
    .topbar, .gn-fab, .gn-fab__pill, .gn-fab__sheet, .gn-fab-scrim{transition:none;}
  }

  .shelf-count{
    font-family:'IBM Plex Mono',monospace;
    font-size:12px;
    color:var(--bgs-gold-dim);
    margin:0 0 14px;
  }

  .shelf{
    display:grid;
    grid-template-columns:repeat(3, 1fr);
    gap:10px;
    min-height:260px;
  }
  @media (min-width:560px){ .shelf{ grid-template-columns:repeat(4, 1fr); gap:14px; } }
  @media (min-width:800px){ .shelf{ grid-template-columns:repeat(6, 1fr); gap:16px; } }
  .empty-state{
    font-family:'Inter',sans-serif;
    color:var(--bgs-ivory-70);
    font-size:14px;
    padding:60px 10px;
    width:100%;
    text-align:center;
    grid-column:1 / -1;
  }

  /* Card = artwork box (top, locked 4:5) + solid plate info (bottom). The
     artwork never runs under the info and there is no gradient: hard edge.
     Cards stay solid with the glass flag on too — no backdrop-filter here. */
  .game-card{
    /* Cards off screen are not laid out, painted or decoded until they come
       near the viewport: 197 fully rendered cards were most of what the
       page held on a phone. `auto` keeps the last rendered size once seen;
       230px is a 3-column card until then. */
    content-visibility:auto;
    contain-intrinsic-size:auto 230px;
    border-radius:18px;
    overflow:hidden;
    background:var(--bgs-plate);
    box-shadow:0 1px 0 rgba(var(--bgs-ivory-rgb),.06) inset, 0 6px 18px rgba(0,0,0,.35);
    display:flex;
    flex-direction:column;
    transition:transform .28s var(--ease-liquid);
    cursor:pointer;
    border:none;
    padding:0;
    text-align:left;
    font:inherit;
    color:inherit;
    position:relative;
  }
  .game-card:hover{ transform:translateY(-2px); }
  .game-card:active{ transform:scale(.97); }

  .game-card .art{
    aspect-ratio:4/5;
    width:100%;
    flex:none;
    overflow:hidden;
    background:var(--bgs-plate);
    position:relative;
  }
  /* center top: a cover's title sits along its top edge, so that is the edge
     the 4:5 crop keeps. */
  .game-card .art img{ width:100%; height:100%; object-fit:cover; object-position:center top; display:block; }

  .game-card .info{
    padding:9px 10px 11px;
    display:flex;
    flex-direction:column;
    gap:8px;
  }
  .game-card .title{
    font-family:'Fraunces',serif;
    font-weight:600;
    font-size:13.5px;
    line-height:1.2;
    letter-spacing:-.005em;
    color:var(--bgs-ivory);
    margin:0;
    display:-webkit-box;
    -webkit-line-clamp:2;
    -webkit-box-orient:vertical;
    overflow:hidden;
    min-height:2.4em; /* two lines, so the meta rows line up across the grid */
  }
  .game-card .meta-row{ display:flex; align-items:center; justify-content:space-between; gap:4px; }
  /* Gold ring only, no fill — an inset box-shadow, never a border. */
  .game-card .rating-pill{
    display:inline-flex; align-items:center; gap:4px;
    background:none;
    border:0;
    box-shadow:inset 0 0 0 1px rgba(var(--bgs-gold-rgb),.45);
    border-radius:999px;
    padding:3px 8px;
    font-size:12.5px; font-weight:600;
    color:var(--bgs-gold);
    white-space:nowrap;
  }
  .game-card .players{ font-family:'IBM Plex Mono',monospace; font-size:12px; color:var(--bgs-ivory-45); font-weight:400; white-space:nowrap; }

  @keyframes shimmer{
    0%{background-position:150% 0;}
    100%{background-position:-50% 0;}
  }
  .game-card-skeleton{
    cursor:default;
    pointer-events:none;
  }
  .game-card-skeleton .art{
    background:linear-gradient(100deg, var(--bgs-plate) 30%, rgba(var(--bgs-ivory-rgb),0.08) 50%, var(--bgs-plate) 70%);
    background-size:250% 100%;
    animation:shimmer 1.7s ease-in-out infinite;
  }
  .game-card-skeleton:nth-child(6n+2) .art{animation-delay:0.15s;}
  .game-card-skeleton:nth-child(6n+3) .art{animation-delay:0.3s;}
  .game-card-skeleton:nth-child(6n+4) .art{animation-delay:0.45s;}
  .game-card-skeleton:nth-child(6n+5) .art{animation-delay:0.6s;}
  .game-card-skeleton:nth-child(6n) .art{animation-delay:0.75s;}
  .game-card-skeleton .skeleton-line{
    height:8px;
    border-radius:4px;
    background:rgba(var(--bgs-ivory-rgb),0.08);
  }
  .game-card-skeleton .skeleton-line.short{ width:60%; }


  /* Footer lives in css/base.css. The shelf adds FAB clearance so the pill
     never covers the legal lines: --fab-clearance = .gn-fab height (48px)
     + its bottom offset (16px + safe-area) + 16px breathing room. */
  .shelf-footer{--fab-clearance:calc(80px + env(safe-area-inset-bottom));}

  /* ==== Game Night (Stage 1: session creation) ==== */

  /* Floating entry point, bottom-centre. z-index 12 keeps it under the selection
     bar (15), tray (14), and scrim (13), and well under the filter sheet (21)
     and detail modal (30) — it can never sit on top of a sheet or modal.

     One element, two states: closed it is the pill; .is-open morphs the same
     box into a sheet (width, height, bottom, radius transition) while the
     pill's content fades out and the sheet's content rises in. Nothing is
     swapped, so there is no flash. The sheet holds the single entry action
     the pill used to fire directly, plus close (docs/claude-code-spec-liquid-glass.md). */
  .gn-fab{
    position:fixed;
    left:50%;
    bottom:calc(16px + env(safe-area-inset-bottom));
    /* Centered. translateX lives here as the base transform; every other
       transform on this element must include it or the pill jumps left. It
       also keeps the box centred while its width transitions. */
    transform:translateX(-50%);
    z-index:12;
    width:152px;
    height:48px;
    /* Tinted glass. Tint stays >= .82: gold text is lower-contrast than ivory,
       and .82 is where it clears 4.5:1 over a white cover (4.87:1). */
    background:rgba(var(--bgs-plate-rgb),0.82);
    -webkit-backdrop-filter:blur(16px) saturate(1.2);
    backdrop-filter:blur(16px) saturate(1.2);
    border:1.5px solid rgba(var(--bgs-gold-rgb),0.55);
    border-radius:999px;
    color:var(--bgs-gold);
    overflow:hidden;
    text-align:left;
    box-shadow:0 1px 0 rgba(var(--bgs-ivory-rgb),0.08) inset,
               0 8px 24px -10px rgba(0,0,0,0.7);
    transition:width var(--dur) var(--ease-liquid), height var(--dur) var(--ease-liquid),
               bottom var(--dur) var(--ease-liquid), border-radius var(--dur) var(--ease-liquid),
               transform 0.18s cubic-bezier(.2,.8,.3,1), opacity 0.18s ease, border-color 0.18s ease;
  }
  .gn-fab:hover{border-color:var(--bgs-gold);}
  .gn-fab.is-open{
    width:calc(100vw - 24px);
    max-width:456px;
    height:312px; /* title, line, two options */
    bottom:calc(12px + env(safe-area-inset-bottom));
    border-radius:30px;
    z-index:60; /* above the compact topbar (17) and every bottom sheet; its scrim is 50 */
  }
  .gn-fab__pill{
    position:absolute;inset:0;
    display:flex;align-items:center;justify-content:center;gap:8px;
    padding:0;border:0;background:none;
    color:inherit;
    font-family:'Inter',sans-serif;
    font-size:14px;
    font-weight:700;
    letter-spacing:0.01em;
    white-space:nowrap;
    cursor:pointer;
    transition:opacity 0.2s ease, transform 0.35s var(--ease-liquid);
  }
  .gn-fab__pill svg{width:18px;height:18px;flex:none;}
  .gn-fab__pill:active{transform:scale(0.97);}
  .gn-fab__pill:focus-visible{outline:0;box-shadow:inset 0 0 0 2px var(--bgs-gold);border-radius:inherit;}
  .gn-fab.is-open .gn-fab__pill{opacity:0;transform:scale(0.9);pointer-events:none;}
  .gn-fab__sheet{
    position:absolute;inset:0;
    padding:22px 20px;
    color:var(--bgs-ivory);
    opacity:0;
    transform:translateY(14px);
    pointer-events:none;
    transition:opacity 0.35s ease 0.18s, transform 0.5s var(--ease-liquid) 0.12s;
  }
  .gn-fab.is-open .gn-fab__sheet{opacity:1;transform:none;pointer-events:auto;}
  .gn-fab__sheet h2{
    margin:0;
    display:flex;align-items:center;gap:12px;
    font-family:'Fraunces',serif;font-weight:700;font-size:26px;line-height:1.1;letter-spacing:-0.01em;
    color:var(--bgs-ivory);
  }
  .gn-fab__sheet h2 svg{width:26px;height:26px;flex:none;color:var(--bgs-gold);}
  .gn-fab__sheet p{margin:6px 0 0;font-size:15px;color:var(--bgs-ivory-70);}
  .gn-fab__close{
    position:absolute;top:16px;right:16px;
    width:36px;height:36px;
    display:grid;place-items:center;
    border:0;border-radius:12px;
    background:rgba(var(--bgs-ivory-rgb),0.06);
    color:var(--bgs-ivory-70);
    font-size:18px;line-height:1;
    cursor:pointer;
  }
  .gn-fab__close:hover{color:var(--bgs-ivory);}
  .gn-fab__close:focus-visible{outline:0;box-shadow:0 0 0 2px var(--bgs-bg),0 0 0 4px var(--bgs-gold);}
  .gn-opt{
    display:flex;align-items:center;gap:14px;
    width:100%;
    margin-top:12px;
    padding:16px;
    border:1px solid rgba(var(--bgs-gold-rgb),0.3);
    border-radius:20px;
    background:rgba(var(--bgs-ivory-rgb),0.05);
    color:var(--bgs-ivory);
    font:inherit;
    text-align:left;
    cursor:pointer;
  }
  .gn-opt:first-of-type{margin-top:22px;}
  .gn-opt:hover{border-color:var(--bgs-gold);}
  .gn-opt:focus-visible{outline:0;box-shadow:0 0 0 2px var(--bgs-bg),0 0 0 4px var(--bgs-gold);}
  .gn-opt__ic{
    width:44px;height:44px;flex:none;
    display:grid;place-items:center;
    border-radius:14px;
    color:var(--bgs-gold);
    background:rgba(var(--bgs-gold-rgb),0.12);
  }
  .gn-opt__ic svg{width:22px;height:22px;}
  .gn-opt__txt{flex:1;min-width:0;}
  .gn-opt__txt b{display:block;font-weight:600;font-size:16px;}
  .gn-opt__txt span{display:block;margin-top:2px;font-size:13.5px;color:var(--bgs-ivory-70);}
  .gn-opt__chev{flex:none;color:var(--bgs-ivory-45);font-size:18px;line-height:1;}
  .gn-fab-scrim{
    position:fixed;inset:0;
    z-index:50;
    background:rgba(var(--bgs-bg-rgb),0.45);
    opacity:0;
    pointer-events:none;
    transition:opacity 0.35s ease;
  }
  .gn-fab-scrim.open{opacity:1;pointer-events:auto;}
  /* Solid plate when blur isn't available or the OS asks for less transparency. */
  @supports not (backdrop-filter:blur(1px)){
    .gn-fab{background:var(--bgs-plate);}
  }
  @media (prefers-reduced-transparency:reduce){
    .gn-fab{
      background:var(--bgs-plate);
      -webkit-backdrop-filter:none;backdrop-filter:none;
    }
  }
  /* Selection mode hands off to the bottom bar — the pill animates down and
     out. Packing a bag takes the same handoff. */
  body.is-selecting .gn-fab{
    opacity:0;
    transform:translateX(-50%) translateY(14px) scale(0.9);
    pointer-events:none;
  }


  .gn-toast{
    position:fixed;
    left:50%;
    /* Clears the floating pill (46px tall at a 16px offset) so the toast
       never lands on top of the control that raises it. */
    bottom:calc(78px + env(safe-area-inset-bottom));
    transform:translateX(-50%) translateY(8px);
    z-index:50;
    background:var(--bgs-plate);
    border:1px solid rgba(var(--bgs-gold-rgb),0.35);
    color:var(--bgs-ivory);
    font-family:'Inter',sans-serif;
    font-size:13px;
    font-weight:500;
    padding:12px 18px;
    border-radius:12px;
    box-shadow:0 8px 24px -6px rgba(0,0,0,0.6);
    opacity:0;
    pointer-events:none;
    transition:opacity 0.2s ease, transform 0.2s ease;
  }
  .gn-toast.open{opacity:1;transform:translateX(-50%) translateY(0);}

  /* generic modal shell reused by the chooser, surprise, and confirm steps */
  .gn-backdrop{
    position:fixed;inset:0;
    background:rgba(var(--bgs-bg-rgb),0.66);
    backdrop-filter:blur(3px);
    display:none;
    align-items:center;
    justify-content:center;
    padding:24px;
    z-index:40;
  }
  .gn-backdrop.open{display:flex;}
  .gn-panel{
    background:var(--bgs-plate);
    border:1px solid rgba(var(--bgs-gold-rgb),0.3);
    border-radius:16px;
    max-width:420px;
    width:100%;
    max-height:85vh;
    overflow-y:auto;
    padding:26px 26px 22px;
    animation:pop 0.18s ease;
  }
  @keyframes pop{from{opacity:0;transform:scale(0.96);}to{opacity:1;transform:scale(1);}}
  .gn-panel h3{
    font-family:'Fraunces',serif;
    font-weight:600;
    font-size:19px;
    margin:0 0 6px;
  }
  .gn-panel .gn-sub{
    font-size:13px;
    color:var(--bgs-ivory-70);
    margin:0 0 18px;
    line-height:1.5;
  }
  .gn-cancel-link{
    display:flex;
    align-items:center;
    justify-content:center;
    width:100%;
    /* 44px is the smallest comfortable thumb target; the old 10px-top-padding
       box was barely taller than the text itself. */
    min-height:44px;
    background:none;
    border:none;
    color:var(--bgs-ivory-45);
    font:inherit;
    font-size:13px;
    font-weight:600;
    text-align:center;
    padding:12px 0;
    cursor:pointer;
  }
  .gn-cancel-link:hover{color:var(--bgs-ivory);}

  .gn-surprise-grid{
    display:grid;
    grid-template-columns:repeat(3, 1fr);
    gap:8px;
    margin:0 0 18px;
  }
  /* Shell matched to .game-card on the shelf — same plate, same radius, same
     shadow — so a game reads identically in the sheet and in the grid behind it. */
  .gn-surprise-card{
    border-radius:10px;
    overflow:hidden;
    background:var(--bgs-plate);
    box-shadow:0 3px 10px rgba(0,0,0,.35);
  }
  .gn-surprise-card .art{aspect-ratio:3/4;width:100%;overflow:hidden;background:var(--bgs-plate);}
  .gn-surprise-card .art img{width:100%;height:100%;object-fit:cover;display:block;}
  .gn-surprise-card .t{
    font-family:'Fraunces',serif;
    font-weight:600;
    font-size:10.5px;
    line-height:1.25;
    padding:5px 5px 6px;
    display:-webkit-box;
    -webkit-line-clamp:2;
    -webkit-box-orient:vertical;
    overflow:hidden;
  }
  .gn-row{display:flex;gap:10px;}
  .gn-row .gn-secondary-btn{flex:1;}
  .gn-row .gn-primary-btn{flex:1;}

  .gn-secondary-btn{
    background:transparent;
    border:1.5px solid rgba(var(--bgs-ivory-rgb),0.22);
    color:var(--bgs-ivory-70);
    font:inherit;
    font-size:13px;
    font-weight:600;
    padding:12px;
    border-radius:10px;
    cursor:pointer;
  }
  .gn-secondary-btn:hover{border-color:var(--bgs-gold);color:var(--bgs-ivory);}
  .gn-primary-btn{
    background:var(--bgs-gold);
    color:var(--bgs-on-gold);
    border:none;
    font:inherit;
    font-size:13px;
    font-weight:700;
    padding:12px;
    border-radius:10px;
    cursor:pointer;
  }
  .gn-primary-btn:hover{filter:brightness(1.06);}
  .gn-primary-btn:disabled{opacity:0.4;cursor:not-allowed;filter:none;}

  /* ---- Tonight's surprise: bottom sheet, lock & re-roll ---- */
  /* Sheet variant of the shared shell. .gn-panel itself is deliberately
     untouched — the confirm dialog still uses it centered. */
  .gn-backdrop--sheet{align-items:flex-end;padding:0;}
  .gn-sheet{
    max-width:none;
    max-height:88vh;
    border-radius:24px 24px 0 0;
    border-width:1px 0 0;
    padding:12px 20px calc(16px + env(safe-area-inset-bottom));
    box-shadow:0 -20px 60px rgba(0,0,0,0.5);
    /* Overrides .gn-panel's `pop`. Animation and nothing else on this node:
       WebKit drops one of the two when a transition shares an element with an
       animation, so every transition in this feature lives on a child. */
    animation:gn-rise 0.34s cubic-bezier(0.2,0.8,0.2,1);
  }
  @keyframes gn-rise{from{transform:translateY(24px);opacity:0;}to{transform:none;opacity:1;}}
  /* The shelf pairs --bgs-plate cards with a --bgs-bg page. Matching the card
     to the shelf means the sheet has to take the darker ground too — a plate
     card on a plate sheet has no visible edge at all. .gn-panel keeps its plate
     background for the confirm dialog. */
  .gn-sheet{background:var(--bgs-bg);}
  .gn-sheet__grab{
    width:40px;height:4px;border-radius:2px;
    background:rgba(var(--bgs-ivory-rgb),0.22);
    margin:0 auto 16px;
  }
  .gn-sheet h3{font-size:24px;}
  /* All six cards stay on screen at any window height — nothing here scrolls.
     Six 3:4 cards outgrow the sheet's 88vh cap on a short, wide window (a
     1024x768 laptop pushed Cancel clean off the bottom), so the sheet is a flex
     column: the chrome keeps its natural size and the grid takes what's left.
     Inside it the rows share that height and each card's cover shrinks out of
     its 3:4 base rather than overflowing. object-fit:cover already crops the
     art, so a shorter cover stays undistorted; the title and meta never shrink. */
  .gn-sheet{display:flex;flex-direction:column;overflow:hidden;}
  .gn-sheet > *{flex:none;}
  .gn-sheet .gn-surprise-grid{
    flex:0 1 auto;
    min-height:0;
    /* Never grows past the cards' natural size, so a tall window still gets a
       3:4 cover; shrinks when the sheet is squeezed, and the 1fr rows hand that
       reduction to the cards. auto (not hidden) is the safety net: below any
       realistic window height the grid scrolls rather than clipping a card. */
    overflow-y:auto;
    overscroll-behavior:contain;
    /* 140px floor = the title/meta block plus a readable sliver of cover. Below
       that the rows stop shrinking and the grid scrolls, rather than collapsing
       the art to nothing and clipping the title (a landscape phone did exactly
       that). No realistic window height reaches the floor. */
    grid-auto-rows:minmax(140px,1fr);
  }
  /* height:100% is what forces the card into its row: a grid item is stretched
     up to its track but never compressed below its own content, so without this
     the card keeps its full height and overflows the row instead of shrinking. */
  .gn-surprise-card{display:flex;flex-direction:column;height:100%;min-height:0;}
  .gn-surprise-card .art{flex:0 1 auto;min-height:0;}
  .gn-surprise-card .meta{flex:none;}

  .gn-surprise-grid{gap:10px;margin-bottom:20px;perspective:900px;}
  .gn-surprise-card{
    position:relative;
    cursor:pointer;
    -webkit-tap-highlight-color:transparent;
  }
  .gn-surprise-card:focus-visible{outline:2px solid var(--bgs-gold);outline-offset:2px;}
  .gn-surprise-card .meta{padding:8px 8px 10px;}
  /* Clamp fix: the padding that used to sit inside the clamped box moved to
     .meta, so the 2-line box is exactly 2 lines and no third line bleeds. */
  .gn-surprise-card .t{font-size:13px;line-height:1.2;padding:0;min-height:2.4em;}
  .gn-surprise-card .s{
    margin-top:4px;
    font-family:'IBM Plex Mono',monospace;
    font-size:10.5px;
    color:var(--bgs-ivory-45);
  }
  /* The kept badge sits exactly where the swap die was, so the corner changes
     state rather than gaining a second control. No ring, no border change. */
  .gn-surprise-card .lock{
    position:absolute;top:8px;right:8px;
    width:32px;height:32px;border-radius:999px;
    background:var(--bgs-gold);
    color:var(--bgs-on-gold);
    display:grid;place-items:center;
    transform:scale(0);
    transition:transform 0.18s cubic-bezier(0.2,0.9,0.3,1.3);
  }
  .gn-surprise-card .lock svg{width:15px;height:15px;}
  .gn-surprise-card[aria-pressed="true"] .lock{transform:scale(1);}
  /* Sits over arbitrary cover art, so it carries its own scrim + hairline. */
  .gn-surprise-card .swap{
    position:absolute;top:8px;right:8px;
    width:32px;height:32px;border-radius:999px;
    border:1px solid rgba(255,255,255,0.25);
    background:rgba(var(--bgs-bg-rgb),0.55);
    backdrop-filter:blur(6px);
    color:var(--bgs-ivory);
    display:grid;place-items:center;
    cursor:pointer;
  }
  .gn-surprise-card .swap svg{width:16px;height:16px;}
  .gn-surprise-card .swap[hidden]{display:none;}

  /* Re-roll flip. The animation lives on this wrapper and only here; the card's
     .lock keeps its transition one level down. Never both on one node. */
  .gn-surprise-flip{transform-style:preserve-3d;backface-visibility:hidden;border-radius:10px;}
  .gn-surprise-flip.out{animation:gn-flip-out 0.18s ease-in forwards;}
  .gn-surprise-flip.in{animation:gn-flip-in 0.28s cubic-bezier(0.2,0.8,0.2,1);}
  @keyframes gn-flip-out{to{transform:rotateY(90deg);}}
  @keyframes gn-flip-in{from{transform:rotateY(-90deg);}}

  /* Re-roll sizes to its label rather than taking a fixed share of the row —
     "Re-roll 6" in a half-width slab read as mostly empty. Continue absorbs the
     rest. Scoped to the sheet so the confirm dialog's own row is untouched. */
  .gn-sheet .gn-row .gn-secondary-btn{
    display:flex;align-items:center;justify-content:center;gap:6px;
    flex:0 0 auto;
    padding:12px 18px;
  }
  .gn-sheet .gn-row .gn-secondary-btn svg{width:16px;height:16px;}
  .gn-sheet .gn-row .gn-secondary-btn:disabled{opacity:0.4;cursor:not-allowed;}
  /* Holds the button's width steady as the count ticks down. */
  #gnRerollN{display:inline-block;min-width:1ch;text-align:center;}

  .sr-only{
    position:absolute;width:1px;height:1px;
    padding:0;margin:-1px;overflow:hidden;
    clip:rect(0,0,0,0);white-space:nowrap;border:0;
  }

  @media (prefers-reduced-motion:reduce){
    .gn-sheet{animation:none;}
    .gn-surprise-flip.out,.gn-surprise-flip.in{animation:none;}
    .gn-surprise-card .lock{transition:none;}
  }
  @media (prefers-reduced-transparency:reduce){
    .gn-surprise-card .swap{background:rgba(var(--bgs-bg-rgb),0.92);backdrop-filter:none;}
  }
  @supports not (backdrop-filter:blur(1px)){
    .gn-surprise-card .swap{background:rgba(var(--bgs-bg-rgb),0.92);}
  }
  @media (min-width:640px){
    .gn-sheet{max-width:520px;margin:0 auto;}
  }

  .gn-field{margin-bottom:16px;}
  .gn-field label{
    display:block;
    font-family:'IBM Plex Mono',monospace;
    font-size:11px;
    letter-spacing:0.06em;
    text-transform:uppercase;
    color:var(--bgs-gold-dim);
    margin-bottom:8px;
  }
  .gn-text-input{
    width:100%;
    background:var(--bgs-bg);
    border:1px solid rgba(var(--bgs-gold-rgb),0.22);
    border-radius:10px;
    color:var(--bgs-ivory);
    font-family:'Inter',sans-serif;
    /* 16px, not smaller: iOS Safari zooms the page in when you focus an input
       whose text is under 16px, and never zooms back out. Matches .search. */
    font-size:16px;
    padding:11px 13px;
    outline:none;
  }
  .gn-text-input:focus{border-color:var(--bgs-gold);}
  .gn-toggle-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
    background:none;
    border:none;
    padding:0;
    width:100%;
    cursor:pointer;
    text-align:left;
  }
  .gn-toggle-row .toggle-label{
    font-family:'Inter',sans-serif;
    font-size:13px;
    font-weight:500;
    color:var(--bgs-ivory);
  }
  .gn-summary{
    font-family:'IBM Plex Mono',monospace;
    font-size:12px;
    color:var(--bgs-gold-dim);
    margin:2px 0 18px;
  }
  .gn-error{
    font-size:12.5px;
    color:var(--bgs-danger-hover);
    margin:0 0 14px;
    display:none;
  }
  .gn-error.show{display:block;}

  /* ---- selection overlays on the shelf card ----
     Shared: body.is-selecting is set by game night's selection mode and by the
     bag's packing mode alike, so picking games looks and moves the same either
     way. Only the bar at the bottom differs. */
  .sel-ring,.checkbox,.info-btn{display:none;}
  body.is-selecting .sel-ring{
    display:block;
    position:absolute;inset:0;z-index:3;
    border:2px solid transparent;border-radius:18px;
    pointer-events:none;transition:border-color 0.15s ease;
  }
  body.is-selecting .game-card.selected .sel-ring{border-color:var(--bgs-gold);}
  body.is-selecting .checkbox{
    display:flex;align-items:center;justify-content:center;
    position:absolute;top:6px;left:6px;z-index:4;
    width:22px;height:22px;border-radius:6px;background:rgba(0,0,0,0.6);
    /* No backdrop-filter here: one per card is ~200 blur layers that all
       re-render whenever a cover dims, and toggling a pick stuttered. */
    border:1.5px solid rgba(var(--bgs-ivory-rgb),0.5);
    transition:background 0.15s ease, border-color 0.15s ease;
  }
  body.is-selecting .checkbox svg{width:13px;height:13px;opacity:0;transition:opacity 0.12s ease;}
  body.is-selecting .game-card.selected .checkbox{background:var(--bgs-gold);border-color:var(--bgs-gold);}
  body.is-selecting .game-card.selected .checkbox svg{opacity:1;}
  body.is-selecting .info-btn{
    display:flex;align-items:center;justify-content:center;
    position:absolute;top:0;right:0;z-index:4;width:40px;height:40px;
    border:none;background:transparent;cursor:pointer;padding:0;
  }
  body.is-selecting .info-btn i{
    display:flex;align-items:center;justify-content:center;
    width:22px;height:22px;border-radius:50%;background:rgba(0,0,0,0.6);
    border:1.5px solid rgba(var(--bgs-ivory-rgb),0.5);
    font-style:normal;font-size:12px;font-weight:700;color:var(--bgs-ivory-70);font-family:'Fraunces',serif;
  }
  body.is-selecting .info-btn:hover i{border-color:var(--bgs-gold);color:var(--bgs-gold);}
  body.is-selecting .game-card:not(.selected) .art img{opacity:0.62;transition:opacity 0.15s ease;}

  /* ---- bottom bar ---- */
  .gn-bar{
    position:fixed;left:0;right:0;bottom:0;z-index:15;
    padding:12px 16px calc(12px + env(safe-area-inset-bottom));
    background:rgba(var(--bgs-bg-rgb),0.94);backdrop-filter:blur(10px);
    border-top:1px solid rgba(var(--bgs-gold-rgb),0.25);
    display:none;align-items:center;transform:translateY(100%);
    transition:transform 0.22s cubic-bezier(.2,.8,.3,1);
  }
  body.gn-selecting .gn-bar{display:flex;transform:translateY(0);}
  .gn-bar__cancel{

<script>
  // Liquid Glass (docs/claude-code-spec-liquid-glass.md). Live for everyone;
  // ?glass=0 opts a device out (persisted to localStorage.bgsGlass) and
  // ?glass=1 opts it back in. Same kill-switch shape as the other flags: set
  // GLASS_ENABLED to false to pull the material without reverting anything.
  // css/glass.css is loaded here — last in <head>, so it wins over the page's
  // own styles at equal specificity. Nothing else is gated: the .glass class
  // sits in the markup regardless and is inert without the stylesheet.
  (function(){
    var GLASS_ENABLED = true;
    try{
      var q = new URLSearchParams(location.search).get('glass');
      if(q === '0') localStorage.setItem('bgsGlass', '0');
      else if(q === '1') localStorage.removeItem('bgsGlass');
      var off = localStorage.getItem('bgsGlass') === '0';
      if(GLASS_ENABLED ? off : !(q === '1')) return;
    }catch(e){ if(!GLASS_ENABLED) return; }
    var link = document.createElement('link');
    link.rel = 'stylesheet'; link.href = '/css/glass.css';
    document.head.appendChild(link);
  })();
</script>

<script type="module">
// Absolute imports: this page is served at /u/<slug>, so a relative './js/…'
// would resolve under /u/ and 404 silently. Same rule as the game-night pages.
import {
  DEFAULT_FILTERS, isFilterActive, activeGroupCount, playersLabel,
  timeBucket, playersMatch, bestFitMatch, applyFilters,
  weightLabel, timeLabel, playersRangeLabel, vibeLabel
} from '/js/filters.js';
import { createGameModal } from '/js/game-modal.js';
import { registerOverlay, syncScrollLock } from '/js/scroll-lock.js';
import { VIBES, applyVibes } from '/js/vibes.js';
import { bagStore } from '/js/bag-store.js';
import { coverage as bagCoverage, timeLabel as bagTimeLabel, cellsHTML as bagCellsHTML } from '/js/bag-coverage.js';
import { fetchProfileBySlug, fetchShelfStatus, fetchShelfGames } from '/js/shelf-data.js';
import { getUser, fetchMyProfile, signOut, userDisplayName } from '/js/auth.js';

// ---- Game Night feature flag ----
// Live: every visitor gets the Game Night pill. All four stages — session
// creation, waiting room, swipe voting, results — are merged and working, so
// the flag is now a kill switch rather than a curtain. Set it back to false to
// pull the feature without reverting anything; ?gamenight=1 still reveals it
// while it is off.
const GAME_NIGHT_ENABLED = true;
const gameNightVisible =
  GAME_NIGHT_ENABLED || new URLSearchParams(location.search).has('gamenight');

// ---- Game night invite poster flag ----
// Live: Game Night's selection bar carries a Share button that opens the
// invite sheet for the selected games. The flag is a kill switch, the same
// shape as the Game Night one: set it back to false to pull the feature
// without reverting anything, and ?invite=1 still reveals it while it is
// off. js/invite.js is imported, and builds its DOM, only when this is
// true, so a shelf with the flag off is byte-for-byte what it was.
const INVITE_ENABLED = true;
const inviteVisible =
  INVITE_ENABLED || new URLSearchParams(location.search).get('invite') === '1';
let invite = null; // set by initInvite(); told about every selection change

// ---- Bag feature flag ----
// Live: every visitor gets "Pack a bag" — pack a named subset of the shelf,
// see what it covers, and browse the shelf as if the bag were the collection.
// Same shape as the flags above, a kill switch rather than a curtain: set it
// back to false to pull the feature without reverting anything, and ?bag=1
// still reveals it while it is off. No flag in this project persists itself to
// storage, so this one doesn't either — the link carries it. With it off
// js/bag-ui.js is never imported, nothing is added to the page, and the bags
// key is never written.
const BAG_ENABLED = true;
const bagVisible =
  BAG_ENABLED || new URLSearchParams(location.search).get('bag') === '1';
let bag = null; // set by initBag(); owns packing mode and the coverage bar

// /bag/<id>: a bag's own page. It is routed here rather than to a page of its
// own so it shares the grid, the filters, the search and the modal. Not
// gated by the flag — a shared link has to work for someone who has never
// seen it. Game Night runs on it too, scoped to the bag: `games` there is the
// bag's list, so the pool, the random pick and the lobby never see the rest
// of the shelf. Packing does not open on a bag page; its Edit goes back to
// the shelf.
const bagRouteId = (location.pathname.match(/^\/bag\/([a-z0-9]{8})\/?$/i) || [])[1]?.toLowerCase() || '';
const isBagRoute = !!bagRouteId;
let pageBag = null; // the bag this page is, on /bag/<id>

// Game night and the bag pick games the same way, off the same card overlays:
// a card carries them whenever either mode can be entered, and body.is-selecting
// decides when they show. A bag page can enter game night but never packing.
const selectionOverlays = gameNightVisible || (bagVisible && !isBagRoute);

let games = [];
// The profile whose shelf this is. Set by loadGames(); game nights started
// from here are scoped to it (owner_id).
let profile = null;

class ShelfError extends Error {
  constructor(kind){ super(kind); this.kind = kind; } // 'not-found' | 'private' | 'bag-not-found'
}

// /u/<slug>: the slug is the BGG username lowercased, and is compared to
// profiles.slug as is — no lookup by original casing.
function slugFromPath(){
  const m = location.pathname.match(/^\/u\/([^/]+)/);
  return m ? decodeURIComponent(m[1]).trim().toLowerCase() : '';
}

// /shelf is "my shelf": a signed-in user with a profile is sent to it, one
// without a profile sees their own shelf empty, with the way to connect.
const isOwnShelfRoute = location.pathname.replace(/\/$/, '') === '/shelf';
let viewer = null;

async function loadGames(){
  if(isOwnShelfRoute){
    viewer = await getUser();
    if(!viewer){ location.replace('/'); throw new ShelfError('redirect'); }
    const mine = await fetchMyProfile();
    if(mine?.slug){ location.replace(`/u/${mine.slug}`); throw new ShelfError('redirect'); }
    throw new ShelfError('empty-own');
  }
  if(isBagRoute){
    pageBag = await bagStore.get(bagRouteId);
    if(!pageBag) throw new ShelfError('bag-not-found');
    // A bag whose shelf has since gone private reads as missing too: the
    // page would have nothing to show for it.
    profile = await fetchProfileBySlug(pageBag.owner);
    if(!profile) throw new ShelfError('bag-not-found');
    state.filters.showExpansions = !!profile.show_expansions;
    const packed = new Set(pageBag.game_ids);
    // Ids the shelf no longer carries just match nothing; the page counts
    // what it renders. (Stage 4 adds proposals as a second list — they are
    // not part of what a bag *holds*, so they will not land here.)
    games = (await fetchShelfGames(profile.id)).filter(g => packed.has(String(g.bggId)));
    applyVibes(games);
    renderBagHeader();
    return;
  }
  const slug = slugFromPath();
  if(!slug) throw new ShelfError('not-found');
  profile = await fetchProfileBySlug(slug);
  if(!profile){
    // RLS hides a private profile from everyone but its owner, so ask the
    // one thing the database will say about it: does it exist, and is it public.
    const status = await fetchShelfStatus(slug);
    throw new ShelfError(status === 'private' ? 'private' : 'not-found');
  }
  state.filters.showExpansions = !!profile.show_expansions;
  games = await fetchShelfGames(profile.id);
  applyVibes(games);
  renderOwner();
}

function renderOwner(){
  const name = profile.display_name || profile.bgg_username || profile.slug;
  document.title = `${name} · BoardgameShelf`;
  // For the share sheets that read the live page; a crawler sees none of
  // this. The ?v= changes with a rename so link previews refetch the image.
  setMeta('og:image', ogImageUrl(profile));
  const eyebrow = document.getElementById('shelfOwner');
  eyebrow.textContent = name;
  // Owner: Settings. Signed-in guest: their own shelf (/welcome routes to it,
  // or to the connect screen if they have none yet). Signed out: Sign in.
  getUser().then(user => {
    if(user && user.id === profile.id){
      // The owner's Settings: a gear at the right end of the line, going
      // where the Settings word used to.
      const gear = document.createElement('button');
      gear.type = 'button';
      gear.className = 'owner-gear';
      gear.setAttribute('aria-label', 'Settings');
      gear.innerHTML = GEAR_ICON;
      gear.addEventListener('click', ()=>{ location.href = '/settings'; });
      eyebrow.appendChild(gear);
      return;
    }
    const a = document.createElement('a');
    a.className = 'owner-link';
    if(!user){ a.href = '/'; a.textContent = 'Sign in'; }
    else { a.href = '/welcome'; a.textContent = 'Your shelf'; }
    eyebrow.append(' · ', a);
  }).catch(()=>{});
}

// The share sheet is fetched the first time something is shared, so a shelf
// that never shares never loads it.
async function openShare(opts){
  const { openShareSheet } = await import('/js/share-sheet.js');
  return openShareSheet(opts);
}
function shareBag(opener){
  return openShare({
    url: `${location.origin}/bag/${encodeURIComponent(pageBag.id)}`,
    title: 'Share this bag',
    subtitle: 'Anyone with the link can browse it',
    opener,
  });
}

// /api/og/{slug} with a cache-buster from display_name_updated_at (unix
// seconds), so previewers that cache the image for weeks pick up a rename.
function ogImageUrl(p){
  const t = Date.parse(p.display_name_updated_at || '');
  const v = Number.isFinite(t) ? `?v=${Math.floor(t / 1000)}` : '';
  return `${location.origin}/api/og/${encodeURIComponent(p.slug)}${v}`;
}

function setMeta(property, content){
  let m = document.querySelector(`meta[property="${property}"]`);
  if(!m){ m = document.createElement('meta'); m.setAttribute('property', property); document.head.appendChild(m); }
  m.setAttribute('content', content);
}

const GEAR_ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>';

const BAG_SHARE_ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12v7a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-7M12 3v13M8 7l4-4 4 4"/></svg>';

// The bag page wears the shelf's skeleton — eyebrow, H1, the tagline slot,
// the search row, the count line, the grid — with the bag's own words in it.
// Mockup: docs/mockups/bag-page-mockup.html, "Bag page".
function renderBagHeader(){
  const name = pageBag.name || 'Bag';
  const ownerName = profile.display_name || profile.bgg_username || profile.slug;
  document.title = `${name} · BoardgameShelf`;
  // Set for the share sheets that read the live page; a crawler sees none of
  // this until a bag OG route exists, and og:image stays the shelf's.
  setMeta('og:title', `${name} · a bag from ${ownerName}'s shelf`);
  setMeta('og:image', ogImageUrl(profile));

  // The header styles live in bag.css, which js/bag-ui.js only loads behind
  // the flag; a bag page needs them regardless. The confirm dialog is the
  // one the game-night pages ask with before an irreversible step.
  for(const href of ['/css/bag.css', '/css/confirm-dialog.css']){
    if(document.querySelector(`link[href="${href}"]`)) continue;
    const link = document.createElement('link');
    link.rel = 'stylesheet'; link.href = href;
    document.head.appendChild(link);
  }

  const eyebrow = document.getElementById('shelfOwner');
  eyebrow.classList.add('bag-eyebrow');
  eyebrow.textContent = '';
  const mark = document.createElement('span');
  mark.innerHTML = '<i class="bag-diamond" aria-hidden="true"></i> Bag';
  const from = document.createElement('a');
  from.className = 'bag-eyebrow__from';
  from.href = `/u/${encodeURIComponent(profile.slug)}`;
  from.textContent = `from ${ownerName}`;
  eyebrow.append(mark, ' · ', from);

  // Replace only the wordmark text: the beta pill sits beside it inside the
  // h1 and must survive the rename.
  document.querySelector('header h1').firstChild.nodeValue = name;

  // Coverage sits where the tagline was: the eight player cells and the
  // meta line, the same rule the packing bar uses.
  const cover = bagCoverage(games);
  const cov = document.createElement('div');
  cov.className = 'bag-cov-row';
  const meta = `${games.length} game${games.length === 1 ? '' : 's'} · ${bagTimeLabel(cover.minTime, cover.maxTime)}`;
  cov.innerHTML = `<div class="bag-dots" aria-hidden="true">${bagCellsHTML(cover.cells, { small: true })}</div><span class="bag-cov-row__meta">${meta}</span>`;
  cov.setAttribute('aria-label', `${meta}. Player counts covered: ${
    cover.cells.map((on, i) => on ? (i === 7 ? '8 or more' : String(i + 1)) : '').filter(Boolean).join(', ') || 'none'}`);
  document.querySelector('header .sub').replaceWith(cov);

  // Share is the one gold action; Edit shows only where the edit key is.
  const acts = document.createElement('div');
  acts.className = 'bag-actions';
  const share = document.createElement('button');
  share.type = 'button'; share.className = 'bag-pill bag-pill--gold';
  share.innerHTML = `${BAG_SHARE_ICON}Share`;
  share.addEventListener('click', ()=> shareBag(share));
  acts.appendChild(share);
  if(bagStore.canEdit(pageBag.id)){
    const edit = document.createElement('a');
    edit.className = 'bag-pill bag-pill--quiet';
    edit.href = `/u/${encodeURIComponent(profile.slug)}?bag=1&edit=${encodeURIComponent(pageBag.id)}`;
    edit.textContent = 'Edit';
    acts.appendChild(edit);
    const del = document.createElement('button');
    del.type = 'button';
    del.className = 'bag-pill bag-pill--quiet bag-pill--danger';
    del.textContent = 'Delete';
    del.addEventListener('click', ()=> confirmDeleteBag(del));
    acts.appendChild(del);
  }
  cov.after(acts);
  // Where a failed delete says so; empty until then.
  const note = document.createElement('p');
  note.className = 'bag-actions__error';
  note.setAttribute('role', 'alert');
  note.hidden = true;
  acts.after(note);

  document.getElementById('search').placeholder = 'Search this bag…';
  document.getElementById('searchCompact').placeholder = 'Search this bag…';
}

// Deleting a bag asks first, in the same dialog the game-night pages use.
// Only the browser holding the edit key ever sees the button; the database
// checks the key again on the way through. The games are untouched — a bag
// is a list, not the shelf — so the copy says so.
let bagConfirm = null;
function confirmDeleteBag(opener){
  if(!bagConfirm){
    bagConfirm = document.createElement('div');
    bagConfirm.className = 'confirm';
    bagConfirm.id = 'bagConfirm';
    bagConfirm.setAttribute('role', 'dialog');
    bagConfirm.setAttribute('aria-modal', 'true');
    bagConfirm.setAttribute('aria-labelledby', 'bagConfirmTitle');
    bagConfirm.innerHTML = `
      <div class="confirm__panel">
        <h3 id="bagConfirmTitle">Delete this bag?</h3>
        <p>Anyone with the link will find nothing there. The games stay on the shelf.</p>
        <div class="confirm__row">
          <button class="confirm__keep" type="button" data-bag-keep>Keep it</button>
          <button class="confirm__end" type="button" data-bag-delete>Delete</button>
        </div>
      </div>`;
    document.body.appendChild(bagConfirm);
    registerOverlay(() => bagConfirm.classList.contains('open'));
    const close = ()=>{
      bagConfirm.classList.remove('open');
      syncScrollLock();
      bagConfirm._opener?.focus({ preventScroll: true });
    };
    bagConfirm.querySelector('[data-bag-keep]').addEventListener('click', close);
    bagConfirm.addEventListener('click', (e)=>{ if(e.target === bagConfirm) close(); });
    bagConfirm.addEventListener('keydown', (e)=>{ if(e.key === 'Escape'){ e.preventDefault(); close(); } });
    bagConfirm.querySelector('[data-bag-delete]').addEventListener('click', async ()=>{
      const btn = bagConfirm.querySelector('[data-bag-delete]');
      btn.disabled = true; btn.textContent = 'Deleting…';
      try {
        await bagStore.remove(pageBag.id);
        // Back to the shelf the bag came from; its Bags row no longer lists it.
        location.href = `/u/${encodeURIComponent(profile.slug)}`;
      } catch (err) {
        btn.disabled = false; btn.textContent = 'Delete';
        close();
        const note = document.querySelector('.bag-actions__error');
        note.textContent = err?.code === 'FORBIDDEN' || err?.code === 'NO_TOKEN'
          ? 'This browser’s edit key for the bag doesn’t match, so it can’t be deleted from here.'
          : err?.code === 'NOT_FOUND'
            ? 'This bag is already gone.'
            : 'Couldn’t reach the shelf to delete it. Check the connection and try again.';
        note.hidden = false;
        console.warn('[bag] delete failed', err);
      }
    });
  }
  bagConfirm._opener = opener;
  bagConfirm.classList.add('open');
  syncScrollLock();
  bagConfirm.querySelector('[data-bag-keep]').focus({ preventScroll: true });
}

// "Show expansions" is the owner's Settings choice, read off the profile once
// it loads. It rides inside `filters` so applyFilters sees it, but it is not
// a filter: resets keep it, the sheet does not show it, chips do not list it.
const freshFilters = () => ({ ...DEFAULT_FILTERS, showExpansions: !!profile?.show_expansions });
const state = {
  filters: freshFilters(),
  search: "",
  sort: "off", // 'off' (ascending, default) | 'desc'
  selectionMode: false,
  selectedIds: new Set(), // bggId strings, in selection order — persists across filter changes
};
let draftFilters = freshFilters();

function render(){
  const shelf = document.getElementById('shelf');
  const countEl = document.getElementById('shelf-count-text');
  shelf.innerHTML = "";

  let filtered = applyFilters(games, state.filters, state.search);
  filtered = filtered.slice().sort((a,b)=> state.sort==="desc" ? a.bggRating - b.bggRating : b.bggRating - a.bggRating);

  // The count line tracks what is showing: the whole pool when nothing is
  // narrowing it, "x of N" once a search or filter does. Expansions only
  // count once "Show expansions" is on; until then the pool is base games.
  // On a bag page `games` is the bag.
  const pool = state.filters.showExpansions ? games : games.filter(g => g.subtype !== 'boardgameexpansion');
  const total = pool.length;
  const all = filtered.length === total;
  countEl.textContent = isBagRoute
    ? (all
        ? `${total} game${total === 1 ? '' : 's'} in this bag`
        : `${filtered.length} of ${total} in this bag`)
    : (all
        ? `${total} on the shelf`
        : `${filtered.length} of ${total} on the shelf`);

  // Cached for the tray's "hidden by filters" tags. Only what's *filtered* can
  // change it, and every such change comes through here — so selection toggles
  // never need to re-run applyFilters.
  gnFilteredIds = new Set(filtered.map(g => g.bggId));

  updateFilterButton();
  renderChips();

  if(filtered.length===0){
    shelf.innerHTML = `<p class="empty-state">Nothing on the shelf for that.<br>Try another vibe, or widen the player count.<button type="button" id="emptyReset">Clear filters</button></p>`;
    const emptyReset = document.getElementById('emptyReset');
    if(emptyReset) emptyReset.addEventListener('click', ()=>{
      state.filters = freshFilters();
      render();
    });
    if(gameNightVisible && state.selectionMode) updateGnBar();
    return;
  }

  filtered.forEach(g=>{
    const el = document.createElement('button');
    const isSelected = gameNightVisible && state.selectedIds.has(g.bggId);
    el.className = 'game-card' + (isSelected ? ' selected' : '');
    el.dataset.id = g.bggId;
    el.innerHTML = `
      ${selectionOverlays ? '<span class="sel-ring"></span>' : ''}
      <div class="art">
        ${selectionOverlays ? `<span class="checkbox">${GN_CHECK_SVG}</span><span class="info-btn" data-gn-info role="button" aria-label="${g.title} details"><i>i</i></span>` : ''}
        <img src="${g.imageSmall || g.image}" alt="${g.title} cover" loading="lazy" decoding="async" data-orig="${g.image}" onerror="if(this.dataset.orig&&this.src!==this.dataset.orig){this.src=this.dataset.orig;delete this.dataset.orig;return}this.closest('.art').style.background='var(--bgs-plate)';this.remove()">
      </div>
      <div class="info">
        <h3 class="title">${g.title}</h3>
        <div class="meta-row">
          <span class="rating-pill">★ ${g.bggRating.toFixed(1)}</span>
          <span class="players">${playersRangeLabel(g.players)}</span>
        </div>
      </div>
    `;
    if(bag) bag.decorateCard(el, g);
    el.addEventListener('click', (ev)=>{
      // Packing turns the tile into a toggle, exactly as selection mode does:
      // the cover picks the game, the ⓘ is the way to the details.
      if(bag && bag.packing()){
        if(ev.target.closest('[data-gn-info]')){ openCard(g); return; }
        bag.toggleGame(g, el);
        return;
      }
      if(gameNightVisible && state.selectionMode){
        if(ev.target.closest('[data-gn-info]')){ openCard(g); return; }
        toggleSelect(g);
        return;
      }
      openCard(g);
    });
    shelf.appendChild(el);
  });

  // Filters/search stay live while selecting; selections persist regardless,
  // so the tray's "hidden by filters" tags need to stay in sync with every
  // re-render, not just the ones that came from toggling a selection.
  if(gameNightVisible && state.selectionMode) updateGnBar();
}

function updateFilterButton(){
  const count = activeGroupCount(state.filters);
  const active = count > 0;
  // The header's button and the compact topbar's show the same state.
  for(const [btnId, badgeId] of [['filterBtn','filterBadge'], ['filterBtnCompact','filterBadgeCompact']]){
    const btn = document.getElementById(btnId);
    const badge = document.getElementById(badgeId);
    btn.classList.toggle('active', active);
    if(active){
      badge.hidden = false;
      badge.textContent = String(count);
    } else {
      badge.hidden = true;
    }
  }
}

function renderChips(){
  const row = document.getElementById('chipsRow');
  const chips = [];
  if(state.filters.minPlayers !== 1 || state.filters.maxPlayers !== 11){
    chips.push({ key:'players', label:`${playersLabel(state.filters)} players` });
  }
  if(state.filters.vibe){
    chips.push({ key:'vibe', label: vibeLabel(state.filters.vibe) });
  }
  if(state.filters.time !== 'any'){
    const labels = { quick:'Quick', medium:'Medium', long:'Long' };
    chips.push({ key:'time', label: labels[state.filters.time] });
  }
  if(state.filters.weight !== 'any'){
    const labels = { light:'Light', medium:'Medium', heavy:'Heavy' };
    chips.push({ key:'weight', label: labels[state.filters.weight] });
  }
  if(state.filters.bestFit){
    chips.push({ key:'bestFit', label: 'Recommended counts only' });
  }
  if(chips.length===0){
    row.hidden = true;
    row.innerHTML = '';
    return;
  }
  row.hidden = false;
  row.innerHTML = chips.map(c=>`
    <span class="chip" data-key="${c.key}">
      ${c.label}
      <button type="button" aria-label="Remove ${c.label} filter">✕</button>
    </span>
  `).join('');
  row.querySelectorAll('.chip button').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const key = btn.closest('.chip').dataset.key;
      if(key==='players'){ state.filters.minPlayers = 1; state.filters.maxPlayers = 11; }
      else if(key==='bestFit'){ state.filters.bestFit = false; }
      else if(key==='vibe'){ state.filters.vibe = null; }
      else state.filters[key] = 'any';
      render();
    });
  });
}

function updateLiveCount(){
  const pct = v => ((v-1)/(11-1))*100;
  rangeFill.style.left = pct(draftFilters.minPlayers)+'%';
  rangeFill.style.width = (pct(draftFilters.maxPlayers)-pct(draftFilters.minPlayers))+'%';
  const exact = draftFilters.minPlayers === draftFilters.maxPlayers ? draftFilters.minPlayers : null;
  numberCueRow.querySelectorAll('.number-cue').forEach(cue=>{
    const n = parseInt(cue.dataset.n,10);
    cue.classList.toggle('active', n>=draftFilters.minPlayers && n<=draftFilters.maxPlayers);

  });
  playersGroupLabel.textContent = `Players — ${playersLabel(draftFilters)}`;
  syncVibePills();

function clampRange(){
  let min = parseInt(rangeMin.value,10);
  let max = parseInt(rangeMax.value,10);
  if(min > max){
    if(document.activeElement === rangeMin) max = min; else min = max;
    rangeMin.value = min;
    rangeMax.value = max;
  }
  draftFilters.minPlayers = min;
  draftFilters.maxPlayers = max;
  updateLiveCount();
}

rangeMax.addEventListener('input', clampRange);

numberCueRow.addEventListener('click', (e)=>{
  const cue = e.target.closest('.number-cue');
  if(!cue) return;
  const n = parseInt(cue.dataset.n,10);
  // Tapping the count that's already the only one selected clears back to Any,
  // so the pick stays reversible without dragging the thumbs apart again.
  const alreadyOnly = draftFilters.minPlayers === n && draftFilters.maxPlayers === n;
  draftFilters.minPlayers = alreadyOnly ? 1 : n;
  draftFilters.maxPlayers = alreadyOnly ? 11 : n;
  rangeMin.value = draftFilters.minPlayers;

document.addEventListener('keydown', (e)=>{
  if(e.key !== 'Escape' && e.key !== 'Tab') return;
  if(!isSheetOpen()) return;
  if(e.key === 'Escape'){
    closeSheet();
    return;
  }
  // focus trap
  const focusable = getFocusable();
  if(!focusable.length) return;
  const first = focusable[0];
  const last = focusable[focusable.length-1];
  if(e.shiftKey && document.activeElement === first){
    e.preventDefault();
    last.focus();
  } else if(!e.shiftKey && document.activeElement === last){
    e.preventDefault();
    first.focus();
  }
});
