<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Swipe to Vote — BoardgameShelf</title>
<link rel="icon" href="/assets/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/assets/icon-180.png">
<link rel="manifest" href="/site.webmanifest">
<meta name="theme-color" content="#160F0A">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,600;1,9..144,600&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/base.css">
<link rel="stylesheet" href="/css/game-modal.css">
<link rel="stylesheet" href="/css/confirm-dialog.css">
<style>
  /* Tokens and page chrome (including .deck-card / .deck-card.back, used by
     the tallying shuffle below) come from css/base.css. */
  html,body{
    /* Keeps an overscroll from turning into pull-to-refresh or a horizontal
       navigation gesture — either one reloads the deck mid-vote. Handles the
       browsers that honour it; the history guard in the script covers iOS,
       which does not. */
    overscroll-behavior:none;
  }
  :root{
    /* One duration for promotion, focus and the tally chip, so the stack and
       the count read as one movement. */
    --dur:.32s;
  }
  body{
    padding:20px 16px calc(40px + env(safe-area-inset-bottom));
  }
  .screen{max-width:400px;margin:0 auto;position:relative;}
  .eyebrow{
    font-family:'IBM Plex Mono',monospace;font-size:10.5px;letter-spacing:.16em;
    text-transform:uppercase;color:var(--bgs-gold-dim);text-align:center;margin-bottom:6px;
  }
  h1{
    font-family:'Fraunces',serif;font-weight:600;font-size:22px;
    text-align:center;margin:0 0 18px;letter-spacing:-.01em;
  }

  /* ---- progress ---- */
  .progress-row{display:flex;align-items:center;gap:10px;margin-bottom:20px;}
  .progress-track{flex:1;height:4px;border-radius:99px;background:rgba(var(--bgs-ivory-rgb),.1);overflow:hidden;}
  .progress-fill{height:100%;background:var(--bgs-gold);border-radius:99px;transition:width .35s ease;}

  /* The count is what a landed vote pays back, so it rolls and flashes gold.
     Gold rather than the sage/clay vote colours: those say which way you
     voted, this says you got somewhere. Transition only, never an animation —
     see the layer rule at the top of js/swipe.js. */
  .tally{
    display:flex;align-items:center;gap:2px;white-space:nowrap;
    font-family:'IBM Plex Mono',monospace;font-size:11px;font-weight:500;
    padding:5px 10px;border-radius:999px;
    background:rgba(var(--bgs-ivory-rgb),.06);
    border:1px solid rgba(var(--bgs-ivory-rgb),.1);
    color:var(--bgs-ivory-45);
    transition:background var(--dur),border-color var(--dur),color var(--dur);
  }
  .tally .roll{display:inline-block;height:1.2em;line-height:1.2em;overflow:hidden;vertical-align:top;}
  .tally .roll span{display:block;transition:transform .34s cubic-bezier(.2,.8,.2,1);}
  .tally.pulse{
    background:rgba(var(--bgs-gold-rgb),.18);
    border-color:var(--bgs-gold);
    color:var(--bgs-gold);
  }

  /* ---- card stack ----
     Every rule here stays scoped under .stack: css/game-modal.css also owns a
     .card (the shared game detail modal, which this page opens from the info
     button), and an unscoped .card here would win on source order and stretch
     that modal to fill the backdrop.

     Two layers per card, and they have to stay separate. The outer .card owns
     the depth transform as a CSS transition; the inner .card-body owns the
     drag transform (set inline) and the exit (Web Animations API). They used
     to be one element, so the depth and drag transforms overwrote each other —
     which is why the stack could only be rebuilt after the exit finished, and
     the next card appeared to jump in late. */
  .stack{position:relative;height:400px;margin-bottom:26px;touch-action:none;}

  /* outer — depth only */
  .stack .card{
    position:absolute;inset:0;
    transform:translateY(calc(var(--d) * 12px)) scale(calc(1 - var(--d) * .08));
    transition:transform var(--dur) cubic-bezier(.2,.8,.2,1);
    z-index:calc(10 - var(--d));
    will-change:transform;
    /* css/game-modal.css styles an unscoped `.card` and gives it
       `animation: bgs-modal-pop`, whose keyframes animate transform and
       opacity. Every card here inherits it, which would leave this element
       carrying an animation AND a transition on transform at once — the one
       combination WebKit resolves by silently dropping the transition, so
       promotion would snap on iPhone while looking correct in Chrome. It also
       faded the depth-3 card in over its `opacity:0`. Cancelled here. */
    animation:none;
  }
  /* Mounted and ready so a promotion never exposes an empty slot, but not yet
     part of what you can see. */
  .stack .card[data-depth="3"]{opacity:0;}
  .stack .card:not([data-depth="0"]){pointer-events:none;}
  /* Defensive: the front card's depth transform does not change mid-drag, but
     if anything ever reassigns it, it must not glide. */
  .stack.dragging .card[data-depth="0"]{transition:none;}

  /* inner — drag + exit */
  .stack .card-body{
    position:absolute;inset:0;border-radius:20px;overflow:hidden;background:var(--bgs-plate);
    border:1px solid rgba(var(--bgs-gold-rgb),.18);box-shadow:0 24px 44px -12px rgba(0,0,0,.5);
    user-select:none;cursor:grab;
  }
  .stack .card-body.dragging{cursor:grabbing;}

  /* Depth reads as focus. The cover overhangs the card on every side so the
     blur samples real pixels instead of fading out into transparency at the
     rounded corners; .card-body clips the overhang. */
  .stack .cover{
    position:absolute;inset:-10px;overflow:hidden;background:var(--bgs-bg-radial);
    transition:filter var(--dur) ease-out;
  }
  .stack .cover img{width:100%;height:100%;object-fit:cover;display:block;pointer-events:none;}
  .stack .card[data-depth="1"] .cover{filter:blur(3px);}
  .stack .card[data-depth="2"] .cover{filter:blur(6px);}
  .stack .card[data-depth="3"] .cover{filter:blur(6px);}

  /* Kept out of .cover so it never blurs: this gradient is what actually
     carries the text contrast. Starting at 40% keeps the meta row on the
     >=90% region. */
  .stack .scrim{
    position:absolute;inset:0;pointer-events:none;z-index:1;
    background:linear-gradient(180deg,rgba(0,0,0,0) 40%,rgba(20,18,15,.92) 100%);
  }

  .stack .meta{position:absolute;left:18px;right:18px;bottom:18px;z-index:2;}
  .stack .meta h2{
    font-family:'Fraunces',serif;font-weight:600;font-size:21px;line-height:1.1;
    margin:0 0 8px;letter-spacing:-.01em;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
  }
  .stack .meta ul{
    margin:0;padding:0;list-style:none;display:flex;gap:14px;flex-wrap:wrap;
    font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--bgs-ivory-70);
  }
  .stack .meta li{display:inline-flex;align-items:center;gap:5px;}
  .stack .meta svg{
    width:14px;height:14px;flex:none;stroke:currentColor;fill:none;
    stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;opacity:.85;
  }
  /* Belt-and-braces over the scrim, not the contrast source. */
  .stack .meta h2,.stack .meta li{text-shadow:0 1px 2px rgba(0,0,0,.6);}
  /* Only legible on the front card, and arriving a beat after promotion so it
     is not fading in while the card is still moving. */
  .stack .card:not([data-depth="0"]) .meta{opacity:0;}
  .stack .card[data-depth="0"] .meta{opacity:1;transition:opacity .18s ease-out .1s;}
  .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;}

  .rating-pill{
    display:inline-flex;align-items:center;gap:3px;margin-bottom:8px;
    background:rgba(0,0,0,.35);border:1px solid rgba(var(--bgs-gold-rgb),.35);
    border-radius:20px;padding:3px 8px 3px 7px;font-size:11px;font-weight:700;
    color:var(--bgs-gold);white-space:nowrap;
  }

  .info-btn{
    position:absolute;top:12px;right:12px;width:30px;height:30px;border-radius:50%;z-index:6;
    background:rgba(0,0,0,.42);backdrop-filter:blur(3px);color:var(--bgs-ivory);
    display:flex;align-items:center;justify-content:center;border:1px solid rgba(var(--bgs-ivory-rgb),.2);
    font-family:'Fraunces',serif;font-style:italic;font-weight:600;font-size:14px;cursor:pointer;
  }

  /* full-card black wash — darkens the same way in both directions; the
     stamp colour below is what carries play/pass meaning. */
  .wash{position:absolute;inset:0;opacity:0;pointer-events:none;z-index:3;background:rgba(20,18,15,.55);}

  .stamp{
    position:absolute;top:26px;z-index:4;opacity:0;pointer-events:none;
    font-family:'IBM Plex Mono',monospace;font-weight:500;
    font-size:20px;line-height:1;letter-spacing:.12em;
    /* Right pad trimmed to offset the trailing letter-spacing, so the box
       looks optically centred on the word. */
    padding:6px 10px 6px 12px;
    border:2px solid currentColor;border-radius:6px;
    /* A clay outline over blackwashed light art is only ~1.8:1 on its own;
       this plate lifts it past the 3:1 non-text minimum. Do not remove. */
    background:rgba(20,18,15,.6);
    transform-origin:center;
  }
  .stamp.play{left:22px;color:var(--bgs-vote-play);transform:rotate(-12deg) scale(1.4);}
  .stamp.pass{right:22px;color:var(--bgs-vote-pass);transform:rotate(12deg) scale(1.4);}
  /* Keyframes only — a transition on transform here would be dropped by
     WebKit and the stamp would jump instead of snapping. */
  .stamp.commit{animation:stampIn .22s cubic-bezier(.2,1.4,.4,1) forwards;}
  @keyframes stampIn{to{transform:rotate(var(--r)) scale(1);opacity:1;}}

  .stack-empty{
    position:absolute;inset:0;border-radius:20px;border:1.5px dashed rgba(var(--bgs-gold-rgb),.25);
    display:flex;align-items:center;justify-content:center;color:var(--bgs-ivory-45);font-size:12.5px;
  }

  /* ---- vote buttons ---- */
  .vote-actions{display:flex;justify-content:center;align-items:center;gap:26px;margin-bottom:6px;}
  .vote-btn{
    width:56px;height:56px;border-radius:50%;display:flex;align-items:center;justify-content:center;
    cursor:pointer;border:1.5px solid;background:var(--bgs-plate);transition:transform .12s ease,opacity .2s ease;
  }
  .vote-btn:active{transform:scale(.88);}
  .vote-btn[disabled]{opacity:.25;cursor:not-allowed;}
  .vote-btn:focus-visible{outline:2px solid var(--bgs-gold);outline-offset:3px;}
  .vote-btn.pass{border-color:rgba(var(--bgs-vote-pass-rgb),.55);color:var(--bgs-vote-pass);background:rgba(var(--bgs-vote-pass-rgb),.10);}
  .vote-btn.play{border-color:rgba(var(--bgs-vote-play-rgb),.55);color:var(--bgs-vote-play);background:rgba(var(--bgs-vote-play-rgb),.10);}
  .vote-hint{text-align:center;font-size:11.5px;color:var(--bgs-ivory-45);margin-top:16px;}

  /* ---- waiting state ---- */
  .waiting-panel{padding:6px 6px 10px;display:flex;flex-direction:column;align-items:center;gap:16px;position:relative;}
  .die-wrap{position:relative;width:52px;height:52px;display:flex;align-items:center;justify-content:center;}
  .die{width:52px;height:52px;position:relative;z-index:1;animation:tumble 2.4s cubic-bezier(.45,0,.2,1) infinite;}
  @keyframes tumble{0%{transform:rotate(0) scale(1);}35%{transform:rotate(200deg) scale(1.06);}60%{transform:rotate(340deg) scale(.97);}100%{transform:rotate(360deg) scale(1);}}
  .die rect{fill:var(--bgs-gold);} .die circle{fill:var(--bgs-plate);}
  .waiting-title{font-family:'Fraunces',serif;font-weight:600;font-size:18px;text-align:center;line-height:1.35;margin:0;}
  .waiting-title b{color:var(--bgs-gold);font-weight:600;}
  .waiting-sub{font-size:12px;color:var(--bgs-ivory-45);text-align:center;min-height:16px;transition:opacity .2s ease;}

  /* ---- tallying state: three face-down cards shuffling ----
     Draws the same .deck-card.back from css/base.css that the waiting room
     uses, scaled up — same component, not a second way of drawing a hidden
     game. Face-down deliberately: nothing about the outcome may leak. */
  .loader-wrap{height:66px;display:flex;align-items:center;justify-content:center;}
  .shuffle{position:relative;width:104px;height:64px;}
  .shuffle .deck-card{
    position:absolute;top:0;left:30px;width:46px;height:62px;
    box-shadow:0 7px 15px rgba(0,0,0,.5);
    animation:deal 1.9s cubic-bezier(.45,0,.3,1) infinite;
  }
  @keyframes deal{
    0%{transform:translateX(0) rotate(0) scale(1);opacity:1;}
    28%{transform:translateX(-36px) rotate(-13deg) scale(.97);opacity:1;}
    62%{transform:translateX(36px) rotate(10deg) scale(.94);opacity:.7;}
    100%{transform:translateX(0) rotate(0) scale(1);opacity:1;}
  }
  .shuffle .deck-card:nth-child(1){z-index:3;}
  .shuffle .deck-card:nth-child(2){z-index:2;animation-delay:.63s;}
  .shuffle .deck-card:nth-child(3){z-index:1;animation-delay:1.26s;}

  .waiting-sub.strong{
    display:flex;align-items:center;justify-content:center;gap:9px;
    font-size:14px;font-weight:600;color:var(--bgs-ivory-70);
  }
  .spinner{
    width:14px;height:14px;border-radius:50%;flex-shrink:0;
    border:2px solid rgba(var(--bgs-gold-rgb),.25);border-top-color:var(--bgs-gold);
    animation:spin .8s linear infinite;
  }
  @keyframes spin{to{transform:rotate(360deg);}}

  /* Reduced motion: the result of a vote is identical, it just arrives without
     the travel — instant swap, static stamp, count updates without rolling.
     Nothing here relies on an animation to become visible, so dropping the
     motion can never leave a card or a count blank. */
  @media (prefers-reduced-motion:reduce){
    .shuffle .deck-card,.spinner{animation:none;}
    .stack .card,.stack .cover,.tally .roll span{transition:none!important;}
    .stamp.commit{animation-duration:.01s!important;}
  }

  /* ---- roster ---- */
  .roster{width:100%;margin-top:4px;}
  .roster-head{display:flex;align-items:center;justify-content:center;gap:8px;margin-bottom:12px;}
  .roster-head h2{font-family:'Fraunces',serif;font-weight:600;font-size:14px;margin:0;color:var(--bgs-ivory-70);}
  .names{display:flex;flex-direction:column;gap:7px;}
  .name-row{
    display:flex;align-items:center;justify-content:space-between;gap:10px;
    background:var(--bgs-plate);border:1px solid rgba(var(--bgs-ivory-rgb),.08);
    border-radius:12px;padding:10px 14px;font-size:13px;font-weight:600;transition:border-color .25s ease;
  }
  .name-row.done{border-color:rgba(var(--bgs-gold-rgb),.35);}
  .name-row .who{display:flex;align-items:center;gap:8px;}
  .name-row .tag{font-size:9.5px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--bgs-gold-dim);}
  .status{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--bgs-ivory-45);}
  .status.done{color:var(--bgs-gold);}
  .status svg{width:13px;height:13px;flex-shrink:0;}
  .dot-pulse{width:6px;height:6px;border-radius:50%;background:var(--bgs-ivory-45);animation:pulse 1.6s ease-in-out infinite;}
  @keyframes pulse{0%,100%{opacity:1;}50%{opacity:.25;}}

  /* ---- host override ---- */
  .force-btn{
    display:block;margin:16px auto 0;background:transparent;border:none;
    color:var(--bgs-ivory-45);font:inherit;font-size:12.5px;font-weight:600;
    cursor:pointer;padding:10px 14px;border-radius:8px;transition:color .15s ease;
  }
  .force-btn:hover{color:var(--bgs-gold);}

  /* ---- ended / not found ---- */
  .ended p{text-align:center;font-size:13px;color:var(--bgs-ivory-70);line-height:1.6;margin:0 0 22px;}
  .ended-detail{
    font-family:'IBM Plex Mono',monospace;font-size:11px;line-height:1.5;
    color:var(--bgs-ivory-45);text-align:center;margin:-10px 0 22px;
    word-break:break-word;
  }
  .start-btn{
    display:block;width:100%;background:var(--bgs-gold);color:var(--bgs-plate);border:none;
    border-radius:12px;padding:16px;font:inherit;font-size:14.5px;font-weight:700;
    cursor:pointer;transition:opacity .18s ease;text-align:center;text-decoration:none;
    box-sizing:border-box;
  }
</style>
</head>
<body>

<div class="screen" id="screen">
  <div class="eyebrow">Game Night</div>
  <h1>Loading&hellip;</h1>
</div>

<div class="confirm" id="confirm">
  <div class="confirm__panel">
    <h3>Show results now?</h3>
    <p id="confirmBody"></p>
    <div class="confirm__row">
      <button class="confirm__keep" id="confirmKeep" type="button">Keep waiting</button>
      <button class="confirm__force" id="confirmForce" type="button">Show results</button>
    </div>
  </div>
</div>

<script type="module">
// Absolute paths: this page is reached via a Vercel rewrite (/vote/:code/swipe),
// so the browser's URL — which relative imports resolve against — is the pretty
// path, not this file's real location. A relative import here 404s silently and
// the whole module script never runs, leaving the page stuck on "Loading…".
import { fetchSession, submitVote, finishVoting, forceResults, fetchVotes, sessionErrorMessage } from '/js/session.js';
import { joinSessionChannel } from '/js/presence.js';
import { deckFromSession, openGameModal } from '/js/waiting-room.js';
import { attachSwipe, markCommitted, exitCard } from '/js/swipe.js';
import { registerOverlay, syncScrollLock } from '/js/scroll-lock.js';

const screen = document.getElementById('screen');
const confirmDialog = document.getElementById('confirm');
const confirmBody = document.getElementById('confirmBody');
registerOverlay(() => confirmDialog.classList.contains('open'));

function codeFromPath() {
  // /vote/{code}/swipe
  const parts = window.location.pathname.split('/').filter(Boolean);
  return parts[1] || null;
}

// Labels for the card's icon row. Each one already has an icon and a
// screen-reader label naming it, so the units that used to disambiguate a
// dot-separated string ("1–4p · 70–120m") would now just repeat the icon.
function timeLabel(t) { return t[0] === t[1] ? `${t[0]} min` : `${t[0]}–${t[1]} min`; }
function playersLabel(p) { return p[0] === p[1] ? `${p[0]}` : `${p[0]}–${p[1]}`; }
// The numeric weight, not the "medium" bucket: on a 1–5 scale one decimal
// separates games the bucket lumps together, and it matches how the shelf's
// detail modal already states weight.
function weightLabel(score) { return score.toFixed(1); }

function joinNames(names) {
  if (names.length === 0) return '';
  if (names.length === 1) return names[0];
  if (names.length === 2) return `${names[0]} and ${names[1]}`;
  return `${names.slice(0, -1).join(', ')}, and ${names[names.length - 1]}`;
}

// Raw database errors are never shown to players — they get the sentence.
// But a dead-end screen that won't say why is one you have to debug from a
// phone with no console, which cost a long round of guesswork on the swipe
// screen's first outing. So the underlying error is always logged, and shown
// on the page only when ?debug=1 is in the URL.
const SHOW_ERROR_DETAIL = new URLSearchParams(location.search).has('debug');

function renderEnded(message, detail) {
  if (detail) console.error('[game night]', detail);
  const showDetail = detail && SHOW_ERROR_DETAIL;
  screen.innerHTML = `
    <div class="eyebrow">Game Night</div>
    <h1>Game night over</h1>
    <div class="ended"><p>${message}</p></div>
    ${showDetail ? `<p class="ended-detail">${detail}</p>` : ''}
    <a class="start-btn" href="/">Back to the shelf</a>`;
}

// Supabase errors carry the useful part in `message`, with `code`/`hint`
// naming the fix (a missing column, a missing grant, a stale schema cache).
function errorDetail(e) {
  const parts = [e?.code, e?.message || String(e), e?.hint].filter(Boolean);
  return parts.join(' · ');
}

const code = codeFromPath();
if (!code) {
  renderEnded('That game night has ended, or the code is wrong.');
} else {
  init(code);
}

async function init(code) {
  const storageKey = `gamenight:${code}:name`;
  const myName = sessionStorage.getItem(storageKey);
  if (!myName) {
    // Deep-linked without joining — send them through the real join flow.
    window.location.href = `/vote/${code}`;
    return;
  }

  let session;
  try {
    session = await fetchSession(code);
  } catch (e) {
    renderEnded('Something went wrong loading this game night.', errorDetail(e));
    return;
  }

  if (!session) {
    renderEnded('That game night has ended, or the code is wrong.');
    return;
  }
  if (session.status === 'cancelled') {
    renderEnded(`${session.host_name} ended this game night.`);
    return;
  }
  if (session.status === 'waiting') {
    // Voting hasn't started yet on this session — nothing to swipe.
    window.location.href = `/vote/${code}`;
    return;
  }
  if (session.status === 'done') {
    window.location.href = `/results/${code}`;
    return;
  }

  let games;
  try {
    const res = await fetch('/games.json');
    if (!res.ok) throw new Error('failed to load games');
    games = await res.json();
  } catch (e) {
    renderEnded('Something went wrong loading this game night.');
    return;
  }

  const deck = deckFromSession(session, games);

  let myVotes;
  try {
    // Scoped to this round: a rematch re-votes games this player already
    // voted on in round 1, and counting those would drop them straight into
    // the waiting panel without swiping a single card.
    myVotes = await fetchVotes(code, myName, session.round);
  } catch (e) {
    renderEnded('Something went wrong loading your votes.', errorDetail(e));
    return;
  }

  // Resume at the first game not yet voted on. If every game already has a
  // vote (e.g. a refresh right after the last card), skip straight to the
  // waiting panel — findIndex returns -1 and startIndex lands on deck.length.
  const votedIds = new Set(myVotes.map((v) => v.game_id));
  let startIndex = deck.findIndex((g) => !votedIds.has(g.bggId));
  if (startIndex === -1) startIndex = deck.length;

  runSwipe({ code, session, deck, myName, startIndex });
}

function runSwipe({ code, session, deck, myName, startIndex }) {
  const isHost = myName === session.host_name;
  let index = startIndex;
  let screenState = index >= deck.length ? 'waiting' : 'voting';
  let finishedCalled = false;
  let players = [];
  let navigated = false;
  let hintTimer;
  // True from the moment a vote is cast until its card has finished leaving.
  // Drags, buttons and keys all ignore input while it is set, so hammering
  // either button cannot vote twice on one card or race the promotion.
  let busy = false;

  const hints = [
    'Everyone swipes at once',
    'Votes lock the moment you swipe',
    'Results reveal to the whole table together',
  ];

  // iOS Safari's edge-swipe-back walks straight out of the middle of a deck.
  // Back lands on /vote/{code}, which sees status 'voting' and bounces here
  // again — so the screen reloads mid-vote and any drag in progress is lost.
  //
  // The system gesture can't be suppressed from script: it is not a scroll, so
  // touch-action doesn't govern it, and preventDefault on the touch does not
  // reliably cancel it either. So the navigation is absorbed rather than
  // fought — a sentinel entry sits on top of the history stack and is pushed
  // again whenever one is popped, leaving back with nowhere to go.
  //
  // Nothing is lost by this: the only entry behind us bounces forward again
  // anyway, so back was never a way off this screen. Our own navigations use
  // location.href, which is unaffected.
  history.pushState({ swipeGuard: true }, '');
  window.addEventListener('popstate', () => {
    if (navigated) return;
    history.pushState({ swipeGuard: true }, '');
  });

  // ---- background vote submission: never block the gesture on the network.
  // On failure, retry once inline; if that also fails, queue the vote and
  // retry it once the *next* vote succeeds, rather than showing an error
  // mid-deck or rolling the card back.
  let pendingQueue = [];

  async function trySubmitOnce(gameId, vote) {
    try {
      await submitVote(code, myName, gameId, vote);
      return true;
    } catch (e) {
      return false;
    }
  }

  async function submitWithRetry(gameId, vote) {
    const ok = (await trySubmitOnce(gameId, vote)) || (await trySubmitOnce(gameId, vote));
    if (!ok) {
      pendingQueue.push({ gameId, vote });
      return;
    }
    if (pendingQueue.length) {
      const queue = pendingQueue;
      pendingQueue = [];
      for (const item of queue) {
        const success = await trySubmitOnce(item.gameId, item.vote);
        if (!success) pendingQueue.push(item);
      }
    }
  }

  async function ensureFinished() {
    if (finishedCalled) return;
    finishedCalled = true;
    try {
      await finishVoting(code, myName);
    } catch (e) {
      // best-effort — the realtime status change still drives navigation
      // once the database actually flips to done.
    }
    controller.markFinished().catch(() => {});
  }

  // How many cards exist in the DOM at once. The fourth is invisible; it is
  // mounted only so that promoting the third never reveals an empty slot.
  const MOUNTED = 4;

  const PLAYERS_ICON = '<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="8" r="3.2"/><path d="M3.5 19a5.5 5.5 0 0 1 11 0"/><circle cx="17" cy="9" r="2.6"/><path d="M16 15.5a4.5 4.5 0 0 1 4.5 4"/></svg>';
  const TIME_ICON = '<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></svg>';
  const WEIGHT_ICON = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4v3M4.5 8h15M12 7l-5 8h10l-5-8z"/><path d="M4 16a3 3 0 0 0 6 0M14 16a3 3 0 0 0 6 0M4 16l3-8M10 16l-3-8M14 16l3-8M20 16l-3-8"/><path d="M9 20h6"/></svg>';

  /**
   * One card as a detached element. The outer div is the depth layer and the
   * inner .card-body is the drag layer — see the note in the stylesheet for
   * why they cannot be the same element.
   */
  function buildCard(game, absoluteIndex) {
    const el = document.createElement('div');
    el.className = 'card';
    el.innerHTML = `
      <div class="card-body">
        <div class="cover"><img src="${game.image}" alt="${game.title} cover" loading="lazy"></div>
        <div class="scrim"></div>
        <button class="info-btn" data-i="${absoluteIndex}" aria-label="Game details">i</button>
        <div class="wash"></div>
        <div class="stamp play" style="--r:-12deg">PLAY</div>
        <div class="stamp pass" style="--r:12deg">PASS</div>
        <div class="meta">
          <span class="rating-pill">★ ${game.bggRating.toFixed(1)}</span>
          <h2>${game.title}</h2>
          <ul>
            <li>${PLAYERS_ICON}<span class="sr">Players</span>${playersLabel(game.players)}</li>
            <li>${TIME_ICON}<span class="sr">Play time</span>${timeLabel(game.time)}</li>
            <li>${WEIGHT_ICON}<span class="sr">Weight</span>${weightLabel(game.weightScore)}</li>
          </ul>
        </div>
      </div>`;
    el.querySelector('.info-btn').addEventListener('click', (e) => {
      e.stopPropagation();
      openGameModal(game);
    });
    return el;
  }

  /**
   * Assigns depth 0..3 to the cards still in the stack. Sets both `data-depth`
   * (which drives blur, meta and pointer-events) and `--d` (which drives the
   * transform), so one call moves the whole stack forward.
   */
  function relayout(excluding) {
    const stack = document.getElementById('stack');
    if (!stack) return;
    [...stack.children]
      .filter((c) => c !== excluding && c.classList.contains('card'))
      .forEach((c, i) => {
        c.dataset.depth = i;
        c.style.setProperty('--d', Math.min(i, 3));
      });
  }

  /** Tops the stack back up to MOUNTED as cards leave. */
  function mountNextIfNeeded() {
    const stack = document.getElementById('stack');
    if (!stack) return;
    const mounted = stack.querySelectorAll('.card').length;
    const next = index + mounted;
    if (mounted < MOUNTED && next < deck.length) {
      stack.appendChild(buildCard(deck[next], next));
    }
    relayout();
  }

  function frontCard() {
    const stack = document.getElementById('stack');
    return stack ? stack.querySelector('.card[data-depth="0"]') : null;
  }

  /** Binds the drag to whichever card is currently in front. */
  function bindFront() {
    const front = frontCard();
    if (!front) return;
    const body = front.querySelector('.card-body');
    if (body.dataset.bound) return;
    body.dataset.bound = '1';
    attachSwipe(body, {
      canStart: () => !busy,
      onCommit: (vote, d) => commit(vote, d),
    });
  }

  /** The count chip: rolls to the new number and flashes gold. */
  function rewardTally(nextCount) {
    const tally = document.getElementById('tally');
    const rollNum = document.getElementById('rollNum');
    if (!tally || !rollNum) return;
    tally.classList.remove('pulse');
    void tally.offsetWidth;            // restart the transition from the top
    tally.classList.add('pulse');
    setTimeout(() => tally.classList.remove('pulse'), 420);

    rollNum.style.transition = 'none';
    rollNum.style.transform = 'translateY(100%)';
    rollNum.textContent = nextCount;
    void rollNum.offsetWidth;          // commit the jump before animating back
    rollNum.style.transition = '';
    rollNum.style.transform = '';
  }

  function updateProgressFill() {
    const fill = document.querySelector('.progress-fill');
    if (fill) fill.style.width = `${Math.round((index / deck.length) * 100)}%`;
  }

  /** Builds the voting screen once; the stack is then mutated, never rebuilt. */
  function renderVoting() {
    const total = deck.length;
    screen.innerHTML = `
      <div class="eyebrow">Game Night · ${code}</div>
      <h1>Swipe to vote</h1>
      <div class="progress-row">
        <div class="progress-track"><div class="progress-fill" style="width:${Math.round((index / total) * 100)}%"></div></div>
        <div class="tally" id="tally" aria-live="polite" aria-atomic="true">
          <span class="roll"><span id="rollNum">${Math.min(index + 1, total)}</span></span><span>&nbsp;/ ${total}</span>
        </div>
      </div>
      <div class="stack" id="stack"></div>
      <div class="vote-actions">
        <button class="vote-btn pass" id="btnPass" aria-label="Pass">
          <svg width="20" height="20" viewBox="0 0 20 20" fill="none"><path d="M4 4L16 16M16 4L4 16" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg>
        </button>
        <button class="vote-btn play" id="btnPlay" aria-label="Play">
          <svg width="20" height="20" viewBox="0 0 20 20" fill="none"><path d="M4 10.5L8 15L16 5.5" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
      </div>
      <p class="vote-hint">Drag right to play, left to pass — votes lock the moment you swipe</p>
    `;

    const stack = document.getElementById('stack');
    deck.slice(index, index + MOUNTED).forEach((g, i) => {
      stack.appendChild(buildCard(g, index + i));
    });
    relayout();
    bindFront();

    document.getElementById('btnPass').addEventListener('click', () => commit('pass'));
    document.getElementById('btnPlay').addEventListener('click', () => commit('play'));
  }

  // Keyboard equivalent of the swipe, for anyone not using a touchscreen.
  // Ignored once the deck is done so the arrow keys go back to the page.
  window.addEventListener('keydown', (e) => {
    if (screenState !== 'voting') return;
    if (e.key === 'ArrowRight') commit('play');
    else if (e.key === 'ArrowLeft') commit('pass');
  });

  /** Everything voted: hand over to the waiting panel. */
  function finishDeck() {
    ensureFinished();
    setTimeout(() => {
      screenState = 'waiting';
      renderWaiting();
    }, 320);
  }

  /**
   * Casts one vote and starts the card leaving.
   *
   * Promotion happens here, at the same moment the exit starts — not in
   * `onfinish`. That is the whole point: the card behind rises and comes into
   * focus while the front one is still travelling, so the stack reads as one
   * continuous movement rather than a swap after a pause.
   *
   * @param {object} [d] drag state, or omitted when the vote came from a button
   */
  function commit(vote, d) {
    if (busy || index >= deck.length) return;
    const front = frontCard();
    if (!front) return;
    busy = true;

    const body = front.querySelector('.card-body');
    const game = deck[index];

    // A button tap has no drag behind it, so the feedback has to be applied
    // here; a released drag has already shown it.
    if (!d) markCommitted(body, vote);

    // Out of the stack, but above it while it flies.
    front.dataset.depth = 'x';
    front.style.zIndex = 20;
    relayout(front);

    index += 1;
    rewardTally(Math.min(index + 1, deck.length));
    updateProgressFill();
    // Never block the gesture on the network: advance locally now, submit in
    // the background.
    submitWithRetry(game.bggId, vote);

    const exit = exitCard(body, vote, d);
    exit.onfinish = () => {
      front.remove();
      busy = false;
      if (index >= deck.length) {
        finishDeck();
      } else {
        mountNextIfNeeded();
        bindFront();
      }
    };
  }

  function loaderHTML() {
    return `<div class="loader-wrap"><div class="shuffle">
      <div class="deck-card back">?</div>
      <div class="deck-card back">?</div>
      <div class="deck-card back">?</div>
    </div></div>`;
  }

  function cycleHints() {
    clearInterval(hintTimer);
    let i = 0;
    hintTimer = setInterval(() => {
      i = (i + 1) % hints.length;
      const node = document.getElementById('waitHint');
      if (!node) { clearInterval(hintTimer); return; }
      node.style.opacity = 0;
      setTimeout(() => { node.textContent = hints[i]; node.style.opacity = 1; }, 200);
    }, 2600);
  }

  function openForceConfirm(names) {
    const who = joinNames(names);
    confirmBody.textContent = `${who} ${names.length === 1 ? "hasn't" : "haven't"} finished. Their votes so far will still count.`;
    confirmDialog.classList.add('open');
    syncScrollLock();
  }

  function renderWaiting() {
    const allDone = players.length > 0 && players.every((p) => p.finished);
    const unfinishedOthers = players.filter((p) => p.name !== myName && !p.finished);
    const showOverride = isHost && finishedCalled && unfinishedOthers.length > 0;

    screen.innerHTML = `
      <div class="eyebrow">Game Night · ${code}</div>
      <h1>Votes locked</h1>
      <div class="waiting-panel">
        ${allDone ? loaderHTML() : `
        <div class="die-wrap">
          <svg class="die" viewBox="0 0 52 52">
            <rect x="2" y="2" width="48" height="48" rx="11"/>
            <circle cx="17" cy="17" r="4.2"/><circle cx="35" cy="17" r="4.2"/>
            <circle cx="17" cy="35" r="4.2"/><circle cx="35" cy="35" r="4.2"/><circle cx="26" cy="26" r="4.2"/>
          </svg>
        </div>`}
        <p class="waiting-title">${allDone ? 'All votes are in' : 'Waiting on the <b>table</b>'}</p>
        ${allDone
          ? `<p class="waiting-sub strong">Results are on their way<span class="spinner"></span></p>`
          : `<p class="waiting-sub" id="waitHint">${hints[0]}</p>`}
      </div>
      <div class="roster">
        <div class="roster-head"><h2>${players.length} at the table</h2></div>
        <div class="names">
          ${players.map((p) => {
            const done = !!p.finished;
            return `
            <div class="name-row ${done ? 'done' : ''}">
              <div class="who">${p.name}${p.isHost ? '<span class="tag">host</span>' : (p.name === myName ? '<span class="tag">you</span>' : '')}</div>
              <div class="status ${done ? 'done' : ''}">
                ${done
                  ? `<svg viewBox="0 0 20 20" fill="none"><path d="M4 10.5L8 15L16 5.5" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg> Done`
                  : `<span class="dot-pulse"></span> Voting…`}
              </div>
            </div>`;
          }).join('')}
        </div>
        ${showOverride ? `<button class="force-btn" id="forceBtn" type="button">Show results now</button>` : ''}
      </div>
    `;

    if (!allDone) cycleHints(); else clearInterval(hintTimer);

    const forceBtn = document.getElementById('forceBtn');
    if (forceBtn) {
      forceBtn.addEventListener('click', () => openForceConfirm(unfinishedOthers.map((p) => p.name)));
    }
  }

  document.getElementById('confirmKeep').addEventListener('click', () => {
    confirmDialog.classList.remove('open');
    syncScrollLock();
  });
  document.getElementById('confirmForce').addEventListener('click', async () => {
    confirmDialog.classList.remove('open');
    syncScrollLock();
    try {
      await forceResults(code, myName);
      // Navigation happens for every device via the realtime status change
      // below, including this one — not here, so the whole table lands together.
    } catch (e) {
      const message = sessionErrorMessage(e, session.host_name);
      if (message) alert(message);
    }
  });

  const controller = joinSessionChannel({
    code,
    participantName: myName,
    isHost,
    finished: index >= deck.length,
    onPresence: ({ players: p }) => {
      players = p;
      if (screenState === 'waiting') renderWaiting();
    },
    onStatus: (status) => {
      if (navigated) return;
      if (status === 'done') {
        navigated = true;
        clearInterval(hintTimer);
        controller.leave();
        window.location.href = `/results/${code}`;
      }
    },
  });

  window.addEventListener('pagehide', () => controller.leave());

  if (screenState === 'voting') {
    renderVoting();
  } else {
    ensureFinished();
    renderWaiting();
  }
}
</script>
</body>
</html>
